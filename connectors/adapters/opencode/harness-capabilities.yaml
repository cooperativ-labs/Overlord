# OpenCode — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# OpenCode is the repo's first Shape C adapter: a control plane, not a callback harness. It
# landed in the same phase as Claude's push path deliberately. A normalized-event waist built
# against a single integration shape encodes that shape — the second harness is where you find
# out whether the abstraction was one, and finding out later means finding out expensively.
#
# What ships here is the PUSH path and the descriptor. The connector's launch integration,
# agent-catalog entry, and skill packaging are not in this phase; until they land, an OpenCode
# session is driven by `ovld agent-session sidecar`, which the runner starts alongside the
# harness rather than by the harness invoking Overlord.
schemaVersion: 1
adapter: opencode
codec: opencode
codecSpec: codec/opencode.codec.yaml

harness:
  # No verifiedVersion: the recorded payloads come from the documented /event schema rather than
  # from a running binary. Omitted rather than guessed — a version string nobody tested against
  # is the kind of detail a future reader trusts precisely because it looks specific.
  name: OpenCode
  versionScheme: semver
  versionRange: '>=0.5.0'

integrationShape: controlPlane

binding:
  source: env
  field: OVERLORD_SESSION_CHANNEL_ID
  status: supported
  fixture: fixtures/sidecar-loopback-only.json
  notes: >-
    A control-plane adapter has no hook payload to read a binding out of, and it does not need
    one: the sidecar is started by Overlord, so it holds the channel bootstrap in its own
    environment from the first instant. The harness's own `sessionID` arrives on the event
    stream and is recorded as a correlation alias. That ordering is the opposite of a callback
    harness and produces the same authorization property, which is the point of separating
    correlation from authorization in the first place.

decisionHold:
  status: supported
  fixture: fixtures/permission-reply-path.json
  notes: >-
    Shape C never *holds* anything: there is no callback to block, so a permission is a durable
    object on the harness's own bus that can be answered by either side. That makes
    `terminal.concurrentAnswer` reachable here and structurally impossible for Claude — the one
    place where the control-plane shape is strictly richer rather than merely different.

capabilities:
  observe.prompt:
    status: not-implemented
    native: message.updated
    trackedAs: agent-session-phase-3
    notes: >-
      Reachable on the same event stream, deliberately unregistered until the inject path
      exists: a user prompt and an Overlord-injected instruction arrive through the same frame,
      and recording them as the same thing before we can tell them apart would put words in a
      user's mouth in the activity feed.
  observe.toolCall:
    status: not-implemented
    native: message.part.updated
    trackedAs: agent-session-phase-2
    notes: >-
      The same frame carries in-progress and completed parts. Grading the in-progress state as
      supported would require a fixture proving we can distinguish them, which the recorded
      payload set does not yet contain.
  observe.toolResult:
    status: supported
    native: message.part.updated
    fixtures: [fixtures/normalize-tool-completed.json]
  observe.fileEdit:
    status: supported
    native: message.part.updated
    fixtures: [fixtures/normalize-tool-completed.json]
    notes: >-
      Shares the tool-part frame; the codec routes a file-mutating normalized tool to
      `file.edited` exactly as the callback codecs do. The same rule, not a parallel one.
  observe.sessionLifecycle:
    status: supported
    native: session.idle
    fixtures: [fixtures/normalize-session-idle.json]
  decide.shell:
    status: supported
    native: /permission
    fixtures: [fixtures/permission-reply-path.json]
  decide.mcp:
    status: supported
    native: /permission
    fixtures: [fixtures/permission-reply-path.json]
  decide.fileWrite:
    status: not-implemented
    native: /permission
    trackedAs: agent-session-phase-2
  decide.anyTool:
    status: supported
    native: /permission
    fixtures: [fixtures/permission-reply-path.json]
  decide.universal:
    status: not-implemented
    native: /permission
    trackedAs: agent-session-phase-2
  answer.structuredQuestion:
    status: not-implemented
    native: /question
    trackedAs: agent-session-phase-2
  answer.persistentAllow:
    status: not-implemented
    native: 'POST /permission/{id}/reply (always)'
    trackedAs: agent-session-phase-2
    notes: >-
      OpenCode's `always` reply grants a standing permission on the machine. Product policy
      hides it from remote surfaces: a person approving from a phone cannot see what they are
      granting for the rest of the session, and an irreversible grant made from a surface that
      shows a summary is not informed consent.
  inject.midTurn:
    status: supported
    native: prompt_async
    fixtures: [fixtures/prompt-async-path.json]
  inject.turnBoundary:
    status: supported
    native: prompt_async
    fixtures: [fixtures/prompt-async-path.json]
  inject.nextTurn:
    status: supported
    native: prompt_async
    fixtures: [fixtures/prompt-async-path.json]
  terminal.concurrentAnswer:
    status: supported
    native: 'GET /permission'
    fixtures: [fixtures/permission-reply-path.json]
    notes: >-
      Structurally available and unbuilt — the one adapter where this is a tracker rather than
      a permanent `unsupported`. A permission is a durable object on the bus, so the TUI and
      Overlord can both see it and either can answer; the loser learns it was resolved
      elsewhere. Callback harnesses cannot produce that outcome at all.
  terminal.statusSurface:
    status: not-implemented
    native: null
    trackedAs: agent-session-phase-2

hazards:
  - id: control-port-is-unauthenticated-by-default
    severity: high
    summary: >-
      OpenCode's server accepts commands that drive the agent — running tools, sending prompts —
      and binds without authentication unless configured otherwise. Anything that can reach the
      port owns the session. The sidecar therefore binds loopback only, generates a per-launch
      OPENCODE_SERVER_PASSWORD, and never projects either the port or the secret to the browser
      or mobile clients, which reach Overlord's own authenticated surface instead.
    verification: verified
    mitigation: implemented
    fixture: fixtures/sidecar-loopback-only.json
  - id: replay-on-reconnect
    severity: low
    summary: >-
      A reconnecting sidecar re-reads state and re-emits frames it may already have sent. This
      is not mitigated by suppressing the replay — a sidecar cannot know what its predecessor
      delivered — but by content-derived producer event ids, so a replayed frame is a no-op at
      the server rather than a second row in the feed.
    verification: verified
    mitigation: implemented
    fixture: fixtures/normalize-tool-completed.json
  - id: harness-version-unverified
    severity: medium
    summary: >-
      The recorded event payloads were taken from the documented `/event` schema rather than
      from a running binary of a pinned version, so `harness.verifiedVersion` is absent. Frame
      shapes may differ in a released build. Record payloads from a real session and pin the
      version before grading anything else here as supported.
    verification: unverified
    mitigation: required
    trackedAs: agent-session-verify-opencode-frames

decisionShape:
  codec: opencode
  neverSend: [hookSpecificOutput, permissionDecision, decision, permission]
  notes: >-
    Shape C answers over HTTP (`POST /permission/{id}/reply`) rather than by writing a decision
    to stdout. None of the callback dialects' response fields mean anything here, and emitting
    one would be silently ignored rather than rejected — the worst failure mode, because it
    looks like it worked.

unboundSessionFixture: fixtures/unbound-session.json

legacy:
  capabilities: []
  hookTypes: []
