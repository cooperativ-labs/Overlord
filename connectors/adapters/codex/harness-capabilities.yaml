# Codex — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# The supported hook surface is proven by recorded payload fixtures and the published Codex
# hook schema. The app-server remains intentionally unselected: it is experimental and would
# introduce a second authority capable of racing hook decisions.
schemaVersion: 1
adapter: codex
codec: codex
codecSpec: codec/codex.codec.yaml
decisionCodecSpec: codec/codex.decision-codec.yaml

harness:
  name: Codex CLI
  verifiedVersion: '0.147.0'
  versionRange: '>=0.124.0'
  versionScheme: semver

integrationShape: callback

binding:
  source: payload
  field: session_id
  status: supported
  fixture: fixtures/normalize-session-start.json
  notes: >-
    `CODEX_THREAD_ID` exists in the environment but is NOT known to equal the hook payload's
    `session_id`; the binary distinguishes session ids, turn ids, and thread ids. Assuming
    symmetry with Claude here is exactly the guess that produces silent misattribution, so
    binding stays on the payload field until the equality is settled by fixture.

decisionHold:
  status: supported
  fixture: fixtures/permission-request.json
  timeoutField: timeout
  timeoutUnit: seconds
  defaultTimeoutSeconds: 600
  maxTimeoutSeconds: null
  trackedAs: agent-session-phase-4
  notes: >-
    Per-hook timeouts in seconds; the documentation gives a 600-second default. The adapter
    must set `timeout` explicitly from the window policy and well below that default. A local
    0.147.0 `codex exec --approve-for-me` smoke test still emitted PermissionRequest after the
    workspace sandbox failed and automatic review retried the shell command, so auto-review does
    not bypass the installed request hook.

mutationHooks:
  classification: post-only
  fixture: fixtures/mutation-window-evidence.json
  notes: >-
    Recorded pre/post shapes are separate calls and do not prove a paired window. A directly named
    native edit path normalized by the Codex codec as `file.edited` may record objective-bound,
    non-exclusive `declared_edit`/`direct` evidence. The recorded apply_patch completion has no
    normalized edit path, so it records unavailable evidence health.

capabilities:
  observe.prompt:
    status: supported
    native: UserPromptSubmit
    fixtures: [fixtures/normalize-user-prompt.json]
  observe.toolCall:
    status: not-implemented
    native: PreToolUse
    trackedAs: latch-engine
    notes: >-
      There is no mechanical observation path until Overlord has a native Conversation Hub client.
  observe.toolResult:
    status: not-implemented
    native: PostToolUse
    trackedAs: latch-engine
  observe.fileEdit:
    status: supported
    native: PostToolUse
    fixtures:
      - fixtures/normalize-post-tool-use.json
      - fixtures/agent-session-hooks.json
      - fixtures/post-tool-use-hook.json
      - fixtures/post-tool-use-unbound.json
    notes: >-
      The lifecycle PostToolUse registration forwards Codex's native payload to local
      `capture-change` only when `OVERLORD_OBJECTIVE_ID` resolves an exact active-session binding.
      Native paths normalized by the Codex codec as `file.edited` record non-exclusive
      `declared_edit`/`direct` evidence. Codec-normalized read, search, and fetch callbacks are
      silent no-ops; mutation-capable callbacks without a normalized edit path, plus shell,
      generic, unknown, and unmapped callbacks, record unavailable evidence health. It remains
      separate from mechanical agent-session observation.
  observe.sessionLifecycle:
    status: not-implemented
    native: SessionStart
    trackedAs: latch-engine
  decide.shell:
    status: not-implemented
    native: PermissionRequest
    trackedAs: latch-engine
  decide.mcp:
    status: not-implemented
    native: PermissionRequest
    trackedAs: latch-engine
  decide.fileWrite:
    status: not-implemented
    native: PermissionRequest
    trackedAs: latch-engine
  decide.anyTool:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-phase-4
  decide.universal:
    status: not-implemented
    native: PermissionRequest
    trackedAs: latch-engine
    notes: >-
      The native Codex prompt owns approvals; Overlord exposes no remote decision control.
  answer.structuredQuestion:
    status: unverified
    native: ToolRequestUserInput
    trackedAs: taxonomy-7.2
    notes: >-
      `codex app-server` exposes ToolRequestUserInput with per-option label/description and an
      autoResolutionMs — an ACP-shaped structured question in everything but name. It is
      unreachable until the single-subscriber question is settled.
  answer.persistentAllow:
    status: unverified
    trackedAs: taxonomy-7.4
  inject.midTurn:
    status: unverified
    native: ThreadInjectItems
    trackedAs: taxonomy-7.2
    notes: >-
      ThreadInjectItems/TurnSteer exist on the experimental app-server surface only. The
      binary carries "expected exactly one client subscribed to the thread, found {}", so if
      the TUI is that one client Overlord cannot also subscribe and this path is closed.
  inject.turnBoundary:
    status: not-implemented
    native: Stop
    trackedAs: latch-engine
  inject.nextTurn:
    status: not-implemented
    native: Stop
    trackedAs: agent-session-phase-4
  terminal.concurrentAnswer:
    status: unsupported
    reason: >-
      On the hook path the native prompt is drawn only after the callback returns, so the
      terminal cannot answer while Overlord holds the decision. (A future app-server
      integration could change this; it would be a different integrationShape.)
    evidenceRef: connector-harness-taxonomy.md#12-the-axis-that-actually-matters
  terminal.statusSurface:
    status: unverified
    trackedAs: taxonomy-7.9

hazards:
  - id: two-integration-surfaces-could-disagree
    severity: high
    summary: >-
      Hooks and `codex app-server` can both answer a permission. A session driven by both
      would race in a way no revision CAS can settle, so exactly one surface must be chosen
      and documented before either is built.
    verification: verified
    mitigation: implemented
    fixture: fixtures/agent-session-hooks.json
  - id: prompt-and-agent-hook-handlers-inert
    severity: low
    summary: >-
      Codex 0.146.0 accepts three hook handler types — `command`, `prompt`, and `agent` — but
      only `command` runs. Hook discovery parses `prompt` and `agent` and then skips them with
      a "not supported yet" warning, so a manifest that used either would install cleanly,
      list in `hooks`, and never execute. The connector must keep emitting `command` handlers
      only, and must not read the presence of these variants in the schema as availability.
      `command` is a shell command line run through `$SHELL -lc` (`/bin/sh` when SHELL is
      unset) — it is not restricted to Bash and not restricted to shell scripting, since the
      command may invoke any interpreter.
    verification: verified
    mitigation: accepted
  - id: hooks-version-and-platform-gate
    severity: medium
    summary: >-
      Hooks were experimental behind `features.codex_hooks` before v0.124. The connector
      requires Codex >=0.124; installations outside that range must be treated as unavailable.
    verification: verified
    mitigation: required
    trackedAs: agent-session-phase-4

decisionShape:
  codec: codex
  neverSend: [updatedInput, updatedPermissions, interrupt, permission, followup_message]
  allowFixture: fixtures/decision-codec.json
  denyFixture: fixtures/decision-codec.json
  deferFixture: fixtures/decision-codec.json
  notes: >-
    PermissionRequest accepts the documented hookSpecificOutput decision.behavior allow/deny
    shape. `ask` remains a deliberate no-output defer so Codex shows its own approval prompt.
    The adapter never emits updatedInput, updatedPermissions, or interrupt. The reserved list
    is not symmetric across events at 0.146.0: PermissionRequest rejects `updatedInput` as
    unsupported, while PreToolUse accepts it together with `permissionDecision: "allow"` and
    will rewrite the call. Keeping `updatedInput` on `neverSend` stays a deliberate policy
    choice — silently editing a tool call a user approved is not a decision Overlord should
    make — and not an inference about what the harness can do.

unboundSessionFixture: fixtures/unbound-session.json
