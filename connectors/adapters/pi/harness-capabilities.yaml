# Pi — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# Pi is the one adapter with no native permission prompt at all. For every other harness
# "fail toward the harness" means a human sees a dialog; for Pi it means THE TOOL RUNS. That
# is a materially different risk posture: Pi's decision interception stays off by default,
# requires an explicit workspace-policy ceiling plus project opt-in, and the UI must name the
# fail-open behavior before it is enabled.
schemaVersion: 1
adapter: pi
codec: pi
codecSpec: codec/pi.codec.yaml
decisionCodecSpec: codec/pi.decision-codec.yaml

harness:
  name: Pi Coding Agent
  verifiedVersion: '0.83.0'
  versionRange: '>=0.83.0 <0.84.0'
  versionScheme: semver

integrationShape: extension

binding:
  source: api
  field: ctx.sessionManager.getSessionId()
  status: supported
  fixture: fixtures/agent-session-runtime.json
  notes: >-
    The extension runs in-process and can read the session id directly; the shipped extension
    writes it into the native-session cache. Channel 1 protocol follow-up does not require a
    Latch session or an Agent Session Exchange channel.

decisionHold:
  status: not-implemented
  trackedAs: latch-engine
  maxTimeoutSeconds: null
  notes: >-
    Remote decision hold moved to Latch. Pi has no native prompt; Overlord no longer intercepts
    tool calls.

capabilities:
  observe.prompt:
    status: supported
    native: input
    fixtures: [fixtures/agent-session-runtime.json]
    notes: >-
      The shipped extension captures `input` and posts follow-up activity through
      `ovld protocol hook-event`. Mechanical agent-session observation is not a live path.
  observe.toolCall:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
  observe.toolResult:
    status: not-implemented
    native: tool_result
    trackedAs: agent-session-phase-4
  observe.fileEdit:
    status: not-implemented
    native: tool_execution_end
    trackedAs: agent-session-phase-4
  observe.sessionLifecycle:
    status: not-implemented
    native: agent_start
    trackedAs: latch-engine
  decide.shell:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
  decide.mcp:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
  decide.fileWrite:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
  decide.anyTool:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
  decide.universal:
    status: not-implemented
    native: tool_call
    trackedAs: latch-engine
    notes: >-
      Remote tool-call decisions moved to Latch. Pi no longer intercepts tools on the Overlord
      connector path.
  answer.structuredQuestion:
    status: not-implemented
    native: ctx.ui.select
    trackedAs: agent-session-phase-4
  answer.persistentAllow:
    status: unsupported
    reason: >-
      Pi has no native permission model, so there is no standing allow rule for a reply to
      write. A persistent grant would have to be invented by Overlord rather than recorded in
      the harness, which is a different feature with its own audit and RBAC review.
    evidenceRef: connector-harness-taxonomy.md#52-what-is-verified
  inject.midTurn:
    status: not-implemented
    native: sendUserMessage(deliverAs=steer)
    trackedAs: latch-engine
    notes: >-
      Session-input injection moved off the Overlord connector. Latch PTY write is Phase 3.
  inject.turnBoundary:
    status: not-implemented
    native: sendUserMessage(deliverAs=followUp)
    trackedAs: latch-engine
  inject.nextTurn:
    status: not-implemented
    native: sendMessage(deliverAs=nextTurn)
    trackedAs: agent-session-phase-4
  terminal.concurrentAnswer:
    status: unsupported
    reason: >-
      There is no native permission prompt for a human to answer concurrently. This is not a
      timing limitation like the callback harnesses have; the surface does not exist.
    evidenceRef: connector-harness-taxonomy.md#53-unique-challenges
  terminal.statusSurface:
    status: not-implemented
    native: ctx.ui.notify
    trackedAs: agent-session-phase-4

hazards:
  - id: no-native-floor-fails-open
    severity: high
    summary: >-
      Pi has no dialog to fall back to, so a timed-out or failed remote decision must ALLOW
      the tool. Every other adapter fails toward a human; this one fails toward execution.
      Remote decisions stay off by default and require a workspace-policy ceiling plus project
      opt-in whose consent text names the fail-open timeout.
    verification: verified
    mitigation: accepted
  - id: block-is-visible-to-the-model
    severity: medium
    summary: >-
      A block becomes a tool refusal in the conversation and changes what the agent does next,
      so `block` must never be used as a "please wait" mechanism. The wait happens inside the
      async handler, before returning.
    verification: verified
    mitigation: accepted
  - id: in-process-blast-radius
    severity: high
    summary: >-
      The extension runs with the agent's memory, credentials, and event loop. An unhandled
      exception is a crash in someone's editor. It must hold no token, make no HTTP call, and
      catch everything — all network work goes through the CLI.
    verification: verified
    mitigation: implemented
    fixture: fixtures/extension-holds-no-credentials.json
  - id: typed-api-version-coupling
    severity: medium
    summary: >-
      The extension is typed against @earendil-works/pi-coding-agent 0.83.0. A typed
      in-process API is far more breakable than JSON on stdin, so the adapter needs a version
      check and a graceful "extension disabled, mission workflow unaffected" path.
    verification: unverified
    mitigation: required
    trackedAs: taxonomy-7.10

decisionShape:
  codec: pi
  allowFixture: fixtures/decision-codec.json
  denyFixture: fixtures/decision-codec.json
  deferFixture: fixtures/decision-codec.json
  neverSend: [hookSpecificOutput, permissionDecision, permission]
  notes: >-
    Pi's decision is a resolved promise, not bytes: `{}` allows and `{ block: true, reason }`
    denies. There is no defer value, which is why the fail-open posture must be a product
    decision rather than an adapter default.

unboundSessionFixture: fixtures/extension-holds-no-credentials.json

legacy:
  capabilities:
    - followUpHook
    - nativeResume
    - modelFlag
    - effortFlag
    - contextFilePrompt
  hookTypes:
    - UserPromptSubmit
