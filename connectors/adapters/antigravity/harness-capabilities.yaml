# Antigravity — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# Antigravity was outside the five-harness verification survey, so its interaction
# capabilities begin conservatively as `unverified` rather than inherited from a harness that
# looks similar. Omitting a shipped connector from the generated matrix would make it less
# truthful than the hand-written table it replaces; guessing its capabilities would be worse.
# No UI control may be derived from the agent name — only from a proven capability.
schemaVersion: 1
adapter: antigravity
codec: antigravity

harness:
  name: Antigravity CLI
  verifiedVersion: 'docs: Antigravity CLI v1.1.11 / Antigravity 2.0 v2.6.0'
  versionScheme: opaque

integrationShape: callback

binding:
  source: payload
  field: conversationId
  status: supported
  fixture: fixtures/official-pre-tool-use.json
  notes: >-
    The first-party hook contract defines `conversationId` as the unique UUID of the active
    agent conversation and includes it in every hook payload. It remains a correlation alias;
    the verified channel credential is the authorization and mission scope. The local `agy`
    binary was unavailable for an empirical resume test, so no interaction capability is
    promoted solely from this binding proof.

decisionHold:
  status: unverified
  trackedAs: agent-session-verify-antigravity
  notes: >-
    The first-party docs define command-hook timeouts (30 seconds by default) and a synchronous
    PreToolUse `decision` response, but do not define timeout, crash, non-zero-exit, or malformed
    JSON fallback behavior. Keep the remote decision hold unverified until an installed binary
    exercises those failure paths.

mutationHooks:
  classification: unsupported
  fixture: fixtures/mutation-window-evidence.json
  reason: No recorded PostToolUse payload or empirical agy hook execution proves a pair.

capabilities:
  observe.prompt:
    status: unsupported
    native: PreInvocation
    reason: >-
      PreInvocation exposes invocation counters and common metadata but no submitted prompt.
      Reading transcriptPath to reconstruct one would violate the raw-transcript privacy boundary.
    evidenceRef: https://antigravity.google/docs/hooks#preinvocation
  observe.toolCall:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-verify-antigravity
  observe.toolResult:
    status: not-implemented
    native: PostToolUse
    trackedAs: agent-session-verify-antigravity
  observe.fileEdit:
    status: not-implemented
    native: PostToolUse
    trackedAs: agent-session-verify-antigravity
  observe.sessionLifecycle:
    status: not-implemented
    native: Stop
    trackedAs: agent-session-verify-antigravity
  decide.shell:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-verify-antigravity
  decide.mcp:
    status: unverified
    trackedAs: agent-session-verify-antigravity
  decide.fileWrite:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-verify-antigravity
  decide.anyTool:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-verify-antigravity
  decide.universal:
    status: unverified
    trackedAs: agent-session-verify-antigravity
  answer.structuredQuestion:
    status: unverified
    trackedAs: agent-session-verify-antigravity
  answer.persistentAllow:
    status: not-implemented
    native: PreToolUse.permissionOverrides
    trackedAs: agent-session-verify-antigravity
  inject.midTurn:
    status: unsupported
    reason: >-
      PreInvocation and PostInvocation can inject only at model-invocation boundaries; the hook
      surface has no path to deliver input while a model or tool call is actively running.
    evidenceRef: https://antigravity.google/docs/hooks#preinvocation
  inject.turnBoundary:
    status: not-implemented
    native: Stop
    trackedAs: agent-session-verify-antigravity
  inject.nextTurn:
    status: not-implemented
    native: PreInvocation.injectSteps.userMessage
    trackedAs: agent-session-verify-antigravity
  terminal.concurrentAnswer:
    status: unverified
    trackedAs: agent-session-verify-antigravity
  terminal.statusSurface:
    status: unverified
    trackedAs: agent-session-verify-antigravity

hazards:
  - id: outside-verification-survey
    severity: medium
    summary: >-
      Antigravity was not part of the original harness verification survey. The current
      first-party docs now establish hook names, payload fields, and response shapes, but the
      `agy` binary was unavailable for empirical timeout, failure, resume, and headless tests.
      The connector must stay at its fixture-proven tier until those paths are exercised.
    verification: unverified
    mitigation: required
    trackedAs: agent-session-verify-antigravity
decisionShape:
  codec: antigravity
  neverSend: [allow_tool, hookSpecificOutput, permissionDecision, permission]
  notes: >-
    The first-party response is `{ decision, reason?, permissionOverrides? }`, with decision
    values allow, deny, ask, force_ask, and deny_unless_prior_grant. No decision codec ships
    until an installed binary verifies failure fallback and exact emitted bytes; in particular,
    no failure path may manufacture `decision: allow`.

unboundSessionFixture: fixtures/unbound-session.json
