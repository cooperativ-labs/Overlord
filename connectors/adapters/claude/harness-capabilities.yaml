# Claude Code — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# Every capability Claude Code *can* do but Overlord has not built yet is `not-implemented`
# with a tracker, never `supported`. Phase 1 flipped the `observe.*` group to `supported` by
# adding executable fixtures that run the shipped codec, not by editing this file.
schemaVersion: 1
adapter: claude
codec: claude
codecSpec: codec/claude.codec.yaml
decisionCodecSpec: codec/claude.decision-codec.yaml

harness:
  name: Claude Code
  verifiedVersion: '2.1.221'
  versionRange: '>=2.1.0'
  versionScheme: semver

integrationShape: callback

binding:
  source: payload
  field: session_id
  status: supported
  fixture: fixtures/normalize-post-tool-use-shell.json
  notes: >-
    Every hook body carries `session_id`, so binding needs no environment cooperation and works
    identically for the first event of a session and the thousandth. The native session id is a
    correlation alias only: authorization and mission scope come from the verified channel
    credential, never from cwd and never from an unverified native id. `CLAUDE_CODE_SESSION_ID`
    remains available in tool subprocesses and is used by `attach`, but the payload field is the
    one the push path depends on because it is present on the path that actually needs it.

decisionHold:
  status: supported
  timeoutField: timeout
  timeoutUnit: seconds
  maxTimeoutSeconds: null
  fixture: fixtures/permission-request.json
  notes: >-
    Per-command `timeout` in seconds with no documented ceiling. Omitting `decision` from a
    PermissionRequest response falls through to the native prompt, which is the required
    fail-toward-the-harness behavior.

capabilities:
  observe.prompt:
    status: supported
    native: UserPromptSubmit
    fixtures: [fixtures/normalize-user-prompt-submit.json]
    notes: >-
      Two registrations now ride UserPromptSubmit: the legacy hook that posts `user_follow_up`
      mission events through the Connector → Protocol surface, and the normalized agent-session
      event this capability grades. Both stay installed until the normalized path has proven
      equivalent follow-up attribution; replacing a working capture with an unproven one is how
      a migration loses data quietly.
  observe.toolCall:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-phase-2
    notes: >-
      Deliberately unregistered in Phase 1. PreToolUse is decision-capable: registering it for
      observation alone would put a script in front of every tool call for no benefit a
      PostToolUse registration does not already provide, while inheriting the blast radius of
      the decision path. It lands with the codecs that can actually use it.
  observe.toolResult:
    status: supported
    native: PostToolUse
    fixtures:
      - fixtures/normalize-post-tool-use-shell.json
      - fixtures/agent-session-hook-unbound.json
  observe.fileEdit:
    status: supported
    native: PostToolUse
    fixtures:
      - fixtures/normalize-post-tool-use-write.json
      - fixtures/post-tool-use-parity.json
    notes: >-
      The shipped PostToolUse hook that records touched files into the per-session log used by
      `deliver` for change attribution is untouched and still registered. The normalized event
      is additive: `fixtures/post-tool-use-parity.json` guards both registrations being present,
      because the migration must not repair observation by regressing change attribution.
  observe.sessionLifecycle:
    status: supported
    native: SessionStart
    fixtures: [fixtures/normalize-session-start.json]
    notes: >-
      SessionStart only. There is no matching stop-class registration: continuing or observing a
      session a user believed had finished is a larger surprise than a missing row, and the Stop
      event is decision-capable in a way SessionStart is not.
  decide.shell:
    status: supported
    native: PermissionRequest
    fixtures: [fixtures/permission-request.json, fixtures/decision-codec.json]
  decide.mcp:
    status: supported
    native: PermissionRequest
    fixtures: [fixtures/permission-request.json, fixtures/decision-codec.json]
  decide.fileWrite:
    status: supported
    native: PermissionRequest
    fixtures: [fixtures/permission-request.json, fixtures/decision-codec.json]
  decide.anyTool:
    status: not-implemented
    native: PreToolUse
    trackedAs: agent-session-phase-2
  decide.universal:
    status: supported
    native: PermissionRequest
    fixtures: [fixtures/permission-request.json, fixtures/decision-codec.json]
    notes: >-
      Unlike Cursor, Claude has one event that covers every approval, so a single
      registration can reach every decision rather than a per-tool-class slice.
  answer.structuredQuestion:
    status: unverified
    native: Elicitation
    trackedAs: agent-session-verify-claude-elicitation
    notes: >-
      Elicitation/ElicitationResult hook events exist in the binary but their request and
      response shapes were not read. Write the fixture before relying on them.
  answer.persistentAllow:
    status: not-implemented
    native: PermissionRequest.decision.updatedPermissions
    trackedAs: agent-session-standing-permissions
    notes: >-
      Structurally available, deliberately unbuilt. A standing permission grant needs its own
      design, confirmation, audit language, and RBAC review before any remote surface offers it.
  inject.midTurn:
    status: supported
    native: asyncRewake
    fixtures:
      - fixtures/inject-async-rewake.json
      - fixtures/agent-session-inbox-unbound.json
    notes: >-
      SessionStart and PostToolUse register `agent-session-inbox.sh` with `asyncRewake: true`.
      Exit code 2 wakes the model with stderr as a system reminder — that is Delivered.
  inject.turnBoundary:
    status: supported
    native: Stop
    fixtures:
      - fixtures/inject-stop-block.json
      - fixtures/agent-session-inbox-unbound.json
    notes: >-
      Stop returns `decision: "block"` with the instruction as `reason`, which continues the
      turn with that text. The model receives it, so this path also reports Delivered.
  inject.nextTurn:
    status: not-implemented
    native: Stop
    trackedAs: agent-session-phase-4
    notes: >-
      No distinct next-turn-only path yet; turn-boundary Stop covers the portable fallback.
  terminal.concurrentAnswer:
    status: unsupported
    reason: >-
      The native permission prompt is drawn only after the hook returns, so nobody can answer
      in the terminal while Overlord holds the decision. Holding is simultaneously the only
      way to answer remotely and the reason the terminal cannot participate.
    evidenceRef: connector-harness-taxonomy.md#12-the-axis-that-actually-matters
  terminal.statusSurface:
    status: not-implemented
    native: statusMessage
    trackedAs: agent-session-phase-2
    notes: >-
      `statusMessage` is static install-time configuration with no per-request interpolation
      and no session-binding predicate, so it renders in unbound sessions too. It must be
      worded as an option, never as an instruction.

hazards:
  - id: shipped-permission-hook-inert
    severity: high
    summary: >-
      The installed PermissionRequest hook calls a `ovld protocol permission-request`
      subcommand that does not exist, backgrounds the call with `) & disown`, and is gated on
      a MISSION_ID environment variable launched sessions do not always set. It records
      nothing and, being backgrounded with stdout discarded, is structurally incapable of
      returning a decision. The shipped conformance `permissionHook` flag therefore overstates
      what happens today.
    verification: verified
    mitigation: implemented
    fixture: fixtures/permission-request.json
  - id: shipped-stop-hook-inert
    severity: medium
    summary: >-
      The installed Stop hook calls `ovld protocol hook-event --hook-type Stop`, which the CLI
      rejects, and then parses a `deliveryStatus` field nothing produces. Confirmed again at
      2.1.221 from a live agent-pod session: every entry
      in ~/.ovld/logs/stop-hook.log takes the `no launch mission id` branch and returns before
      the delivery check, because the hook gates on a `MISSION_ID` environment variable the pod
      does not set. The PostToolUse hook works in the same session because it resolves the
      mission from the per-cwd active-session manifest instead; the Stop hook should resolve it
      the same way.
    verification: verified
    mitigation: required
    trackedAs: agent-session-phase-3
  - id: unbound-session-side-effects
    severity: medium
    summary: >-
      NARROWED, NOT CLOSED. The new agent-session registrations gate in bash on
      OVERLORD_SESSION_CHANNEL_ID before spawning anything, so they are completely silent in an
      unbound session (proved by fixtures/agent-session-hook-unbound.json). The LEGACY
      PostToolUse hook still spawns `ovld protocol record-touched` and appends to ~/.ovld/logs
      in every session on the machine, because its scope gate lives inside the CLI rather than
      before the spawn (proved by fixtures/unbound-session.json). It stays installed on purpose:
      it is what feeds touched-file change attribution at deliver time, and removing it before
      the normalized path has demonstrated equivalent attribution would trade a privacy nit for
      a data-loss bug. Closing this means retiring the legacy hook, which is a migration, not a
      patch.
    verification: verified
    mitigation: required
    fixture: fixtures/unbound-session.json
    trackedAs: agent-session-phase-4
  - id: fork-and-subagent-identity-unknown
    severity: medium
    summary: >-
      Whether an in-process fork mints a new native session id, and whether subagent tool
      calls carry the parent's id, are both unverified. Guessing either routes a session's
      requests to the wrong mission. Partially narrowed at 2.1.221: the binary carries
      distinct `SubagentStart` and `SubagentStop` hook events, converts an agent-frontmatter
      `Stop` registration into `SubagentStop` ("subagents trigger SubagentStop"), and records
      `parent_session_id` and `agent_type` as separate fields from `session_id`. That the
      harness distinguishes the two identities is now established; which value lands in a
      subagent hook payload's `session_id` is still not, and that is the part binding depends
      on. Read it from a real subagent payload before changing any binding code.
    verification: unverified
    mitigation: required
    trackedAs: taxonomy-7.6
  - id: subagent-stop-unregistered
    severity: medium
    summary: >-
      The adapter registers `Stop` and no subagent-lifecycle event. Claude Code 2.1.221 fires
      `SubagentStop` — not `Stop` — when a subagent finishes, and subagents now run in the
      background past the parent's turn boundary, so the shipped Stop registration is
      guaranteed not to run for work a subagent completes after the parent stopped. Nothing is
      lost today because that registration is already inert (see `shipped-stop-hook-inert`),
      which is exactly why the fix is to repair the Stop path first and only then decide
      whether the repaired body should also ride `SubagentStop`. Registering the current
      inert script on a second event would add a spawn per subagent completion and buy
      nothing.
    verification: verified
    mitigation: required
    trackedAs: coo:585
  - id: subagent-commits-escape-delivery-delta
    severity: high
    summary: >-
      Delivery change attribution is computed from `git status --porcelain` against the attach
      baseline (cli/src/vcs.ts `readChangedFiles` / `filterRunAttributableChanges`); nothing in
      that path consults HEAD or the commit graph. A background subagent that commits, merges,
      or opens a PR for its own work therefore removes those files from the worktree delta, and
      they vanish from the delivery report entirely — not flagged, not skipped, silently
      absent. The PostToolUse touched-files log is unaffected (its key is
      `sha256(abspath(cwd) + "\0" + MISSION_ID)`, so a subagent sharing the cwd writes to the
      same log), which means the evidence that the edit happened survives while the delta that
      decides coverage does not. Closing this means teaching the delta about commits made since
      the baseline, which is a CLI change with branch and worktree semantics to settle, not a
      hook edit.
    verification: verified
    mitigation: required
    trackedAs: coo:585

decisionShape:
  codec: claude
  allowFixture: fixtures/decision-codec.json
  denyFixture: fixtures/decision-codec.json
  deferFixture: fixtures/decision-codec.json
  neverSend: [permission, user_message, agent_message, followup_message]
  notes: >-
    Claude expects `hookSpecificOutput.decision` with behavior allow/deny. Cursor's flat
    `permission` dialect must never be emitted here; relying on any cross-vendor
    compatibility shim is how a connector silently stops working after an upstream release.
    The decision-codec fixture executes the shared interpreter and pins all three outcomes.

unboundSessionFixture: fixtures/unbound-session.json

legacy:
  capabilities:
    - followUpHook
    - permissionHook
    - stopHook
    - editHook
    - modelFlag
    - effortFlag
    - contextFilePrompt
    - permissionRules
    - slashCommands
  hookTypes:
    - UserPromptSubmit
    - PermissionRequest
    - PostToolUse
    - Stop
