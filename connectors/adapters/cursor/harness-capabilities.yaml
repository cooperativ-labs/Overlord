# Cursor Agent CLI — agent-session interaction capabilities.
#
# Authoritative and fixture-backed. Validated against contract/harness-capabilities.schema.yaml.
# See connectors/AGENTS.md → "Harness capability descriptors" before writing any code here.
#
# Cursor is the adapter where a naive reading gets it backwards: the shipped conformance
# manifest claimed a universal PermissionRequest hook Cursor does not have, while the
# capability it DOES have (per-tool-class decisions with allow/deny/ask) is richer than
# Claude's in one respect. `decide.universal` is `unsupported` here, permanently, and the
# false legacy claim is corrected in the generated projection.
schemaVersion: 1
adapter: cursor
codec: cursor
codecSpec: codec/cursor.codec.yaml
decisionCodecSpec: codec/cursor.decision-codec.yaml

harness:
  name: Cursor Agent CLI
  verifiedVersion: '2026.08.04-aaa8809'
  versionRange: '>=2026.07.01'
  versionScheme: calendar

integrationShape: callback

binding:
  source: payload
  field: conversation_id
  fallbackField: session_id
  status: supported
  fixture: fixtures/normalize-before-submit-prompt.json
  notes: >-
    Cursor's current first-party hook reference defines `conversation_id` as stable across many
    turns. The executable prompt fixture and the shipped prompt/event codecs already use that
    field as the primary correlation alias, so the descriptor now matches the runtime instead of
    preferring the optional `session_id`. The verified channel credential remains the authority;
    neither identifier grants mission scope. A local authenticated resume probe was unavailable,
    so `session_id` remains a compatibility fallback rather than a competing primary identity.

decisionHold:
  status: supported
  timeoutField: timeout
  timeoutUnit: seconds
  defaultTimeoutSeconds: 60
  maxTimeoutSeconds: null
  fixture: fixtures/permission-request.json
  notes: >-
    The 60-second per-script default is an order of magnitude below any window sized for a
    human who is away from the keyboard. The adapter must always set `timeout` explicitly
    and must never rely on the default.

capabilities:
  observe.prompt:
    status: supported
    native: beforeSubmitPrompt
    fixtures: [fixtures/normalize-before-submit-prompt.json]
  observe.toolCall:
    status: not-implemented
    native: preToolUse
    trackedAs: latch-engine
    notes: >-
      Mechanical preToolUse observation moved to Latch `events`. Native Cursor permission
      prompts own approvals when Latch is absent.
  observe.toolResult:
    status: supported
    native: postToolUse
    fixtures: [fixtures/normalize-post-tool-use-write.json]
  observe.fileEdit:
    status: supported
    native: postToolUse
    fixtures: [fixtures/normalize-post-tool-use-write.json]
    notes: >-
      Carried on postToolUse rather than on Cursor's dedicated `afterFileEdit`, for the same
      reason Claude carries it on PostToolUse: one registration then covers every mutation,
      including the ones a shell command makes, and the split into `file.edited` happens where
      the normalized tool name is already known. `afterFileEdit` remains available if a future
      need appears for edit-level granularity the tool-level event cannot express.
  observe.sessionLifecycle:
    status: not-implemented
    native: sessionStart
    trackedAs: agent-session-phase-1
    notes: >-
      Cursor fires the event, but no shipped code in this repo has ever read one of its
      payloads, so the field carrying the equivalent of Claude's `source` is unknown. A codec
      rule on a guessed path would not fail loudly — an unresolved path yields a card with no
      detail — so this stays unbuilt until a real payload is recorded, rather than being
      claimed on an assumed field name.
  decide.shell:
    status: not-implemented
    native: beforeShellExecution
    trackedAs: latch-engine
  decide.mcp:
    status: not-implemented
    native: beforeMCPExecution
    trackedAs: latch-engine
  decide.fileWrite:
    status: not-implemented
    native: preToolUse
    trackedAs: agent-session-phase-2
  decide.anyTool:
    status: not-implemented
    native: preToolUse
    trackedAs: latch-engine
  decide.universal:
    status: unsupported
    reason: >-
      There is no single event covering every approval. Cursor's own Claude-compatibility map
      resolves `PermissionRequest` to null and lists it as unsupported; coverage is per tool
      class (shell, MCP, file read, generic pre-tool), so some approvals will never reach
      Overlord and the UI must not imply otherwise.
    evidenceRef: connector-harness-taxonomy.md#42-what-is-verified
  answer.structuredQuestion:
    status: unsupported
    reason: >-
      No hook step returns a structured question with options; the decision surfaces return
      only allow/deny/ask plus free-text user/agent messages.
    evidenceRef: connector-harness-taxonomy.md#42-what-is-verified
  answer.persistentAllow:
    status: unsupported
    reason: Hook responses are per-call; there is no "always" reply that persists a rule.
    evidenceRef: connector-harness-taxonomy.md#42-what-is-verified
  inject.midTurn:
    status: unsupported
    reason: No mechanism exists to insert a message into a running turn.
    evidenceRef: connector-harness-taxonomy.md#43-unique-challenges
  inject.turnBoundary:
    status: supported
    native: stop
    fixtures:
      - fixtures/inject-followup-message.json
    notes: >-
      `stop` returns `followup_message` for the protocol delivery reminder. Session-input
      injection is no longer a live Overlord path.
  inject.nextTurn:
    status: supported
    native: stop
    fixtures:
      - fixtures/inject-followup-message.json
    notes: >-
      Cursor's followup_message is scheduled for the next turn; the same path covers
      turn-boundary and next-turn naming.
  terminal.concurrentAnswer:
    status: unsupported
    reason: >-
      The native prompt is drawn only after the hook returns, so nobody can answer locally
      while Overlord holds the decision.
    evidenceRef: connector-harness-taxonomy.md#12-the-axis-that-actually-matters
  terminal.statusSurface:
    status: unverified
    trackedAs: taxonomy-7.9
    notes: Whether Cursor exposes an in-TUI status surface equivalent to Claude's statusMessage was not established.

hazards:
  - id: false-permission-hook-claim
    severity: high
    summary: >-
      The shipped conformance manifest declared the `permissionHook` capability and a
      `PermissionRequest` hook type. Cursor maps that event to null and lists it as
      unsupported, so the declaration was false and would render remote controls that can
      never fire. Corrected in this descriptor and in the generated legacy projection.
    verification: verified
    mitigation: implemented
    fixture: fixtures/no-permission-request-hook.json
    evidenceRef: connector-harness-taxonomy.md#43-unique-challenges
  - id: reads-claude-hook-config
    severity: high
    summary: >-
      Cursor resolves hooks from Claude's own project-local, project, and user configuration
      in addition to its own. If plugin-provided hooks are expanded, Overlord's Claude hooks
      may fire inside Cursor sessions and emit Claude-shaped decisions into a Cursor-shaped
      contract — cross-connector misattribution with no code change on our side.
    verification: unverified
    mitigation: required
    trackedAs: taxonomy-7.1
  - id: allowlist-precedence
    severity: medium
    summary: >-
      Reported upstream that beforeShellExecution allow/ask is ignored when a command
      allowlist entry matches. A remote approval may be a no-op, so "we returned allow" is
      not proof the decision was decisive.
    verification: unverified
    mitigation: required
    trackedAs: taxonomy-7.8
  - id: fail-closed-inverts-fallback
    severity: high
    summary: >-
      Cursor's per-script `failClosed` converts a hook failure into a block, inverting the
      core's fail-toward-the-harness rule. Overlord's hook registration must never set it.
    verification: verified
    mitigation: implemented
    fixture: fixtures/fail-closed-unset.json
  - id: post-tool-use-log-dir-precondition
    severity: medium
    summary: >-
      The shipped postToolUse hook redirects stderr into ~/.ovld/logs without creating that
      directory first (Claude's equivalent does). On a machine where the directory does not
      yet exist the redirect fails and `ovld protocol record-touched` is never invoked, so
      touched-file attribution silently records nothing for that session. Fixed in phase 0B by
      creating the directory before the redirect, matching Claude's hook; the fixture guards
      the hook against losing that line again.
    verification: verified
    mitigation: implemented
    fixture: fixtures/post-tool-use-log-dir.json

decisionShape:
  codec: cursor
  allowFixture: fixtures/decision-codec.json
  denyFixture: fixtures/decision-codec.json
  deferFixture: fixtures/decision-codec.json
  neverSend: [hookSpecificOutput, permissionDecision, decision]
  notes: >-
    Cursor's own dialect is flat — `{ permission, user_message, agent_message }`. Claude's
    nested `hookSpecificOutput` must never be emitted here even though Cursor would accept it
    under `enableClaudeNestedHookSpecificOutputCompatibility`: relying on another vendor's
    compatibility shim for our primary path is a dependency we do not need.
    The decision-codec fixture executes the shared interpreter and pins all three outcomes.

unboundSessionFixture: fixtures/unbound-session.json

legacy:
  capabilities:
    - followUpHook
    - stopHook
    - editHook
    - modelFlag
    - permissionRules
    - slashCommands
  hookTypes:
    - UserPromptSubmit
    - PostToolUse
    - Stop
