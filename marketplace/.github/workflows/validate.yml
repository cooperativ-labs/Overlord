name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate catalog and plugin packages
        env:
          MARKETPLACE_BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/validate-marketplace.mjs
