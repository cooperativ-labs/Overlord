<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribe transcripts</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:CanvasText;background:Canvas}body{margin:0;padding:20px}h1{font-size:20px;margin:0 0 8px}p{line-height:1.5}article{padding:14px 0;border-top:1px solid color-mix(in srgb,CanvasText 20%,transparent)}h2{font-size:16px;margin:0 0 5px}.muted{font-size:13px;opacity:.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 system-ui,sans-serif}button{font:inherit;padding:8px 12px;border-radius:6px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
</style></head><body><h1>Scribe</h1><p id="status" role="status">Waiting for transcripts…</p><main id="content"></main>
<script>
const content=document.querySelector('#content'), status=document.querySelector('#status');
let sequence=0, hostReady=false, lastData; const pending=new Map();
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The host did not respond. Ask the assistant to retrieve the next page.'));},15000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function add(parent,tag,text,cls){const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el;}
async function call(args,button){button.disabled=true;status.textContent='Reading transcript…';try{const result=await request('tools/call',{name:'scribe_get_transcript',arguments:args});if(result.isError)throw new Error(result.content?.[0]?.text||'Unable to read transcript.');render(result.structuredContent);}catch(error){status.textContent=error.message;}finally{button.disabled=false;}}
function render(data){lastData=data;content.replaceChildren();if(!data){status.textContent='No transcript data yet.';return;}
 if(typeof data.text==='string'){status.textContent=data.title;add(content,'p',`${data.created_at} · ${data.speakers.join(', ')} · revision ${data.revision}`,'muted');add(content,'pre',data.text||'No speech detected.');if(data.next_offset!==null){add(content,'p',`Showing characters ${data.offset}–${data.offset+data.text.length} of ${data.total_chars}.`,'muted');if(hostReady){const b=add(content,'button','Next page');b.onclick=()=>call({id:data.id,offset:data.next_offset,revision:data.revision},b);}}for(const warning of data.warnings||[])add(content,'p',warning.message,'muted');}
 else{const rows=data.transcripts||data.results||[];status.textContent=rows.length?`${rows.length} meeting${rows.length===1?'':'s'}`:'No matching transcripts.';for(const row of rows){const article=document.createElement('article');content.append(article);add(article,'h2',row.title);add(article,'p',[row.created_at,(row.speakers||[]).join(', ')].filter(Boolean).join(' · '),'muted');if(row.excerpt)add(article,'p',row.excerpt);if(hostReady){const b=add(article,'button','Read transcript');b.onclick=()=>call({id:row.id},b);}}if(data.next_offset!==null&&data.next_offset!==undefined)add(content,'p','More meetings are available. Ask the assistant for the next results.','muted');if(data.skipped_runs)add(content,'p',`${data.skipped_runs} unfinished or unreadable runs omitted.`,'muted');}}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const message=event.data;if(message?.jsonrpc!=='2.0')return;if(message.id&&pending.has(message.id)){const p=pending.get(message.id);clearTimeout(p.timer);pending.delete(message.id);message.error?p.reject(new Error(message.error.message)):p.resolve(message.result);}if(message.method==='ui/notifications/tool-result')render(message.params?.structuredContent);if(message.method==='ui/notifications/tool-cancelled')status.textContent='Transcript request cancelled.';});
request('ui/initialize',{appInfo:{name:'scribe-transcripts',version:'0.1.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{hostReady=true;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(lastData||window.openai?.toolOutput)render(lastData||window.openai.toolOutput);new ResizeObserver(()=>window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}},'*')).observe(document.body);}).catch(()=>{if(window.openai?.toolOutput)render(window.openai.toolOutput);});
</script></body></html>
