description: 'OAuth-protected, mission-first MCP server for hosted ChatGPT Apps and other MCP clients. The overlord_create_mission and overlord_add_objectives tools support per-objective agent/model selection. Run Queue tools include overlord_list_run_queues, overlord_reorder_run_queue, and overlord_manage_run_queue; overlord_queue_objective supports queue, predecessor, front, and rank placement.'
