name: Contract

# Mechanical contract alignment on every branch push and pull request
# (contract/CONTRACT.md sections 5 and 6). The contract-impact declaration is
# checked against a release range by `yarn release:preflight` (the release gate,
# ADR 0052, contract/releases/README.md), not here.

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: corepack enable
      - run: yarn install --immutable
      - name: Validate contract structure and version agreement
        run: yarn contract:check
      - name: Unit-test the contract tooling
        run: yarn contract:test
      - name: Check conformance manifest versions
        run: yarn check:conformance-versions
      # Regenerates packages/contract/src/generated/api.ts from the OpenAPI
      # description, fails on any difference, and typechecks the contract package.
      - name: Verify the generated API contract
        run: yarn api:generate:check
      # The route parity test loads the real Express app (backend/app.ts), which
      # imports the built workspace packages.
      - name: Build the workspace packages the backend imports
        run: yarn contract:build:prod && yarn db:build:prod && yarn auth:build:prod && yarn automations:build:prod && yarn core:build:prod
      - name: OpenAPI route parity
        run: yarn contract:parity
      # The backend suite runs under scripts/api-conformance-report.mjs (ADR 0051): it
      # holds the request-validation tests, and every response a test produces is
      # checked against its OpenAPI operation; the run fails on any mismatch. The
      # end-to-end tests drive the built CLI.
      - name: Build the CLI
        run: yarn cli:build:prod
      - name: Backend tests with REST request validation and response conformance
        run: yarn test:backend
