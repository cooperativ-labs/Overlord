schema_version: '1.1'
name: draft-only
description: A request to draft a mission must not start execution.
execution:
  max_turns: 4
  timeout_seconds: 90
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Consult the Overlord mission skill. Show the CLI command to create a draft
    mission for project 49763405-008f-4267-89e4-c57f5a234c91 with one objective,
    "Document the connector setup", assigned to agent claude. I only want a
    draft; do not execute the mission. This is an offline documentation exercise:
    show the command without running it or contacting Overlord.
graders:
  - name: mission-skill
    type: tool_used
    tool: Skill
    input_match: 'overlord-mission'
  - name: draft-command
    type: regex
    pattern: 'ovld protocol create\b'
  - name: project-scoped
    type: regex
    pattern: '--project-id\s+49763405-008f-4267-89e4-c57f5a234c91'
  - name: objective-array
    type: regex
    pattern: '--objectives-json\s'
  - name: no-execution-command
    type: regex
    pattern: 'ovld protocol (attach|prompt|launch-objective)\b'
    match: not_contains
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
