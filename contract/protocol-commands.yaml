# Overlord Protocol Command Surface
# Machine-readable counterpart to planning/feature-plans/03-agent-protocol.md
#
# This file defines the stable command names, required flags, response shape versions,
# and declared side effects. Full parameter detail is in the reference spec.
#
# IMPORTANT: Any addition, rename, or flag change to a command in this file requires
# a contract version update (`yarn version:contract`, contract/CONTRACT.md section 5).
#
# Local-only `ovld protocol <subcommand>` commands that never cross the CLI -> backend
# HTTP surface (no POST /api/protocol/<subcommand>, no backend handler, no permission
# entry) are intentionally not listed here: `capture-change` and `changes`. See
# the contract-version-2 changelog entry for the precedent (versions before 95 are
# kept only in git history; see contract/CHANGELOG.md).
#
# Routing split (contract v165): the CLI-local `ovld protocol changes` reads this
# working directory's objective ledgers (LocalObjectiveChangesDto, scope
# local_objective_sessions) and is never sent to the backend. The server read of
# synchronized objective history is the backend subcommand `objective-changes`
# (ObjectiveFileChangesDto, scope server_objective) below; the two names never
# collide and neither claims the other's coverage.

contractVersion: "179.0.1"
referenceSpec: 'contract/protocol.md'

# Transport-level shape shared by every protocol command, independent of subcommand.
requestEnvelope:
  objectiveAddressing:
    description: >-
      Every subcommand that accepts --mission-id also accepts --objective-id
      (objective UUID or {mission.display_id}.{display_key}). The objective
      display id already names its parent mission, so --mission-id may be
      omitted whenever a full display id is supplied: the client CLI derives it
      before the request and the backend derives it again from the body, so a
      caller holding only `coo:756.k7xm` never has to reconstruct `coo:756`.
    rules:
      - "An objective display id supplies the mission reference when --mission-id is absent; an explicit --mission-id always wins and must name that objective's own mission."
      - 'An objective UUID does not name its mission, so --mission-id remains required when --objective-id is a UUID.'
      - 'The CLI auto-fills --objective-id from OVERLORD_OBJECTIVE_ID (and the recovered launch bootstrap) on session-scoped subcommands, not only attach; update-objective and discuss-objective never inherit it.'
      - 'CLI load-context, read-context, attachment-list and attachment-download-url inherit an objective only with no explicit mission (flag or positional) or a matching parent mission display id. Opaque UUIDs need an explicit objective pin on mission-selected reads. Explicit pairs retain validation; lifecycle/mutation targeting is unchanged. list-deliveries remains mission-wide and never inherits an objective. Reads never rebind execution sessions.'
      - 'Reference grammar is owned by @overlord/contract (parseObjectiveRef / formatObjectiveDisplayId / missionDisplayIdFromObjectiveRef) and re-exported by @overlord/database; no surface may carry a private copy.'
  fileInputs:
    description: "Canonical per-flag map of resolved --*-file payloads: { '--summary-file': '<content>', '--declared-paths-file': '<content>', ... }."
    rules:
      - "At most one --*-file flag may use literal '-' (true stdin) per invocation; passing two stdin flags fails fast on the client with a CliError naming the offending flags. Real file paths are unlimited."
      - 'Every file-backed input is read only from its own fileInputs entry; no shared stdin payload or fallback field exists.'
  declaredPathsInput:
    description: 'Shape of --declared-paths-json / --declared-paths-file (and the declaredPaths payload field) on update, deliver, and record-work: a JSON array of repository-relative path strings.'
    validationRules:
      - 'Each item is a canonical, bounded, repository-relative path; at most 100 items. Unsafe (absolute, traversal, control characters), Overlord-managed, and non-string items are discarded individually with a bounded warning; duplicates collapse.'
      - 'Deleted and renamed paths are valid even when absent on disk; both rename endpoints may be declared. Commas are path characters inside the JSON array.'
      - 'Declarations are stored with source agent_declared and never claim native capture. Native evidence for the same objective, resource, and path is never downgraded.'
      - 'Declarations are advisory and never reject update, deliver, or record-work.'
  retiredInputs:
    description: 'Rejected with HTTP 400 invalid_input (not aliased, ignored, or dual-written) from contract v165.'
    flags:
      - --change-rationales-json
      - --change-rationales-file
      - --changed-files-json
      - --changed-files-file
    payloadFields:
      - changeRationales
      - changedFiles

sessionLifecycle:
  project-items:
    requiredFlags: [--session-key]
    optionalFlags: [--mission-id, --objective-id, --kind, --query, --path, --include-own-mission, --limit, --offset]
    responseShapeVersion: 1
    sideEffects: []
    notes:
      - 'Requires mission:read and a live undelivered attached session matching mission and optional objective; project_automation denied. Publication ended-session exception does not apply.'
      - 'Accepted live open items in the same workspace/project, excluding own mission by default. Draft observations never contribute results or counts.'
      - '--kind is comma-separated risk,human_action,suggestion. --query is a case-insensitive substring over text and suggestion change/location/doneWhen, at most 200 characters; never id lookup. --path is comma-separated repo-relative ranking paths (at most 200, each at most 1000 characters).'
      - 'Scan at most 2000 newest-delivery open rows before filtering and ranking. Full path strong, directory prefix of at least two segments medium, non-generic basename weak; matched then newest (project-item-match-vectors.json). Explicit paths augment the live objective ledger, not a mandatory path filter.'
      - 'Response: responseShapeVersion 1, projectId, excludedMissionId (null when including own), total (filtered scanned rows), items, limit (default 20, 1..100), offset (default 0), nextOffset, truncated, scanTruncated, ledger {paths: number, captureGap: boolean}. Each item has id, kind, mission {displayId,title}, objective display id, text (at most 240 characters), optional textTruncated true and location (at most 240), blocking boolean or null, reportedAt and match {paths (at most five), strength: strong|medium|weak|none}. Restart paging after writes.'
  mission-items:
    requiredFlags: [--session-key]
    optionalFlags: [--mission-id, --objective-id, --limit, --offset]
    responseShapeVersion: 1
    sideEffects: []
    notes:
      - 'Live attached session must match mission; workspace/project scope and mission:read apply.'
      - 'Returns full open items, total, limit (default 60, 1..200), offset (default 0), truncated and nextOffset. Blocking human actions first; restart paging after concurrent changes.'
  close-items:
    requiredFlags: [--session-key]
    optionalFlags: [--mission-id, --objective-id, --close-items-json, --close-items-file]
    responseShapeVersion: 1
    sideEffects: [mission_item_update, entity_change_append]
    notes:
      - 'Requires event:create and a live attached session matching the mission; delivered sessions must resume follow-up.'
      - 'Requires 1..50 close entries with delivery validation and warnings. Agent provenance uses attached objective and null delivery id. Returns contentRevision, narrativeWritten false, closedItemIds, warnings and foreign targets [{missionDisplayId, closed}]. Same-project foreign items require mission:update; out-of-scope ids are not_found, denied entries forbidden, person-restored foreign entries restored_by_person. Provenance includes mission/session and links once at first delivery acceptance.'
  attach:
    description: 'Start a working session; return compact execution context plus agent instructions'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --session-key
      - --execution-request-id
      - --execution-target-id
      # Binds the session channel prepared before launch to the session attach creates.
      # The channel ID only — never its credential, which reaches the backend solely as an
      # Authorization header on /api/agent-session-channels/v1/*. The CLI fills this from
      # OVERLORD_SESSION_CHANNEL_ID automatically when the launch path exported one.
      - --session-channel-id
      # Pins attach to this objective (UUID or {mission.display_id}.{display_key}).
      # When this flag or --execution-request-id is present, attach must not rediscover
      # another objective from mission state. A display id supplies --mission-id.
      - --objective-id
      # Declared capture binding observed by the attaching client: bound | unbound | unknown
      # (default unknown). Configuration evidence only; never proof that a hook ran.
      - --capture-binding
      # Tool vocabulary of agentInstructions: cli (default) or mcp. MCP servers send mcp so the
      # rules name MCP tools and payload fields, never CLI commands or flags.
      - --connection-method
    returnsSessionKey: true
    responseShape: attach-response-v4
    rules:
      - '--connection-method accepts cli or mcp (default cli); any other value is rejected with invalid_input. With mcp, agentInstructions names Overlord MCP tools and payload fields and no CLI commands or flags; the value is also stored as the session connection_method'
      - 'For a summary-enabled mission the response carries the optional top-level missionSummary editing baseline (ADR 0060) and agentInstructions gains a Mission summary block; load-context and connect never carry either'
      - 'When --objective-id or --execution-request-id is present, attach pins to that objective and must not rediscover via mission state'
      - 'A pinned completed objective refuses attach and gives the follow-up recovery instruction for the caller connection method'
      - 'Without a pin, attach rediscovers in this order: the single executing, launching or pending_delivery objective (two equally ranked active objectives return 409 ambiguous_active_objective); then the first submitted objective; then the next runnable draft (first draft with instruction text); then the first draft; then the first unfinished objective — each by position, created_at, id (ADR 0056)'
      - 'Session commands (attach, connect, resume-follow-up, update, heartbeat, sync-changes, hook-event, ask, deliver) and launch/queue commands are denied for a project_automation USER_TOKEN (contract v151); it holds no session:attach, event:create, or execution_request:create grant, and the REST allowlist for that preset does not admit them'
    sideEffects:
      - creates-agent-session
      - objective-state-to-executing
      - binds-session-channel

  update:
    description: 'Post progress event; optionally record a batch of draft report evidence (ADR 0078) and declare shell/script-written paths the native hook could not name'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
      - --options-json
      - --options-file
      - --no-free-text
      - --json
      - --summary
      - --summary-file
      - --phase
      - --event-type
      - --payload-json
      - --payload-file
      - --external-url
      - --external-session-id
      - --declared-paths-json
      - --declared-paths-file
      - --paths
      - --paths-file
      - --begin-follow-up-work
      - --follow-up-intent
      # Opt-in draft evidence batch (ADR 0078); also accepted as reportDraft in --payload-json.
      - --report-draft-json
      - --report-draft-file
    reportDraftInput:
      shape: '{ operationId, expectedRevision, operations: [ { op: upsert, entryId, kind, content } | { op: withdraw, entryId, reason } | { op: import, sourceDraftId, sourceEntryId, entryId? } ] }'
      rules:
        - 'Optional and opt-in. With a batch, --summary may be omitted; the event summary is then derived from the operation counts. Cannot be combined with --begin-follow-up-work (400 invalid_input). Never stored in the event payload; the event carries only bounded metadata reportDraft { draftId, operationId, revision, upserted, withdrawn, imported }.'
        - 'operationId is the caller-retained batch identity (8-128 characters of letters, digits, ".", "_", ":" or "-"), chosen before sending and reused for every retry of the batch; clients never mint one per retry. expectedRevision is a non-negative integer, 0 when the session has no draft. operations holds 1-50 operations with distinct entry ids. Entry ids are 1-100 characters starting alphanumeric. kind is the closed set human_action|tradeoff|known_risk|deferred_work|assumption; content is validated with the delivery-report item schemas and bounds ({ text } for known_risk and assumption). Malformed input answers 400 invalid_input before any write.'
        - 'Under the mission lock the receipt of the same session draft and operationId is looked up before the session must be live and before the revision check: the same digest returns the original eventId and reportDraft { draftId, operationId, revision, replayed: true, currentRevision } with no writes, also after sealing or session end (a receipt read, never update authority); a different request answers 409 report_draft_operation_conflict.'
        - 'Otherwise the session must be live and undelivered (409 delivery_boundary for a delivered session), the caller must be the session owner (403 report_draft_forbidden), the draft must not be sealed (409 report_draft_sealed), and expectedRevision must equal the current revision; a mismatch applies nothing and answers 409 report_draft_conflict with details { currentRevision, draft }.'
        - 'A batch applies atomically with its immutable delivery_report_draft_batches receipt and its update event, and increments the draft revision once. upsert creates or replaces an entry (re-activating a withdrawn one) and never changes its kind; withdraw keeps the entry as audit data; import copies an active entry of an abandoned draft (session ended, unsealed) of the same objective and records its source.'
        - 'Bounds: at most 12 active entries per kind; at most 1,000 accepted batches and 1,000 distinct entry ids per draft. Beyond a bound the write answers 409 report_draft_limit_exceeded; receipts, reads and finalization keep working; nothing is pruned.'
        - 'Draft entries never create mission_items, human obligations, badges or seen-state changes.'
    validPhases:
      - draft
      - execute
      - review
      - deliver
      - complete
      - blocked
      - cancelled
    validEventTypes:
      - update
      - user_follow_up
      - alert
      - discussion_summary
      - decision
    sideEffects:
      - appends-mission-event
      - appends-optional-generator-output-ledger-evidence
      - records-optional-agent-declared-changed-files
      - emits-scoped-changed-file-entity-changes
      - writes-optional-report-draft-batch-and-receipt
      - emits-scoped-delivery-report-draft-entity-changes

  hookEvent:
    description: 'Record connector lifecycle events such as UserPromptSubmit without requiring a live agent session'
    requiredFlags:
      - --hook-type
    optionalFlags:
      - --mission-id
      - --objective-id
      - --session-key
      - --external-session-id
      - --prompt
      - --prompt-file
      - --turn-index
    validHookTypes:
      - UserPromptSubmit
    sideEffects:
      - appends-mission-event-type-user-follow-up
    rules:
      - 'UserPromptSubmit records discussion activity and does not reopen objective execution'
      - 'Expired delivered sessions may be used for attribution but must not reject follow-up capture'

  resumeFollowUp:
    description: 'Explicitly reopen a completed objective for post-delivery implementation follow-up'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --objective-id
      - --agent
      - --model
      - --external-session-id
      - --summary
      - --summary-file
      # Same meaning as on attach.
      - --connection-method
    returnsSessionKey: true
    responseShape: attach-response-v4
    rules:
      - 'Returns a fresh protocol session key and preserves any execution request link to the original session'
    sideEffects:
      - creates-agent-session
      - objective-state-complete-to-pending-delivery
      - mission-status-to-execute
      - appends-mission-event
      # ADR 0076: supersedes outstanding mission-summary publication opportunities.
      - advances-mission-narrative-evidence

  heartbeat:
    description: 'Update session liveness without creating a mission event'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
      - --phase
      - --percent
      - --note
    sideEffects:
      - updates-session-last-heartbeat-only
      # Does NOT create a mission_events row

  syncChanges:
    description: 'Synchronize bounded metadata-only path evidence from the execution target objective ledger'
    requiredFlags:
      - --session-key
    optionalFlags:
      - --mission-id
      - --objective-id
      - --changes-json
      - --changes-file
      - --capture-json
      - --capture-file
    requestInput:
      requiredFields:
        - filePath
        - idempotencyKey
        - source
      optionalFields:
        - observedAt
        - hookHealth
    captureInput:
      description: 'Optional bounded session capture diagnostics: { bindingState?, callbackObservedAt?, health?: [{ code, at }] }; unsupported keys reject the whole capture object with a warning.'
    responseShape: sync-changes-v1
    rules:
      - 'Each item is processed independently and returns accepted, ignored, or warning; invalid siblings never roll back accepted evidence.'
      - 'source is declared_edit (native) or agent_declared. window_observed, quality, overlap, and toolWindowId are retired and rejected per item with a clear warning.'
      - 'Only normalized workspace-relative path and bounded source/health/observedAt metadata persist. Absolute paths, parent traversal, file content, diffs, commands, transcripts, environment values, raw callbacks, and fingerprints are prohibited.'
      - 'Row identity is objective + resource resolved from the authorized session + path. Native evidence is never downgraded by a later declaration; observedAt extends first/last observation and never moves them past now.'
      - 'Replay of an idempotencyKey for the same row is ignored; sync failure and warnings cannot reject delivery.'
      - 'Advisory recovery accepts ended delivered sessions, with current caller authorization and unchanged mission/objective/resource binding. Deleted or ended non-delivered sessions remain invalid. Recovery never reopens lifecycle state or rewrites a delivery.'
      - 'Capture diagnostics are written to the authorized session only: binding state, earliest accepted callback, and per-code first/last health aggregates (at most 16 codes; known gap codes are sticky and never displaced). They emit an agent_session entity change in the same transaction.'
    sideEffects:
      - upserts-changed-files-by-objective-resource-path
      - emits-scoped-changed-file-entity-changes
      - updates-session-capture-diagnostics
      - emits-scoped-agent-session-entity-changes

  objectiveChanges:
    description: 'Read synchronized changed-path evidence for exactly one objective across all sessions, resources, and devices (ObjectiveFileChangesDto)'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --objective-id
      - --connection-method
    responseShape: objective-file-changes-v1
    rules:
      - 'Server-only read of persisted rows; never reads an execution target filesystem and never sees unsynchronized local ledger rows. The response says so with scope server_objective.'
      - 'The objective is validated against the addressed mission before any SQL; a foreign mission/objective pair is rejected. The objective filter applies before count and the 200-row limit.'
      - 'Returns { scope, missionId, objectiveId, items, total, limit, truncated, capture } with compact FileChangeDto items ordered by resource then path, total as the pre-cap count, and persisted per-session capture diagnostics plus derived warnings.'
      - 'Needs no attach and no mutation; reuses mission read authorization, active workspace membership, and token project scope.'
      - 'When a capture warning needs agent action (any warning on this read), the response adds instruction: how to declare missed paths, worded by --connection-method cli|mcp (default cli; other values 400 invalid_input). MCP servers send mcp and the text names declaredPaths on the Overlord MCP session tools and no CLI flag. The CLI-local changes read returns the same field in CLI wording, also for sync_failed; sync_pending alone adds none (coo:1294 D6).'
    sideEffects: []

  ask:
    description: 'Post a single blocking question and stop work'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
    questionInput:
      flag: --question
      fileAlternative: --question-file
    rules:
      - 'Agent MUST stop after calling ask'
      - 'Ask exactly one blocking question per call'
    sideEffects:
      - appends-mission-event-type-ask
      - creates-answerable-agent-request-when-session-has-bound-channel

  deliver:
    description: 'Final delivery — mark objective complete and move mission to review'
    requiredFlags: []
    requiresSessionKey: true
    summaryInput:
      flag: --summary
      fileAlternative: --summary-file
    optionalFlags:
      - --mission-id
      - --objective-id
      - --artifacts
      - --declared-paths-json
      - --declared-paths-file
      - --payload-json
      - --payload-file
      - --verification-summary
      - --follow-up-notes
      - --paths
      - --paths-file
      # Agent-authored mission summary write (ADR 0060); wins over payload missionSummary.
      - --mission-summary-file
      # Caller-retained finalization operation id (ADR 0075); wins over payload operationId.
      - --operation-id
      # Draft-aware delivery (ADR 0078): { expectedRevision, operations? }, or the shorthand
      # --expected-draft-revision <n>; also accepted as reportDraft in --payload-json.
      - --report-draft-json
      - --report-draft-file
      - --expected-draft-revision
    reportDraftInput:
      shape: '{ expectedRevision, operations? } (operations as for update; no batch operationId)'
      rules:
        - 'Required when the session has a report draft: a missing or stale expectedRevision answers 409 report_draft_conflict with details { currentRevision, draft } before any write. Sessions without a draft keep the full-report behavior unchanged. --expected-draft-revision and --report-draft-json/file are mutually exclusive (400 invalid_input). Never stored in the delivery payload; part of the finalization digest.'
        - 'Inside the finalization transaction the final operations apply with the update rules; the accepted V1 report is the active entries in position order followed by deliveryReport items whose canonical kind and content match no active entry. Entries are amended or removed only through their ids. More than 12 items of a kind answers 409 report_draft_limit_exceeded; nothing is truncated or selected by a model. Normalization, human-action filtering and deferred-work eligibility are the ones shared with non-draft deliveries and record-work.'
        - 'Acceptance records each active entry''s accepted V1 reference (human-action-N, tradeoff-N, the deferred-work id, knownRisks[i], assumptions[i]), seals the draft and links the delivery; the response adds reportDraft { draftId, revision, sealed: true, activeEntries, refs: [{ entryId, ref }] }. A failed delivery leaves the draft open. A replay returns the original sealed result and never reseals. Sealed drafts, their entries and batch receipts are immutable in both editions.'
    operationIdInput:
      sources:
        - --operation-id
        - 'operationId field of --payload-json / --payload-file (never stored in the delivery payload)'
      rules:
        - 'Optional. 8-128 characters of letters, digits, ".", "_", ":" or "-", starting with a letter or digit; anything else answers 400 invalid_input before any write. It is a non-secret reference, not a credential.'
        - 'The finalization transaction commits a durable, immutable delivery_finalizations receipt with the delivery: the canonical digest of the validated semantic request and the accepted result. Receipts live as long as their delivery and are never request-cache entries.'
        - 'A retry with the same actor, kind and operation id and the same semantic request returns the stored accepted result with replayed: true and writes nothing, also after the session ended. The caller''s current membership, permission and project scope are checked again first.'
        - 'The same operation id with a different semantic request (or another mission/session) answers 409 delivery_operation_conflict with details { operationId, operationKind, deliveryId }.'
        - 'A session finalizes at most once. Under the mission lock the service rechecks that the session is live and undelivered; a session that already delivered, with or without a receipt (historical deliveries keep none), answers 409 delivery_already_accepted with details { deliveryId } instead of a second delivery. This also applies to requests without an operation id.'
        - 'Clients choose the id before sending and reuse it for every retry of the same logical attempt; they never mint a new id on a timeout. An id minted inside a tool handler per invocation is not a retry guarantee. A not-found delivery-receipt read alone does not prove a concurrent attempt cannot commit; retry the same operation id instead.'
    missionSummaryInput:
      shape: '{ baseContentRevision, baseEvidenceRevision, headline, summary, closeItems: [{ id, status: done|dismissed, reason }] }'
      sources:
        - --mission-summary-file
        - 'missionSummary field of --payload-json / --payload-file'
      rules:
        - 'Validated before any write; malformed input, headline and summary not sent together, a headline that is empty, multi-line or over 140 characters, a summary empty or over 1,200 characters, prose without baseContentRevision, a negative or non-integer base, more than 50 closeItems, or a close entry without status done|dismissed and a reason of at most 280 characters answers 400 invalid_input'
        - 'Agent-only narrative (ADR 0076): nothing else writes mission headline or summary. For a summary-eligible mission, under the mission lock and then the summary row lock and before any delivery row is written, both bases are compared with the pre-delivery mission_summaries.content_revision and evidence_revision. Only when both match does the prose publish, against the evidence revision this delivery advances to'
        - 'Stale, legacy or absent prose never rejects the delivery: a stale content base (stale_content), a stale evidence base (stale_evidence), a missing baseEvidenceRevision from an older client (missing_evidence_base) or no prose (absent) accepts the delivery and its closes, keeps the existing text, and leaves this delivery''s publication opportunity outstanding. Withheld prose adds a bounded mission_summary_withheld warning. 409 mission_summary_conflict is no longer a deliver response'
        - 'Every accepted delivery of an eligible mission advances evidence_revision, supersedes older outstanding publication opportunities of the mission (superseded_reason newer_delivery) and creates one delivery_summary_publications row holding the immutable original proposal; the acceptance receipt references it'
        - 'closeItems close open same-project items with agent mission/session provenance (ADR 0079); foreign targets require mission:update, restored_by_person protects foreign person-restored rows, and out-of-scope ids read as not_found. Unknown, unauthorized, restored, duplicate, superseded or already-closed ids are skipped with bounded mission_summary_item_skipped warnings and never reject the delivery. Each warning message states the cause and what the agent does next: when the intended item may stay open, it says to name that item and why in the final message'
        - 'Published prose is written with generated_by agent, status composed, the narrative_* references, published_evidence_revision, server-issued narrative_published_at / narrative_changed_at strictly after the previous narrative change, and content_revision + 1, visible at once'
        - 'For an eligible mission the response always carries missionSummary { contentRevision, narrativeWritten, closedItemIds, targets, warnings, publication: { id, available, withheldReason } } plus baseline (the attach shape, with evidenceRevision and narrative) when the publication stays available; the instruction then leads with the publication step, worded for the connection method, and says not to deliver again or resume execution. An ineligible mission without input gets no missionSummary; prose sent to it is dropped with mission_summary_disabled'
        - 'The field is never stored in the delivery payload. A delivery without it is accepted; no prose is generated for it'
    clientCapture:
      - 'The client CLI drains every pending bounded batch from the attached objective ledger through sync-changes before delivery. It never derives or injects file paths from a worktree delta.'
      - 'Optional bounded --paths (comma list) and --paths-file (JSON string array; commas are path characters) append agent-known shell/script/generator outputs, deletes, and both rename endpoints to the attached objective ledger as agent_declared before the drain. They are normalized against the session checkout (absent targets valid; traversal, out-of-checkout symlinks, ignored and Overlord-managed paths rejected with a reason) and are not a changed-file reconciliation input.'
      - 'If local binding/ledger storage is unavailable, explicit --session-key and --objective-id retain the same declarations and path policy via authenticated sync-changes. The CLI warns; server objective-changes exposes accepted fallback evidence, while local changes diagnoses the capture gap. Failed fallback sync has no durable retry copy and requires repeating declarations; delivery remains advisory and non-blocking.'
      - 'The drain also sends bounded session capture diagnostics (binding recorded at attach, first accepted callback, health codes) through sync-changes capture once per drain when they changed since last accepted.'
    validationRules:
      - 'Objective-ledger changed files and declared paths are review metadata and cannot reject a delivery. No per-file rationale exists.'
      - '--payload-json / --payload-file may carry an additive deliveryReport object with schemaVersion: 1 and agentReport.{humanActions,tradeoffsMade,knownRisks,deferredWork,assumptions}; omitted or malformed advisory items normalize independently with bounded warnings, except deferredWork: since contract v166, string items, malformed objects, and overlong fields reject the submission with invalid_input'
      - 'Human actions are bounded and filter Git operations plus routine review/testing instructions before they are persisted in deliveryReport.presentation'
      - 'Each human action has a required action, expected reason and category, optional blocking, and optional command, verify, and link fields; link accepts only an HTTP(S) URL or a repository-relative path, and an item with an invalid link is discarded with a bounded warning'
      - 'The delivery compose worker always appends deterministic_rule actions derived from changed paths (migrations, .env examples, deployment configs, dependency manifests, CI workflow files) to deliveryReport.presentation.humanActions when neither the agent report nor the composed draft already carries them'
      - 'deliveryReport.presentation starts as an immediate deterministic/pending fallback; a durable overlord.delivery.compose.v1 worker job may asynchronously replace only presentation while delivery success and latency never depend on an automation provider'
      - 'Changed-file provenance and capture diagnostics are objective-scoped review metadata aggregated across sessions (and no-session record-work records); none can reject delivery.'
      - 'Delivery is the final work boundary — no implementation after delivery without explicit follow-up'
      - 'The response carries instruction: the post-delivery rule worded by the session connection_method. A cli session is told to run resume-follow-up with the delivered mission and objective display ids before more work; an mcp session is told to ask the user to start follow-up work from Overlord (coo:1294 D6)'
      - 'Required follow-on scheduling (Run Queue dispatch job, next-draft awaiting_approval event, awaiting-review notification and its dispatch job, webhooks, delivery-presentation compose job) is written inside the finalization transaction, so it exists exactly when the delivery does and a replay never repeats it; no post-commit failure can turn an accepted delivery into a rejection (ADR 0075). Queue selection and the parallel-objective rule are unchanged.'
    sideEffects:
      - records-optional-agent-declared-changed-files
      - emits-scoped-changed-file-entity-changes
      - stores-delivery-record
      - stores-delivery-finalization-receipt
      - seals-optional-report-draft
      - advances-mission-narrative-evidence-and-creates-publication-opportunity
      - objective-state-to-complete
      - mission-status-to-review
      - may-trigger-auto-advance-for-next-objective

  delivery-receipt:
    description: 'Read the caller''s own durable finalization receipt (ADR 0075)'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --delivery-id
      - --operation-id
      # deliver (default) or record_work; selects the operation-id namespace.
      - --operation-kind
    responseShapeVersion: 1
    responseShape: '{ receipt: { operationKind, operationId, missionId, missionDisplayId, objectiveId, deliveryId, acceptedAt, result } }'
    rules:
      - 'Exactly one of --delivery-id or --operation-id; otherwise 400 invalid_input. Requires mission:read; available after the session ended and needs no session key.'
      - 'Only the workspace member who finalized can read a receipt, and its mission must be in the caller''s current workspace/project scope. An unknown, foreign, deleted or out-of-scope receipt answers the same 404 delivery_receipt_not_found. A project_automation USER_TOKEN is denied (404).'
      - 'result is the immutable accepted response, including what was true at acceptance; it is never rewritten by later events.'
    sideEffects: []

  report-draft:
    description: 'Read the caller''s own provisional report draft and its final inspection, or an abandoned or sealed draft of the same objective (ADR 0078)'
    requiredFlags:
      - --session-key
    optionalFlags:
      - --mission-id
      - --objective-id
      - --draft-id
      - --include-withdrawn
    responseShapeVersion: 1
    responseShape: '{ draft: ReportDraft | null, revision, inspection: { agentReport, entries: [{ entryId, kind, ref, excludedReason? }], warnings } | null, abandoned: [{ draftId, sessionId, state, revision, activeEntryCount, updatedAt }], limits }'
    rules:
      - 'Requires mission:read and a session key of the mission (live or ended). Without --draft-id it reads the session''s own draft; revision is 0 and draft null when none exists.'
      - 'inspection is present only for the caller''s own open draft: the normalized, eligibility-filtered agent report deliver would seal now, each active entry''s V1 reference or exclusion reason, and warnings.'
      - '--draft-id reads an abandoned (session ended without delivering it) or sealed draft of the same objective; an open draft of another session, or any other id, answers 404 report_draft_not_found.'
      - 'withdrawn entries are included only with --include-withdrawn; abandoned lists up to ten abandoned drafts of the objective, newest first.'
    sideEffects: []

  delivery-summary-context:
    description: 'Read the publication opportunity of the caller''s own accepted delivery and a fresh mission-summary baseline (ADR 0076)'
    requiredFlags:
      - --mission-id
    optionalFlags:
      - --delivery-id
      - --publication-id
      # The key of the session that delivered; omitted for record-work deliveries.
      - --session-key
      - --connection-method
    responseShapeVersion: 1
    responseShape: '{ publication: { id, missionId, missionDisplayId, objectiveId, objectiveDisplayId, deliveryId, evidenceRevision, available, state: outstanding|published|superseded|ineligible, supersededReason, publishedAt, publishedContentRevision }, baseline, instruction }'
    rules:
      - 'Exactly one of --delivery-id or --publication-id. Requires event:create, current membership and project scope; a project_automation USER_TOKEN is denied (404).'
      - 'Only the originating workspace member reads it. A session-bound opportunity also requires the original session key of the session that delivered it; that session''s delivered, ended state is accepted for this command and publish-delivery-summary only. A record-work opportunity has no session and is bound to its originating member.'
      - 'An unknown, foreign, other-member, deleted-source or out-of-scope (including a mission moved to another project) publication answers 404 mission_summary_publication_not_found without revealing existence.'
      - 'No deadline: availability follows the evidence basis, not elapsed time. A read is not proof a later write succeeds.'
    sideEffects: []

  publish-delivery-summary:
    description: 'Publish one reconciled mission headline and summary for the caller''s own accepted delivery (ADR 0076)'
    requiredFlags:
      - --mission-id
      - --operation-id
    optionalFlags:
      - --delivery-id
      - --publication-id
      - --session-key
      - --payload-json
      - --payload-file
      - --connection-method
    payloadShape: '{ baseContentRevision, baseEvidenceRevision, headline, summary } (operationId may be sent here instead of the flag)'
    responseShapeVersion: 1
    responseShape: '{ publication, operationId, contentRevision, evidenceRevision, publishedAt, warnings, instruction, replayed? }'
    rules:
      - 'Same addressing and authority as delivery-summary-context. Both bases, headline and summary are required and validated like deliver missionSummary; closeItems or any other field answers 400 invalid_input. No closes, paths, artifacts, report fields, objective or session changes.'
      - 'The operation id is required and caller-retained. One successful publication per opportunity: the same operation id and content after success replays the result with replayed: true; any other publication after success answers 409 mission_summary_already_published.'
      - 'Under the mission lock, then the summary row and publication row locks: an opportunity superseded by a newer accepted delivery, an explicit follow-up, an objective reopen or source deletion, or whose evidence revision is no longer current or whose objective is not complete, answers 409 mission_summary_publication_superseded with no route to resurrect it. Stale bases answer 409 mission_summary_conflict with details { publication, missionSummary, instruction } and consume nothing.'
      - 'No timer, expiry worker or attempt limit. Clients retry a conflict once immediately and then report that the summary is not updated.'
    sideEffects:
      - writes-agent-mission-narrative
      - fulfils-delivery-summary-publication

missionDiscovery:
  create:
    description: 'Create a draft mission and objective without attaching, or an explicitly requested account-owned inbox item'
    optionalFlags:
      - --project-id
      - --unassigned-to-project
      - --agent
      - --assigned-to
      - --session-key
      - --auto-advance
      - --no-auto-advance
      - --objective-agent
      - --objective-model
      - --objective-instructions
      - --objective-instructions-file
      - --objective-summary
      - --objective-summary-file
    rules:
      - 'Supply --project-id to create a mission, or --unassigned-to-project to deliberately create an account-owned inbox item. The former --inbox alias is retired (ADR 0054) and rejected with HTTP 400 invalid_input. Omitting both is rejected; the Protocol never discovers a project for agent-created work.'
      - '--agent names the connector/agent identifier authoring the row and is recorded as creation provenance (missions.created_by_agent / objectives.created_by_agent); it does not select the agent that will run the work'
      - "Each --objectives-json / --objectives-file item may set agent and model. agent persists as the created objective's assignedAgent; model requires a non-empty agent. When both are omitted, existing project launch-preference defaults apply."
      - '--objective-agent / --objective-model supply the launch selection for items that name no agent of their own; a per-item agent wins, and --objective-model without --objective-agent is rejected. These are distinct from --agent, which is creation provenance only.'
      - '--assigned-to resolves one workspace member by workspace_users.id, profile UUID, orgid:username, bare username, or email; an unresolvable member is rejected with the same "Assignee is not a member of this workspace" error REST uses and is never silently left unassigned'
      - '--session-key additionally attributes the created row to the calling agent session (created_by_session_id) and lets an omitted --assigned-to inherit the session mission assignee'
      - '--auto-advance / --no-auto-advance set the default autoAdvance for created objectives; per-item autoAdvance in --objectives-json / --objectives-file wins when present; omitted defaults to false'
      - 'The create response returns the created mission and ObjectiveDto records so callers can verify each persisted assignedAgent, model, resourceKey, and queue/auto-advance setting; CLI human-readable output echoes these settings for each created objective'
      - 'Instructions and summary (ADR 0083): --objective-instructions / --objective-instructions-file (or the positional text) carry the instructions, the complete brief the executing agent receives; --objective-summary / --objective-summary-file carry the summary, a short overview for people (one to three paragraphs) that is never sent to the agent. --objectives-json / --objectives-file items carry the same two texts as instructions (required) and summary (string or null). One of the positional text, --objective-instructions[-file] or --objectives-json/--objectives-file is required.'
      - 'The retired names --objective, --objective-description and --objective-description-file, and the JSON item keys objective and description, are refused with 400 invalid_input naming the replacement (ADR 0083).'
      - "Objective summaries (ADR 0059, renamed by ADR 0083): --objective-summary / --objective-summary-file apply to the single --objective-instructions form and are rejected with --objectives-json/--objectives-file (400 invalid_input). Text is stored as agent-authored; advisory warnings (code summary_style, with rule, message and optional excerpt/suggestion) are attached as warnings on the matching created objective. The summary is presentation only and never appears in attach/load-context ObjectiveSummary or launch prompts."
      - 'Swap warning (ADR 0083, advisory, never refuses): when an objective summary is at least 3 times as long as its instructions and at least 400 characters (the texts look swapped), or more than 1.5 times as long (and at least 240 characters) or holding Markdown headings, two or more numbered steps or a "Done when:" label while the instructions are shorter than 400 characters (the texts may be swapped), both texts are stored as written and the matching created objective carries an objective_fields_swapped warning whose message names both fields and says which one the agent receives.'
      - 'Authorization (contract v151): the project form requires mission:create in the resolved target project for every caller; the gate is no longer null. A project_automation USER_TOKEN may create only in one of its selected projects (any other project id, including one in the same workspace, is 404) and is denied the --unassigned-to-project form before any row is written. A mission created by a direct out_ bearer records created_by_token_id and a created_by_token_label snapshot; for project_automation an omitted --assigned-to leaves the mission unassigned'
    sideEffects:
      - creates-mission-or-inbox-item
      - creates-objective-in-draft-state-when-project-resolved

  prompt:
    description: 'Create a mission and immediately attach or queue execution'
    optionalFlags:
      - --project-id
      - --agent
      - --assigned-to
      - --session-key
      - --auto-advance
      - --no-auto-advance
      - --objective-agent
      - --objective-model
      - --objective-instructions
      - --objective-instructions-file
      - --objective-summary
      - --objective-summary-file
    rules:
      - 'Requires --project-id. prompt attaches work immediately and therefore cannot create an inbox item or discover a project implicitly.'
      - '--agent, --assigned-to, and --session-key carry the same meaning and resolution rules as on create; on prompt --agent additionally names the attaching agent for the session'
      - '--auto-advance / --no-auto-advance and per-item autoAdvance follow the same rules as on create'
      - 'Per-item agent / model and --objective-agent / --objective-model follow the same rules as on create'
      - '--objective-instructions / --objective-instructions-file, --objective-summary / --objective-summary-file, per-item instructions and summary, the retired-name refusals and the swap warning follow the same rules as on create; the attach response carries no summary, and an objective_fields_swapped warning, when present, is a top-level warnings array'
      - 'Denied for a project_automation USER_TOKEN before any write (contract v151): prompt attaches a session, which that preset cannot hold. full and mission_lifecycle behavior is unchanged'
    sideEffects:
      - creates-mission
      - attaches-or-queues-execution

  loadContext:
    description: 'Read mission context without creating a session'
    readOnly: true
    optionalFlags:
      - --mission-id
      - --execution-target-id
      # Returns context for this objective instead of rediscovering the mission's
      # active one. Required to read context on a mission running two objectives
      # in parallel, where unpinned rediscovery is ambiguous.
      - --objective-id
    responseShape: attach-response-v3
    rules:
      - 'When --objective-id is present, load-context returns that objective as the current objective and never rediscovers via mission state'
      - 'Without --objective-id, a mission with two equally ranked active objectives returns 409 ambiguous_active_objective, same as unpinned attach'
      - 'CLI explicit mission selection suppresses environment/bootstrap objective fallback unless its parent mission display id matches; opaque UUIDs need an explicit objective pin. Explicit objective/mission pairs retain validation. Reads never rebind execution sessions.'

  connect:
    description: 'Create a lightweight session key without full context assembly'
    optionalFlags:
      - --mission-id
      - --objective-id
      - --agent
      - --external-session-id
    rules:
      - 'When --objective-id is present, connect pins the session to that objective and must not rediscover via mission state'
    sideEffects:
      - creates-session-key

  listDeliveries:
    description: "List one addressed mission's newest-first normalized delivery records"
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id
    responseShape: MissionDeliveriesDto
    rules:
      - 'Uses mission:read authorization and returns the existing delivery DTO projection as a { items, total, limit } page, never arbitrary deliveries.payload_json'
      - 'items is newest-first and capped at 200; total is the matching row count before that cap'

  launchObjective:
    description: 'Queue the normal execution request for one objective'
    requiredFlags:
      - --objective-id
      - --agent
    optionalFlags:
      - --model
      - --reasoning-effort
      - --execution-target-id
    responseShape: ExecutionRequestDto
    rules:
      - 'Uses execution_request:create in the objective workspace and preserves existing objective launchability, active-sibling, execution-target, and active-request idempotency checks'
      - 'An objective UUID or full objective display id is accepted; a display id supplies the mission address'
    sideEffects:
      - queues-execution-request
      - may-transition-draft-objective-to-launching

  reorderObjectives:
    description: "Replace one mission UUID's complete draft-queue order (draft and submitted objectives) without moving any other objective"
    requiredFlags:
      - --mission-id
      - --ordered-objective-ids-json
    optionalFlags:
      - --objective-id
    responseShape: ObjectiveDto[]
    rules:
      - 'The mission and objective identifiers are stable UUIDs. Uses objective:update and requires exactly the live draft and submitted objective UUIDs of the mission, once each, in the complete post-move order; the head may move. Duplicate, missing, extra, foreign and non-queued ids are rejected; a queued set that changed concurrently is rejected without writing and the caller reloads'
      - 'The listed objectives are written into the sorted position slots they already hold, so launching, active and complete objectives never move; an unchanged order writes nothing'
      - 'The new order is carried into every Run Queue holding the mission''s waiting/blocked entries in the same transaction'
      - 'Returns the existing mission-wide objective list in its new order'
    sideEffects:
      - updates-queued-objective-positions
      - syncs-run-queue-order

  queueObjective:
    description: 'Add or reposition one objective in the authoritative project Run Queue'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --project-id
      - --queue
      - --after
      - --front
      - --position
    responseShape: RunQueueEntryDto
    rules:
      - 'Objective UUIDs and display ids are accepted. --project-id accepts the normal project UUID, slug, or name reference and, when supplied, must own the objective.'
      - "--queue accepts a queue UUID or an unambiguous queue name in the addressed project. --after accepts a queued entry id, objective UUID, or objective display id; without --queue it selects that predecessor's queue."
      - '--front and --position are mutually exclusive with --after. --position is one-based and bounded to the insertion range. Existing membership is idempotent unless a queue or placement option requests a move.'
      - 'Uses execution_request:create and the Run Queue service; entries remain target-neutral.'
    sideEffects:
      - enqueues-or-moves-run-queue-entry
      - rewrites-affected-mission-objective-positions

  dequeueObjective:
    description: 'Remove one objective from the authoritative project Run Queue'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --project-id
    responseShape: '{ removed: boolean, objectiveId: string }'
    rules:
      - 'Objective UUIDs and display ids are accepted. --project-id accepts a UUID, slug, or name and, when supplied, must own the objective.'
      - 'Uses execution_request:create and is idempotent when the objective is already unqueued.'
    sideEffects:
      - dequeues-run-queue-entry
      - rewrites-affected-mission-objective-positions

  runQueue:
    description: "Read the addressed project's live Run Queue projection"
    readOnly: true
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --queue
    responseShape: ProjectRunQueuesDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id. The objective or mission derives the project when --project-id is absent; supplied scopes must agree.'
      - '--project-id accepts the normal project UUID, slug, or name reference. --queue accepts a queue UUID or an unambiguous queue name and narrows the unchanged ProjectRunQueuesDto shape.'
      - 'Uses objective:read authorization.'

  reorderRunQueue:
    description: "Atomically replace one Run Queue's complete live entry order"
    requiredFlags:
      - --queue
      - --ordered-entries-json | --ordered-entries-file
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: RunQueueDto
    rules:
      - 'The queue reference accepts a UUID or unambiguous name. Each order item accepts an entry UUID, objective UUID, or objective display id in that queue.'
      - 'Supply every live entry exactly once. Running and dispatched entries cannot move; rejected orders include currentOrder and runningEntryId so callers can re-read and retry.'
      - 'Uses execution_request:create; entries remain target-neutral.'
    sideEffects:
      - reorders-run-queue-entries
      - rewrites-affected-mission-objective-positions

  createRunQueue:
    description: 'Create an additional Run Queue in the addressed project'
    requiredFlags:
      - --name
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: RunQueueDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id to address the project; supplied scopes must agree.'
      - 'Uses project:update. Queue definitions are project configuration, so mission_lifecycle-scoped tokens cannot create them.'
    sideEffects:
      - creates-run-queue

  updateRunQueue:
    description: 'Rename, pause, or resume one Run Queue'
    requiredFlags:
      - --queue
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --name
      - --pause
      - --resume
    responseShape: RunQueueDto
    rules:
      - 'The queue reference accepts a UUID or unambiguous name. Supply --project-id, --objective-id, or --mission-id to disambiguate a name when needed.'
      - '--pause and --resume are mutually exclusive. At least one of --name, --pause, or --resume is required.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - updates-run-queue

  deleteRunQueue:
    description: 'Delete one Run Queue, optionally moving its entries'
    requiredFlags:
      - --queue
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --move-entries-to
    responseShape: '{ removed: boolean, projectId: string }'
    rules:
      - 'Queue and destination references accept UUIDs or unambiguous names in the addressed project; the destination must differ from the deleted queue.'
      - 'The default queue cannot be deleted. A non-empty queue requires --move-entries-to.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - deletes-run-queue
      - optionally-moves-run-queue-entries

  reorderProjectRunQueues:
    description: "Atomically replace a project's complete Run Queue definition order"
    requiredFlags:
      - --ordered-queues-json | --ordered-queues-file
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: ProjectRunQueuesDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id to address the project; each order item accepts a queue UUID or unambiguous name.'
      - 'Supply every live queue exactly once and keep the default queue first.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - reorders-project-run-queues

  search:
    description: 'Canonical search by query, status type, project, resource key, entity type, objective state, and explicit date range; response versions 2 and 3 are organization-bounded and report filter/truncation metadata'
    readOnly: true
    optionalFlags:
      - --query
      - --status
      - --project-id
      - --resource-key
      - --date-field
      - --from
      - --to
      - --limit
      - --response-version
      - --entity-types
      - --objective-states
      - --matches-per-result
      - --reference
      - --cursor
      - --workspace-id
    rules:
      - '--reference <token> (contract v155) is exhaustive exact-reference mode, not ranked search: it requires --project-id resolving to exactly one readable project, accepts only --workspace-id, --limit (1-100, default 50) and --cursor, and rejects every ranked flag. It returns MissionReferenceSearchResponse { kind: mission_reference_search, version: 1, reference, projectId, workspaceId, results, nextCursor, complete }: every live mission in the project whose live objective instruction text contains the token case-sensitively as a whole token, in mission-id order, each with statusType and its matching objectives. Absence is established only after following nextCursor to a page with complete true; a cursor is bound to its reference and project. Ranked search (any version) never proves absence.'
      - '--status is a CSV of status TYPES (draft, next, execute, review, complete, blocked, cancelled), which are invariant across projects and workspaces; project-defined status names are not accepted'
      - '--response-version defaults to 3, which returns SearchResponseV3 with v3 defaults (entityTypes all three, matchesPerResult 3); --response-version 2 returns SearchMissionsResponseV2. Any other value, including the retired 1 (the legacy array), is rejected with HTTP 400 invalid_input (ADR 0054). --entity-types, --objective-states, and --matches-per-result apply only to v3.'
      - 'The former search-missions alias is retired (ADR 0054); the name answers 404 like any unknown subcommand.'
      - 'V2 date bounds are inclusive from and exclusive to; dateField is createdAt or updatedAt and defaults to updatedAt only when a bound is supplied'
      - 'V2 fans out only across authorizedWorkspaces in one organization; its even per-workspace quota is deterministic and never redistributes unused slots'

  statuses:
    description: "List one project's ordered board columns (statuses)"
    readOnly: true
    requiredFlags:
      - --project-id
    rules:
      - 'Status definitions are project-scoped, so names, order, and count vary between projects in one workspace; the status type of each column does not'
      - 'Read-only: status definitions are created and edited in project settings over REST, never over the protocol'
      - '--project-id accepts a project id, slug, or name and resolves within the caller workspace'

  discussObjective:
    description: 'Mark a draft objective submitted (signals in active discussion)'
    optionalFlags:
      - --mission-id
      - --objective-id
    rules:
      - 'When --objective-id is present, that objective is submitted; it must belong to the mission and must be in draft state'
      - 'Without --objective-id, the first draft objective on the mission by position, created_at, id is submitted (blank drafts included)'
    sideEffects:
      - objective-state-draft-to-submitted

  addObjectives:
    description: 'Append ordered objectives to an existing mission'
    optionalFlags:
      - --mission-id
      - --objective-id
      - --auto-advance
      - --no-auto-advance
      - --objective-agent
      - --objective-model
    rules:
      - 'Each --objectives-json / --objectives-file item may set autoAdvance; --auto-advance / --no-auto-advance supply the default when an item omits it; omitted defaults to false'
      - "Each item may set agent and model. agent persists as the new objective's assignedAgent; model requires a non-empty agent. When both are omitted, existing project launch-preference defaults apply."
      - 'Denied for a project_automation USER_TOKEN before any write (contract v151): that preset creates objectives only as the initial objectives of a mission it creates and never edits an existing mission'
      - '--objective-agent / --objective-model supply the launch selection for items that name no agent of their own; a per-item agent wins, and --objective-model without --objective-agent is rejected'
      - 'Each item carries instructions (required: the complete brief for the executing agent) and may carry summary (string or null: a short overview for people, ADR 0059 renamed by ADR 0083); the retired keys objective and description are refused with 400 invalid_input. The create swap warning applies per item; style and objective_fields_swapped warnings are attached as warnings on the matching returned objective'
    sideEffects:
      - creates-objectives-in-draft-state

  updateObjective:
    description: 'Update title, summary, auto-advance, instruction text and/or agent on an existing objective, or request a generated summary'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --title
      - --summary
      - --summary-file
      - --summary-request
      - --auto-advance
      - --no-auto-advance
      - --instruction-text
      - --instruction-text-file
      - --objective-agent
      - --objective-model
      - --objective-reasoning-effort
    responseShape: ObjectiveDto
    rules:
      - 'At least one of --title, --summary/--summary-file, --summary-request, --auto-advance/--no-auto-advance, --instruction-text/--instruction-text-file, or --objective-agent is required'
      - 'An empty --title clears the custom title and returns to instruction-derived presentation; title edits do not change instruction text and are permitted in any state'
      - 'Instruction text may be edited only when the objective is in draft state'
      - "Summaries (ADR 0059, renamed by ADR 0083): --summary / --summary-file replace the human-facing summary; an empty value is Remove, which keeps the summary absent (also across instruction edits and catch-up) until a person selects Summarize. --summary-request summarize|regenerate|retry records a generated-summary request; it cannot be combined with --summary (400 invalid_input). Protocol callers are agents with or without a session: summary changes and requests are allowed only in draft state (400 summary_not_editable). While a person's removal is in force, agent text is not stored and a summary_suppressed warning is returned, and summarize/regenerate are refused (409 summary_suppressed); retry re-requests only a failed generation (409 summary_not_failed) and never clears removal. Instructions shorter than 280 characters are not summarized (409 summary_not_eligible)."
      - 'The swap guard of create applies to a non-empty --summary, compared with the instructions the objective has after the write: the summary is stored as written and a likely or possible swap returns an objective_fields_swapped warning. The retired --description, --description-file and --description-request are refused with 400 invalid_input naming the replacement.'
      - 'The response is the updated ObjectiveDto (including summary and its summary state) plus warnings: an array of { code, message, rule?, excerpt?, suggestion? } with code summary_style (advisory style issue; the text was stored), summary_suppressed or objective_fields_swapped'
      - 'Does not require a session key'
    sideEffects:
      - updates-objective-title
      - updates-objective-auto-advance
      - updates-objective-instruction-text
      - updates-objective-summary
      - requests-objective-summary-generation

  deleteMissions:
    description: 'Atomically soft-delete an explicitly confirmed list of missions'
    requiredFlags:
      - --mission-ids-json | --mission-ids-file
      - --confirm
    responseShape: '{ deletedMissionIds: string[] }'
    rules:
      - 'Accepts one to 100 unique mission UUID or display-id references. Every target is resolved and authorized with mission:delete before any write; an invalid, duplicate, deleted, or unauthorized target rejects the whole request.'
      - 'Agents MUST show the resolved list to the user and obtain an affirmative response before passing --confirm. --confirm is required and must be the literal boolean flag, not an inferred default.'
      - 'Soft-deletes each mission and its live objectives in one transaction, preserving existing deletion change-feed semantics.'
    sideEffects:
      - atomically-soft-deletes-missions-and-live-objectives

  deleteObjectives:
    description: 'Atomically soft-delete an explicitly confirmed list of objectives'
    requiredFlags:
      - --objective-ids-json | --objective-ids-file
      - --confirm
    responseShape: '{ deletedObjectiveIds: string[] }'
    rules:
      - 'Accepts one to 100 unique objective UUID or display-id references. Every target is resolved and authorized with objective:update before any write; an invalid, duplicate, deleted, or unauthorized target rejects the whole request.'
      - 'Agents MUST show the resolved list to the user and obtain an affirmative response before passing --confirm. --confirm is required and must be the literal boolean flag, not an inferred default.'
      - 'Soft-deletes each objective in one transaction and preserves existing Run Queue cleanup and deletion change-feed semantics.'
    sideEffects:
      - atomically-soft-deletes-objectives
      - dequeues-deleted-objectives

  recordWork:
    description: 'Record already-completed chat work as a review mission without an attached session'
    optionalFlags:
      - --project-id
      - --assigned-to
      - --mission-summary-file
      - --operation-id
    rules:
      - 'Requires --project-id; completed work always records a normal project mission and never discovers a project implicitly.'
      - 'For work already done in chat, not for in-progress work'
      - '--assigned-to resolves one workspace member by the same rules as on create; an unresolvable member is rejected rather than silently left unassigned'
      - 'Explicit declaredPaths are stored as sessionless agent_declared rows with a null resource; record-work does not inspect a current checkout and accepts no VCS status.'
      - 'Denied for a project_automation USER_TOKEN before any write (contract v151): record-work creates a completed objective and a delivery, which exceed mission:create'
      - 'Accepts the deliver missionSummary input (payload field or --mission-summary-file) with the same validation and close rules; the mission is new, so no base revision is checked and prose publishes at creation (ADR 0076 new-mission exception). Without prose the new mission gets one sessionless publication opportunity bound to the originating member, and the response carries missionSummary.publication and an instruction for publish-delivery-summary'
      - 'Sessionless: record-work has no report draft. A reportDraft payload field answers 400 invalid_input; send the final deliveryReport arrays instead (ADR 0078).'
      - 'Accepts the deliver operationId input (--operation-id or payload operationId) with the same validation and receipt rules (ADR 0075). Mission, completed objective, source report and receipt commit in one transaction; a concurrent request with the same id serializes on the receipt unique index, the loser rolls back its whole creation and answers from the winning receipt, so a logical retry returns the same mission and delivery.'
      - 'Without an operation id the server cannot distinguish a retry from intentionally separate identical work: each call creates a new mission (the documented weaker legacy guarantee). Identical text is never deduplicated by hash.'
    sideEffects:
      - creates-mission-in-review-status
      - stores-delivery-finalization-receipt
      - advances-mission-narrative-evidence-and-creates-publication-opportunity
      - creates-completed-objective
      - creates-delivery-record-without-session-attribution
      - records-explicit-declared-paths
      - emits-scoped-changed-file-entity-changes

artifacts:
  addArtifact:
    description: >-
      Create a mission artifact during a turn without delivering (same rules as
      REST POST /api/missions/:id/artifacts). Delivery remains optional for
      artifacts; agents may publish plans, notes, URLs, and similar records
      mid-session and revise them later with update-artifact.
    requiredFlags:
      - --type
      - --label
    optionalFlags:
      - --mission-id
      - --session-key
      - --objective-id
      - --content-text
      - --content-text-file
      - --external-url
    rules:
      - 'At least one of --content-text/--content-text-file or --external-url must be supplied'
      - '--objective-id (UUID or display id) stamps objective provenance without a live session key; --session-key wins when both are present'
      - 'type is one of the core artifact types (test_results, next_steps, note, url, decision, migration) or a namespaced extension value accepted by the deployment CHECK'
      - 'When --session-key is present (or auto-injected from the attach cache), session_id and objective_id are stamped from that live session'
      - 'delivery_id is always null for mid-turn creates; deliver may still attach additional artifacts later'
      - 'Non-HTTP(S) external URLs are rejected'
    sideEffects:
      - creates-artifact-row
      - emits-artifact-entity-change-create

  updateArtifact:
    description: >-
      Update an existing mission artifact's human-facing label, contentText,
      and/or externalUrl in place (same rules as REST PATCH
      /api/missions/:id/artifacts/:artifactId). Does not require a session key.
    requiredFlags:
      - --artifact-id
      - --expected-revision
    optionalFlags:
      - --mission-id
      - --objective-id
      - --label
      - --content-text
      - --content-text-file
      - --external-url
    rules:
      - 'At least one of --label, --content-text/--content-text-file, or --external-url must be supplied'
      - 'Empty --content-text / --external-url clears that field (subject to the retain-at-least-one-content rule)'
      - 'Stale --expected-revision returns 409; non-HTTP(S) external URLs are rejected'
      - 'Delivery/session/objective provenance and contentJson remain immutable'
    sideEffects:
      - updates-artifact-row
      - increments-artifact-revision
      - emits-artifact-entity-change

sharedContext:
  readContext:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id

  writeContext:
    optionalFlags:
      - --mission-id
      - --objective-id
    sideEffects:
      - upserts-shared-context-entry-by-mission-and-key

  attachmentList:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id
    rules:
      - "Without --objective-id the listing spans every objective on the mission; with it, only that objective's attachments are returned"

  attachmentPrepareUpload:
    sideEffects:
      - creates-objective-attachment-record-in-prepared-state

  attachmentFinalizeUpload:
    sideEffects:
      - updates-attachment-upload-status-to-available

  attachmentDownloadUrl:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id
      - --output

  attachmentUploadFile:
    description: 'One-command local attachment upload (prepare + upload + finalize)'
    sideEffects:
      - creates-and-finalizes-attachment

managementSurfaces:
  runnerQueue:
    description: 'Runner queue/device/project-resource operations are management surfaces, not ovld protocol commands.'
    owner: 'runner'
    transport: 'Runner -> REST'
    endpoints:
      - 'GET /api/runner/status'
      - 'POST /api/runner/claim'
      - 'POST /api/runner/clear'
      - 'POST /api/runner/requests/:id/launching'
      - 'POST /api/runner/requests/:id/launched'
      - 'POST /api/runner/requests/:id/failed'
      - 'POST /api/missions/:id/branch-prepared'
    rules:
      - 'ovld runner uses these REST endpoints through the configured backend.'
      - 'Agents use attach/update/heartbeat/ask/deliver for mission lifecycle work.'
  projectResources:
    description: 'Project/resource setup is exposed through top-level CLI management commands and REST project endpoints, not ovld protocol commands.'
    examples:
      - 'ovld create-project --name <name>'
      - 'ovld add-cwd --project-id <id-or-name>'
  executionTargets:
    description: >-
      Standalone execution-target registration. The top-level CLI command
      `ovld add-et --name <name>` forwards to the parentless `register-target`
      protocol handler (`POST /api/protocol/register-target`), which provisions or
      reuses the acting machine's local execution target for the resolved workspace
      and applies `--name` as its label. Workspace resolution and the
      `workspace_selection_required` fallback mirror `create-project`; gated by
      per-workspace `execution_request:claim`.
    examples:
      - 'ovld add-et --name <name>'
      - 'ovld add-et --name <name> --workspace-id <id-or-name>'

authAndDiscovery:
  authStatus:
    description: 'Report local runtime readiness and auth mode without printing secrets'
    readOnly: true

  discoverProject:
    description: 'Resolve project from CWD, explicit directory, or project identifier. CWD resolution uses the isPrimary project in .overlord/project.json when the checkout is linked to more than one project; the additive linkedProjects array lists every linked project.'
    readOnly: true

# Stable response shape versions
# Add a new version key here when the shape changes in a backward-incompatible way

responseShapes:
  # attach-response-v1 (superseded by v2 in contract version 4). Retained for
  # historical reference. v1 exposed a single top-level `objectives` array that
  # included the current objective.
  attach-response-v1:
    description: 'Response shape returned by the attach command (superseded by attach-response-v2)'
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - objectives
      - session
      - sharedState
      - promptContext
    sessionRequiredFields:
      - sessionKey
      - state
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    promptContextRequiredContent:
      - task title
      - mission ID
      - objective ID
      - objective instruction text
      - recent activity/history
      - required protocol workflow instructions
    promptContextOptionalContent:
      - constraints
      - attachments
      - artifacts
      - shared context
      - user custom agent instructions

  attach-response-v2:
    description: >-
      Response shape returned by the attach and resume-follow-up commands.
      Replaces the single `objectives` array with two disjoint arrays that both
      exclude the current objective: `previousObjectives` (positioned before the
      current objective) and `futureObjectives` (positioned after). Both are
      positional, not objective states: objectives can launch out of order, so a
      lower-position objective may still be an unstarted draft (ADR 0056). The
      current objective is carried only in the top-level `objective` field.
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - previousObjectives
      - futureObjectives
      - session
      - sharedState
      - promptContext
    sessionRequiredFields:
      - sessionKey
      - state
    # Applies to entries in both previousObjectives and futureObjectives.
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    # The current objective is excluded from previousObjectives and futureObjectives.
    objectivesExcludeCurrent: true
    promptContextRequiredContent:
      - task title
      - mission ID
      - objective ID
      - objective instruction text
      - recent activity/history
      - required protocol workflow instructions
    # Recent activity/history rendered into promptContext excludes operational
    # lifecycle event types so the agent sees only substantive events.
    promptContextHistoryExcludedEventTypes:
      - status_change
      - execution_requested
      - awaiting_approval
    promptContextOptionalContent:
      - constraints
      - attachments
      - artifacts
      - shared context
      - user custom agent instructions

  attach-response-v3:
    description: >-
      Legacy full context shape, retained for load-context; superseded for execution by attach-response-v4.
      Replaces the human-readable `promptContext` field from attach-response-v2
      with `agentInstructions`. Mission context lives in the structured top-level
      fields (`mission`, `objective`, `previousObjectives`, `futureObjectives`,
      `history`, `attachments`, `artifacts`, and `sharedState`). `agentInstructions`
      is the only source of working and delivery rules; the launch prompt carries
      only what is needed to attach. Contract version 1 keeps this v3 shape and adds
      optional resource-binding metadata: `projectResources` at the top level and
      `resourceKey` on current/previous/future objective summaries.
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - previousObjectives
      - futureObjectives
      - session
      - sharedState
      - agentInstructions
    optionalTopLevelFields:
      projectResources: 'Project resource manifest for the current execution target, grouped by logical resource key.'
      reportDraft: 'ADR 0078, attach and resume-follow-up only, omitted when empty: { current: { draftId, revision, activeCounts, withdrawnCount } | null, abandoned: [{ draftId, sessionId, state, revision, activeEntryCount, updatedAt }] }. current is the attaching execution''s own open draft on re-attach of the same session; abandoned lists up to five abandoned drafts of the objective that may be imported explicitly.'
    sessionRequiredFields:
      - sessionKey
      - state
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    objectivesOptionalFields:
      - resourceKey
    objectivesExcludeCurrent: true
    # Additive (ADR 0060): attach and resume-follow-up only, summary-enabled missions only.
    missionSummaryOptionalField:
      fields:
        - contentRevision
        - headline
        - summary
        - author
        - openItems
        - totalOpenItems
        - truncated
      openItemFields:
        - id
        - kind
        - objective
        - text
        - blocking
    agentInstructionsRequiredContent:
      - mission ID
      - objective ID
      - objective title or fallback label
      - location of objective details in the structured JSON
      - required protocol workflow instructions, worded for the caller's connection method
      - a statement that these instructions take precedence over an installed Overlord skill or plugin
    # agentInstructions is the first top-level key so output truncation never drops it.
    agentInstructionsFirst: true
    agentInstructionsOptionalContent:
      - user custom agent instructions
      - mission summary writing guidance and the one-retry conflict rule (when missionSummary is present)

  attach-response-v4:
    description: >-
      Compact execution context for attach and resume-follow-up (ADR 0069).
      No history or previousObjectives/futureObjectives. Siblings contain only displayId,
      state and objective in mission order, excluding the current objective and blank slots.
      Completed instructions are capped at 600 characters including a truncation marker;
      other siblings keep full instructions. Full objective context and history remain
      available through load-context. Ordinary ObjectiveSummary reads are unchanged.
    requiredTopLevelFields:
      - mission
      - objective
      - directives
      - artifacts
      - attachments
      - objectives
      - session
      - sharedState
      - agentInstructions
    optionalTopLevelFields:
      projectResources: 'Project resource manifest for the current execution target, grouped by logical resource key.'
    sessionRequiredFields:
      - sessionKey
      - state
    objectivesRequiredFields:
      - displayId
      - state
      - objective
    completedObjectiveInstructionMaxCharacters: 600
    directivesLimit: 10
    directivesOrder: newest-first
    directivesScope: current-objective
    directivesEventTypes: [user_follow_up, decision, discussion_summary]
    objectivesExcludeCurrent: true
    # Additive (ADR 0060): attach and resume-follow-up only, summary-enabled missions only.
    missionSummaryOptionalField:
      fields:
        - contentRevision
        - headline
        - summary
        - author
        - openItems
        - totalOpenItems
        - truncated
      openItemFields:
        - id
        - kind
        - objective
        - text
        - blocking
    agentInstructionsRequiredContent:
      - mission ID
      - objective ID
      - objective title or fallback label
      - location of objective details in the structured JSON
      - required protocol workflow instructions, worded for the caller's connection method
      - a statement that these instructions take precedence over an installed Overlord skill or plugin
    # agentInstructions is the first top-level key so output truncation never drops it.
    agentInstructionsFirst: true
    agentInstructionsOptionalContent:
      - user custom agent instructions
      - mission summary writing guidance and the one-retry conflict rule (when missionSummary is present)
