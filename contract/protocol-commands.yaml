# Overlord Protocol Command Surface
# Machine-readable counterpart to planning/feature-plans/03-agent-protocol.md
#
# This file defines the stable command names, required flags, response shape versions,
# and declared side effects. Full parameter detail is in the reference spec.
#
# IMPORTANT: Any addition, rename, or flag change to a command in this file requires
# a contract version update in CONTRACT.md and components.yaml.
#
# Local-only `ovld protocol <subcommand>` commands that never cross the CLI -> backend
# HTTP surface (no POST /api/protocol/<subcommand>, no backend handler, no permission
# entry) are intentionally not listed here: `capture-change` and `changes`. See
# CONTRACT.md's contract-version-2 changelog entry for the precedent.

contractVersion: '130'
referenceSpec: 'cli/docs/03-agent-protocol.md'

# Transport-level shape shared by every protocol command, independent of subcommand.
requestEnvelope:
  objectiveAddressing:
    description: >-
      Every subcommand that accepts --mission-id also accepts --objective-id
      (objective UUID or {mission.display_id}.{display_key}). The objective
      display id already names its parent mission, so --mission-id may be
      omitted whenever a full display id is supplied: the client CLI derives it
      before the request and the backend derives it again from the body, so a
      caller holding only `coo:756.k7xm` never has to reconstruct `coo:756`.
    rules:
      - "An objective display id supplies the mission reference when --mission-id is absent; an explicit --mission-id always wins and must name that objective's own mission."
      - 'An objective UUID does not name its mission, so --mission-id remains required when --objective-id is a UUID.'
      - 'The CLI auto-fills --objective-id from OVERLORD_OBJECTIVE_ID (and the recovered launch bootstrap) on every subcommand that accepts it, not only attach.'
      - 'Reference grammar is owned by @overlord/contract (parseObjectiveRef / formatObjectiveDisplayId / missionDisplayIdFromObjectiveRef) and re-exported by @overlord/database; no surface may carry a private copy.'
  fileInputs:
    description: "Canonical per-flag map of resolved --*-file payloads: { '--summary-file': '<content>', '--change-rationales-file': '<content>', ... }."
    rules:
      - "At most one --*-file flag may use literal '-' (true stdin) per invocation; passing two stdin flags fails fast on the client with a CliError naming the offending flags. Real file paths are unlimited."
      - 'Every file-backed input is read only from its own fileInputs entry; no shared stdin payload or fallback field exists.'
  changeRationaleInput:
    description: 'Shape of each optional --change-rationales entry on deliver, update, and record-work.'
    requiredFields:
      - filePath
      - label
      - summary
      - why
      - impact
    optionalFields:
      - hunks
    validationRules:
      - 'Items accept exactly filePath, label, summary, why, impact, and optional hunks; unknown or retired fields discard that item with a bounded warning.'
      - 'Each optional hunk accepts exactly one non-empty bounded header field; malformed hunks are discarded independently with bounded warnings.'
      - 'After canonical path normalization, the last valid item for a duplicate filePath wins with a bounded warning.'
      - 'Annotations are advisory: discarded items and hunks never reject update, deliver, or record-work.'
  changedFileInput:
    description: 'Shape of each explicit --changed-files entry on sessionless record-work.'
    requiredFields:
      - filePath
    optionalFields:
      - vcsStatus

sessionLifecycle:
  attach:
    description: 'Start a working session; return full structured mission context plus agent instructions'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --session-key
      - --execution-request-id
      - --execution-target-id
      # Binds the session channel prepared before launch to the session attach creates.
      # The channel ID only — never its credential, which reaches the backend solely as an
      # Authorization header on /api/agent-session-channels/v1/*. The CLI fills this from
      # OVERLORD_SESSION_CHANNEL_ID automatically when the launch path exported one.
      - --session-channel-id
      # Pins attach to this objective (UUID or {mission.display_id}.{display_key}).
      # When this flag or --execution-request-id is present, attach must not rediscover
      # another objective from mission state. A display id supplies --mission-id.
      - --objective-id
    returnsSessionKey: true
    responseShape: attach-response-v3
    rules:
      - 'When --objective-id or --execution-request-id is present, attach pins to that objective and must not rediscover via mission state'
    sideEffects:
      - creates-agent-session
      - objective-state-to-executing
      - binds-session-channel

  update:
    description: 'Post progress event; optionally record rationale annotations for ledger-observed paths'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
      - --options-json
      - --options-file
      - --no-free-text
      - --json
      - --summary
      - --summary-file
      - --phase
      - --event-type
      - --payload-json
      - --payload-file
      - --external-url
      - --external-session-id
      - --change-rationales-json
      - --change-rationales-file
      - --paths
      - --begin-follow-up-work
      - --follow-up-intent
    validPhases:
      - draft
      - execute
      - review
      - deliver
      - complete
      - blocked
      - cancelled
    validEventTypes:
      - update
      - user_follow_up
      - alert
      - discussion_summary
      - decision
    sideEffects:
      - appends-mission-event
      - appends-optional-generator-output-ledger-evidence
      - records-optional-change-rationale-annotations
      - emits-scoped-change-rationale-entity-changes

  hookEvent:
    description: 'Record connector lifecycle events such as UserPromptSubmit without requiring a live agent session'
    requiredFlags:
      - --hook-type
    optionalFlags:
      - --mission-id
      - --objective-id
      - --session-key
      - --external-session-id
      - --prompt
      - --prompt-file
      - --turn-index
    validHookTypes:
      - UserPromptSubmit
    sideEffects:
      - appends-mission-event-type-user-follow-up
    rules:
      - 'UserPromptSubmit records discussion activity and does not reopen objective execution'
      - 'Expired delivered sessions may be used for attribution but must not reject follow-up capture'

  resumeFollowUp:
    description: 'Explicitly reopen a completed objective for post-delivery implementation follow-up'
    requiredFlags: []
    optionalFlags:
      - --mission-id
      - --objective-id
      - --agent
      - --model
      - --external-session-id
      - --summary
      - --summary-file
    returnsSessionKey: true
    responseShape: attach-response-v3
    sideEffects:
      - creates-agent-session
      - objective-state-complete-to-pending-delivery
      - mission-status-to-execute
      - appends-mission-event

  heartbeat:
    description: 'Update session liveness without creating a mission event'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
      - --phase
      - --percent
      - --note
    sideEffects:
      - updates-session-last-heartbeat-only
      # Does NOT create a mission_events row

  syncChanges:
    description: 'Synchronize bounded metadata-only path evidence from the execution target objective ledger'
    requiredFlags:
      - --session-key
    optionalFlags:
      - --mission-id
      - --objective-id
      - --changes-json
      - --changes-file
    requestInput:
      requiredFields:
        - filePath
        - idempotencyKey
        - source
        - quality
      optionalFields:
        - overlap
        - toolWindowId
        - observedAt
        - hookHealth
    responseShape: sync-changes-v1
    rules:
      - 'Each item is processed independently and returns accepted, ignored, or warning; invalid siblings never roll back accepted evidence.'
      - 'source is declared_edit or window_observed; quality is direct or window. fallback_delta is not accepted.'
      - 'Only normalized workspace-relative path and bounded source/quality/overlap/window/health metadata persist. Absolute paths, parent traversal, file content, diffs, commands, transcripts, environment values, and fingerprints are prohibited.'
      - 'Accepted path evidence sets current_diff_state to unknown; synchronization does not inspect VCS state or claim that a current diff exists.'
      - 'Replay of an idempotencyKey for the same objective/path is ignored; sync failure and warnings cannot reject delivery.'
    sideEffects:
      - upserts-changed-files-by-objective-path
      - emits-scoped-changed-file-entity-changes

  ask:
    description: 'Post a single blocking question and stop work'
    requiredFlags: []
    requiresSessionKey: true
    optionalFlags:
      - --mission-id
      - --objective-id
    questionInput:
      flag: --question
      fileAlternative: --question-file
    rules:
      - 'Agent MUST stop after calling ask'
      - 'Ask exactly one blocking question per call'
    sideEffects:
      - appends-mission-event-type-ask
      - creates-answerable-agent-request-when-session-has-bound-channel

  deliver:
    description: 'Final delivery — mark objective complete and move mission to review'
    requiredFlags: []
    requiresSessionKey: true
    summaryInput:
      flag: --summary
      fileAlternative: --summary-file
    optionalFlags:
      - --mission-id
      - --objective-id
      - --artifacts
      - --change-rationales-json
      - --change-rationales-file
      - --payload-json
      - --payload-file
      - --verification-summary
      - --follow-up-notes
      - --paths
    clientCapture:
      - 'The client CLI drains every pending bounded batch from the attached objective ledger through sync-changes before delivery. It never derives or injects file paths from a worktree delta.'
      - 'An optional bounded --paths list may append agent-known generator, migration, or script outputs to the attached objective ledger before the drain. It is not a changed-file reconciliation input.'
    validationRules:
      - 'Objective-ledger changed files and optional rationales are review metadata and cannot reject a delivery.'
      - '--payload-json / --payload-file may carry an additive deliveryReport object with schemaVersion: 1 and agentReport.{humanActions,tradeoffsMade,knownRisks,deferredWork,assumptions}; omitted or malformed advisory items normalize independently with bounded warnings and can never prevent delivery'
      - 'Human actions are bounded and filter Git operations plus routine review/testing instructions before they are persisted in deliveryReport.presentation'
      - 'deliveryReport.presentation starts as an immediate deterministic/pending fallback; a durable overlord.delivery.compose.v1 worker job may asynchronously replace only presentation while delivery success and latency never depend on an automation provider'
      - 'Changed-file attribution, hook health, and rationale coverage are objective-scoped review metadata aggregated across sessions (and no-session record-work records); none can reject delivery.'
      - 'Delivery is the final work boundary — no implementation after delivery without explicit follow-up'
    sideEffects:
      - records-optional-change-rationale-annotations
      - emits-scoped-change-rationale-entity-changes
      - stores-delivery-record
      - objective-state-to-complete
      - mission-status-to-review
      - may-trigger-auto-advance-for-next-objective

missionDiscovery:
  create:
    description: 'Create a draft mission and objective without attaching, or an account-owned inbox item with --inbox/fallback when no project resolves'
    optionalFlags:
      - --inbox
      - --agent
      - --assigned-to
      - --session-key
      - --auto-advance
      - --no-auto-advance
    rules:
      - '--agent names the connector/agent identifier authoring the row and is recorded as creation provenance (missions.created_by_agent / objectives.created_by_agent); it does not select the agent that will run the work'
      - '--assigned-to resolves one workspace member by workspace_users.id, profile UUID, orgid:username, bare username, or email; an unresolvable member is rejected with the same "Assignee is not a member of this workspace" error REST uses and is never silently left unassigned'
      - '--session-key additionally attributes the created row to the calling agent session (created_by_session_id) and lets an omitted --assigned-to inherit the session mission assignee'
      - '--auto-advance / --no-auto-advance set the default autoAdvance for created objectives; per-item autoAdvance in --objectives-json / --objectives-file wins when present; omitted defaults to false'
    sideEffects:
      - creates-mission-or-inbox-item
      - creates-objective-in-draft-state-when-project-resolved

  prompt:
    description: 'Create a mission and immediately attach or queue execution'
    optionalFlags:
      - --agent
      - --assigned-to
      - --session-key
      - --auto-advance
      - --no-auto-advance
    rules:
      - '--agent, --assigned-to, and --session-key carry the same meaning and resolution rules as on create'
      - '--auto-advance / --no-auto-advance and per-item autoAdvance follow the same rules as on create'
    sideEffects:
      - creates-mission
      - attaches-or-queues-execution

  loadContext:
    description: 'Read mission context without creating a session'
    readOnly: true
    optionalFlags:
      - --mission-id
      - --execution-target-id
      # Returns context for this objective instead of rediscovering the mission's
      # active one. Required to read context on a mission running two objectives
      # in parallel, where unpinned rediscovery is ambiguous.
      - --objective-id
    responseShape: attach-response-v3
    rules:
      - 'When --objective-id is present, load-context returns that objective as the current objective and never rediscovers via mission state'
      - 'Without --objective-id, a mission with two equally ranked active objectives returns 409 ambiguous_active_objective, same as unpinned attach'

  connect:
    description: 'Create a lightweight session key without full context assembly'
    optionalFlags:
      - --mission-id
      - --objective-id
      - --agent
      - --external-session-id
    rules:
      - 'When --objective-id is present, connect pins the session to that objective and must not rediscover via mission state'
    sideEffects:
      - creates-session-key

  listDeliveries:
    description: 'List one addressed mission''s newest-first normalized delivery records'
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id
    responseShape: DeliveryDto[]
    rules:
      - 'Uses mission:read authorization and returns the existing delivery DTO projection, never arbitrary deliveries.payload_json'

  launchObjective:
    description: 'Queue the normal execution request for one objective'
    requiredFlags:
      - --objective-id
      - --agent
    optionalFlags:
      - --model
      - --reasoning-effort
      - --execution-target-id
    responseShape: ExecutionRequestDto
    rules:
      - 'Uses execution_request:create in the objective workspace and preserves existing objective launchability, active-sibling, execution-target, and active-request idempotency checks'
      - 'An objective UUID or full objective display id is accepted; a display id supplies the mission address'
    sideEffects:
      - queues-execution-request
      - may-transition-draft-objective-to-launching

  reorderFutureObjectives:
    description: 'Reorder one mission UUID''s future objectives without changing non-future positions'
    requiredFlags:
      - --mission-id
      - --ordered-objective-ids-json
    optionalFlags:
      - --objective-id
    responseShape: ObjectiveDto[]
    rules:
      - 'The mission and future objective identifiers are stable UUIDs. Uses objective:update and requires the complete post-move UUID ordering of future objectives; duplicate, missing, and non-future ids are rejected'
      - 'Returns the existing mission-wide objective list in its new order'
    sideEffects:
      - updates-future-objective-positions

  queueObjective:
    description: 'Add or reposition one objective in the authoritative project Run Queue'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --project-id
      - --queue
      - --after
      - --front
      - --position
    responseShape: RunQueueEntryDto
    rules:
      - 'Objective UUIDs and display ids are accepted. --project-id accepts the normal project UUID, slug, or name reference and, when supplied, must own the objective.'
      - '--queue accepts a queue UUID or an unambiguous queue name in the addressed project. --after accepts a queued entry id, objective UUID, or objective display id; without --queue it selects that predecessor''s queue.'
      - '--front and --position are mutually exclusive with --after. --position is one-based and bounded to the insertion range. Existing membership is idempotent unless a queue or placement option requests a move.'
      - 'Uses execution_request:create and the Run Queue service; entries remain target-neutral.'
    sideEffects:
      - enqueues-or-moves-run-queue-entry
      - rewrites-affected-mission-objective-positions

  dequeueObjective:
    description: 'Remove one objective from the authoritative project Run Queue'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --project-id
    responseShape: '{ removed: boolean, objectiveId: string }'
    rules:
      - 'Objective UUIDs and display ids are accepted. --project-id accepts a UUID, slug, or name and, when supplied, must own the objective.'
      - 'Uses execution_request:create and is idempotent when the objective is already unqueued.'
    sideEffects:
      - dequeues-run-queue-entry
      - rewrites-affected-mission-objective-positions

  runQueue:
    description: 'Read the addressed project''s live Run Queue projection'
    readOnly: true
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --queue
    responseShape: ProjectRunQueuesDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id. The objective or mission derives the project when --project-id is absent; supplied scopes must agree.'
      - '--project-id accepts the normal project UUID, slug, or name reference. --queue accepts a queue UUID or an unambiguous queue name and narrows the unchanged ProjectRunQueuesDto shape.'
      - 'Uses objective:read authorization.'

  reorderRunQueue:
    description: 'Atomically replace one Run Queue''s complete live entry order'
    requiredFlags:
      - --queue
      - --ordered-entries-json | --ordered-entries-file
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: RunQueueDto
    rules:
      - 'The queue reference accepts a UUID or unambiguous name. Each order item accepts an entry UUID, objective UUID, or objective display id in that queue.'
      - 'Supply every live entry exactly once. Running and dispatched entries cannot move; rejected orders include currentOrder and runningEntryId so callers can re-read and retry.'
      - 'Uses execution_request:create; entries remain target-neutral.'
    sideEffects:
      - reorders-run-queue-entries
      - rewrites-affected-mission-objective-positions

  createRunQueue:
    description: 'Create an additional Run Queue in the addressed project'
    requiredFlags:
      - --name
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: RunQueueDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id to address the project; supplied scopes must agree.'
      - 'Uses project:update. Queue definitions are project configuration, so mission_lifecycle-scoped tokens cannot create them.'
    sideEffects:
      - creates-run-queue

  updateRunQueue:
    description: 'Rename, pause, or resume one Run Queue'
    requiredFlags:
      - --queue
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --name
      - --pause
      - --resume
    responseShape: RunQueueDto
    rules:
      - 'The queue reference accepts a UUID or unambiguous name. Supply --project-id, --objective-id, or --mission-id to disambiguate a name when needed.'
      - '--pause and --resume are mutually exclusive. At least one of --name, --pause, or --resume is required.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - updates-run-queue

  deleteRunQueue:
    description: 'Delete one Run Queue, optionally moving its entries'
    requiredFlags:
      - --queue
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
      - --move-entries-to
    responseShape: '{ removed: boolean, projectId: string }'
    rules:
      - 'Queue and destination references accept UUIDs or unambiguous names in the addressed project; the destination must differ from the deleted queue.'
      - 'The default queue cannot be deleted. A non-empty queue requires --move-entries-to.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - deletes-run-queue
      - optionally-moves-run-queue-entries

  reorderProjectRunQueues:
    description: 'Atomically replace a project''s complete Run Queue definition order'
    requiredFlags:
      - --ordered-queues-json | --ordered-queues-file
    optionalFlags:
      - --project-id
      - --objective-id
      - --mission-id
    responseShape: ProjectRunQueuesDto
    rules:
      - 'Supply --project-id, --objective-id, or --mission-id to address the project; each order item accepts a queue UUID or unambiguous name.'
      - 'Supply every live queue exactly once and keep the default queue first.'
      - 'Uses project:update; mission_lifecycle-scoped tokens cannot modify queue definitions.'
    sideEffects:
      - reorders-project-run-queues

  search:
    aliases:
      - search-missions
    description: 'Canonical search by query, status type, project, resource key, entity type, objective state, and explicit date range; response versions 2 and 3 are organization-bounded and report filter/truncation metadata'
    readOnly: true
    optionalFlags:
      - --query
      - --status
      - --project-id
      - --resource-key
      - --date-field
      - --from
      - --to
      - --limit
      - --response-version
      - --entity-types
      - --objective-states
      - --matches-per-result
    rules:
      - '--status is a CSV of status TYPES (draft, next, execute, review, complete, blocked, cancelled), which are invariant across projects and workspaces; project-defined status names are not accepted'
      - '--response-version 1 preserves the legacy array response; --response-version 2 returns SearchMissionsResponseV2; --response-version 3 returns SearchResponseV3 with v3 defaults (entityTypes all three, matchesPerResult 3). --entity-types, --objective-states, and --matches-per-result apply only to v3.'
      - 'V2 date bounds are inclusive from and exclusive to; dateField is createdAt or updatedAt and defaults to updatedAt only when a bound is supplied'
      - 'V2 fans out only across authorizedWorkspaces in one organization; its even per-workspace quota is deterministic and never redistributes unused slots'

  statuses:
    description: "List one project's ordered board columns (statuses)"
    readOnly: true
    requiredFlags:
      - --project-id
    rules:
      - 'Status definitions are project-scoped, so names, order, and count vary between projects in one workspace; the status type of each column does not'
      - 'Read-only: status definitions are created and edited in project settings over REST, never over the protocol'
      - '--project-id accepts a project id, slug, or name and resolves within the caller workspace'

  discussObjective:
    description: 'Mark a draft objective submitted (signals in active discussion)'
    optionalFlags:
      - --mission-id
      - --objective-id
    rules:
      - 'When --objective-id is present, that objective is submitted; it must belong to the mission and must be in draft state'
      - 'Without --objective-id, the first draft objective on the mission is submitted (unchanged)'
    sideEffects:
      - objective-state-draft-to-submitted

  addObjectives:
    description: 'Append ordered objectives to an existing mission'
    optionalFlags:
      - --mission-id
      - --objective-id
      - --auto-advance
      - --no-auto-advance
    rules:
      - 'Each --objectives-json / --objectives-file item may set autoAdvance; --auto-advance / --no-auto-advance supply the default when an item omits it; omitted defaults to false'
      - 'Each item may set agent and model. agent persists as the new objective''s assignedAgent; model requires a non-empty agent. When both are omitted, existing project launch-preference defaults apply.'
    sideEffects:
      - creates-objectives-in-draft-state

  updateObjective:
    description: 'Update auto-advance and/or instruction text on an existing objective'
    requiredFlags:
      - --objective-id
    optionalFlags:
      - --auto-advance
      - --no-auto-advance
      - --instruction-text
      - --instruction-text-file
    rules:
      - 'At least one of --auto-advance/--no-auto-advance or --instruction-text/--instruction-text-file is required'
      - 'Instruction text may be edited only when the objective is in draft or future state'
      - 'Does not require a session key'
    sideEffects:
      - updates-objective-auto-advance
      - updates-objective-instruction-text

  deleteMissions:
    description: 'Atomically soft-delete an explicitly confirmed list of missions'
    requiredFlags:
      - --mission-ids-json | --mission-ids-file
      - --confirm
    responseShape: '{ deletedMissionIds: string[] }'
    rules:
      - 'Accepts one to 100 unique mission UUID or display-id references. Every target is resolved and authorized with mission:delete before any write; an invalid, duplicate, deleted, or unauthorized target rejects the whole request.'
      - 'Agents MUST show the resolved list to the user and obtain an affirmative response before passing --confirm. --confirm is required and must be the literal boolean flag, not an inferred default.'
      - 'Soft-deletes each mission and its live objectives in one transaction, preserving existing deletion change-feed semantics.'
    sideEffects:
      - atomically-soft-deletes-missions-and-live-objectives

  deleteObjectives:
    description: 'Atomically soft-delete an explicitly confirmed list of objectives'
    requiredFlags:
      - --objective-ids-json | --objective-ids-file
      - --confirm
    responseShape: '{ deletedObjectiveIds: string[] }'
    rules:
      - 'Accepts one to 100 unique objective UUID or display-id references. Every target is resolved and authorized with objective:update before any write; an invalid, duplicate, deleted, or unauthorized target rejects the whole request.'
      - 'Agents MUST show the resolved list to the user and obtain an affirmative response before passing --confirm. --confirm is required and must be the literal boolean flag, not an inferred default.'
      - 'Soft-deletes each objective in one transaction and preserves existing Run Queue cleanup and deletion change-feed semantics.'
    sideEffects:
      - atomically-soft-deletes-objectives
      - dequeues-deleted-objectives

  recordWork:
    description: 'Record already-completed chat work as a review mission without an attached session'
    optionalFlags:
      - --assigned-to
    rules:
      - 'For work already done in chat, not for in-progress work'
      - '--assigned-to resolves one workspace member by the same rules as on create; an unresolvable member is rejected rather than silently left unassigned'
      - 'Explicit changed-file paths set current_diff_state to unknown; record-work does not inspect a current checkout.'
    sideEffects:
      - creates-mission-in-review-status
      - creates-completed-objective
      - creates-delivery-record-without-session-attribution
      - records-explicit-changed-files-and-optional-rationale-annotations
      - emits-scoped-changed-file-and-change-rationale-entity-changes

artifacts:
  addArtifact:
    description: >-
      Create a mission artifact during a turn without delivering (same rules as
      REST POST /api/missions/:id/artifacts). Delivery remains optional for
      artifacts; agents may publish plans, notes, URLs, and similar records
      mid-session and revise them later with update-artifact.
    requiredFlags:
      - --type
      - --label
    optionalFlags:
      - --mission-id
      - --session-key
      - --objective-id
      - --content-text
      - --content-text-file
      - --external-url
    rules:
      - 'At least one of --content-text/--content-text-file or --external-url must be supplied'
      - '--objective-id (UUID or display id) stamps objective provenance without a live session key; --session-key wins when both are present'
      - 'type is one of the core artifact types (test_results, next_steps, note, url, decision, migration) or a namespaced extension value accepted by the deployment CHECK'
      - 'When --session-key is present (or auto-injected from the attach cache), session_id and objective_id are stamped from that live session'
      - 'delivery_id is always null for mid-turn creates; deliver may still attach additional artifacts later'
      - 'Non-HTTP(S) external URLs are rejected'
    sideEffects:
      - creates-artifact-row
      - emits-artifact-entity-change-create

  updateArtifact:
    description: >-
      Update an existing mission artifact's human-facing label, contentText,
      and/or externalUrl in place (same rules as REST PATCH
      /api/missions/:id/artifacts/:artifactId). Does not require a session key.
    requiredFlags:
      - --artifact-id
      - --expected-revision
    optionalFlags:
      - --mission-id
      - --objective-id
      - --label
      - --content-text
      - --content-text-file
      - --external-url
    rules:
      - 'At least one of --label, --content-text/--content-text-file, or --external-url must be supplied'
      - 'Empty --content-text / --external-url clears that field (subject to the retain-at-least-one-content rule)'
      - 'Stale --expected-revision returns 409; non-HTTP(S) external URLs are rejected'
      - 'Delivery/session/objective provenance and contentJson remain immutable'
    sideEffects:
      - updates-artifact-row
      - increments-artifact-revision
      - emits-artifact-entity-change

sharedContext:
  readContext:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id

  writeContext:
    optionalFlags:
      - --mission-id
      - --objective-id
    sideEffects:
      - upserts-shared-context-entry-by-mission-and-key

  attachmentList:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id
    rules:
      - "Without --objective-id the listing spans every objective on the mission; with it, only that objective's attachments are returned"

  attachmentPrepareUpload:
    sideEffects:
      - creates-objective-attachment-record-in-prepared-state

  attachmentFinalizeUpload:
    sideEffects:
      - updates-attachment-upload-status-to-available

  attachmentDownloadUrl:
    readOnly: true
    optionalFlags:
      - --mission-id
      - --objective-id

  attachmentUploadFile:
    description: 'One-command local attachment upload (prepare + upload + finalize)'
    sideEffects:
      - creates-and-finalizes-attachment

managementSurfaces:
  runnerQueue:
    description: 'Runner queue/device/project-resource operations are management surfaces, not ovld protocol commands.'
    owner: 'runner'
    transport: 'Runner -> REST'
    endpoints:
      - 'GET /api/runner/status'
      - 'POST /api/runner/claim'
      - 'POST /api/runner/clear'
      - 'POST /api/runner/requests/:id/launching'
      - 'POST /api/runner/requests/:id/launched'
      - 'POST /api/runner/requests/:id/failed'
      - 'POST /api/missions/:id/branch-prepared'
    rules:
      - 'ovld runner uses these REST endpoints through the configured backend.'
      - 'Agents use attach/update/heartbeat/ask/deliver for mission lifecycle work.'
  projectResources:
    description: 'Project/resource setup is exposed through top-level CLI management commands and REST project endpoints, not ovld protocol commands.'
    examples:
      - 'ovld create-project --name <name>'
      - 'ovld add-cwd --project-id <id-or-name>'
  executionTargets:
    description: >-
      Standalone execution-target registration. The top-level CLI command
      `ovld add-et --name <name>` forwards to the parentless `register-target`
      protocol handler (`POST /api/protocol/register-target`), which provisions or
      reuses the acting machine's local execution target for the resolved workspace
      and applies `--name` as its label. Workspace resolution and the
      `workspace_selection_required` fallback mirror `create-project`; gated by
      per-workspace `execution_request:claim`.
    examples:
      - 'ovld add-et --name <name>'
      - 'ovld add-et --name <name> --workspace-id <id-or-name>'

authAndDiscovery:
  authStatus:
    description: 'Report local runtime readiness and auth mode without printing secrets'
    readOnly: true

  discoverProject:
    description: 'Resolve project from CWD, explicit directory, or project identifier. CWD resolution uses the isPrimary project in .overlord/project.json when the checkout is linked to more than one project; the additive linkedProjects array lists every linked project.'
    readOnly: true

  listOrganizations:
    description: 'List workspace (MVP: returns local instance workspace)'
    readOnly: true

# Stable response shape versions
# Add a new version key here when the shape changes in a backward-incompatible way

responseShapes:
  # attach-response-v1 (superseded by v2 in contract version 4). Retained for
  # historical reference. v1 exposed a single top-level `objectives` array that
  # included the current objective.
  attach-response-v1:
    description: 'Response shape returned by the attach command (superseded by attach-response-v2)'
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - objectives
      - session
      - sharedState
      - promptContext
    sessionRequiredFields:
      - sessionKey
      - state
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    promptContextRequiredContent:
      - task title
      - mission ID
      - objective ID
      - objective instruction text
      - recent activity/history
      - required protocol workflow instructions
    promptContextOptionalContent:
      - constraints
      - attachments
      - artifacts
      - shared context
      - user custom agent instructions

  attach-response-v2:
    description: >-
      Response shape returned by the attach and resume-follow-up commands.
      Replaces the single `objectives` array with two disjoint arrays that both
      exclude the current objective: `previousObjectives` (positioned before the
      current objective) and `futureObjectives` (positioned after). The current
      objective is carried only in the top-level `objective` field.
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - previousObjectives
      - futureObjectives
      - session
      - sharedState
      - promptContext
    sessionRequiredFields:
      - sessionKey
      - state
    # Applies to entries in both previousObjectives and futureObjectives.
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    # The current objective is excluded from previousObjectives and futureObjectives.
    objectivesExcludeCurrent: true
    promptContextRequiredContent:
      - task title
      - mission ID
      - objective ID
      - objective instruction text
      - recent activity/history
      - required protocol workflow instructions
    # Recent activity/history rendered into promptContext excludes operational
    # lifecycle event types so the agent sees only substantive events.
    promptContextHistoryExcludedEventTypes:
      - status_change
      - execution_requested
      - awaiting_approval
    promptContextOptionalContent:
      - constraints
      - attachments
      - artifacts
      - shared context
      - user custom agent instructions

  attach-response-v3:
    description: >-
      Response shape returned by the attach and resume-follow-up commands.
      Replaces the human-readable `promptContext` field from attach-response-v2
      with `agentInstructions`. Mission context lives in the structured top-level
      fields (`mission`, `objective`, `previousObjectives`, `futureObjectives`,
      `history`, `attachments`, `artifacts`, and `sharedState`). `agentInstructions`
      is intentionally concise workflow guidance for agents that attach without
      a richer launch prompt. Contract version 1 keeps this v3 shape and adds
      optional resource-binding metadata: `projectResources` at the top level and
      `resourceKey` on current/previous/future objective summaries.
    requiredTopLevelFields:
      - history
      - artifacts
      - attachments
      - previousObjectives
      - futureObjectives
      - session
      - sharedState
      - agentInstructions
    optionalTopLevelFields:
      projectResources: 'Project resource manifest for the current execution target, grouped by logical resource key.'
    sessionRequiredFields:
      - sessionKey
      - state
    objectivesRequiredFields:
      - id
      - objective
      - state
      - position
    objectivesOptionalFields:
      - resourceKey
    objectivesExcludeCurrent: true
    agentInstructionsRequiredContent:
      - mission ID
      - objective ID
      - objective title or fallback label
      - location of objective details in the structured JSON
      - required protocol workflow instructions
    agentInstructionsOptionalContent:
      - user custom agent instructions
