      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Upload a file to an objective
      description: >-
        Requires `attachment:create`. The request body is the file's raw bytes (no JSON, no multipart);
        the global JSON parser skips this route. At most 25 MiB: a larger body is refused by the parser
        with 413 `body_too_large`. Stored in the workspace's `attachments` bucket and recorded with an
        `attachment` change.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: x-upload-filename
          in: header
          required: false
          description: >-
