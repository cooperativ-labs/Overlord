      x-overlord-consumers: [mobile, webapp]
      summary: Disconnect an account connection
      description: >-
        A profile-scoped row of the caller is disconnected on both editions: the credential is erased
        first, then revoked upstream best-effort, then the legacy row is tombstoned. Any other id takes
