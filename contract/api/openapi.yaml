  /api/connections:
    get:
      operationId: getConnections
      tags: [connections]
      x-overlord-permission: owner
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: List the caller's account connections
      description: >-
        Owner-scoped; no RBAC action. Without `scope` it lists the caller's live organization-scoped
        (Knowledgebase) connections in the request's selected organization; that listing is Cloud-only
        (404 `chat_unavailable` on Local, 404 `not_found` without a selected organization or membership),
        and a grant whose refresh has expired is moved to `reauthorization_required` as it is read. With
        `scope=all`, on both editions, it adds the caller's profile-scoped connections (Everhour, GitHub;
        legacy rows are adopted first) and `providers`. Responses carry `Cache-Control: no-store`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: scope
          in: query
          required: false
          description: '`all` selects the combined listing; any other value is the default listing.'
          schema: { type: string }
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountConnectionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: postConnections
      tags: [connections]
      x-overlord-permission: owner
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Start an OAuth account connection
      description: >-
        `provider: github` starts the caller's profile-scoped GitHub repository consent on both editions
        (reusing a live connection's row for a reconnect); 503 `provider_not_ready` when the GitHub OAuth
        client or every write key is missing. Any other provider takes the Cloud-only organization path
        (404 `chat_unavailable` on Local): only `knowledgebase` is accepted there (400 `invalid_request`
        otherwise, `everhour` included), 503 `provider_not_ready` when Knowledgebase or encryption is not
        configured. The client opens `authorizeUrl`; the state expires at `expiresAt`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAccountConnectionBody' }
      responses:
        '200':
          description: The pending connection and where to authorize it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartAccountConnectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
