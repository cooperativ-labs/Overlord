openapi: 3.1.0
info:
  title: Overlord API
  # info.version is the API description's own Semantic Version; it changes when
  # this document changes and is never compared with the contract version.
  version: 1.0.0
  # The contract version (contract/VERSION) this document belongs to. Written
  # only by `yarn version:contract`.
  x-overlord-contract-version: 168.1.0
  description: >-
    Normative description of Overlord's REST surface (ADR 0006): one operation for every
    method and path the backend registers, at the path it is served (ADR 0007), excluding
    only the routes listed in x-overlord-route-exclusions. backend/openapi-route-parity.test.ts
    fails when a registered route has no operation or an operation has no registered route.
    It describes REST only; the agent protocol is specified by protocol-commands.yaml and the
    MCP tools by the generated tool catalog (ADR 0008). Every operation carries
    x-overlord-permission, x-overlord-edition and x-overlord-consumers, and extension routes
    carry x-overlord-extension; the vocabularies are defined in ADR 0048. Request and response
    schemas are being added (phase 4b of the contract migration); an operation without them
    is marked x-overlord-schema-status stub, and contract/api/openapi-ratchet.json caps how
    many may be. Until phase 4d, contract/api/rest-notes.md remains normative for the
    behaviour this document cannot yet express; where the two disagree, report the conflict.
servers:
  - url: /
    description: The backend origin. Paths are absolute; there is no version prefix.
# Registered routes that are deliberately not described here (ADR 0048). The parity
# test treats exactly these as registered-but-undescribed; anything else must have an
# operation.
x-overlord-route-exclusions:
  - method: ALL
    path: /api/auth/*
    kind: provider-owned
    reason: >-
      Better Auth's handler (backend/app.ts, `app.all('/api/auth/*')`). Its sign-in, session,
      sign-out and social-callback routes are defined and versioned by the Better Auth library,
      not by Overlord. Overlord's own handlers under /api/auth (desktop and browser sign-in
      handoffs and the GitHub repository-consent callback) are registered before the wildcard
      and are described as operations.
  - method: GET
    path: '*'
    kind: non-api
    reason: >-
      Single-page web app fallback, registered together with express.static only when a
      Local (SQLite) backend has a built web app next to it (backend/http/serve-spa.ts).
      It serves HTML for client-side routes; /api/* paths fall through to the API.
