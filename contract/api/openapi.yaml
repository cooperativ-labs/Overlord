paths:
  /api/auth/desktop/github:
    get:
      operationId: getAuthDesktopGithub
      tags: [auth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Start native GitHub sign-in in the system browser
      description: >-
        Opened in the system browser by the desktop shell and the mobile app. Starts Better Auth's GitHub
        sign-in with the fixed callback `/api/auth/desktop/callback`, sets Better Auth's state cookie and
        an `overlord.native_oauth` flow marker (`__Secure-` prefixed over HTTPS; path `/api/auth`, 10
        minutes) and redirects to GitHub. Better Auth's own errors are passed through unchanged as `{
        message, code }`. Not an API call; nothing here is a credential the caller keeps.
      security: []
      responses:
        '302':
          description: Redirect to GitHub's authorization page.
          headers:
            Location:
              required: true
              description: The GitHub authorization URL (with Better Auth's `state`).
              schema: { type: string }
            Set-Cookie:
              required: true
              description: Better Auth's OAuth state cookie and the native flow marker.
              schema: { type: string }
        '404':
          description: >-
            GitHub sign-in is not configured on this server (`{ message: 'Provider not found', code:
            'PROVIDER_NOT_FOUND' }`, written by Better Auth).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageErrorBody' }
        '503':
          description: Too many sign-ins are open (256 flows in this process); plain text.
          content:
            text/plain:
              schema: { type: string }
  /api/auth/desktop/callback:
    get:
      operationId: getAuthDesktopCallback
      tags: [auth]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: Finish native GitHub sign-in and hand off to the app
      description: >-
        Better Auth's GitHub callback lands here in the system browser. With a browser session it mints a
        one-time handoff ticket (60 seconds, single use, process-local) and redirects to
        `overlord://auth/callback?ticket=…`. Without a session it redirects to itself with
        `error=state_mismatch`. With an `error` query parameter it redirects to
        `overlord://auth/callback?error=<access_denied|state_mismatch|sign_in_failed>` when the native
        flow marker cookie is present, and otherwise answers a plain-text 400 page. Responses carry
        `Cache-Control: no-store` and `Referrer-Policy: no-referrer`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, {} ]
      parameters:
        - name: error
          in: query
          required: false
          description: An OAuth error code from Better Auth or GitHub; its presence selects the error path.
          schema: { type: string }
      responses:
        '302':
          description: >-
            `overlord://auth/callback?ticket=<ticket>`, `overlord://auth/callback?error=<code>`, or
            `/api/auth/desktop/callback?error=state_mismatch` when there is no session. Except for the
            `error` path, the body is Express's short redirect notice.
          headers:
            Location:
              required: true
              schema: { type: string }
        '400':
          description: An `error` callback without the native flow marker; a plain-text page.
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/browser/callback:
    get:
      operationId: getAuthBrowserCallback
      tags: [auth]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Finish hosted-web sign-in and hand off to the web client
      description: >-
        Reached in the browser after Better Auth sign-in for a hosted web client on another origin. The
        origin of `returnTo` must be an allowed browser origin. With a browser session it mints a one-time
        handoff ticket (60 seconds, single use) and redirects to that origin with `overlord_oauth_ticket`.
        Errors are short text pages, not JSON.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, {} ]
      parameters:
        - name: returnTo
          in: query
          required: true
          description: >-
            An absolute URL; only its origin is used, and it must be one of the server's allowed browser
            origins (400 otherwise).
          schema: { type: string }
      responses:
        '302':
          description: >-
            Redirect to `<returnTo origin>/?overlord_oauth_ticket=<ticket>`; the body is Express's short
            redirect notice.
          headers:
            Location:
              required: true
              schema: { type: string }
        '400':
          description: The return origin is missing or not allowed (`text/html` body with a plain sentence).
          content:
            text/html:
              schema: { type: string }
        '401':
          description: No browser session (`text/html` body with a plain sentence).
          content:
            text/html:
              schema: { type: string }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/desktop/exchange:
    post:
      operationId: postAuthDesktopExchange
      tags: [auth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [desktop, mobile]
      summary: Exchange a native sign-in ticket for a session token
      description: >-
        Unauthenticated; the one-time ticket from `/api/auth/desktop/callback` is the credential. A ticket
        is consumed by its first use, valid or not for this audience; an unknown, expired, reused or
        browser-audience ticket answers 401 `{ message }`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthHandoffExchangeBody' }
      responses:
        '200':
          description: The Better Auth session token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthHandoffExchangeResultDto' }
        '401':
          description: '`{ message: ''This desktop sign-in link has expired or was already used.'' }`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageErrorBody' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/browser/exchange:
    post:
      operationId: postAuthBrowserExchange
      tags: [auth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Exchange a hosted-web sign-in ticket for a session token
      description: >-
        Unauthenticated; the one-time ticket from `/api/auth/browser/callback` is the credential. An
        unknown, expired, reused or desktop-audience ticket answers 401 `{ message }`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthHandoffExchangeBody' }
      responses:
        '200':
          description: The Better Auth session token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthHandoffExchangeResultDto' }
        '401':
          description: '`{ message: ''This browser sign-in link has expired or was already used.'' }`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageErrorBody' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/callback/github/repository:
    get:
      operationId: getAuthCallbackGithubRepository
      tags: [auth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: GitHub repository-access OAuth callback
      description: >-
        GitHub redirects here after the repository consent started by `POST /api/connections` (or the
        `/ext/github/user-connection/authorize` alias). The account-connections module consumes the hashed
        state once, exchanges the code server-to-server and stores the encrypted credential. Every failure
        becomes the status `failed`; nothing but a status leaves the server. Responses carry
        `Cache-Control: no-store` and `Referrer-Policy: no-referrer`.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: The authorization code GitHub issued.
          schema: { type: string }
        - name: state
          in: query
          required: false
          description: The state minted when the connection started; unknown, used or expired answers `expired`.
          schema: { type: string }
        - name: error
          in: query
          required: false
          description: GitHub's error code (`access_denied` reports `denied`).
          schema: { type: string }
      responses:
        '302':
          description: >-
            When the flow named a return target: `overlord://connections/callback` (mobile) or the web
            origin plus the requested path, default `/settings/connections` (web), each with
            `provider=github&status=<connected|denied|expired|failed>`; or, for a flow a legacy alias
            started, its validated return URL with `githubConnection=<status>`. The body is Express's
            short redirect notice.
          headers:
            Location:
              required: true
              schema: { type: string }
        '200':
          description: Connected, and the flow named no return target; a short HTML status page.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: Denied, expired or failed, and no return target; a short HTML status page.
          content:
            text/html:
              schema: { type: string }
  /api/auth-providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Login providers this server offers
      description: >-
        Unauthenticated, for the login screen. `email` is always true; `github` is true when GitHub OAuth
        client credentials are configured.
      security: []
      responses:
        '200':
          description: The providers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProvidersDto' }
  /api/health:
    get:
      operationId: getHealth
      tags: [meta]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [cli, desktop]
      summary: Liveness probe
      description: 'Unauthenticated; always `{ ok: true }` while the process serves requests.'
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
  /.well-known/oauth-protected-resource:
    get:
      operationId: getWellKnownOauthProtectedResource
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: OAuth protected-resource metadata (RFC 9728)
      description: >-
        Describes `/mcp` as an OAuth-protected resource. The base URL is `OVERLORD_WEBAPP_PUBLIC_URL` or
        `OVERLORD_PUBLIC_URL` when set; otherwise the request's `Host` (never `X-Forwarded-Host`), with
        `https` assumed for any host that is not local.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProtectedResourceMetadata' }
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getWellKnownOauthProtectedResourceMcp
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: OAuth protected-resource metadata for /mcp (path-inserted form)
      description: Identical to `/.well-known/oauth-protected-resource`; the `/mcp` 401 points clients here.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProtectedResourceMetadata' }
  /.well-known/oauth-authorization-server:
    get:
      operationId: getWellKnownOauthAuthorizationServer
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: OAuth authorization-server metadata (RFC 8414)
      description: >-
        The issuer is the same base URL as the resource metadata. `authorization_endpoint` is the web
        approval page `/oauth/approve`, not `/oauth/authorize`. Only the authorization-code grant with
        PKCE S256 and public clients (`none`) are offered.
      security: []
      responses:
        '200':
          description: The metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationServerMetadata' }
  /oauth/authorize:
    get:
      operationId: getOauthAuthorize
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: Redirect an authorization request to the web approval page
      description: >-
        Copies every query parameter, unvalidated, onto `<base URL>/oauth/approve` and redirects there;
        the web app validates the request through `POST /oauth/authorize/request`.
      security: []
      responses:
        '302':
          description: Redirect to the approval page; the body is Express's short redirect notice.
          headers:
            Location:
              required: true
              schema: { type: string }
  /oauth/register:
    post:
      operationId: postOauthRegister
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: Dynamic client registration (RFC 7591)
      description: >-
        Stateless: the client id is a signed encoding of the client's name and redirect URIs, so nothing
        is stored and any caller may register. Errors are RFC 6749 `{ error, error_description }`, not
        `ErrorEnvelope`. A form-encoded body must repeat `redirect_uris`: a single value parses as a string
        and is refused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthClientRegistrationBody' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthClientRegistrationBody' }
      responses:
        '201':
          description: The registered client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistrationDto' }
        '400':
          description: '`invalid_redirect_uri`: no acceptable redirect URI.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthErrorBody' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/token:
    post:
      operationId: postOauthToken
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: Exchange an authorization code for an access token
      description: >-
        Public client (no client authentication). The code is single-use and expires after five minutes; a
        failed exchange consumes it and revokes the token it would have delivered. `client_id`,
        `redirect_uri` and `resource` must equal those of the authorization, and the SHA-256 of
        `code_verifier` must equal the `code_challenge`. The access token is a `mission_lifecycle` user
        token minted at approval, valid 90 days, with no refresh token. Errors are RFC 6749 `{ error,
        error_description }`; the response sets no `Cache-Control`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthTokenRequestBody' }
          application/json:
            schema: { $ref: '#/components/schemas/OAuthTokenRequestBody' }
      responses:
        '200':
          description: The access token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResponseDto' }
        '400':
          description: >-
            `unsupported_grant_type`, `invalid_grant` (unknown, expired or mismatched code, or PKCE
            failure) or `invalid_target` (resource mismatch).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthErrorBody' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/revoke:
    post:
      operationId: postOauthRevoke
      tags: [oauth]
      x-overlord-permission: public
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: Revoke an access token (RFC 7009)
      description: >-
        Unauthenticated; possession of the token is the credential. Revokes any live `out_…` user token
        whose secret is given (an OAuth access token or any other user token); an unknown, malformed or
        absent token is not an error. Always answers `{ ok: true }`.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthRevokeBody' }
          application/json:
            schema: { $ref: '#/components/schemas/OAuthRevokeBody' }
      responses:
        '200':
          description: Revoked, or nothing to revoke.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/authorize/request:
    post:
      operationId: postOauthAuthorizeRequest
      tags: [oauth]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Validate an authorization request for the approval page
      description: >-
        Called by the web approval page with the authorization request's parameters, read from the JSON
        body or else the query string. Validates the client, redirect URI, PKCE, resource and scopes and
        lists the organizations and workspaces the caller may consent to (every active membership of the
        profile, whatever the request's token binding). Errors are `ErrorEnvelope` with an OAuth `code`
        (`unsupported_response_type`, `invalid_client`, `invalid_request`, `invalid_target`,
        `invalid_scope`), not redirects.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthAuthorizationRequestBody' }
      responses:
        '200':
          description: What the approval page shows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationRequestInfoDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /oauth/authorize/approve:
    post:
      operationId: postOauthAuthorizeApprove
      tags: [oauth]
      x-overlord-permission: user_token:self:create
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Approve or deny an authorization request
      description: >-
        Validates the request as `POST /oauth/authorize/request` does. `deny` answers the client redirect
        with `error=access_denied`. `approve` resolves the consent (an organization, required when the
        profile belongs to several, and either explicit workspaces or all current and future workspaces; a
        single workspace or organization is chosen implicitly), requires `user_token:self:create` on the
        issuance workspace (the first selected, else the organization's first) as authorized in the
        request's snapshot, mints a 90-day `mission_lifecycle` token with that consent, and answers the
        client redirect carrying a five-minute single-use code. A session whose profile belongs to several
        organizations has an empty snapshot and is refused with 403.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthApproveBody' }
      responses:
        '200':
          description: Where the approval page sends the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthApproveResultDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /mcp:
    get:
      operationId: getMcp
      tags: [mcp]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [external]
      summary: MCP server description
      description: >-
        Registered only when `OVERLORD_MCP_ENABLED=true`. Describes the MCP server: protocol version,
        endpoint, the tool definitions and widget resources (specified by the generated tool catalog, ADR
        0008, not here) and usage instructions. It is not a Streamable HTTP SSE stream. Accepts a session,
        a user token (including hosted MCP OAuth access tokens and `project_automation` tokens) or, from
        loopback, an unauthenticated local operator. An unauthenticated remote call answers 401 with
        `WWW-Authenticate: Bearer resource_metadata="/.well-known/oauth-protected-resource/mcp"`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: The server description.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpServerInfoDto' }
        '401':
          description: >-
            Not authenticated (`{ error: 'Authentication required' }`) with the `WWW-Authenticate` header
            naming the protected-resource metadata; or an invalid user token.
          headers:
            WWW-Authenticate:
              required: false
              description: Present on the `Authentication required` refusal.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: postMcp
      tags: [mcp]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [external, mobile]
      summary: MCP JSON-RPC transport
      description: >-
        Registered only when `OVERLORD_MCP_ENABLED=true`. The transport only: a JSON-RPC 2.0 request, or a
        batch array, answered as JSON (never an SSE stream). Methods are `initialize`,
        `notifications/initialized`, `ping`, `tools/list`, `tools/call`, `resources/list` and
        `resources/read`; the tools, their arguments and their authorization are specified by the
        generated tool catalog (ADR 0008). JSON-RPC errors are answered with HTTP 200: `-32600` for an
        invalid request, `-32601` for an unknown method, `-32000` when a tool or resource fails (its
        message carried). A single notification answers `{ jsonrpc: '2.0', result: null }`; a batch omits
        notifications. Authentication as `GET /mcp`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JsonRpcRequest'
                - type: array
                  items: { $ref: '#/components/schemas/JsonRpcRequest' }
      responses:
        '200':
          description: The JSON-RPC response, or an array of them for a batch.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JsonRpcResponse'
                  - type: array
                    items: { $ref: '#/components/schemas/JsonRpcResponse' }
        '401':
          description: As `GET /mcp`.
          headers:
            WWW-Authenticate:
              required: false
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
