      parameters:
        - name: after
          in: query
          required: false
          description: >-
            Resume cursor (an `entity_changes.seq`). A non-negative number (floored); anything else is
            ignored and `Last-Event-ID` is tried.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          description: The EventSource resume header, read like `after` when `after` is absent or invalid.
