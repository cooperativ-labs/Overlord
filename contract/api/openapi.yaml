      description: >-
        Called by the runner after preparing a mission branch. Requires `execution_request:claim` in the
        mission's workspace, as the other runner routes do (a token also needs that workspace in its
        consent). Moves the mission's active branch
        (unless `isolated`), stamps the execution request and its objective when `requestId` is given, and
        records a branch event and observation.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchPreparedBody' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/missions/{id}/branch/action":
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Mission UUID, or display id (`coo:756`) resolved within the caller's organization; an ambiguous
          display id answers 409.
        schema: { type: string }
    post:
      operationId: postMissionsByIdBranchAction
      tags: [missions]
      x-overlord-permission: mission:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Run an on-demand branch action
      description: >-
        Requires `mission:update`. Queues `integrate`, `commit`, `push_parent` or `publish` on the
        project's local target and waits up to 15 seconds; a wait that times out is not an error (the
        runner records the activity when it finishes). With `clientExecuted` the server only records the
        summary. Failures answer 409 with a typed `code` (`BRANCH_NOT_PREPARED`, `BRANCH_NO_PRIMARY`,
        `BRANCH_RESOURCE_NOT_CONNECTED`, `BRANCH_BUSY_EXECUTING`, `LOCAL_FILESYSTEM_UNAVAILABLE`, or the
        target's branch-action code such as `BRANCH_MERGE_CONFLICT`).
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchActionBody' }
      responses:
        '200':
          description: The refreshed mission detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionDetailDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/missions/{id}/branches":
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Mission UUID, or display id (`coo:756`) resolved within the caller's organization; an ambiguous
          display id answers 409.
        schema: { type: string }
    get:
      operationId: getMissionsByIdBranches
      tags: [missions]
      x-overlord-permission: mission:read
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: The mission's selectable branches
      description: Requires `mission:read`. Returns only the mission's current branch from metadata.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: The branch list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionBranchListDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/worktrees:
    get:
      operationId: getWorktrees
      tags: [worktrees]
      x-overlord-permission: project:read
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: List Overlord-managed worktrees
      description: >-
        Requires `project:read` in at least one workspace the caller is a member of. Worktree listing runs
        on the client through the local-target bridge; this route always answers an empty list.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: Always empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorktreeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/worktrees/remove:
    post:
      operationId: postWorktreesRemove
      tags: [worktrees]
      x-overlord-permission: project:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Remove one managed worktree
      description: >-
        Requires `project:update` in at least one workspace the caller is a member of. `path` is required
        (400) and resolved to an absolute path on the server. With `clientExecuted: true` the removal
        already ran on the client: `primaryRepoPath` is then required (400) and the route only
        acknowledges, answering `removed: [path]`. Otherwise `projectId` is required: without it the route
        answers 409 `LOCAL_FILESYSTEM_UNAVAILABLE`. With it, `project:update` is also checked in the
        project's workspace (404 for an unknown or foreign project) and the removal is queued to the
        execution target that serves the project (`executionTargetId`, else the caller's selection); no
        target able to serve it answers 409 `LOCAL_FILESYSTEM_UNAVAILABLE`, a missing `primaryRepoPath`
        400, and a capability failure 409 with the failure's code. The route waits up to 15 seconds; a
        call still running then answers empty lists. A dirty worktree is refused unless `force`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveWorktreeBody' }
      responses:
        '200':
          description: What was removed and skipped; `worktrees` is always empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurgeWorktreesResultDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/worktrees/purge-merged:
    post:
      operationId: postWorktreesPurgeMerged
      tags: [worktrees]
      x-overlord-permission: project:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Remove every clean, merged managed worktree of a project
      description: >-
        Requires `project:update` in at least one workspace the caller is a member of, and, with a
        `projectId`, in the project's workspace. Without `projectId` the route answers 409
        `LOCAL_FILESYSTEM_UNAVAILABLE`. With it, the purge is queued to the execution target that serves
        the project, which discovers the managed worktrees of `primaryRepoPath` (under `worktreeRoot` when
        given) and removes the merged, clean ones; dirty worktrees are skipped, never forced. No target
        able to serve it answers 409 `LOCAL_FILESYSTEM_UNAVAILABLE`, a missing `primaryRepoPath` 400, and
        a capability failure 409 with the failure's code. A call still running after 15 seconds answers
        empty lists. Takes an optional body.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurgeMergedWorktreesBody' }
      responses:
        '200':
          description: What was removed and skipped; `worktrees` is always empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurgeWorktreesResultDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth browser session cookie (`__Secure-` prefixed over HTTPS). Resolves the signed-in
        profile and its organization-bounded workspace memberships; it never selects an ambient
        workspace (backend/auth.ts `requireAuthenticatedSession`).
    sessionBearer:
      type: http
      scheme: bearer
      description: >-
        The same Better Auth session token sent as `Authorization: Bearer <session token>` by
        cross-origin clients (desktop remote mode, hosted web, mobile). Any bearer value that does not
        start with `out_` is tried as a session token first.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: out_
      description: >-
        A USER_TOKEN, `Authorization: Bearer out_…`. Personal tokens, `mission_lifecycle` tokens,
        `project_automation` tokens and the access tokens hosted MCP OAuth issues are all user tokens.
        A token authenticates its owning profile; every request intersects its consent and scope
        grants with live membership and per-workspace RBAC. An invalid, expired or revoked token
        answers 401 `{ error: 'Invalid or expired USER_TOKEN' }`. A `project_automation` token reaches
        only the routes listed in backend/project-automation-routes.ts; every other route answers 404
        `{ error: 'Not found' }`, and resources outside its selected projects read as 404.
    channelCredential:
      type: http
      scheme: bearer
      bearerFormat: osc_
      description: >-
        An agent-session channel credential, `Authorization: Bearer osc_…`, accepted only by the
        `/api/agent-session-channels/v1/*` family and refused (401) everywhere else.
  responses:
    BadRequest:
      description: >-
        The request failed validation (hand-written checks in the handler or the service layer, a
        ServiceError with status 400, or a SQLite foreign-key failure). See ErrorEnvelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: >-
        No session or token, or an invalid USER_TOKEN (`{ error }` only, written by the authentication
        middleware), or a handler found no authenticated profile.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: >-
        The caller is an active member of the owning workspace but lacks the RBAC action, or the
        token's scope grants exclude it (`error` is `Permission denied: <action>`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: >-
        The resource does not exist, is soft-deleted, belongs to a workspace the caller is not an
        active member of, or lies outside a project_automation token's projects. Existence is not
        disclosed. A project_automation token on a route outside its allowlist also gets 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: >-
        The request conflicts with current state (lifecycle, uniqueness, stale revision, ambiguous
        display id). SQLite unique and check constraint failures also answer 409 with only `error` and
        `detail`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: >-
        The body exceeded the parser limit (100 KB for JSON, the route's ceiling for raw uploads): `{
        error: 'Request body is too large.', code: 'body_too_large' }`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: >-
        A route-specific limit was reached. Overlord has no global rate limit; only the routes that
        document this response produce it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadGateway:
      description: An upstream dependency (a model provider or external service) failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: >-
        Any unexpected failure: `{ error, detail }` with both set to the exception message. This
        includes a malformed JSON body, a CORS-rejected origin and, on Postgres, constraint violations
        (see contract/api/schema-disagreements.md).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: The request body's media type is not accepted (for images, anything but PNG, JPEG, GIF or WebP).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: >-
        A provider or its credential encryption is not configured on this server (`{ error, code:
        'provider_not_ready' }`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableContent:
      description: The upstream provider rejected the supplied credential (`code` `credential_rejected`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        The one JSON error body of every route that forwards errors to `apiErrorHandler`
        (backend/errors.ts), and of the authentication middleware and the project-automation route
        guard. `error` is always present. Which other members appear depends on the error's origin: an
        ApiError writes `detail` and `code` when set; a service-layer ServiceError writes `code` and,
        when present, `details`; the body parser's 413 writes `code: body_too_large`; a SQLite
        constraint failure writes `detail` (the driver message) and no `code`; an unexpected failure
        (500) writes `detail` equal to `error`. Clients branch on `code` and HTTP status, never on
        `error` text.
      required: [ error ]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: >-
            Machine-readable code when the error carries one (open vocabulary, for example
            `validation_error`, `not_found`, `invalid_input`, `body_too_large`,
            `no_execution_target_registered`, `BRANCH_NOT_PREPARED`).
        detail:
          type: string
          description: Additional human-readable detail (ApiError detail, driver message, or the 500 message).
        details:
          $ref: '#/components/schemas/JsonValue'
    JsonValue:
      description: >-
        Any JSON value. Used where the code passes through arbitrary JSON (artifact `contentJson`,
        shared-context values, ServiceError `details`, repository-read `data`).
    OkResponse:
      type: object
      description: Acknowledgement written by `handle()` when a handler returns nothing, or returned explicitly.
      required: [ ok ]
      properties:
        ok:
          const: true
    DateTime:
      type: string
      format: date-time
      description: ISO-8601 timestamp. Postgres values are normalized to UTC `…Z`; SQLite values are
        stored as written (`nowIso()` writes UTC `…Z`).
    StatusType:
      type: string
      enum: [ draft, next, execute, review, complete, blocked, cancelled ]
    MissionPriority:
      type: string
      enum: [ low, normal, high, urgent ]
    ObjectiveState:
      type: string
      enum: [ future, draft, submitted, launching, executing, pending_delivery, complete ]
    CreatedByKind:
      type: string
      enum: [ human, agent, automation ]
      description: Rows predating creation provenance report `human`.
    ProjectLifecycle:
      type: string
      enum: [ active, archived ]
    ProjectListLifecycle:
      type: string
      enum: [ active, archived, all ]
    AgentLaunchFlagDto:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: CLI flag token, usually starting with `--`.
        value:
          description: Positional value after the flag; absent or null for a boolean flag.
          oneOf:
            - type: string
            - type: 'null'
    AgentLaunchFlagInput:
      description: >-
        A launch flag as accepted on input: a structured flag, or flag text (`--x`, `--x v`, `--x=v`)
        that the server parses. Entries without a non-blank name are dropped.
      oneOf:
        - type: string
        - type: object
          required: [ name ]
          properties:
            name: { type: string }
            value:
              oneOf:
                - type: string
                - type: 'null'
    AgentLaunchConfigDto:
      type: object
      required: [ preCommand, flags ]
      properties:
        preCommand:
          type: string
        flags:
          type: array
          items: { $ref: '#/components/schemas/AgentLaunchFlagDto' }
    AgentLaunchConfigInput:
      type: object
      description: Launch mechanics as accepted on input; omitted members default to empty.
      properties:
        preCommand:
          type: string
        flags:
          type: array
          items: { $ref: '#/components/schemas/AgentLaunchFlagInput' }
    ProjectDto:
      type: object
      required:
        [
          id,
          workspaceId,
          slug,
          name,
          description,
          color,
          defaultBranch,
          status,
          createdAt,
          updatedAt,
          revision,
          missionCount,
          position,
          preLaunchCommands,
          launchEnvVars
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description:
          oneOf:
            - type: string
            - type: 'null'
        color:
          description: Lower-case `#rrggbb` from project settings, or null.
          oneOf:
            - type: string
            - type: 'null'
        defaultBranch:
          description: Configured base branch for mission branches; null falls back to `main`.
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/ProjectLifecycle' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        missionCount: { type: integer, minimum: 0 }
        position:
          type: integer
          minimum: 0
          description: 1-based sidebar order within the workspace; 0 for a legacy row without one.
        preLaunchCommands:
          type: array
          items: { type: string }
        launchEnvVars:
          type: object
          additionalProperties: { type: string }
    ProjectStatusDto:
      type: object
      required: [ id, workspaceId, projectId, key, name, type, position, isDefault, isTerminal ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/StatusType' }
        position: { type: integer, minimum: 0 }
        isDefault: { type: boolean }
        isTerminal: { type: boolean }
    ProjectTagDto:
      type: object
      required: [ id, projectId, label, color, active ]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        label: { type: string }
        color:
          description: Free-form trimmed color text (not validated), or null.
          oneOf:
            - type: string
            - type: 'null'
        active: { type: boolean }
    ProjectResourceAccessMode:
      type: string
      enum: [ read, read_write ]
    ProjectResourceSourceDto:
      type: object
      required:
        [
          id,
          executionTargetId,
          sourceKind,
          descriptor,
          launchDefaults,
          observedRevision,
          observedContentDigest
        ]
      properties:
        id: { type: string, format: uuid }
        executionTargetId:
          description: The target this source materializes on; null for a project-global source.
          oneOf:
            - type: string
            - type: 'null'
        sourceKind:
          type: string
          description: Open vocabulary; the REST surface writes `local_checkout` and `git`.
        descriptor:
          type: object
          additionalProperties: true
          description: >-
            The stored descriptor object (`path` for a checkout, `url` for git, plus `launchDefaults`
            when set); `{}` when the stored JSON is not an object.
        launchDefaults:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
          description: Per-agent launch defaults; `{}` when none.
        observedRevision:
          oneOf:
            - type: string
            - type: 'null'
        observedContentDigest:
          oneOf:
            - type: string
            - type: 'null'
    ProjectResourceDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          executionTargetId,
          resourceKey,
          type,
          label,
          path,
          isPrimary,
          accessMode,
          status,
          observedAt,
          observationSource,
          createdAt,
          updatedAt,
          revision,
          sources
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionTargetId:
          description: Target of the representative source (the first `local_checkout` source, else the first
            source); null when none.
          oneOf:
            - type: string
            - type: 'null'
        resourceKey: { type: string }
        type:
          type: string
          description: >-
            `local_directory` when the representative source is `local_checkout`, otherwise that
            source's kind (`git`, …), or `remote_directory` when the resource has no source. The
            TypeScript type lists `local_directory`, `remote_directory`, `git`, `source_bundle`.
        label:
          oneOf:
            - type: string
            - type: 'null'
        path:
          type: string
          description: The checkout path of a `local_checkout` representative source, else empty.
        isPrimary: { type: boolean }
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
        status:
          type: string
          enum: [ active, missing, archived ]
        observedAt:
          description: When the representative source's target last reported this resource; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        observationSource:
          description: '`client` when `observedAt` is set, else null.'
          oneOf:
            - const: client
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ProjectResourceSourceDto' }
    MissionCreatorTokenDto:
      type: object
      required: [ tokenId, label ]
      properties:
        tokenId: { type: string, format: uuid }
        label: { type: string }
    MissionDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          displayId,
          sequenceNumber,
          title,
          statusId,
          statusType,
          boardPosition,
          priority,
          assignedWorkspaceUserId,
          notes,
          scheduleId,
          dueDatetime,
          createdAt,
          updatedAt,
          revision,
          objectiveCount,
          completedObjectiveCount,
          hasExecutingObjective,
          hasCompletedObjective,
          hasPendingObjectiveWithInstructions,
          hasUnseenBlockingQuestion,
          hasUnseenReturnedToExecute,
          allowParallelObjectives,
          draftObjectiveResourceKey,
          tags,
          createdByKind,
          createdByAgent,
          createdByWorkspaceUserId,
          createdByToken
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        displayId:
          type: string
          description: Human-readable id, `<workspace prefix>:<sequence>` (for example `coo:756`).
        sequenceNumber: { type: integer, minimum: 1 }
        title: { type: string }
        statusId: { type: string, format: uuid }
        statusType: { $ref: '#/components/schemas/StatusType' }
        boardPosition: { type: integer }
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
        assignedWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        notes:
          description: Human-only notes; never sent to agents.
          oneOf:
            - type: string
            - type: 'null'
        scheduleId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        dueDatetime:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        objectiveCount: { type: integer, minimum: 0 }
        completedObjectiveCount: { type: integer, minimum: 0 }
        hasExecutingObjective:
          type: boolean
          description: True while an objective is `executing` or `pending_delivery`.
        hasCompletedObjective: { type: boolean }
        hasPendingObjectiveWithInstructions: { type: boolean }
        hasUnseenBlockingQuestion: { type: boolean }
        hasUnseenReturnedToExecute: { type: boolean }
        allowParallelObjectives: { type: boolean }
        draftObjectiveResourceKey:
          oneOf:
            - type: string
            - type: 'null'
        tags:
          type: array
          items: { $ref: '#/components/schemas/ProjectTagDto' }
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        createdByWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        createdByToken:
          oneOf:
            - $ref: '#/components/schemas/MissionCreatorTokenDto'
            - type: 'null'
        objectives:
          type: array
          description: Present only on `GET /api/projects/{id}/missions?includeObjectives=1`.
          items: { $ref: '#/components/schemas/ObjectiveDto' }
    ObjectiveRunQueueEntryDto:
      type: object
      required:
        [
          id,
          queueId,
          queueName,
          position,
          state,
          blockedReason,
          waitingReason,
          waitingOnObjectiveId,
          waitingOnObjectiveDisplayId,
          attemptCount,
          precededBy
        ]
      properties:
        id: { type: string, format: uuid }
        queueId: { type: string, format: uuid }
        queueName: { type: string }
        position: { type: integer, minimum: 1 }
        state:
          type: string
          enum: [ waiting, blocked, dispatched, running ]
        blockedReason:
          oneOf:
            - type: string
            - type: 'null'
        waitingReason:
          oneOf:
            - type: string
              enum: [ mission_busy, resource_disconnected, retry_pending ]
            - type: 'null'
        waitingOnObjectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        waitingOnObjectiveDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        attemptCount: { type: integer, minimum: 0 }
        precededBy:
          description: Always null in objective projections.
          type: 'null'
    ObjectiveDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          position,
          title,
          instructionText,
          state,
          autoAdvance,
          queueEntry,
          assignedAgent,
          model,
          reasoningEffort,
          createdAt,
          updatedAt,
          launchedAt,
          startedAt,
          completedAt,
          reopenedAt,
          revision,
          externalSessionId,
          branch,
          resourceKey,
          displayKey,
          displayId,
          createdByKind,
          createdByAgent,
          createdByWorkspaceUserId,
          launchConfigOverrides
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        title:
          oneOf:
            - type: string
            - type: 'null'
        instructionText: { type: string }
        state: { $ref: '#/components/schemas/ObjectiveState' }
        autoAdvance:
          type: boolean
          description: Deprecated; derived from live queue membership when the read joins it.
        queueEntry:
          description: Live Run Queue membership; null when not queued or when the read does not join queue
            state (create and update responses).
          oneOf:
            - $ref: '#/components/schemas/ObjectiveRunQueueEntryDto'
            - type: 'null'
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        model:
          oneOf:
            - type: string
            - type: 'null'
        reasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        launchedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        reopenedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        revision: { type: integer, minimum: 1 }
        externalSessionId:
          description: Native harness session id of the latest agent session; null where the read does not
            join sessions.
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        displayKey: { type: string }
        displayId:
          type: string
          description: '`{mission.displayId}.{displayKey}`, for example `coo:756.k7xm`.'
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        createdByWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        launchConfigOverrides:
          type: object
          description: Explicit overrides keyed by execution target id (`*` = any target), then agent key;
            `{}` when none.
          additionalProperties:
            type: object
            additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
    ExecutionRequestDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          executionTargetId,
          requestedAgent,
          requestedModel,
          requestedReasoningEffort,
          launchConfig,
          status,
          requestedSource,
          localTargetMutationKind,
          lastError,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        requestedAgent:
          oneOf:
            - type: string
            - type: 'null'
        requestedModel:
          oneOf:
            - type: string
            - type: 'null'
        requestedReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        launchConfig: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
        status:
          type: string
          enum: [ queued, claimed, launching, launched, failed, cleared, cancelled, expired ]
        requestedSource: { type: string }
        localTargetMutationKind:
          oneOf:
            - type: string
              enum: [ branch_action, worktree_purge, capability_call ]
            - type: 'null'
        lastError:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    TerminalSessionDto:
      type: object
      required:
        [
          executionRequestId,
          objectiveId,
          provider,
          providerSessionId,
          sessionName,
          executionTargetId,
          deviceLabel,
          agentSessionId,
          executable,
          viewerKind,
          viewerOpenAs,
          createdAt,
          lastObservedState
        ]
      properties:
        executionRequestId: { type: string, format: uuid }
        objectiveId:
          type: string
          format: uuid
        provider:
          const: latch
        providerSessionId: { type: string }
        sessionName: { type: string }
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        deviceLabel:
          oneOf:
            - type: string
            - type: 'null'
        agentSessionId:
          oneOf:
            - type: string
            - type: 'null'
        executable: { type: string }
        viewerKind: { type: string }
        viewerOpenAs:
          type: string
          enum: [ window, tab ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastObservedState:
          type: string
          enum: [ running, exited, stopping, lost ]
    MissionBranchStatus:
      type: string
      enum: [ pending, created, published, merged_unpushed, merged ]
    MissionWorktreePreference:
      type: string
      enum: [ worktree, branch ]
    MissionBranchDto:
      type: object
      required:
        [
          name,
          baseBranch,
          worktreePath,
          status,
          dirty,
          overrideBranch,
          worktreeAutomationEnabled,
          worktreePreference,
          willPrepareBranch,
          willUseWorktree
        ]
      properties:
        name: { type: string }
        baseBranch:
          oneOf:
            - type: string
            - type: 'null'
        worktreePath:
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/MissionBranchStatus' }
        dirty: { type: boolean }
        hasUnpushedCommits:
          type: boolean
          description: Never written by the REST read today (see schema-disagreements.md).
        overrideBranch:
          oneOf:
            - type: string
            - type: 'null'
        worktreeAutomationEnabled: { type: boolean }
        worktreePreference:
          oneOf:
            - $ref: '#/components/schemas/MissionWorktreePreference'
            - type: 'null'
        willPrepareBranch: { type: boolean }
        willUseWorktree: { type: boolean }
        observedAt:
          description: Present only once a local target observed the branch.
          $ref: '#/components/schemas/DateTime'
        observationSource:
          description: Present (`client`) only together with `observedAt`.
          const: client
    MissionCreatedFromDto:
      type: object
      required: [ sessionId, missionId, missionDisplayId, agentIdentifier ]
      properties:
        sessionId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        missionDisplayId: { type: string }
        agentIdentifier: { type: string }
    MissionDetailDto:
      description: '`MissionDto` (without `objectives` as an opt-in) plus the mission page projections.'
      allOf:
        - $ref: '#/components/schemas/MissionDto'
        - type: object
          required: [ objectives, statuses, executionRequests, terminalSessions, branch, createdFrom ]
          properties:
            objectives:
              type: array
              items: { $ref: '#/components/schemas/ObjectiveDto' }
            statuses:
              type: array
              items: { $ref: '#/components/schemas/ProjectStatusDto' }
            executionRequests:
              type: array
              description: Active (queued, claimed, launching) requests, newest first.
              items: { $ref: '#/components/schemas/ExecutionRequestDto' }
            terminalSessions:
              type: array
              items: { $ref: '#/components/schemas/TerminalSessionDto' }
            branch:
              description: Always an object from this read; nullable in the TypeScript type.
              oneOf:
                - $ref: '#/components/schemas/MissionBranchDto'
                - type: 'null'
            createdFrom:
              oneOf:
                - $ref: '#/components/schemas/MissionCreatedFromDto'
                - type: 'null'
    ObjectiveAttachmentDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          inboxItemId,
          bucketKey,
          storageKey,
          filename,
          contentType,
          sizeBytes,
          uploadStatus,
          url,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        inboxItemId:
          description: Set while the file belongs to an unpromoted Inbox item; null otherwise.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        bucketKey:
          const: attachments
        storageKey: { type: string }
        filename: { type: string }
        contentType:
          oneOf:
            - type: string
            - type: 'null'
        sizeBytes:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        uploadStatus:
          type: string
          enum: [ prepared, uploaded, available, failed, deleted ]
        url:
          type: string
          description: Server-relative URL serving the bytes (`/api/storage/attachments/<storageKey>`).
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ObjectiveAttachmentList:
      type: array
      items: { $ref: '#/components/schemas/ObjectiveAttachmentDto' }
    RawUploadBody:
      type: string
      contentMediaType: application/octet-stream
      description: >-
        The file's raw bytes as the request body (no multipart). Any Content-Type is accepted and
        recorded as the attachment's media type. An empty body is refused (400).
    CreateProjectBody:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
        workspaceId:
          type: string
          description: >-
            Target workspace. Required in practice: a session or token request has no implicit
            workspace, so omitting it answers 400 `workspaceId is required when creating a project`.
        slug:
          type: string
          description: Slugified; derived from `name` when omitted or blank.
        description:
          oneOf:
            - type: string
            - type: 'null'
        color:
          type: string
          description: Six hex digits with or without `#`; stored lower-case with `#`. Other text answers 400.
        primaryResource:
          oneOf:
            - type: object
              required: [ directoryPath ]
              properties:
                directoryPath:
                  type: string
                  description: A blank path skips resource creation.
                executionTargetId:
                  description: >-
                    An existing target in the workspace (404 otherwise); null for a project-global
                    source; omitted to declare the calling machine, which needs a machine-local
                    identity or answers 409 `no_execution_target_registered`.
                  oneOf:
                    - type: string
                    - type: 'null'
            - type: 'null'
    InitializeProjectBody:
      type: object
      required: [ workspaceId, idempotencyKey, name, description ]
      properties:
        workspaceId: { type: string }
        idempotencyKey:
          type: string
          maxLength: 200
          description: >-
            Generated once by the client and reused on retry (at most 200 characters after trimming).
            A repeat with the same key for the same profile returns the first initialization and only
            retries pending or failed GitHub provisioning.
        name: { type: string, description: Project name and first mission title; must not be blank. }
        description: { type: string, description: Project description and first objective; must not be blank. }
        createGitHubRepository:
          type: boolean
          description: Only `true` requests provisioning.
        githubOwnerLogin:
          type: string
          description: Required exactly when `createGitHubRepository` is true (400 otherwise).
    InitializeProjectResultDto:
      type: object
      required: [ project, mission, repositoryProvisioning ]
      properties:
        project: { $ref: '#/components/schemas/ProjectDto' }
        mission: { $ref: '#/components/schemas/MissionDetailDto' }
        repositoryProvisioning:
          type: object
          required: [ status, retryable, ownerLogin, repository, resource, error ]
          properties:
            status:
              type: string
              enum: [ not_requested, pending, failed, succeeded ]
            retryable:
              type: boolean
              description: True while `status` is `pending` or `failed`; retry with the same idempotency key.
            ownerLogin:
              oneOf:
                - type: string
                - type: 'null'
            repository:
              oneOf:
                - type: object
                  required: [ id, fullName, defaultBranch, private, cloneUrl ]
                  properties:
                    id: { type: string }
                    fullName: { type: string }
                    defaultBranch: { type: string }
                    private: { const: true }
                    cloneUrl: { type: string }
                - type: 'null'
            resource:
              description: The read-only `git` resource recorded for the clone URL, once provisioning succeeded.
              oneOf:
                - $ref: '#/components/schemas/ProjectResourceDto'
                - type: 'null'
            error:
              description: The provisioning failure message (generic unless the provider raised an ApiError).
              oneOf:
                - type: string
                - type: 'null'
    ReorderProjectsBody:
      type: object
      required: [ orderedProjectIds ]
      properties:
        orderedProjectIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Every non-deleted project of one workspace (active and archived), top to bottom.
          items: { type: string }
    UpdateProjectBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
        description:
          description: Blank or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/ProjectLifecycle' }
        color:
          description: Six hex digits with or without `#`; an empty string or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        defaultBranch:
          description: A valid git branch name; blank or null clears it (falls back to `main`).
          oneOf:
            - type: string
            - type: 'null'
        preLaunchCommands:
          type: array
          description: Replaces the stored list; blank lines are dropped.
          items: { type: string }
        launchEnvVars:
          type: object
          description: Replaces the stored map; entries with a blank name are dropped.
          additionalProperties: { type: string }
    RepositoryEntryDto:
      type: object
      required: [ path, name, type, parentPath, depth ]
      properties:
        path: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [ file, directory ]
        parentPath:
          oneOf:
            - type: string
            - type: 'null'
        depth: { type: integer, minimum: 0 }
    ProjectRepositoryDto:
      type: object
      required:
        [
          projectId,
          executionTargetId,
          resource,
          status,
          rootPath,
          gitRoot,
          branch,
          commit,
          entries,
          truncated,
          scannedAt,
          message
        ]
      properties:
        projectId: { type: string }
        executionTargetId:
          description: The `executionTargetId` query parameter echoed back, or null.
          oneOf:
            - type: string
            - type: 'null'
        resource:
          oneOf:
            - $ref: '#/components/schemas/ProjectResourceDto'
            - type: 'null'
        status:
          type: string
          enum: [ ready, no_resource, not_git_repository, unsupported_resource, unreadable ]
        rootPath:
          oneOf:
            - type: string
            - type: 'null'
        gitRoot:
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        commit:
          oneOf:
            - type: string
            - type: 'null'
        entries:
          type: array
          items: { $ref: '#/components/schemas/RepositoryEntryDto' }
        truncated: { type: boolean }
        scannedAt: { $ref: '#/components/schemas/DateTime' }
        message:
          oneOf:
            - type: string
            - type: 'null'
    CreateProjectTagBody:
      type: object
      required: [ label ]
      properties:
        label:
          type: string
          description: Trimmed; must not be blank and must be unique among the project's live tags.
        color:
          description: Free-form; blank or null stores null.
          oneOf:
            - type: string
            - type: 'null'
    UpdateProjectTagBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        label:
          type: string
          description: Trimmed; must not be blank and must stay unique among the project's live tags.
        color:
          oneOf:
            - type: string
            - type: 'null'
        active:
          type: boolean
          description: Inactive tags stay on missions but are hidden from the create picker.
    ReorderBoardColumnBody:
      type: object
      required: [ statusId, orderedMissionIds ]
      properties:
        statusId:
          type: string
          description: A live status of this project (409 otherwise).
        orderedMissionIds:
          type: array
          uniqueItems: true
          description: >-
            Mission UUIDs that should occupy the column, top to bottom. A mission from another column
            moves into it (its status changes). Each must be a live mission of this project (404
            otherwise).
          items: { type: string }
    RepositoryReadOperation:
      type: string
      enum: [ observe, tree, branches, worktrees, git_status, diff, read_file, search_text ]
    RepositoryReadRequest:
      description: >-
        One bounded, read-only repository read on a registered resource binding. Every variant carries
        the binding (`executionTargetId`, `projectId`, `resourceKey`) and an `operationId` matching
        `^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$`, reused on retry. Paths are repository-relative;
        absolute or escaping paths answer 400.
      oneOf:
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey ]
          properties:
            operation:
              type: string
              enum: [ observe, branches, worktrees, git_status ]
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey ]
          properties:
            operation: { const: tree }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            relativePath:
              oneOf:
                - type: string
                - type: 'null'
            maxEntries:
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, scope ]
          properties:
            operation: { const: diff }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            scope:
              type: string
              enum: [ unstaged, staged, all ]
            relativePaths:
              oneOf:
                - type: array
                  maxItems: 50
                  items: { type: string }
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, relativePath ]
          properties:
            operation: { const: read_file }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            relativePath: { type: string }
            startLine:
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
            endLine:
              description: Must not precede `startLine`.
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, query ]
          properties:
            operation: { const: search_text }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            query:
              type: string
              minLength: 1
              maxLength: 256
              description: One line; no NUL, CR or LF.
            relativePath:
              oneOf:
                - type: string
                - type: 'null'
            caseSensitive: { type: boolean }
    RepositoryReadResult:
      type: object
      required:
        [
          operationId,
          operation,
          binding,
          outcome,
          head,
          branch,
          observedAt,
          bytes,
          truncated,
          data
        ]
      properties:
        operationId: { type: string }
        operation: { $ref: '#/components/schemas/RepositoryReadOperation' }
        binding:
          type: object
          required: [ executionTargetId, projectId, resourceKey ]
          properties:
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
        outcome:
          type: string
          enum: [ ok, unavailable, target_offline, timeout, denied, binary, oversized, not_found ]
        head:
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        observedAt: { $ref: '#/components/schemas/DateTime' }
        bytes: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        data:
          description: >-
            Operation-specific bounded payload (packages/contract/src/chat.ts
            `RepositoryGitStatusData`, `RepositoryDiffData`, `RepositoryFileData`,
            `RepositorySearchData`, or the capability payload); non-`ok` outcomes carry `{ message }`.
          $ref: '#/components/schemas/JsonValue'
    CreateProjectStatusBody:
      type: object
      required: [ name, type ]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank and must be unique among the project's live statuses (409).
        type: { $ref: '#/components/schemas/StatusType' }
        isDefault:
          type: boolean
          description: Only a `draft` or `next` status may be the default (400); setting it clears the
            previous default.
    UpdateProjectStatusBody:
      type: object
      description: Partial update; a status's type cannot change.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank and must stay unique (409).
        isDefault:
          type: boolean
          description: >-
            `true` makes a `draft` or `next` status the default (400 for other types); `false` on the
            current default answers 409 (choose another default instead).
    ReorderProjectStatusesBody:
      type: object
      required: [ orderedStatusIds ]
      properties:
        orderedStatusIds:
          type: array
          minItems: 1
          description: Every live status of the project, top to bottom; positions become 0, 1, 2, ….
          items: { type: string }
    ProjectStatusList:
      type: array
      items: { $ref: '#/components/schemas/ProjectStatusDto' }
    ProjectList:
      type: array
      items: { $ref: '#/components/schemas/ProjectDto' }
    ProjectTagList:
      type: array
      items: { $ref: '#/components/schemas/ProjectTagDto' }
    MissionList:
      type: array
      items: { $ref: '#/components/schemas/MissionDto' }
    ProjectResourceList:
      type: array
      items: { $ref: '#/components/schemas/ProjectResourceDto' }
    CreateProjectResourceBody:
      type: object
      description: >-
        Exactly one source: `directoryPath` (or its alias `path`) for a `local_checkout` source, or
        `sourceUrl` for a `git` source; when both are given `sourceUrl` wins. A resource with the
        derived `resourceKey` that already exists gains or updates the source instead of a new
        resource being created.
      properties:
        directoryPath:
          type: string
          description: Checkout path on the execution target.
        path:
          type: string
          description: Alias of `directoryPath` read when `directoryPath` is absent.
        sourceUrl:
          type: string
          description: An `http(s)://` or `git@host:path` Git URL (400 otherwise).
        resourceKey:
          description: Slugified; derived from `label`, then from the path's basename, when blank.
          oneOf:
            - type: string
            - type: 'null'
        label:
          oneOf:
            - type: string
            - type: 'null'
        isPrimary:
          type: boolean
          description: Defaults to true (only an explicit `false` creates a non-primary resource); a new
            primary clears the previous one.
        executionTargetId:
          description: >-
            For a checkout: an existing target of the workspace (404 otherwise), null for a pathless
            global source, or omitted to declare the calling machine (409
            `no_execution_target_registered` without a machine-local identity). For a `sourceUrl` it
            is stored as given without validation.
          oneOf:
            - type: string
            - type: 'null'
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
          description: A primary resource is always `read_write`; a non-primary one defaults to `read`.
    UpdateProjectResourceBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        resourceKey:
          description: Slugified; a blank or null value re-derives the key from the label or the current key.
          oneOf:
            - type: string
            - type: 'null'
        isPrimary:
          type: boolean
          description: Only `true` has an effect (it promotes the resource and forces `read_write`); `false`
            is ignored.
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
          description: Ignored for a primary resource.
    UpdateProjectResourceSourceBody:
      type: object
      required: [ launchDefaults ]
      properties:
        launchDefaults:
          type: object
          description: >-
            Replaces the per-agent defaults keyed by agent key. Entries with a blank key, a non-object
            value, or neither a pre-command nor flags are dropped; `{}` clears them.
          additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigInput' }
    MissionSearchDateField:
      type: string
      enum: [ createdAt, updatedAt, dueDatetime ]
    MissionSearchMatchKind:
      type: string
      enum: [ title, displayId, objective, event, delivery, constraints, notes ]
    MissionSearchAppliedFilters:
      type: object
      required: [ query, mode, projectIds, resourceKeys, statusTypes, dateField, from, to, coverageFloor ]
      properties:
        query:
          oneOf:
            - type: string
            - type: 'null'
        mode:
          type: string
          enum: [ display_id, any, all, phrase, fallback ]
        projectIds:
          type: array
          items: { type: string }
        resourceKeys:
          type: array
          items: { type: string }
        statusTypes:
          type: array
          items: { type: string }
        dateField:
          oneOf:
            - $ref: '#/components/schemas/MissionSearchDateField'
            - type: 'null'
        from:
          oneOf:
            - type: string
            - type: 'null'
        to:
          oneOf:
            - type: string
            - type: 'null'
        coverageFloor:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
    MissionSearchWorkspaceCount:
      type: object
      required: [ workspaceId, matched, returned ]
      properties:
        workspaceId: { type: string }
        matched: { type: integer, minimum: 0 }
        returned: { type: integer, minimum: 0 }
    MissionSearchResultV2:
      type: object
      required:
        [
          id,
          displayId,
          title,
          statusType,
          statusId,
          priority,
          projectId,
          projectName,
          workspaceId,
          workspaceName,
          workspaceSlug,
          createdAt,
          updatedAt,
          dueDatetime,
          objectiveCount,
          relevance,
          snippet,
          matchedTerms,
          matchedIn
        ]
      properties:
        id: { type: string, format: uuid }
        displayId: { type: string }
        title: { type: string }
        statusType: { type: string }
        statusId: { type: string }
        priority:
          oneOf:
            - type: string
            - type: 'null'
        projectId: { type: string }
        projectName: { type: string }
        workspaceId: { type: string }
        workspaceName: { type: string }
        workspaceSlug: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        dueDatetime:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        objectiveCount: { type: integer, minimum: 0 }
        relevance:
          type: number
          description: Deterministic fused score (text rank fused with recency, exact display id and title
            first); not a raw engine score.
        snippet:
          oneOf:
            - type: string
            - type: 'null'
        matchedTerms:
          type: array
          items: { type: string }
        matchedIn:
          type: array
          items: { $ref: '#/components/schemas/MissionSearchMatchKind' }
    SearchMissionsResponseV2:
      type: object
      required: [ version, results, appliedFilters, totalMatchedBeforeLimit, workspaceCounts ]
      properties:
        version: { const: 2 }
        results:
          type: array
          items: { $ref: '#/components/schemas/MissionSearchResultV2' }
        appliedFilters: { $ref: '#/components/schemas/MissionSearchAppliedFilters' }
        totalMatchedBeforeLimit: { type: integer, minimum: 0 }
        workspaceCounts:
          type: array
          items: { $ref: '#/components/schemas/MissionSearchWorkspaceCount' }
    MissionSearchV1Response:
      type: object
      required: [ missions ]
      properties:
        missions:
          type: array
          items: { $ref: '#/components/schemas/MissionDto' }
    SearchMatch:
      type: object
      required:
        [
          entityType,
          id,
          displayId,
          title,
          objectiveId,
          objectiveState,
          relevance,
          snippet,
          matchedTerms,
          createdAt,
          updatedAt
        ]
      properties:
        entityType:
          type: string
          enum: [ objective, delivery ]
        id: { type: string }
        displayId:
          description: The objective display id; null for a delivery.
          oneOf:
            - type: string
            - type: 'null'
        title:
          type: string
          description: Objective title, or the delivery's first line.
        objectiveId:
          oneOf:
            - type: string
            - type: 'null'
        objectiveState:
          oneOf:
            - $ref: '#/components/schemas/ObjectiveState'
            - type: 'null'
        relevance: { type: number }
        snippet:
          oneOf:
            - type: string
            - type: 'null'
        matchedTerms:
          type: array
          items: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    SearchResultV3:
      allOf:
        - $ref: '#/components/schemas/MissionSearchResultV2'
        - type: object
          required: [ anchorOnly, matches, matchCounts ]
          properties:
            anchorOnly:
              type: boolean
              description: True when nothing on the mission record itself matched; it only anchors child matches.
            matches:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/SearchMatch' }
            matchCounts:
              type: object
              description: Matching documents for this mission before `matchesPerResult` capping.
              required: [ objective, delivery, event ]
              properties:
                objective: { type: integer, minimum: 0 }
                delivery: { type: integer, minimum: 0 }
                event: { type: integer, minimum: 0 }
    SearchAppliedFiltersV3:
      allOf:
        - $ref: '#/components/schemas/MissionSearchAppliedFilters'
        - type: object
          required: [ entityTypes, objectiveStates, matchesPerResult ]
          properties:
            entityTypes:
              type: array
              items:
                type: string
                enum: [ mission, objective, delivery ]
            objectiveStates:
              type: array
              items: { $ref: '#/components/schemas/ObjectiveState' }
            matchesPerResult: { type: integer, minimum: 1, maximum: 10 }
    SearchResponseV3:
      type: object
      required:
        [
          version,
          results,
          appliedFilters,
          totalMatchedBeforeLimit,
          entityCounts,
          workspaceCounts,
          truncatedCandidates
        ]
      properties:
        version: { const: 3 }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResultV3' }
        appliedFilters: { $ref: '#/components/schemas/SearchAppliedFiltersV3' }
        totalMatchedBeforeLimit: { type: integer, minimum: 0 }
        entityCounts:
          type: object
          required: [ mission, objective, delivery, event ]
          properties:
            mission: { type: integer, minimum: 0 }
            objective: { type: integer, minimum: 0 }
            delivery: { type: integer, minimum: 0 }
            event: { type: integer, minimum: 0 }
        workspaceCounts:
          type: array
          items: { $ref: '#/components/schemas/MissionSearchWorkspaceCount' }
        truncatedCandidates:
          type: boolean
          description: True when a workspace hit the 500-document candidate cap; counts are then lower bounds.
    CreateMissionBody:
      type: object
      required: [ projectId ]
      description: >-
        At least one of `title`, `firstObjective` and `objectives` must carry text (400 otherwise).
        `objectives` wins over `firstObjective`; the first objective is created `draft`, the rest
        `future`.
      properties:
        projectId:
          type: string
          description: Target project UUID; requires `mission:create` there.
        title:
          type: string
          description: Trimmed. When blank or omitted the mission is titled from the first instruction and a
            better title is generated asynchronously.
        priority:
          $ref: '#/components/schemas/MissionPriority'
          description: Defaults to `normal`.
        dueDatetime:
          description: >-
            Checked only with `Date.parse` (400 when unparsable). SQLite stores only the canonical
            `YYYY-MM-DDTHH:mm:ss.sssZ` form (other text answers 409 `Database constraint violation.`);
            Postgres normalizes it. Null or omitted leaves it unset.
          oneOf:
            - type: string
            - type: 'null'
        statusId:
          type: string
          description: A live status of the project (409 otherwise); omitted uses the project's default status.
        assignedWorkspaceUserId:
          description: >-
            An active member of the project's workspace (400 otherwise), or null for unassigned.
            Omitted assigns the creator, except for a project_automation token, which leaves the
            mission unassigned.
          oneOf:
            - type: string
            - type: 'null'
        firstObjective:
          type: string
        objectives:
          type: array
          items:
            type: object
            required: [ objective ]
            properties:
              objective:
                type: string
                description: Instruction text; must not be blank.
              title:
                oneOf:
                  - type: string
                  - type: 'null'
              autoAdvance:
                type: boolean
                description: Deprecated queue hint; defaults to false.
              agent:
                description: Explicit launch agent; omitted keeps project launch-preference defaulting.
                oneOf:
                  - type: string
                  - type: 'null'
              model:
                description: Requires a non-empty `agent` (400 `validation_error` otherwise).
                oneOf:
                  - type: string
                  - type: 'null'
              resourceKey:
                oneOf:
                  - type: string
                  - type: 'null'
        tagIds:
          type: array
          description: Live tags of the project (400 otherwise).
          items: { type: string }
    UpdateMissionBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        title:
          type: string
          description: Trimmed; must not be blank.
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
        projectId:
          type: string
          description: >-
            Move to another live project of the same workspace (404 otherwise). The status maps to
            `statusId` if given, else the target's status with the same key, then the same name, then
            the target's default (409 when none).
        statusId:
          type: string
          description: A live status of the (target) project (409 otherwise). A real change moves the mission
            to the top of the column.
        assignedWorkspaceUserId:
          description: An active member of the mission's workspace (400 otherwise); null or blank unassigns.
          oneOf:
            - type: string
            - type: 'null'
        notes:
          description: Blank or null clears them.
          oneOf:
            - type: string
            - type: 'null'
        branchOverride:
          description: Pin the next launch's branch; blank or null clears the pin.
          oneOf:
            - type: string
            - type: 'null'
        worktreePreference:
          oneOf:
            - $ref: '#/components/schemas/MissionWorktreePreference'
            - type: 'null'
        allowParallelObjectives: { type: boolean }
        resetActiveBranch:
          type: boolean
          description: Only `true` acts; it clears the prepared branch and its observations (400 when none is
            prepared).
        tagIds:
          type: array
          description: Replaces the mission's tags; each must be a live tag of its project (400 otherwise).
            `[]` clears them.
          items: { type: string }
        dueDatetime:
          description: >-
            Checked only with `Date.parse` (400 when unparsable); SQLite accepts only the canonical
            `YYYY-MM-DDTHH:mm:ss.sssZ` form (409 otherwise). Null clears it. The linked schedule is
            unchanged.
          oneOf:
            - type: string
            - type: 'null'
    ObjectiveList:
      type: array
      items: { $ref: '#/components/schemas/ObjectiveDto' }
    ReorderFutureObjectivesBody:
      type: object
      required: [ orderedObjectiveIds ]
      properties:
        orderedObjectiveIds:
          type: array
          uniqueItems: true
          description: Objective UUIDs, each a `future` objective of the mission (400 otherwise), top to bottom.
          items: { type: string }
    MissionEventActorDto:
      type: object
      required: [ workspaceUserId, displayName, handle, avatarUrl ]
      properties:
        workspaceUserId: { type: string }
        displayName: { type: string }
        handle:
          oneOf:
            - type: string
            - type: 'null'
        avatarUrl:
          oneOf:
            - type: string
            - type: 'null'
    MissionEventDto:
      type: object
      required:
        [
          id,
          missionId,
          objectiveId,
          type,
          phase,
          summary,
          source,
          actorWorkspaceUserId,
          actor,
          externalUrl,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        type:
          type: string
          description: >-
            `mission_events.type`: update, user_follow_up, alert, discussion_summary, decision, ask,
            answer, permission_request, delivery, execution_requested, awaiting_approval,
            status_change. Clients render unknown values neutrally.
        phase:
          oneOf:
            - type: string
            - type: 'null'
        summary: { type: string }
        source: { type: string }
        actorWorkspaceUserId:
          oneOf:
            - type: string
            - type: 'null'
        actor:
          oneOf:
            - $ref: '#/components/schemas/MissionEventActorDto'
            - type: 'null'
        externalUrl:
          oneOf:
            - type: string
            - type: 'null'
        deliveryId:
          description: Present only on `delivery` events; null when the payload names no delivery.
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
    MissionEventList:
      type: array
      items: { $ref: '#/components/schemas/MissionEventDto' }
    HumanActionCategory:
      type: string
      enum: [ environment, database, deployment, codegen, packaging, external_service, other ]
    HumanActionV1:
      type: object
      additionalProperties: false
      required: [ id, action, category, source ]
      properties:
        id: { type: string }
        action: { type: string }
        reason: { type: string }
        category: { $ref: '#/components/schemas/HumanActionCategory' }
        blocking: { type: boolean }
        command: { type: string }
        verify: { type: string }
        link: { type: string }
        source:
          type: string
          enum: [ agent, deterministic_rule ]
        sourceRef: { type: string }
    TradeoffMadeV1:
      type: object
      additionalProperties: false
      required: [ id, decision, alternativesConsidered, rationale, source ]
      properties:
        id: { type: string }
        decision: { type: string }
        alternativesConsidered:
          type: array
          maxItems: 6
          items: { type: string }
        rationale: { type: string }
        impact: { type: string }
        source: { const: agent }
        sourceRef: { type: string }
    DeferredWorkV1:
      type: object
      additionalProperties: false
      required: [ id, title, change, location, doneWhen ]
      properties:
        id:
          type: string
          description: '`deferred-work-<index>-<digest>`, stable per delivery.'
        title: { type: string, maxLength: 80 }
        change: { type: string, maxLength: 400 }
        location: { type: string, maxLength: 200 }
        doneWhen: { type: string, maxLength: 200 }
    DeliveryAgentReportV1:
      type: object
      additionalProperties: false
      required: [ humanActions, tradeoffsMade, knownRisks, deferredWork, assumptions ]
      properties:
        humanActions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/HumanActionV1' }
        tradeoffsMade:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/TradeoffMadeV1' }
        knownRisks:
          type: array
          maxItems: 12
          items: { type: string }
        deferredWork:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/DeferredWorkV1' }
        assumptions:
          type: array
          maxItems: 12
          items: { type: string }
    DeliveryPresentationV1:
      type: object
      additionalProperties: false
      required:
        [
          status,
          markdown,
          humanActions,
          tradeoffsMade,
          knownRisks,
          deferredWork,
          assumptions,
          generatedBy
        ]
      properties:
        status:
          type: string
          enum: [ deterministic, pending, composed, fallback ]
        markdown: { type: string }
        humanActions:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/HumanActionV1' }
        tradeoffsMade:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/TradeoffMadeV1' }
        knownRisks:
          type: array
          maxItems: 12
          items: { type: string }
        deferredWork:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/DeferredWorkV1' }
        assumptions:
          type: array
          maxItems: 12
          items: { type: string }
        generatedBy:
          type: string
          enum: [ deterministic, gemini ]
        generatedAt: { type: string }
        model: { type: string }
    DeliveryReportPayloadV1:
      type: object
      additionalProperties: false
      description: >-
        The normalized versioned report. A missing or malformed stored report is synthesized
        deterministically at read time; the raw payload is never exposed.
      required: [ schemaVersion, agentReport, presentation ]
      properties:
        schemaVersion: { const: 1 }
        agentReport: { $ref: '#/components/schemas/DeliveryAgentReportV1' }
        warnings:
          type: array
          maxItems: 12
          items: { type: string }
        presentation: { $ref: '#/components/schemas/DeliveryPresentationV1' }
    HumanActionResolutionDto:
      type: object
      required: [ status, resolvedAt, resolvedByWorkspaceUserId, outcome, outcomeRef ]
      properties:
        status:
          type: string
          enum: [ done, dismissed ]
        resolvedAt: { $ref: '#/components/schemas/DateTime' }
        resolvedByWorkspaceUserId:
          oneOf:
            - type: string
            - type: 'null'
        outcome:
          oneOf:
            - type: string
              enum: [ mission_created, objective_added ]
            - type: 'null'
        outcomeRef:
          oneOf:
            - type: string
            - type: 'null'
    DeliveryDeferredWorkItemDto:
      type: object
      required: [ actionId, title, change, location, doneWhen, resolution ]
      properties:
        actionId:
          type: string
          description: The item's `DeferredWorkV1.id`, the `actionId` of the resolution routes.
        title: { type: string }
        change: { type: string }
        location: { type: string }
        doneWhen: { type: string }
        resolution:
          oneOf:
            - $ref: '#/components/schemas/HumanActionResolutionDto'
            - type: 'null'
    DeliveryDto:
      type: object
      required:
        [
          id,
          missionId,
          objectiveId,
          sessionId,
          summary,
          verificationSummary,
          followUpNotes,
          report,
          deliveredAt,
          agentIdentifier,
          modelIdentifier,
          deferredWorkItems
        ]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        objectiveId: { type: string, format: uuid }
        sessionId:
          oneOf:
            - type: string
            - type: 'null'
        summary: { type: string }
        verificationSummary:
          oneOf:
            - type: string
            - type: 'null'
        followUpNotes:
          oneOf:
            - type: string
            - type: 'null'
        report: { $ref: '#/components/schemas/DeliveryReportPayloadV1' }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        agentIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        modelIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        deferredWorkItems:
          type: array
          description: One entry per `report.presentation.deferredWork` item, in order.
          items: { $ref: '#/components/schemas/DeliveryDeferredWorkItemDto' }
    MissionDeliveriesDto:
      type: object
      required: [ items, total, limit ]
      properties:
        items:
          type: array
          maxItems: 200
          description: Newest first.
          items: { $ref: '#/components/schemas/DeliveryDto' }
        total:
          type: integer
          minimum: 0
          description: Matching deliveries before the cap.
        limit:
          type: integer
          description: The applied cap (200).
    MissionSummaryStatus:
      type: string
      enum: [ pending, composed, fallback ]
    MissionSummaryRiskDto:
      type: object
      required: [ deliveryId, objectiveId, deliveredAt, text ]
      properties:
        deliveryId: { type: string }
        objectiveId: { type: string }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        text: { type: string }
    MissionSummarySuggestionDto:
      description: A deferred-work suggestion projected at read time; dismissed items are omitted,
        promoted ones reduced to identity, title and resolution.
      oneOf:
        - type: object
          required:
            [
              deliveryId,
              objectiveId,
              deliveredAt,
              actionId,
              title,
              state,
              change,
              location,
              doneWhen,
              resolution
            ]
          properties:
            deliveryId: { type: string }
            objectiveId: { type: string }
            deliveredAt: { $ref: '#/components/schemas/DateTime' }
            actionId: { type: string }
            title: { type: string }
            state: { const: open }
            change: { type: string }
            location: { type: string }
            doneWhen: { type: string }
            resolution: { type: 'null' }
        - type: object
          required: [ deliveryId, objectiveId, deliveredAt, actionId, title, state, resolution ]
          properties:
            deliveryId: { type: string }
            objectiveId: { type: string }
            deliveredAt: { $ref: '#/components/schemas/DateTime' }
            actionId: { type: string }
            title: { type: string }
            state: { const: resolved }
            resolution: { $ref: '#/components/schemas/HumanActionResolutionDto' }
    MissionSummaryDto:
      type: object
      required:
        [
          missionId,
          revision,
          status,
          headline,
          summary,
          risks,
          suggestions,
          sourceDeliveryId,
          generatedBy,
          generatedAt,
          model
        ]
      properties:
        missionId: { type: string }
        revision: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/MissionSummaryStatus' }
        headline:
          type: string
          description: One sentence; empty in the first pending shell.
        summary:
          type: string
          description: Markdown, two to five sentences; empty in the first pending shell.
        risks:
          type: array
          items: { $ref: '#/components/schemas/MissionSummaryRiskDto' }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/MissionSummarySuggestionDto' }
        sourceDeliveryId:
          oneOf:
            - type: string
            - type: 'null'
        generatedBy:
          type: string
          enum: [ deterministic, gemini ]
        generatedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        model:
          oneOf:
            - type: string
            - type: 'null'
    MissionSummaryActionDto:
      type: object
      required: [ deliveryId, objectiveId, actionId, deliveredAt, action, category, source ]
      properties:
        deliveryId: { type: string }
        objectiveId:
          type: string
          description: May name a deleted objective.
        actionId: { type: string }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        action: { type: string }
        reason: { type: string }
        category: { $ref: '#/components/schemas/HumanActionCategory' }
        blocking: { type: boolean }
        command: { type: string }
        verify: { type: string }
        link: { type: string }
        source:
          type: string
          enum: [ agent, deterministic_rule ]
        sourceRef: { type: string }
    MissionSummarySourceDto:
      type: object
      required: [ objectiveId, deliveryId, deliveredAt ]
      properties:
        objectiveId: { type: string }
        deliveryId: { type: string }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
    MissionSummaryEvidenceDto:
      type: object
      required: [ actions, sources, totals, truncated ]
      properties:
        actions:
          type: array
          maxItems: 100
          description: Blocking first, then newest delivery first, then report order.
          items: { $ref: '#/components/schemas/MissionSummaryActionDto' }
        sources:
          type: array
          maxItems: 100
          description: Newest first, one per objective, deleted objectives included.
          items: { $ref: '#/components/schemas/MissionSummarySourceDto' }
        totals:
          type: object
          required: [ actions, sources, currentRunDeliveries ]
          properties:
            actions: { type: integer, minimum: 0 }
            sources: { type: integer, minimum: 0 }
            currentRunDeliveries: { type: integer, minimum: 0 }
        truncated:
          type: object
          required: [ actions, sources ]
          properties:
            actions: { type: boolean }
            sources: { type: boolean }
    MissionSummaryResponse:
      oneOf:
        - type: object
          required: [ eligible, summary, evidence, watermark, seenAt ]
          properties:
            eligible: { const: false }
            summary: { type: 'null' }
            evidence: { type: 'null' }
            watermark: { type: 'null' }
            seenAt: { type: 'null' }
        - type: object
          required: [ eligible, summary, evidence, watermark, seenAt ]
          properties:
            eligible: { const: true }
            summary:
              oneOf:
                - $ref: '#/components/schemas/MissionSummaryDto'
                - type: 'null'
            evidence: { $ref: '#/components/schemas/MissionSummaryEvidenceDto' }
            watermark:
              description: Newest `deliveredAt` of the current-run deliveries drawn on, or `createdAt` of an open
                question or choice request.
              oneOf:
                - $ref: '#/components/schemas/DateTime'
                - type: 'null'
            seenAt:
              oneOf:
                - $ref: '#/components/schemas/DateTime'
                - type: 'null'
    MarkMissionSummarySeenBody:
      type: object
      required: [ watermark ]
      properties:
        watermark:
          type: string
          description: A `watermark` from a summary read; any `Date.parse`-able text, stored normalized to UTC.
    MissionSummarySeenResponse:
      type: object
      required: [ seenAt ]
      properties:
        seenAt: { $ref: '#/components/schemas/DateTime' }
    ArtifactDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          sessionId,
          deliveryId,
          type,
          label,
          contentText,
          contentJson,
          externalUrl,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        objectiveId:
          oneOf:
            - type: string
            - type: 'null'
        sessionId:
          oneOf:
            - type: string
            - type: 'null'
        deliveryId:
          oneOf:
            - type: string
            - type: 'null'
        type:
          type: string
          description: test_results, next_steps, note, url, decision, migration, or a namespaced (dotted)
            extension value.
        label: { type: string }
        contentText:
          oneOf:
            - type: string
            - type: 'null'
        contentJson:
          description: Structured content, null when none.
          $ref: '#/components/schemas/JsonValue'
        externalUrl:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    ArtifactList:
      type: array
      items: { $ref: '#/components/schemas/ArtifactDto' }
    CreateArtifactBody:
      type: object
      required: [ type, label ]
      description: At least one of `contentText` and `externalUrl` must be non-blank (400).
      properties:
        type:
          type: string
          description: Trimmed; one of the six core types or a dotted namespaced value (400 otherwise; a
            namespaced value the deployment's CHECK constraint lacks answers 409).
        label:
          type: string
          description: Trimmed; must not be blank.
        contentText:
          description: Stored verbatim; blank stores null.
          oneOf:
            - type: string
            - type: 'null'
        externalUrl:
          description: An http(s) URL (400 otherwise); blank stores null.
          oneOf:
            - type: string
            - type: 'null'
        objectiveId:
          description: Objective UUID or display id on this mission (404 otherwise). Ignored when `sessionKey`
            is given.
          oneOf:
            - type: string
            - type: 'null'
        sessionId:
          description: Agent session UUID on this mission (404 otherwise); supplies `objectiveId` when that is
            absent.
          oneOf:
            - type: string
            - type: 'null'
        sessionKey:
          description: A live session key of this mission; stamps `sessionId` and `objectiveId`. An unknown or
            ended key answers 401, another mission's key 400.
          oneOf:
            - type: string
            - type: 'null'
    UpdateArtifactBody:
      type: object
      required: [ expectedRevision ]
      description: >-
        At least one of `label`, `contentText` and `externalUrl` (400 otherwise). The artifact must
        keep text, structured content or a URL (400).
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: The artifact's current revision; a different value answers 409.
        label:
          type: string
          description: Trimmed; must not be blank.
        contentText:
          description: Blank or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        externalUrl:
          description: An http(s) URL (400 otherwise); blank or null clears it.
          oneOf:
            - type: string
            - type: 'null'
    SharedContextEntryDto:
      type: object
      required: [ id, missionId, key, value, valueKind, tags, updatedAt, revision ]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        key: { type: string }
        value:
          description: The parsed JSON object or array when `valueKind` is `json`, else the stored string.
          $ref: '#/components/schemas/JsonValue'
        valueKind:
          type: string
          enum: [ string, json ]
        tags:
          type: array
          description: Always empty from REST.
          items: { type: string }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    SharedContextEntryList:
      type: array
      items: { $ref: '#/components/schemas/SharedContextEntryDto' }
    UpsertSharedContextBody:
      type: object
      required: [ key, value ]
      properties:
        key:
          type: string
          description: Trimmed; must not be blank.
        value:
          description: >-
            Any JSON value. An object or array is stored as JSON; any other value, `null` included, is
            stored as its string form (`5` reads back as `"5"`, `null` as `"null"`).
          $ref: '#/components/schemas/JsonValue'
    FileChangeDto:
      type: object
      required: [ id, missionId, objectiveId, resourceKey, filePath, source, observedAt, hookHealth ]
      properties:
        id: { type: string }
        missionId: { type: string }
        objectiveId: { type: string }
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        filePath:
          type: string
          description: Repository-relative path.
        source:
          description: '`declared_edit` (a native observation), `agent_declared` (declaration only), or null
            (unknown provenance).'
          oneOf:
            - type: string
              enum: [ declared_edit, agent_declared ]
            - type: 'null'
        observedAt: { $ref: '#/components/schemas/DateTime' }
        hookHealth:
          oneOf:
            - type: string
            - type: 'null'
    MissionFileChangesDto:
      type: object
      additionalProperties: false
      required: [ items, total, limit ]
      properties:
        items:
          type: array
          maxItems: 200
          description: Newest observation first. A truncated page must not be partitioned by objective.
          items: { $ref: '#/components/schemas/FileChangeDto' }
        total: { type: integer, minimum: 0, description: Matching rows before the cap. }
        limit: { type: integer, description: The applied cap (200). }
    CaptureHealthEntryDto:
      type: object
      required: [ code, firstAt, lastAt ]
      properties:
        code: { type: string }
        firstAt: { $ref: '#/components/schemas/DateTime' }
        lastAt: { $ref: '#/components/schemas/DateTime' }
    CaptureSessionDto:
      type: object
      required: [ sessionId, startedAt, bindingState, callbackObservedAt, health ]
      properties:
        sessionId: { type: string }
        startedAt: { $ref: '#/components/schemas/DateTime' }
        bindingState:
          type: string
          enum: [ bound, unbound, unknown ]
        callbackObservedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        health:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/CaptureHealthEntryDto' }
    ObjectiveFileChangesDto:
      type: object
      required: [ scope, missionId, objectiveId, items, total, limit, truncated, capture ]
      properties:
        scope: { const: server_objective }
        missionId: { type: string }
        objectiveId: { type: string }
        items:
          type: array
          maxItems: 200
          description: Ordered by resource key then path.
          items: { $ref: '#/components/schemas/FileChangeDto' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        truncated: { type: boolean }
        capture:
          type: object
          required: [ sessions, warnings ]
          properties:
            sessions:
              type: array
              items: { $ref: '#/components/schemas/CaptureSessionDto' }
            warnings:
              type: array
              items:
                type: string
                enum: [ unbound, bound_no_callback, unknown_binding, tool_activity_uncaptured ]
    ScheduleWeekDayDto:
      type: object
      required: [ dayNum, times ]
      properties:
        dayNum: { type: integer, minimum: 0, maximum: 6 }
        times:
          type: array
          description: '`HH:mm` or `HH:mm:ss`, local to the schedule timezone.'
          items: { type: string }
    ScheduleDto:
      type: object
      required:
        [
          id,
          workspaceId,
          name,
          periodType,
          periodInterval,
          weeksOfMonth,
          daysOfMonth,
          daysOfWeek,
          timezone,
          startDate,
          nextStatusKey,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name:
          oneOf:
            - type: string
            - type: 'null'
        periodType:
          type: string
          enum: [ d, w, m ]
        periodInterval: { type: integer, minimum: 1 }
        weeksOfMonth:
          type: array
          items: { type: integer, minimum: 1, maximum: 5 }
        daysOfMonth:
          type: array
          description: 1-31, or 32 for the last day of the month.
          items: { type: integer, minimum: 1, maximum: 32 }
        daysOfWeek:
          type: array
          items: { $ref: '#/components/schemas/ScheduleWeekDayDto' }
        timezone: { type: string }
        startDate:
          oneOf:
            - type: string
            - type: 'null'
        nextStatusKey:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    ScheduleInput:
      type: object
      required: [ periodType, periodInterval, timezone ]
      description: >-
        Validated by the scheduling engine; a rule it cannot evaluate answers 400 `validation_error`
        (for example, daily and weekly schedules require `daysOfWeek`).
      properties:
        name:
          oneOf:
            - type: string
            - type: 'null'
        periodType:
          type: string
          enum: [ d, w, m ]
        periodInterval: { type: integer, minimum: 1 }
        weeksOfMonth:
          type: array
          items: { type: integer }
        daysOfMonth:
          type: array
          items: { type: integer }
        daysOfWeek:
          type: array
          items: { $ref: '#/components/schemas/ScheduleWeekDayDto' }
        timezone:
          type: string
          description: IANA timezone.
        startDate:
          oneOf:
            - type: string
            - type: 'null'
        nextStatusKey:
          description: A live status key of the mission's project (409 `validation_error` otherwise); null
            uses the project default.
          oneOf:
            - type: string
            - type: 'null'
    MissionScheduleDto:
      type: object
      required: [ dueDatetime, schedule ]
      properties:
        dueDatetime:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        schedule:
          oneOf:
            - $ref: '#/components/schemas/ScheduleDto'
            - type: 'null'
    PreviewScheduleBody:
      type: object
      required: [ schedule ]
      properties:
        schedule: { $ref: '#/components/schemas/ScheduleInput' }
        itemDueDatetime:
          description: Current due date used as the recurrence anchor.
          oneOf:
            - type: string
            - type: 'null'
    SchedulePreviewDto:
      type: object
      required: [ dueDatetime ]
      properties:
        dueDatetime: { $ref: '#/components/schemas/DateTime' }
    MissionBranchListDto:
      type: object
      required: [ branches, current ]
      properties:
        branches:
          type: array
          maxItems: 1
          description: The current branch alone, or empty; full ref lists come from the desktop local-target
            bridge.
          items: { type: string }
        current:
          description: The prepared branch, else the pinned override, else null.
          oneOf:
            - type: string
            - type: 'null'
    BranchActionBody:
      type: object
      required: [ action ]
      properties:
        action:
          type: string
          enum: [ integrate, commit, push_parent, publish ]
        message:
          type: string
          description: Commit message for `commit`; the target refuses an empty one
            (`BRANCH_COMMIT_MESSAGE_REQUIRED`).
        resourceKey:
          type: string
          description: Resource to act on; blank uses the project primary.
        confirmBusy:
          type: boolean
          description: Only `true` proceeds while an objective of the mission is executing.
        clientExecuted:
          type: boolean
          description: Only `true` means git already ran on the client; the server records `summary` only.
        summary:
          type: string
          description: Required (non-blank) when `clientExecuted` is true.
    GenerateCommitMessageBody:
      type: object
      properties:
        diff:
          type: string
          description: Diff text gathered by the client. Required in practice; without it the route answers
            409 `LOCAL_FILESYSTEM_UNAVAILABLE`.
    GenerateCommitMessageResultDto:
      type: object
      required: [ message ]
      properties:
        message: { type: string }
    BranchPreparedBody:
      type: object
      required: [ branchAutomation ]
      properties:
        requestId:
          description: The execution request the branch was prepared for; stamps it and records the branch on
            its objective (404 when unknown).
          oneOf:
            - type: string
            - type: 'null'
        branchAutomation:
          type: object
          required: [ branchName, baseBranch, worktreePath, resourceKey, action ]
          properties:
            branchName: { type: string, description: Must not be blank. }
            baseBranch: { type: string, description: Must not be blank. }
            worktreePath: { type: string, description: Must not be blank. }
            resourceKey: { type: string, description: Must not be blank. }
            action:
              type: string
              enum: [ create, reuse, new_cycle ]
            cycle:
              type: number
              description: Defaults to 1.
            isolated:
              type: boolean
              description: Only `true` marks a per-objective branch, which leaves the mission's active branch
                alone.
    ForgetTerminalSessionBody:
      type: object
      required: [ providerSessionId ]
      properties:
        providerSessionId:
          type: string
          description: Must not be blank.
        executionRequestId:
          description: Narrows the match to one execution request.
          oneOf:
            - type: string
            - type: 'null'
    ForgetTerminalSessionResultDto:
      type: object
      required: [ forgotten, executionRequestId ]
      properties:
        forgotten:
          type: boolean
          description: False when no execution request of the mission maps that session.
        executionRequestId:
          oneOf:
            - type: string
            - type: 'null'
    CreateObjectiveBody:
      type: object
      required: [ missionId, instructionText ]
      properties:
        missionId:
          type: string
          description: Mission UUID or display id; requires `objective:update` there.
        instructionText:
          type: string
          description: Trimmed; may be blank only for a `draft` or `future` objective.
        title:
          description: Blank or omitted derives a title from the instruction and generates a better one
            asynchronously.
          oneOf:
            - type: string
            - type: 'null'
        state:
          $ref: '#/components/schemas/ObjectiveState'
          description: Defaults to `draft`; a `draft` request becomes `future` when the mission already has a
            draft.
        autoAdvance:
          type: boolean
          description: Deprecated queue hint; defaults to false.
        resourceKey:
          description: A resource key linked to the mission's project (409 `project_resource_key_not_found`
            otherwise); blank or null inherits the primary.
          oneOf:
            - type: string
            - type: 'null'
    UpdateObjectiveBody:
      type: object
      description: Partial update; a body with no recognized member returns the objective unchanged.
      properties:
        instructionText:
          type: string
          description: >-
            Trimmed; may be blank only when the resulting state is `draft` or `future`. Refused (400)
            once the objective is `executing`, `pending_delivery` or `complete`.
        title:
          description: Blank or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        state:
          $ref: '#/components/schemas/ObjectiveState'
          description: >-
            `complete` cannot move back to `future` (400). Moving an executed objective back to
            `draft` reopens it (a new run); leaving an active state dequeues it and clears its active
            execution requests.
        autoAdvance:
          type: boolean
          description: Deprecated; adds the objective to, or removes it from, its mission's Run Queue.
        position:
          type: integer
          minimum: 0
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        model:
          oneOf:
            - type: string
            - type: 'null'
        reasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        launchConfigOverride:
          description: Saves (or, with null, removes) the any-target override for `launchConfigAgent`.
          oneOf:
            - $ref: '#/components/schemas/AgentLaunchConfigInput'
            - type: 'null'
        launchConfigAgent:
          type: string
          description: Required (non-blank) with `launchConfigOverride` (400 otherwise).
    LaunchObjectiveBody:
      type: object
      required: [ agent ]
      properties:
        agent:
          type: string
          description: Agent key; must not be blank. `manual` answers 400 `manual_agent_not_launchable`.
        model:
          oneOf:
            - type: string
            - type: 'null'
        reasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        executionTargetId:
          description: >-
            An eligible target of the project for the caller (reachable, primary resource connected;
            400 `execution_target_not_eligible` otherwise). Omitted or blank uses the project's
            selected target.
          oneOf:
            - type: string
            - type: 'null'
        launchConfigOverride:
          description: Saved onto the objective for this target (or `*`) and agent before the request is queued.
          oneOf:
            - $ref: '#/components/schemas/AgentLaunchConfigInput'
            - type: 'null'
    ObjectivePromptDto:
      type: object
      required: [ objectiveId, missionId, prompt ]
      properties:
        objectiveId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        prompt: { type: string }
    ObjectiveLaunchCommandDto:
      type: object
      required: [ objectiveId, missionId, command ]
      properties:
        objectiveId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        command:
          type: string
          description: A paste-ready `ovld launch` command line.
    ObjectiveEffectiveLaunchConfigDto:
      type: object
      required: [ objectiveId, missionId, executionTargetId, launchConfig, source ]
      properties:
        objectiveId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        executionTargetId:
          description: The target used to resolve target- and resource-scoped defaults.
          oneOf:
            - type: string
            - type: 'null'
        launchConfig: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
        source:
          type: string
          enum: [ objective, resource_source, user_target, workspace, none ]
    ResolveHumanActionBody:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ done, dismissed ]
        outcome:
          type: string
          enum: [ mission_created, objective_added ]
          description: Only with `status` `done` (400 otherwise).
        outcomeRef:
          type: string
          maxLength: 64
          description: Display id of the created mission or objective; requires `outcome` and must not be
            blank (400).
    ActivityFeedMissionObjectiveDto:
      type: object
      required: [ objectiveId, displayId, title, state, position, assignedAgent, autoAdvance, blocked ]
      properties:
        objectiveId: { type: string, format: uuid }
        displayId:
          type: string
          description: The objective display id (the objective UUID when it has no display key).
        title:
          oneOf:
            - type: string
            - type: 'null'
        state: { $ref: '#/components/schemas/ObjectiveState' }
        position: { type: integer, minimum: 0 }
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        autoAdvance: { type: boolean }
        blocked:
          type: boolean
          description: True while an open question or choice request waits on a human for this objective.
    ActivityFeedMissionItemDto:
      type: object
      description: >-
        A mission card: live work (`mission_run`) or a mission whose most recent live delivery falls
        in the page's two-week window (`mission_delivered`). Chrome fields describe the primary
        objective: the launching one, else the oldest active one, else the objective behind the latest
        delivery.
      required:
        [
          id,
          kind,
          occurredAt,
          workspaceId,
          workspaceName,
          projectId,
          projectName,
          projectColor,
          missionId,
          missionDisplayId,
          missionTitle,
          objectiveId,
          objectiveDisplayId,
          createdByKind,
          createdByAgent,
          runState,
          objectives,
          activeObjectiveIds,
          objectiveTitle,
          instructionPreview,
          agentIdentifier,
          modelIdentifier,
          branch,
          resourceKey,
          startedAt,
          latestEventSummary,
          latestEventAt
        ]
      properties:
        id:
          type: string
          description: '`mission:<missionId>`.'
        kind:
          type: string
          enum: [ mission_run, mission_delivered ]
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        workspaceId: { type: string }
        workspaceName: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        projectColor:
          oneOf:
            - type: string
            - type: 'null'
        missionId: { type: string }
        missionDisplayId: { type: string }
        missionTitle: { type: string }
        objectiveId:
          oneOf:
            - type: string
            - type: 'null'
        objectiveDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        runState:
          type: string
          enum: [ launching, executing, delivered ]
        objectives:
          type: array
          description: Every objective of the mission, in mission-panel display order.
          items: { $ref: '#/components/schemas/ActivityFeedMissionObjectiveDto' }
        activeObjectiveIds:
          type: array
          description: Objectives that are launching, executing or pending delivery; empty for `delivered`.
          items: { type: string }
        objectiveTitle:
          oneOf:
            - type: string
            - type: 'null'
        instructionPreview:
          type: string
          description: Server-truncated instruction preview of the primary objective.
        agentIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        modelIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        startedAt:
          description: Session start, or the execution request's creation while launching; null for `delivered`.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        latestEventSummary:
          oneOf:
            - type: string
            - type: 'null'
        latestEventAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    ActivityFeedQuestionItemDto:
      type: object
      description: An unseen `ask` mission event from the past three days; the agent is blocked on it.
      required:
        [
          id,
          kind,
          occurredAt,
          workspaceId,
          workspaceName,
          projectId,
          projectName,
          projectColor,
          missionId,
          missionDisplayId,
          missionTitle,
          objectiveId,
          objectiveDisplayId,
          createdByKind,
          createdByAgent,
          eventId,
          agentRequestId,
          delivery,
          question,
          agentIdentifier,
          askedAt
        ]
      properties:
        id:
          type: string
          description: '`ask:<eventId>`.'
        kind: { const: blocking_question }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        workspaceId: { type: string }
        workspaceName: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        projectColor:
          oneOf:
            - type: string
            - type: 'null'
        missionId: { type: string }
        missionDisplayId: { type: string }
        missionTitle: { type: string }
        objectiveId:
          oneOf:
            - type: string
            - type: 'null'
        objectiveDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        eventId: { type: string }
        agentRequestId:
          oneOf:
            - type: string
            - type: 'null'
        delivery:
          type: object
          required: [ mode ]
          properties:
            mode:
              type: string
              enum: [ latch, read_only ]
        question:
          type: string
          description: Server-truncated question text.
        agentIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        askedAt: { $ref: '#/components/schemas/DateTime' }
    ActivityFeedDto:
      type: object
      required: [ items, generatedAt, counts, nextBefore ]
      properties:
        items:
          type: array
          description: >-
            Grouped: launching mission runs, executing mission runs, blocking questions (those three
            capped together), then delivered missions; newest first within each group. A page loaded
            with `before` holds only delivered missions.
          items:
            oneOf:
              - $ref: '#/components/schemas/ActivityFeedMissionItemDto'
              - $ref: '#/components/schemas/ActivityFeedQuestionItemDto'
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        counts:
          type: object
          description: Per-kind totals before truncation.
          required: [ mission_run, blocking_question, mission_delivered ]
          properties:
            mission_run: { type: integer, minimum: 0 }
            blocking_question: { type: integer, minimum: 0 }
            mission_delivered: { type: integer, minimum: 0 }
        nextBefore:
          description: Pass as `before` for the next older two-week delivered window; null when none is older.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    ObjectiveTranscriptItemDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          missionDisplayId,
          missionTitle,
          missionRevision,
          statusType,
          projectName,
          projectColor,
          projectRevision,
          title,
          instructionText,
          state,
          assignedAgent,
          resourceKey,
          createdByKind,
          createdByAgent,
          createdByWorkspaceUserId,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string }
        projectId: { type: string }
        missionId: { type: string }
        missionDisplayId: { type: string }
        missionTitle: { type: string }
        missionRevision: { type: integer, minimum: 1 }
        statusType: { $ref: '#/components/schemas/StatusType' }
        projectName: { type: string }
        projectColor:
          oneOf:
            - type: string
            - type: 'null'
        projectRevision: { type: integer, minimum: 1 }
        title:
          oneOf:
            - type: string
            - type: 'null'
        instructionText: { type: string }
        state: { $ref: '#/components/schemas/ObjectiveState' }
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        createdByWorkspaceUserId:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    ObjectiveTranscriptPageDto:
      type: object
      required: [ items, nextBefore, nextAfter, newestCursor, hasMore ]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ObjectiveTranscriptItemDto' }
        nextBefore:
          description: Cursor for the next older page; set only on a `before`-style read with more rows.
          oneOf:
            - type: string
            - type: 'null'
        nextAfter:
          description: On an `after` read, the cursor to continue from (the last item's, or the given cursor
            when the page is empty); null otherwise.
          oneOf:
            - type: string
            - type: 'null'
        newestCursor:
          description: Cursor of the newest item on the page, or null when it is empty.
          oneOf:
            - type: string
            - type: 'null'
        hasMore:
          type: boolean
          description: Always false for an `ids` read.
    InboxItemDto:
      type: object
      required: [ id, title, objectives, dueDatetime, priority, attachmentCount, createdAt, updatedAt ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        objectives:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string }
        dueDatetime:
          description: >-
            The stored due date, or null. Create and update echo the request's text rather than
            re-reading the row, so on Postgres (which normalizes the stored value) the response can
            differ from a later read.
          oneOf:
            - type: string
            - type: 'null'
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
        attachmentCount: { type: integer, minimum: 0 }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    InboxItemList:
      type: array
      items: { $ref: '#/components/schemas/InboxItemDto' }
    CreateInboxItemBody:
      type: object
      required: [ title, objectives ]
      properties:
        title:
          type: string
          description: Trimmed; must not be blank.
        objectives:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one non-blank instruction (trimmed); non-string items count as blank.
          items: { type: string }
        dueDatetime:
          description: >-
            Checked only with `Date.parse` (400 when unparsable); SQLite accepts only the canonical
            `YYYY-MM-DDTHH:mm:ss.sssZ` form (409 `Database constraint violation.` otherwise). Null
            leaves it unset.
          oneOf:
            - type: string
            - type: 'null'
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
    UpdateInboxItemBody:
      type: object
      description: >-
        Partial update; omitted members keep their stored value and the merged item is validated as on
        create. `title: null` and `objectives: null` also keep the stored value.
      properties:
        title: { type: string }
        objectives:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string }
        dueDatetime:
          oneOf:
            - type: string
            - type: 'null'
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
    PromoteInboxItemBody:
      type: object
      required: [ projectId ]
      properties:
        projectId:
          type: string
          description: Destination project; requires `mission:create` there. Missing or unknown answers 404.
    InboxMissionDto:
      allOf:
        - $ref: '#/components/schemas/MissionDto'
        - type: object
          required: [ projectName, projectColor, reasons ]
          properties:
            projectName: { type: string }
            projectColor:
              oneOf:
                - type: string
                - type: 'null'
            reasons:
              type: array
              description: >-
                Why the mission is listed: `overdue` (due before today, UTC), `due_soon` (due today or
                tomorrow, UTC; exclusive with `overdue`), `agent_next` (agent-authored, status type
                `next`), and the label-only `recent` (created in the past seven days).
              items:
                type: string
                enum: [ overdue, due_soon, agent_next, recent ]
    InboxMissionsResponse:
      type: object
      required: [ generatedAt, missions ]
      properties:
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        missions:
          type: array
          description: Overdue (latest due first), then due soon (soonest first), then agent Next (newest
            first); each slice capped at 60.
          items: { $ref: '#/components/schemas/InboxMissionDto' }
    ProfileDto:
      type: object
      description: The caller's profile (`profiles` row plus metadata projections).
      required:
        [
          userId,
          displayName,
          handle,
          email,
          avatarUrl,
          agentInstructions,
          editorScheme,
          kind,
          authProvider,
          roles,
          createdAt
        ]
      properties:
        userId: { type: string, description: '`profiles.id` (Better Auth user id, not a UUID).' }
        displayName: { type: string }
        handle:
          description: Mirrors the Better Auth account name; read-only here.
          oneOf: [ { type: string }, { type: 'null' } ]
        email:
          description: Mirrors the Better Auth account email; read-only here.
          oneOf: [ { type: string }, { type: 'null' } ]
        avatarUrl:
          description: '`metadata_json.avatarUrl` when a non-blank string (returned as stored), else null.'
          oneOf: [ { type: string }, { type: 'null' } ]
        agentInstructions:
          description: '`metadata_json.agentInstructions`, trimmed, when non-blank; else null.'
          oneOf: [ { type: string }, { type: 'null' } ]
        editorScheme:
          description: '`metadata_json.editorScheme`, trimmed, when non-blank; else null (clients default to
            VS Code).'
          oneOf: [ { type: string }, { type: 'null' } ]
        kind: { type: string, description: 'Open vocabulary (`human`, `service`).' }
        authProvider:
          description: Always `better-auth` from this route (typed nullable in packages/contract).
          oneOf: [ { type: string }, { type: 'null' } ]
        roles:
          type: array
          description: Distinct role keys across the selected organization's authorized workspaces, sorted.
          items: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    UpdateProfileBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        displayName:
          type: string
          description: Trimmed; blank answers 400.
        avatarUrl:
          description: >-
            Trimmed; blank or null clears it. Otherwise must start with `http://`, `https://` or `/` (an
            uploaded image path such as `/api/storage/user-images/…`), else 400.
          oneOf: [ { type: string }, { type: 'null' } ]
        agentInstructions:
          description: Trimmed; blank or null clears it.
          oneOf: [ { type: string }, { type: 'null' } ]
        editorScheme:
          description: Trimmed; blank or null clears it. Not validated against a vocabulary.
          oneOf: [ { type: string }, { type: 'null' } ]
    DefaultProjectPreferenceDto:
      type: object
      required: [ projectId ]
      properties:
        projectId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    SetDefaultProjectBody:
      type: object
      description: >-
        `projectId` is read as `String(projectId ?? '')` and trimmed; blank or absent answers 400
        `projectId is required`. An unknown, foreign or archived project answers 404.
      required: [ projectId ]
      properties:
        projectId: { type: string }
    UserTokenStatus:
      type: string
      enum: [ active, revoked, expired, rotated ]
      description: >-
        The `user_tokens.status` CHECK vocabulary. Lifecycle routes write only `active` and `revoked`;
        an expired token keeps `active` with a past `expiresAt`.
    TokenScope:
      type: string
      enum: [ full, mission_lifecycle, project_automation ]
    UserTokenProjectDto:
      type: object
      required: [ id, name ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The project's current name. }
    UserTokenDto:
      type: object
      description: A personal token as listed to its owner; never the secret or its hash.
      required:
        [
          id,
          label,
          tokenPrefix,
          status,
          scope,
          scopeGrants,
          projects,
          expiresAt,
          lastUsedAt,
          revokedAt,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        tokenPrefix: { type: string, description: 'Non-secret display prefix, `out_…`.' }
        status: { $ref: '#/components/schemas/UserTokenStatus' }
        scope: { $ref: '#/components/schemas/TokenScope' }
        scopeGrants:
          type: array
          description: Active scope grant patterns (RBAC actions); empty for a `full` token.
          items: { type: string }
        projects:
          type: array
          description: >-
            The live projects a `project_automation` token was issued for, by name; empty for other
            scopes and once every selected project is deleted.
          items: { $ref: '#/components/schemas/UserTokenProjectDto' }
        expiresAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        lastUsedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        revokedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
    UserTokenList:
      type: array
      items: { $ref: '#/components/schemas/UserTokenDto' }
    CreateUserTokenBody:
      type: object
      required: [ label ]
      properties:
        label:
          type: string
          description: Trimmed; blank or absent answers 400.
        expiresAt:
          description: >-
            Absent: 90 days from now. `null` or blank: never expires. Otherwise parsed with `new Date()`
            (a number is read as epoch milliseconds); unparseable or not in the future answers 400.
            Stored normalized to ISO-8601 UTC.
          oneOf: [ { type: string }, { type: 'null' } ]
        scope:
          description: Defaults to `full` when absent or null; any other value answers 400.
          oneOf: [ { $ref: '#/components/schemas/TokenScope' }, { type: 'null' } ]
        projectIds:
          type: array
          description: >-
            Required, non-empty and unique when `scope` is `project_automation` (each a 36-character
            hex-and-dash id; 400 otherwise); present with any other scope answers 400. Every project
            must exist (404) and grant the caller `project:read` and `mission:create` (403/404).
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    CreateUserTokenResultDto:
      type: object
      required: [ token, secret ]
      properties:
        token: { $ref: '#/components/schemas/UserTokenDto' }
        secret: { type: string, description: 'The raw `out_…` secret; returned only once.' }
    UpdateUserTokenBody:
      type: object
      required: [ label ]
      properties:
        label:
          type: string
          description: Trimmed; blank or absent answers 400.
    OrganizationDto:
      type: object
      required: [ id, name, logoUrl, workspaceCount, isActive, createdAt ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        logoUrl:
          description: '`settings_json.logoUrl`, trimmed, when non-blank; else null.'
          oneOf: [ { type: string }, { type: 'null' } ]
        workspaceCount: { type: integer, minimum: 0, description: Live workspaces in the organization. }
        isActive:
          type: boolean
          description: >-
            Whether this is the request's selected organization (the token's organization, or a
            session's only organization). Always written although optional in packages/contract.
        createdAt: { $ref: '#/components/schemas/DateTime' }
    OrganizationList:
      type: array
      items: { $ref: '#/components/schemas/OrganizationDto' }
    WorkspaceDto:
      type: object
      required:
        [
          id,
          organizationId,
          slug,
          name,
          kind,
          isActive,
          projectCount,
          memberCount,
          sqlStudioEnabled,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        slug:
          {
            type: string,
            description: 'Unique within the organization; `[a-z0-9-]`, at most 48 characters.'
          }
        name: { type: string }
        kind: { type: string, description: 'Open vocabulary; workspaces created through REST are `local`.' }
        isActive:
          type: boolean
          description: >-
            Whether this is the request's ambient workspace. Authenticated REST requests carry none, so
            it is `false` for every session and token caller.
        projectCount: { type: integer, minimum: 0, description: Non-deleted projects (archived included). }
        memberCount: { type: integer, minimum: 0, description: 'Active, non-deleted memberships.' }
        sqlStudioEnabled:
          type: boolean
          description: The workspace's stored boolean setting, else the server's configured default.
        createdAt: { $ref: '#/components/schemas/DateTime' }
    WorkspaceList:
      type: array
      items: { $ref: '#/components/schemas/WorkspaceDto' }
    MetaDto:
      type: object
      description: >-
        The caller's organizations and the selected organization's workspaces (`buildMeta`,
        backend/http/meta.ts). Shared by `GET /api/meta`, which adds server metadata, and `POST
        /api/onboarding`.
      required: [ organization, organizations, workspaces, workspace, defaultProjectId ]
      properties:
        organization:
          description: The selected organization; null when none is selected (several organizations, or none).
          oneOf: [ { $ref: '#/components/schemas/OrganizationDto' }, { type: 'null' } ]
        organizations:
          type: array
          description: Every organization the profile has an active membership in (as `GET /api/organizations`).
          items: { $ref: '#/components/schemas/OrganizationDto' }
        workspaces:
          type: array
          description: The profile's active workspaces in the selected organization; empty when none is selected.
          items: { $ref: '#/components/schemas/WorkspaceDto' }
        workspace:
          description: The ambient workspace; always null for authenticated REST callers.
          oneOf: [ { $ref: '#/components/schemas/WorkspaceDto' }, { type: 'null' } ]
        defaultProjectId:
          description: As `GET /api/profile/default-project`.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    CreateOrganizationOnboardingBody:
      type: object
      required: [ organizationName ]
      properties:
        organizationName:
          type: string
          description: Trimmed; blank or absent answers 400.
        workspaceName:
          type: string
          description: Trimmed; blank or absent becomes `general`.
        workspaceSlug:
          type: string
          description: >-
            Lowercased, runs of other characters become `-`, trimmed of `-`, cut to 48 characters
            (`workspace` if nothing remains). Absent or blank derives the first three letters and digits
            of the workspace name. A taken slug gets a `-2`, `-3`, … suffix.
    UpdateOrganizationBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        name:
          type: string
          description: Trimmed; blank answers 400.
        logoUrl:
          description: >-
            Trimmed; blank or null clears it. Otherwise must start with `http://`, `https://` or `/` (an
            uploaded `/api/storage/organization-images/…` path), else 400.
          oneOf: [ { type: string }, { type: 'null' } ]
    OrganizationAdminDto:
      type: object
      required: [ userId, displayName, handle, email, avatarUrl ]
      properties:
        userId: { type: string, description: '`profiles.id`.' }
        displayName: { type: string }
        handle:
          oneOf: [ { type: string }, { type: 'null' } ]
        email:
          oneOf: [ { type: string }, { type: 'null' } ]
        avatarUrl:
          description: '`metadata_json.avatarUrl`, trimmed, when non-blank; else null.'
          oneOf: [ { type: string }, { type: 'null' } ]
    OrganizationAdminList:
      type: array
      items: { $ref: '#/components/schemas/OrganizationAdminDto' }
    AddOrganizationAdminBody:
      type: object
      required: [ userId ]
      properties:
        userId:
          type: string
          description: Profile id, trimmed; blank or absent answers 400, an unknown profile 404.
    CreateWorkspaceBody:
      type: object
      required: [ organizationId, name ]
      properties:
        organizationId:
          type: string
          description: Trimmed; blank or absent answers 400.
        name:
          type: string
          description: Trimmed; blank or absent answers 400.
        slug:
          type: string
          description: >-
            Normalized as `CreateOrganizationOnboardingBody.workspaceSlug`; absent or blank derives the
            first three letters and digits of the name. Uniquified within the organization.
    UpdateWorkspaceBody:
      type: object
      description: Partial update; omitted members are unchanged. A `MANAGER` may set either member.
      properties:
        name:
          type: string
          description: Trimmed; blank answers 400.
        sqlStudioEnabled:
          type: boolean
          description: >-
            Stored as given without a type check; a non-boolean value is stored and then reads back as
            the server default. Changing it on the server's bootstrap workspace starts or stops SQL
            Studio.
    WorkspaceRoleKey:
      type: string
      enum: [ ADMIN, MANAGER, MEMBER ]
    WorkspaceMemberDto:
      type: object
      required:
        [
          workspaceUserId,
          userId,
          displayName,
          handle,
          email,
          kind,
          roleKeys,
          isAdmin,
          isOperator,
          joinedAt,
          avatarUrl
        ]
      properties:
        workspaceUserId: { type: string, description: '`workspace_users.id`.' }
        userId: { type: string, description: '`profiles.id`.' }
        displayName: { type: string }
        handle:
          oneOf: [ { type: string }, { type: 'null' } ]
        email:
          oneOf: [ { type: string }, { type: 'null' } ]
        kind: { type: string, description: 'Open vocabulary (`human`, `service`).' }
        roleKeys:
          type: array
          description: Active workspace-level role keys, sorted.
          items: { type: string }
        isAdmin: { type: boolean, description: Whether `roleKeys` contains `ADMIN`. }
        isOperator: { type: boolean, description: Whether the membership belongs to the caller. }
        joinedAt: { $ref: '#/components/schemas/DateTime' }
        avatarUrl:
          description: '`metadata_json.avatarUrl`, trimmed, when non-blank; else null.'
          oneOf: [ { type: string }, { type: 'null' } ]
    WorkspaceMemberList:
      type: array
      items: { $ref: '#/components/schemas/WorkspaceMemberDto' }
    UpdateWorkspaceMemberRoleBody:
      type: object
      required: [ roleKey ]
      properties:
        roleKey:
          type: string
          description: >-
            Trimmed and uppercased, then one of `ADMIN`, `MANAGER`, `MEMBER`; anything else (or absent)
            answers 400.
    WorkspaceInvitationStatus:
      type: string
      enum: [ pending, accepted, revoked, expired ]
    WorkspaceInvitationDto:
      type: object
      required: [ id, workspaceId, email, roleKey, status, tokenPrefix, expiresAt, createdAt ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        email: { type: string, description: Lowercased. }
        roleKey: { $ref: '#/components/schemas/WorkspaceRoleKey' }
        status: { $ref: '#/components/schemas/WorkspaceInvitationStatus' }
        tokenPrefix: { type: string, description: 'Non-secret display prefix, `inv_…`.' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    WorkspaceInvitationList:
      type: array
      items: { $ref: '#/components/schemas/WorkspaceInvitationDto' }
    InviteWorkspaceMemberBody:
      type: object
      required: [ email ]
      properties:
        email:
          type: string
          description: Trimmed and lowercased; must contain `@` (400 otherwise).
        roleKey:
          type: string
          description: >-
            Trimmed and uppercased; defaults to `MEMBER`. Must be `ADMIN`, `MANAGER` or `MEMBER` (400
            otherwise).
    InviteWorkspaceMemberResultDto:
      type: object
      required: [ invitation ]
      properties:
        invitation: { $ref: '#/components/schemas/WorkspaceInvitationDto' }
        acceptUrl:
          type: string
          description: >-
            Present only when no email provider is configured: the web accept page with the raw token,
            `<site>/accept-invite?token=…`.
    AcceptWorkspaceInvitationBody:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          description: The raw `inv_…` token, trimmed; blank or absent answers 400.
    ServerMetaDto:
      description: '`GET /api/meta`: `MetaDto` plus server configuration.'
      allOf:
        - $ref: '#/components/schemas/MetaDto'
        - type: object
          required: [ databasePath, backendMode, web, sqlStudio, authProviders, capabilities ]
          properties:
            databasePath:
              type: string
              description: The resolved SQLite file path (also present, and meaningless, on Postgres).
            backendMode:
              type: string
              enum: [ local, cloud ]
              description: '`cloud` on Postgres; otherwise `backend_mode` from overlord.toml (default `local`).'
            web:
              type: object
              required: [ host, port, url ]
              properties:
                host: { type: string, description: The bind host. }
                port: { type: integer, minimum: 0, maximum: 65535 }
                url: { type: string, description: '`http://<host>:<port>`, with `0.0.0.0` shown as `127.0.0.1`.' }
            sqlStudio:
              type: object
              required: [ enabled, url ]
              properties:
                enabled: { type: boolean, description: Whether this process is serving SQL Studio. }
                url:
                  oneOf: [ { type: string }, { type: 'null' } ]
            authProviders: { $ref: '#/components/schemas/AuthProvidersDto' }
            capabilities:
              type: object
              required:
                [
                  projects,
                  missions,
                  objectives,
                  realtime,
                  sqlStudio,
                  launchAgents,
                  executionTargets,
                  localTarget,
                  mcp
                ]
              properties:
                projects: { const: true }
                missions: { const: true }
                objectives: { const: true }
                realtime: { const: true }
                sqlStudio: { type: boolean }
                launchAgents: { const: true }
                executionTargets: { const: false }
                localTarget:
                  type: string
                  enum: [ in_process_server, unavailable ]
                  description: '`in_process_server` only on SQLite with `OVERLORD_DEV_IN_PROCESS_LOCAL_TARGET=true`.'
                mcp: { type: boolean, description: Whether `/mcp` is registered (`OVERLORD_MCP_ENABLED=true`). }
    AuthProvidersDto:
      type: object
      required: [ email, github ]
      properties:
        email: { const: true }
        github: { type: boolean }
    AuthorizedWorkspaceDto:
      type: object
      required: [ workspaceId, workspaceUserId, organizationId, slug, name, kind, roleKeys ]
      properties:
        workspaceId: { type: string, format: uuid }
        workspaceUserId: { type: string }
        organizationId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { type: string }
        roleKeys:
          type: array
          description: Active role keys in that workspace, sorted.
          items: { type: string }
    AuthorizedWorkspaceDiscoveryDto:
      type: object
      required: [ organizationId, organizations, workspaces, selectionRequired ]
      properties:
        organizationId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        organizations:
          type: array
          items: { $ref: '#/components/schemas/OrganizationDto' }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/AuthorizedWorkspaceDto' }
        selectionRequired:
          type: boolean
          description: True only for a session whose profile belongs to more than one organization.
    StaleBackendHostExecutionTargetDto:
      type: object
      required: [ executionTargetId, label, deviceLabel, deviceFingerprint ]
      properties:
        executionTargetId: { type: string }
        label: { type: string }
        deviceLabel:
          oneOf: [ { type: string }, { type: 'null' } ]
        deviceFingerprint: { type: string }
    ExecutionTargetMigrationDiagnosticsDto:
      type: object
      required:
        [
          hostedBackend,
          backendHostFingerprint,
          staleBackendHostTargets,
          staleQueuedExecutionRequestCount
        ]
      properties:
        hostedBackend: { type: boolean }
        backendHostFingerprint: { type: string }
        staleBackendHostTargets:
          type: array
          items: { $ref: '#/components/schemas/StaleBackendHostExecutionTargetDto' }
        staleQueuedExecutionRequestCount: { type: integer, minimum: 0 }
    MessageErrorBody:
      type: object
      description: >-
        The `{ message }` error body of the sign-in handoff exchanges, and Better Auth's `{ message,
        code }` passed through by `/api/auth/desktop/github`. Not an `ErrorEnvelope`.
      required: [ message ]
      properties:
        message: { type: string }
        code: { type: string }
    OAuthHandoffExchangeBody:
      type: object
      required: [ ticket ]
      properties:
        ticket:
          type: string
          description: >-
            The one-time ticket (32–128 characters of `[A-Za-z0-9_-]`). A missing, non-string or
            malformed value answers 401, not 400.
    OAuthHandoffExchangeResultDto:
      type: object
      required: [ token ]
      properties:
        token: { type: string, description: 'The Better Auth session token, for `Authorization: Bearer`.' }
    NotificationType:
      type: string
      enum:
        [
          mission_awaiting_review,
          agent_question,
          mission_complete,
          mission_failed,
          agent_started,
          returned_to_execute
        ]
    NotificationPreferenceType:
      type: string
      description: A mission notification type or one of the two assistant conversation types.
      enum:
        [
          mission_awaiting_review,
          agent_question,
          mission_complete,
          mission_failed,
          agent_started,
          returned_to_execute,
          chat_needs_answer,
          chat_finished
        ]
    NotificationTransport:
      type: string
      enum: [ apns, realtime, in_app ]
      description: '`agent_started` and `returned_to_execute` are not eligible for `apns`.'
    NotificationMode:
      type: string
      enum: [ alert, silent, off ]
    PushNotificationCategory:
      type: string
      description: The APNs-eligible mission notification types.
      enum: [ mission_awaiting_review, agent_question, mission_complete, mission_failed ]
    NotificationDto:
      type: object
      required: [ id, workspaceId, type, missionId, objectiveId, createdAt, readAt, revision, presentation ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        missionId: { type: string, format: uuid }
        objectiveId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        readAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        revision: { type: integer, minimum: 1 }
        presentation:
          type: object
          required: [ body ]
          properties:
            body:
              type: string
              description: >-
                Bounded text built from the mission display id and title (or the objective's) and the
                type's fixed verb; recomputed on read, never stored.
    NotificationList:
      type: array
      items: { $ref: '#/components/schemas/NotificationDto' }
    NotificationRevisionBody:
      type: object
      required: [ expectedRevision ]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: The notification's current `revision`; a non-integer or value below 1 answers 400.
    NotificationPreferenceDto:
      type: object
      required: [ type, transport, mode ]
      properties:
        type: { $ref: '#/components/schemas/NotificationPreferenceType' }
        transport: { $ref: '#/components/schemas/NotificationTransport' }
        mode: { $ref: '#/components/schemas/NotificationMode' }
    NotificationPreferencesDto:
      type: object
      required: [ enabled, preferences, categories ]
      properties:
        enabled:
          type: boolean
          description: The master switch; false only when it was explicitly turned off.
        preferences:
          type: array
          description: Every type with each of its eligible transports, in catalog order.
          items: { $ref: '#/components/schemas/NotificationPreferenceDto' }
        categories:
          type: array
          description: APNs-only projection for released iOS builds (absent rows read `alert`).
          items:
            type: object
            required: [ category, mode ]
            properties:
              category: { $ref: '#/components/schemas/PushNotificationCategory' }
              mode: { $ref: '#/components/schemas/NotificationMode' }
    UpdateNotificationPreferencesBody:
      type: object
      description: Partial; every member is optional and the three are applied in order.
      properties:
        enabled:
          type: boolean
          description: Sets the master switch (stored as `all`/`all` with `alert` or `off`); a non-boolean
            answers 400.
        preferences:
          type: array
          description: Each entry must name a known type, an eligible transport for it and a known mode (400
            otherwise).
          items: { $ref: '#/components/schemas/NotificationPreferenceDto' }
        categories:
          type: array
          description: Deprecated APNs-only alias; each entry sets that category's `apns` mode.
          items:
            type: object
            required: [ category, mode ]
            properties:
              category: { $ref: '#/components/schemas/PushNotificationCategory' }
              mode: { $ref: '#/components/schemas/NotificationMode' }
    ApnsEnvironment:
      type: string
      enum: [ sandbox, production ]
      description: Trimmed before comparison; anything else answers 400.
    RegisterLiveActivityPushTokenBody:
      type: object
      required: [ pushToken, environment, bundleId ]
      properties:
        pushToken:
          type: string
          description: The opaque ActivityKit update token, trimmed; blank answers 400, longer than 4096
            characters 400.
        environment: { $ref: '#/components/schemas/ApnsEnvironment' }
        bundleId:
          type: string
          description: Trimmed; blank answers 400, longer than 255 characters 400.
        startedByPush:
          type: boolean
          description: True when APNs started the activity remotely (push-to-start handoff); a non-boolean
            answers 400.
    RegisterLiveActivityStartTokenBody:
      type: object
      required: [ startToken, environment, bundleId ]
      properties:
        startToken:
          type: string
          description: The opaque push-to-start token, trimmed; blank or longer than 512 characters answers 400.
        environment: { $ref: '#/components/schemas/ApnsEnvironment' }
        bundleId:
          type: string
          description: Trimmed; blank or longer than 255 characters answers 400.
        activityType:
          type: string
          description: Trimmed; longer than 128 characters answers 400; absent or blank means
            `OverlordActivityAttributes`.
        appVersion:
          type: string
          description: Trimmed; longer than 64 characters answers 400; absent or blank stores null.
    RevokeLiveActivityStartTokenBody:
      type: object
      required: [ startToken ]
      properties:
        startToken:
          type: string
          description: Trimmed; blank or longer than 512 characters answers 400.
    RegisterDevicePushTokenBody:
      type: object
      required: [ deviceToken, environment, bundleId ]
      properties:
        deviceToken:
          type: string
          description: The opaque APNs device token, trimmed; blank or longer than 512 characters answers 400.
        environment: { $ref: '#/components/schemas/ApnsEnvironment' }
        bundleId:
          type: string
          description: Trimmed; blank or longer than 255 characters answers 400.
        appVersion:
          type: string
          description: Trimmed; longer than 64 characters answers 400; absent or blank stores null.
    RevokeDevicePushTokenBody:
      type: object
      required: [ deviceToken ]
      properties:
        deviceToken:
          type: string
          description: Trimmed; blank or longer than 512 characters answers 400.
    WebhookEventType:
      type: string
      enum:
        [
          mission.delivered,
          mission.status_changed,
          objective.completed,
          mission.blocked,
          mission.unblocked
        ]
    WebhookPayloadMode:
      type: string
      enum: [ thin, full ]
    WebhookDisabledReason:
      type: string
      enum: [ manual, failures, owner_revoked ]
    WebhookSubscriptionDto:
      type: object
      required:
        [
          id,
          projectId,
          name,
          endpointUrl,
          isInternal,
          eventTypes,
          payloadMode,
          enabled,
          disabledReason,
          consecutiveFailures,
          lastSuccessAt,
          lastFailureAt,
          createdByWorkspaceUserId,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        projectId:
          description: The project the subscription is limited to, or null for the whole workspace.
          oneOf: [ { type: string }, { type: 'null' } ]
        name: { type: string }
        endpointUrl: { type: string, description: The normalized endpoint URL. }
        isInternal: { type: boolean, description: Whether the endpoint host is internal (evaluated on read). }
        eventTypes:
          type: array
          description: Stored types that are still known; unknown stored values are dropped.
          items: { $ref: '#/components/schemas/WebhookEventType' }
        payloadMode: { $ref: '#/components/schemas/WebhookPayloadMode' }
        enabled: { type: boolean }
        disabledReason:
          oneOf: [ { $ref: '#/components/schemas/WebhookDisabledReason' }, { type: 'null' } ]
        consecutiveFailures: { type: integer, minimum: 0 }
        lastSuccessAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        lastFailureAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        createdByWorkspaceUserId: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    WebhookSubscriptionList:
      type: array
      items: { $ref: '#/components/schemas/WebhookSubscriptionDto' }
    CreateWebhookSubscriptionBody:
      type: object
      required: [ name, endpointUrl, eventTypes ]
      properties:
        workspaceId:
          type: string
          description: The owning workspace when `projectId` is absent (400 when both are missing).
        projectId:
          type: string
          description: >-
            Limits the subscription to one project and selects its workspace. An unknown project answers
            400; a project outside the caller's authorized workspaces 404.
        name:
          type: string
          description: Trimmed; blank or absent answers 400.
        endpointUrl:
          type: string
          description: >-
            Absolute URL; unparseable answers 400, as does `http://` to a host that is not internal.
        eventTypes:
          type: array
          minItems: 1
          description: Non-empty; duplicates are removed; an unknown type answers 400.
          items: { $ref: '#/components/schemas/WebhookEventType' }
        payloadMode:
          description: Defaults to `full` for an internal host and `thin` otherwise; another value answers 400.
          oneOf: [ { $ref: '#/components/schemas/WebhookPayloadMode' }, { type: 'null' } ]
    UpdateWebhookSubscriptionBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        name:
          type: string
          description: Trimmed; blank answers 400.
        endpointUrl:
          type: string
          description: Validated as on create.
        projectId:
          description: >-
            A project of the subscription's workspace (400 otherwise), or null to widen it to the whole
            workspace.
          oneOf: [ { type: string }, { type: 'null' } ]
        eventTypes:
          type: array
          minItems: 1
          description: Replaces the list; validated as on create.
          items: { $ref: '#/components/schemas/WebhookEventType' }
        payloadMode: { $ref: '#/components/schemas/WebhookPayloadMode' }
        enabled:
          type: boolean
          description: Not type-checked; any truthy value enables.
    CreateWebhookSubscriptionResultDto:
      type: object
      required: [ subscription, secret ]
      properties:
        subscription: { $ref: '#/components/schemas/WebhookSubscriptionDto' }
        secret: { type: string, description: 'The HMAC signing secret, `whsec_…`; shown only here.' }
    WebhookTestResultDto:
      type: object
      required: [ ok, responseStatus ]
      properties:
        ok: { const: true }
        responseStatus: { type: integer, description: The endpoint's 2xx status. }
    WebhookDeliveryAttemptDto:
      type: object
      required:
        [
          id,
          outboxMessageId,
          eventType,
          attemptNumber,
          responseStatus,
          responseSnippet,
          error,
          durationMs,
          attemptedAt
        ]
      properties:
        id: { type: string, format: uuid }
        outboxMessageId: { type: string }
        eventType: { type: string, description: 'A webhook event type, or `webhook.ping` for a test delivery.' }
        attemptNumber: { type: integer, minimum: 1 }
        responseStatus:
          oneOf: [ { type: integer }, { type: 'null' } ]
        responseSnippet:
          description: A redacted prefix of the endpoint's response body (null for test pings).
          oneOf: [ { type: string }, { type: 'null' } ]
        error:
          oneOf: [ { type: string }, { type: 'null' } ]
        durationMs:
          oneOf: [ { type: integer, minimum: 0 }, { type: 'null' } ]
        attemptedAt: { $ref: '#/components/schemas/DateTime' }
    WebhookDeliveryAttemptsPageDto:
      type: object
      required: [ attempts, hasMore ]
      properties:
        attempts:
          type: array
          items: { $ref: '#/components/schemas/WebhookDeliveryAttemptDto' }
        hasMore: { type: boolean }
    StorageBucketKey:
      type: string
      enum: [ user-images, workspace-images, organization-images, attachments ]
    RawImageUploadBody:
      type: string
      contentMediaType: application/octet-stream
      description: >-
        The image's raw bytes as the request body. The request `Content-Type` (parameters ignored, case
        insensitive) must be `image/png`, `image/jpeg`, `image/gif` or `image/webp`. An empty body
        answers 400.
    BinaryDownload:
      type: string
      contentMediaType: application/octet-stream
      description: The stored object's raw bytes.
    StoredImageDto:
      type: object
      required: [ id, bucketKey, storageKey, filename, contentType, sizeBytes, url, createdAt ]
      properties:
        id:
          type: string
          format: uuid
          description: The metadata row id (for an organization image, an id with no row).
        bucketKey: { $ref: '#/components/schemas/StorageBucketKey' }
        storageKey:
          type: string
          description: >-
            The backend key: `user-images/<profile id>/<id><ext>`, `workspace-files/<workspace
            id>/images/<id><ext>` or `organization-files/<organization id>/images/<id><ext>`.
        filename: { type: string }
        contentType:
          type: string
          enum: [ image/png, image/jpeg, image/gif, image/webp ]
        sizeBytes: { type: integer, minimum: 1, maximum: 8388608 }
        url: { type: string, description: 'Server-relative `/api/storage/<bucket>/<percent-encoded key>`.' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    EntityChangeOperation:
      type: string
      enum: [ insert, update, delete, restore ]
    EntityChangeDto:
      type: object
      required:
        [
          seq,
          workspaceId,
          entityType,
          entityId,
          operation,
          projectId,
          missionId,
          objectiveId,
          changedFields,
          occurredAt
        ]
      properties:
        seq: { type: integer, minimum: 1 }
        workspaceId: { type: string, format: uuid }
        entityType:
          {
            type: string,
            description: 'Open vocabulary (`mission`, `objective`, `project`, `workspace_user`, …).'
          }
        entityId: { type: string }
        operation: { $ref: '#/components/schemas/EntityChangeOperation' }
        projectId:
          oneOf: [ { type: string }, { type: 'null' } ]
        missionId:
          oneOf: [ { type: string }, { type: 'null' } ]
        objectiveId:
          oneOf: [ { type: string }, { type: 'null' } ]
        changedFields:
          type: array
          description: Column names parsed from `changed_fields_json`; empty when none were recorded.
          items: { type: string }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
    SyncChangesDto:
      type: object
      required: [ changes, cursor, hasMore ]
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/EntityChangeDto' }
        cursor:
          type: integer
          minimum: 0
          description: The next `after`; the last returned `seq` when `hasMore`, else the scanned high-water mark.
        hasMore: { type: boolean }
    RealtimeChangeEventDto:
      type: object
      required: [ type, changes, cursor ]
      properties:
        type: { const: change }
        changes:
          type: array
          items: { $ref: '#/components/schemas/EntityChangeDto' }
        cursor: { type: integer, minimum: 0 }
    RealtimeStreamEvent:
      description: >-
        The JSON `data` of one stream event. The stream itself is `text/event-stream` framing (`event:`,
        `id:`, `data:` lines and `: ping` comments), not JSON.
      oneOf:
        - type: object
          required: [ type, cursor ]
          properties:
            type: { const: hello }
            cursor: { type: integer, minimum: 0 }
        - $ref: '#/components/schemas/RealtimeChangeEventDto'
        - type: object
          required: [ type ]
          properties:
            type: { const: refresh }
    OAuthScope:
      type: string
      enum:
        [
          overlord.workspace.read,
          overlord.mission.read,
          overlord.mission.write,
          overlord.session.write
        ]
    OAuthProtectedResourceMetadata:
      type: object
      required:
        [
          resource,
          authorization_servers,
          bearer_methods_supported,
          resource_documentation,
          scopes_supported
        ]
      properties:
        resource: { type: string, description: '`<base URL>/mcp`.' }
        authorization_servers:
          type: array
          description: The issuer, `<base URL>`.
          items: { type: string }
        bearer_methods_supported:
          type: array
          items: { const: header }
        resource_documentation: { type: string }
        scopes_supported:
          type: array
          items: { $ref: '#/components/schemas/OAuthScope' }
    OAuthAuthorizationServerMetadata:
      type: object
      required:
        [
          issuer,
          authorization_endpoint,
          token_endpoint,
          registration_endpoint,
          revocation_endpoint,
          response_types_supported,
          grant_types_supported,
          code_challenge_methods_supported,
          token_endpoint_auth_methods_supported,
          scopes_supported
        ]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string, description: '`<base URL>/oauth/approve` (the web approval page).' }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        revocation_endpoint: { type: string }
        response_types_supported:
          type: array
          items: { const: code }
        grant_types_supported:
          type: array
          items: { const: authorization_code }
        code_challenge_methods_supported:
          type: array
          items: { const: S256 }
        token_endpoint_auth_methods_supported:
          type: array
          items: { const: none }
        scopes_supported:
          type: array
          items: { $ref: '#/components/schemas/OAuthScope' }
    OAuthErrorBody:
      type: object
      description: An RFC 6749 error. `error` is an OAuth error code, not a message.
      required: [ error, error_description ]
      properties:
        error: { type: string }
        error_description: { type: string }
    OAuthClientRegistrationBody:
      type: object
      required: [ redirect_uris ]
      properties:
        redirect_uris:
          type: array
          description: >-
            Entries that are not strings, not URLs, or not `https:` (or `http:` to `localhost` /
            `127.0.0.1`) are dropped; none left answers 400 `invalid_redirect_uri`.
          items: { type: string }
        client_name:
          type: string
          description: Trimmed and cut to 120 characters; absent or blank becomes `MCP client`.
    OAuthClientRegistrationDto:
      type: object
      required:
        [
          client_id,
          client_name,
          redirect_uris,
          grant_types,
          response_types,
          token_endpoint_auth_method,
          client_id_issued_at
        ]
      properties:
        client_id: { type: string, description: '`ovlc_<payload>.<signature>`.' }
        client_name: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { const: authorization_code }
        response_types:
          type: array
          items: { const: code }
        token_endpoint_auth_method: { const: none }
        client_id_issued_at: { type: integer, description: Unix seconds. }
    OAuthTokenRequestBody:
      type: object
      description: Every value is read as a trimmed string; a missing one is empty.
      required: [ grant_type, code, client_id, redirect_uri, code_verifier, resource ]
      properties:
        grant_type: { const: authorization_code }
        code: { type: string }
        client_id: { type: string }
        redirect_uri: { type: string }
        code_verifier: { type: string }
        resource:
          type: string
          description: Must equal the authorization's resource (`<base URL>/mcp`); an absent value does not match.
    OAuthTokenResponseDto:
      type: object
      required: [ access_token, token_type, expires_in, scope ]
      properties:
        access_token: { type: string, description: 'An `out_…` user token.' }
        token_type: { const: Bearer }
        expires_in: { const: 7776000 }
        scope: { type: string, description: 'The granted scopes, space-separated.' }
    OAuthRevokeBody:
      type: object
      properties:
        token: { type: string, description: 'The `out_…` token to revoke.' }
    OAuthAuthorizationRequestBody:
      type: object
      description: >-
        The OAuth authorization request parameters (each read from the body, else the query string, as a
        trimmed string).
      properties:
        response_type:
          const: code
          description: Anything else answers 400 `unsupported_response_type`.
        client_id: { type: string, description: A client id from registration; otherwise 400 `invalid_client`. }
        redirect_uri: { type: string, description: One of the client's redirect URIs; otherwise 400 `invalid_request`. }
        code_challenge_method: { const: S256 }
        code_challenge: { type: string, description: Required (400 `invalid_request`). }
        resource:
          type: string
          description: Defaults to `<base URL>/mcp`; any other value answers 400 `invalid_target`.
        scope:
          type: string
          description: Space-separated; defaults to every scope; an unknown scope answers 400 `invalid_scope`.
        state: { type: string, description: Echoed back. }
    OAuthConsentWorkspaceDto:
      type: object
      required: [ workspaceId, workspaceUserId, slug, name, kind, roleKeys ]
      properties:
        workspaceId: { type: string, format: uuid }
        workspaceUserId: { type: string }
        slug: { type: string }
        name: { type: string }
        kind: { type: string }
        roleKeys:
          type: array
          items: { type: string }
    OAuthConsentOrganizationDto:
      type: object
      required: [ id, name, workspaces ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/OAuthConsentWorkspaceDto' }
    OAuthAuthorizationRequestInfoDto:
      type: object
      required: [ clientName, redirectUri, redirectHost, resource, scopes, state, organizations ]
      properties:
        clientName: { type: string }
        redirectUri: { type: string }
        redirectHost: { type: string }
        resource: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/OAuthScope' }
        state: { type: string, description: 'The request''s `state`, or empty.' }
        organizations:
          type: array
          description: Every organization and workspace in which the profile has an active membership.
          items: { $ref: '#/components/schemas/OAuthConsentOrganizationDto' }
    OAuthApproveBody:
      description: The authorization request parameters plus the decision and consent.
      allOf:
        - $ref: '#/components/schemas/OAuthAuthorizationRequestBody'
        - type: object
          required: [ decision ]
          properties:
            decision:
              type: string
              enum: [ approve, deny ]
              description: Anything else answers 400 `invalid_request`.
            organizationId:
              type: string
              description: Required when the profile belongs to several organizations (400 otherwise).
            allWorkspaces:
              type: boolean
              description: Only `true` selects all current and future workspaces.
            workspaceIds:
              type: array
              description: >-
                Live workspaces of the organization (400 otherwise); required unless `allWorkspaces` or
                the organization has one workspace.
              items: { type: string }
    OAuthApproveResultDto:
      type: object
      required: [ redirectTo ]
      properties:
        redirectTo:
          type: string
          description: >-
            The client's redirect URI with `code` and `state`, or with `error=access_denied`,
            `error_description` and `state`.
    McpServerInfoDto:
      type: object
      required: [ name, protocolVersion, endpoint, capabilities, instructions ]
      properties:
        name: { const: overlord }
        protocolVersion: { type: string, description: 'The MCP protocol revision, currently `2025-11-25`.' }
        endpoint:
          type: string
          description: '`<request protocol>://<Host>/mcp`.'
        capabilities:
          type: object
          required: [ tools, resources ]
          properties:
            tools:
              type: array
              description: Tool definitions as `tools/list` returns them (generated tool catalog).
              items: { $ref: '#/components/schemas/JsonValue' }
            resources:
              type: array
              description: Widget resources as `resources/list` returns them.
              items: { $ref: '#/components/schemas/JsonValue' }
        instructions: { type: string }
    JsonRpcId:
      oneOf: [ { type: string }, { type: number }, { type: 'null' } ]
    JsonRpcRequest:
      type: object
      description: A JSON-RPC 2.0 request or notification. A non-object item is answered `-32600`.
      required: [ jsonrpc, method ]
      properties:
        jsonrpc: { const: '2.0' }
        id: { $ref: '#/components/schemas/JsonRpcId' }
        method: { type: string }
        params: { $ref: '#/components/schemas/JsonValue' }
    JsonRpcResponse:
      description: A JSON-RPC 2.0 result or error; `id` is null when the request had none.
      oneOf:
        - type: object
          description: A result. `id` is absent only on the `{ jsonrpc, result null }` answer to a single
            notification.
          required: [ jsonrpc, result ]
          properties:
            jsonrpc: { const: '2.0' }
            id: { $ref: '#/components/schemas/JsonRpcId' }
            result: { $ref: '#/components/schemas/JsonValue' }
        - type: object
          required: [ jsonrpc, id, error ]
          properties:
            jsonrpc: { const: '2.0' }
            id: { $ref: '#/components/schemas/JsonRpcId' }
            error:
              type: object
              required: [ code, message ]
              properties:
                code: { type: integer, enum: [ -32600, -32601, -32000 ] }
                message: { type: string }
    AccountConnectionProvider:
      type: string
      enum: [ knowledgebase, everhour, github ]
    AccountConnectionScope:
      type: string
      enum: [ organization, profile ]
    AccountConnectionCredentialKind:
      type: string
      enum: [ oauth, api_key ]
    AccountConnectionState:
      type: string
      enum: [ pending, connected, reauthorization_required, disconnected ]
    AccountConnectionAssistantWriteScope:
      type: string
      enum: [ per_request, all_workspaces ]
    AccountConnectionUnavailableReason:
      type: string
      enum: [ not_offered_on_edition, not_configured, encryption_not_configured ]
    AccountConnectionDto:
      type: object
      description: Non-secret connection metadata; credentials never leave the connections module.
      required:
        [
          id,
          provider,
          organizationId,
          scope,
          credentialKind,
          account,
          scopes,
          lastValidatedAt,
          serverUrl,
          state,
          authorizedWorkspaces,
          assistantWriteScope,
          toolPolicyVersion,
          lastErrorCode,
          connectedAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string }
        provider: { $ref: '#/components/schemas/AccountConnectionProvider' }
        organizationId:
          description: Null exactly when `scope` is `profile`.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        scope: { $ref: '#/components/schemas/AccountConnectionScope' }
        credentialKind: { $ref: '#/components/schemas/AccountConnectionCredentialKind' }
        account:
          description: The upstream account, when any of its fields is known.
          oneOf:
            - type: object
              required: [ id, label, avatarUrl ]
              properties:
                id:
                  oneOf: [ { type: string }, { type: 'null' } ]
                label:
                  oneOf: [ { type: string }, { type: 'null' } ]
                avatarUrl:
                  oneOf: [ { type: string }, { type: 'null' } ]
            - type: 'null'
        scopes:
          type: array
          description: Granted OAuth scopes; empty for API keys.
          items: { type: string }
        lastValidatedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        serverUrl: { type: string }
        state: { $ref: '#/components/schemas/AccountConnectionState' }
        authorizedWorkspaces:
          type: array
          description: Provider workspaces the grant can read (Knowledgebase slugs).
          items: { type: string }
        assistantWriteScope:
          $ref: '#/components/schemas/AccountConnectionAssistantWriteScope'
          description: Always `per_request` for providers other than `knowledgebase`.
        toolPolicyVersion: { type: integer }
        lastErrorCode:
          oneOf: [ { type: string }, { type: 'null' } ]
        connectedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    AccountConnectionProviderStatusDto:
      type: object
      required: [ provider, scope, credentialKind, available, reason ]
      properties:
        provider: { $ref: '#/components/schemas/AccountConnectionProvider' }
        scope: { $ref: '#/components/schemas/AccountConnectionScope' }
        credentialKind: { $ref: '#/components/schemas/AccountConnectionCredentialKind' }
        available: { type: boolean }
        reason:
          oneOf: [ { $ref: '#/components/schemas/AccountConnectionUnavailableReason' }, { type: 'null' } ]
    AccountConnectionListResponse:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccountConnectionDto' }
        providers:
          type: array
          description: Present only with `scope=all`; Knowledgebase first, then each profile provider.
          items: { $ref: '#/components/schemas/AccountConnectionProviderStatusDto' }
    StartAccountConnectionBody:
      type: object
      required: [ provider, returnTo ]
      properties:
        provider: { $ref: '#/components/schemas/AccountConnectionProvider' }
        returnTo:
          type: string
          enum: [ mobile, web ]
          description: Where the callback sends the browser; anything else answers 400 `invalid_request`.
        returnPath:
          oneOf:
            - type: string
              maxLength: 512
            - type: 'null'
          description: >-
            GitHub with `returnTo: web` only (400 otherwise): a relative web path starting with `/`, not
            `//`, without backslashes or control characters, at most 512 characters. Defaults to
            `/settings/connections`. Ignored by the Knowledgebase path.
    StartAccountConnectionResponse:
      type: object
      required: [ connectionId, authorizeUrl, expiresAt ]
      properties:
        connectionId: { type: string }
        authorizeUrl: { type: string, description: The provider's authorization URL with state and PKCE challenge. }
        expiresAt: { $ref: '#/components/schemas/DateTime' }
    SetAccountConnectionApiKeyBody:
      type: object
      required: [ provider, apiKey ]
      properties:
        provider:
          $ref: '#/components/schemas/AccountConnectionProvider'
          description: An API-key provider offered here (`everhour`); anything else answers 404
            `provider_not_available`.
        apiKey:
          type: string
          maxLength: 512
          description: Trimmed; blank or longer than 512 characters answers 400 `invalid_request`.
    UpdateAccountConnectionBody:
      type: object
      required: [ expectedRevision, assistantWriteScope ]
      additionalProperties: false
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        assistantWriteScope: { $ref: '#/components/schemas/AccountConnectionAssistantWriteScope' }
    KnowledgebaseClientMetadataDto:
      type: object
      required:
        [
          client_id,
          client_name,
          client_uri,
          redirect_uris,
          grant_types,
          response_types,
          token_endpoint_auth_method,
          scope
        ]
      properties:
        client_id: { type: string, description: 'This document''s own URL.' }
        client_name: { const: Overlord }
        client_uri: { type: string }
        redirect_uris:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string, enum: [ authorization_code, refresh_token ] }
        response_types:
          type: array
          items: { const: code }
        token_endpoint_auth_method: { const: none }
        scope: { type: string }
    RunQueueEntryState:
      type: string
      description: Closed four-value entry state machine (contract/conformance.md).
      enum: [ waiting, blocked, dispatched, running ]
    RunQueueWaitingReason:
      type: string
      description: Why a `waiting` entry is not eligible right now; each clears on its own.
      enum: [ mission_busy, resource_disconnected, retry_pending ]
    ExecutionRequestStatus:
      type: string
      enum: [ queued, claimed, launching, launched, failed, cleared, cancelled, expired ]
    RunQueueEntryDto:
      type: object
      description: One queue entry (packages/core/service/run-queue.ts `entryDto`).
      required:
        [
          id,
          queueId,
          position,
          state,
          blockedReason,
          waitingReason,
          waitingOnObjectiveId,
          waitingOnObjectiveDisplayId,
          attemptCount,
          objectiveId,
          objectiveDisplayId,
          objectiveTitle,
          missionId,
          missionDisplayId,
          missionTitle,
          assignedAgent,
          resourceKey,
          enqueuedAt,
          executionRequestId,
          executionRequest,
          diagnosticCode
        ]
      properties:
        id: { type: string, format: uuid }
        queueId: { type: string, format: uuid }
        position:
          type: integer
          minimum: 1
          description: 1-based rank within the queue (not the stored position).
        state: { $ref: '#/components/schemas/RunQueueEntryState' }
        blockedReason:
          description: What a human must fix; set while `blocked`.
          oneOf:
            - type: string
            - type: 'null'
        waitingReason:
          oneOf:
            - { $ref: '#/components/schemas/RunQueueWaitingReason' }
            - type: 'null'
        waitingOnObjectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        waitingOnObjectiveDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        attemptCount:
          type: integer
          minimum: 0
          description: Dispatch attempts already spent; the ceiling is 3.
        objectiveId: { type: string, format: uuid }
        objectiveDisplayId: { type: string, description: '`<mission display id>.<objective key>`.' }
        objectiveTitle:
          oneOf:
            - type: string
            - type: 'null'
        missionId: { type: string, format: uuid }
        missionDisplayId: { type: string }
        missionTitle: { type: string }
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          description: The objective's resource key, trimmed; blank is null.
          oneOf:
            - type: string
            - type: 'null'
        enqueuedAt: { $ref: '#/components/schemas/DateTime' }
        executionRequestId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        executionRequest:
          description: >-
            State diagnostics of the linked execution request; null when the entry links none or the
            request is deleted.
          oneOf:
            - type: object
              required:
                [
                  status,
                  lastError,
                  claimedByDeviceId,
                  claimedByExecutionTargetId,
                  executionTargetId,
                  createdAt,
                  claimedAt,
                  launchStartedAt,
                  launchCompletedAt,
                  updatedAt
                ]
              properties:
                status: { $ref: '#/components/schemas/ExecutionRequestStatus' }
                lastError:
                  oneOf:
                    - type: string
                    - type: 'null'
                claimedByDeviceId:
                  oneOf:
                    - type: string
                    - type: 'null'
                claimedByExecutionTargetId:
                  oneOf:
                    - type: string
                    - type: 'null'
                executionTargetId:
                  oneOf:
                    - type: string
                    - type: 'null'
                createdAt: { $ref: '#/components/schemas/DateTime' }
                claimedAt:
                  oneOf:
                    - { $ref: '#/components/schemas/DateTime' }
                    - type: 'null'
                launchStartedAt:
                  oneOf:
                    - { $ref: '#/components/schemas/DateTime' }
                    - type: 'null'
                launchCompletedAt:
                  oneOf:
                    - { $ref: '#/components/schemas/DateTime' }
                    - type: 'null'
                updatedAt: { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        diagnosticCode:
          description: A detected impossible queue/request state pair, if any.
          oneOf:
            - type: string
              enum: [ terminal_request_dispatched, running_without_live_request ]
            - type: 'null'
    RunQueueDto:
      type: object
      required:
        [
          id,
          projectId,
          name,
          isDefault,
          missionId,
          missionDisplayId,
          paused,
          position,
          entries,
          running
        ]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        missionId:
          description: The mission of a mission-scoped queue; null for a free-standing queue.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        missionDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        paused: { type: boolean }
        position:
          type: number
          description: Stored sort position (multiples of 1000).
        entries:
          type: array
          items: { $ref: '#/components/schemas/RunQueueEntryDto' }
        running:
          description: The first `dispatched` or `running` entry, or null.
          oneOf:
            - { $ref: '#/components/schemas/RunQueueEntryDto' }
            - type: 'null'
    ProjectRunQueuesDto:
      type: object
      required: [ projectId, queues ]
      properties:
        projectId: { type: string, format: uuid }
        queues:
          type: array
          items: { $ref: '#/components/schemas/RunQueueDto' }
    CreateRunQueueBody:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: >-
            Trimmed; blank or absent answers 400 `invalid_queue_name`. Not type-checked: a non-string
            answers 500. Unique per project case-insensitively (a duplicate answers 409 from the
            database constraint).
        missionId:
          description: Mission UUID of this project for a mission-scoped queue.
          oneOf:
            - type: string
            - type: 'null'
    ReorderProjectRunQueuesBody:
      type: object
      required: [ orderedQueueIds ]
      properties:
        orderedQueueIds:
          type: array
          items: { type: string }
    EnqueueRunQueueEntryBody:
      type: object
      required: [ objectiveId ]
      properties:
        objectiveId:
          type: string
          description: >-
            Objective UUID of an objective in this project; anything else (absent, a display id, another
            project's objective) answers 404 `objective_not_found`.
        queueId:
          type: string
          description: A live queue of this project (404 `run_queue_not_found` otherwise).
        afterEntryId:
          type: string
          description: Place the entry directly after this entry of the destination queue (404
            `run_queue_entry_not_found` otherwise).
        position:
          type: number
          description: Explicit stored position, used when `afterEntryId` is absent; not validated.
        cascade:
          type: boolean
          description: '`false` queues only this objective; default true.'
    UpdateRunQueueBody:
      type: object
      properties:
        name:
          type: string
          description: Trimmed; blank answers 400 `invalid_queue_name`; a non-string answers 500.
        paused:
          type: boolean
          description: Not type-checked; on SQLite any truthy value pauses.
    DeleteRunQueueBody:
      type: object
      properties:
        moveEntriesTo:
          type: string
          description: Destination queue UUID for the queue's remaining entries.
    ReorderRunQueueBody:
      type: object
      required: [ orderedEntryIds ]
      properties:
        orderedEntryIds:
          type: array
          items: { type: string }
    UpdateRunQueueEntryBody:
      type: object
      properties:
        retry:
          type: boolean
          description: '`true` retries the entry instead of moving it.'
        queueId: { type: string }
        afterEntryId: { type: string }
        position: { type: number }
    DeleteRunQueueEntryBody:
      type: object
      properties:
        force:
          type: boolean
          description: Only `true` forces; any other value is a plain removal.
    RunQueueRemovalDto:
      type: object
      required: [ removed, projectId ]
      properties:
        removed: { const: true }
        projectId: { type: string, format: uuid }
    RunQueueEntryRemovalDto:
      type: object
      required:
        [
          removed,
          forced,
          objectiveId,
          previousState,
          objectiveReset,
          clearedExecutionRequests,
          removedEmptyQueueId
        ]
      properties:
        removed: { const: true }
        forced: { type: boolean }
        objectiveId: { type: string, format: uuid }
        previousState:
          $ref: '#/components/schemas/RunQueueEntryState'
          description: The entry's state at removal; `dispatched` or `running` means it was in flight.
        objectiveReset:
          type: boolean
          description: A forced removal reset a stuck `launching` objective to `draft`.
        clearedExecutionRequests:
          type: integer
          minimum: 0
          description: Active execution requests a forced removal cleared (0 otherwise).
        removedEmptyQueueId:
          description: Non-default queue retired because this removal emptied it.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    ExecutionTargetRunnerRegistrationDto:
      type: object
      description: A runner instance registered against an execution target (`listRunnerRegistrations`).
      required:
        [
          id,
          executionTargetId,
          runnerInstanceId,
          relation,
          label,
          runnerVersion,
          supportedAgents,
          health,
          lastHeartbeatAt,
          lastErrorCode
        ]
      properties:
        id: { type: string, format: uuid }
        executionTargetId: { type: string }
        runnerInstanceId: { type: string }
        relation:
          type: string
          enum: [ native, adopted ]
        label:
          oneOf:
            - type: string
            - type: 'null'
        runnerVersion:
          oneOf:
            - type: string
            - type: 'null'
        supportedAgents:
          type: array
          description: Agent keys from the stored JSON list; non-strings are dropped and malformed JSON reads
            as empty.
          items: { type: string }
        health: { type: string, description: Open vocabulary reported by the runner. }
        lastHeartbeatAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        lastErrorCode:
          oneOf:
            - type: string
            - type: 'null'
    WorkspaceExecutionTargetDto:
      type: object
      description: Safe workspace-settings projection of an execution target (`listWorkspaceExecutionTargets`).
      required:
        [
          id,
          type,
          label,
          status,
          ownerDisplayName,
          reachable,
          lastSeenAt,
          activeMemberAccessCount,
          hasCurrentUserAccess,
          unavailableReason,
          runnerRegistrations
        ]
      properties:
        id: { type: string }
        type: { type: string, description: '`local` or `virtual`.' }
        label: { type: string }
        status:
          type: string
          enum: [ active, disabled, unavailable ]
        ownerDisplayName:
          oneOf:
            - type: string
            - type: 'null'
        reachable: { type: boolean }
        lastSeenAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        activeMemberAccessCount: { type: integer, minimum: 0 }
        hasCurrentUserAccess:
          type: boolean
          description: Whether the caller has active access and so can select it for project launches.
        unavailableReason:
          description: >-
            Human-readable reason the target cannot run work now (disabled, awaiting its first runner
            heartbeat, or no healthy runner); null when reachable and active.
          oneOf:
            - type: string
            - type: 'null'
        runnerRegistrations:
          type: array
          items: { $ref: '#/components/schemas/ExecutionTargetRunnerRegistrationDto' }
    WorkspaceExecutionTargetList:
      type: array
      items: { $ref: '#/components/schemas/WorkspaceExecutionTargetDto' }
    RegisterExecutionTargetBody:
      type: object
      properties:
        label:
          type: string
          description: Display name for the target, trimmed; a non-string or blank value keeps the device label.
    UpdateWorkspaceExecutionTargetBody:
      type: object
      properties:
        label:
          type: string
          description: New label, trimmed; blank answers 400. A non-string is ignored.
        status:
          type: string
          enum: [ active, disabled ]
          description: Any other value is ignored.
    EligibleExecutionTargetDto:
      type: object
      required: [ executionTargetId, type, label, deviceLabel, reachable, primaryResourceConnected ]
      properties:
        executionTargetId: { type: string }
        type: { type: string }
        label: { type: string }
        deviceLabel:
          oneOf:
            - type: string
            - type: 'null'
        reachable: { type: boolean }
        primaryResourceConnected:
          type: boolean
          description: Whether the project's primary resource on this target is not `missing`.
    ProjectExecutionTargetDto:
      type: object
      required: [ selectedExecutionTargetId, eligibleTargets ]
      properties:
        selectedExecutionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        eligibleTargets:
          type: array
          items: { $ref: '#/components/schemas/EligibleExecutionTargetDto' }
    UpdateProjectExecutionTargetBody:
      type: object
      properties:
        executionTargetId:
          description: Target to select, trimmed; null, absent or blank clears the choice. A non-string answers 500.
          oneOf:
            - type: string
            - type: 'null'
    TargetObservationState:
      type: string
      enum: [ available, missing, unreachable, permission_denied, not_git_repository, unknown ]
    ReportResourceObservationsBody:
      type: object
      required: [ observations ]
      properties:
        observations:
          type: array
          minItems: 1
          description: A missing, non-array or empty list answers 400.
          items:
            type: object
            required: [ resourceId, state, observedAt ]
            properties:
              resourceId: { type: string, description: 'Project resource UUID, trimmed; blank answers 400.' }
              state:
                $ref: '#/components/schemas/TargetObservationState'
                description: Trimmed; any other value answers 400.
              gitRoot: { type: string, description: A non-string is stored as null. }
              branch: { type: string, description: A non-string is stored as null. }
              commit: { type: string, description: A non-string is stored as null. }
              observedAt:
                type: string
                description: Trimmed and stored as given (not parsed); blank answers 400.
    ReportMissionBranchObservationsBody:
      type: object
      required: [ observations ]
      properties:
        observations:
          type: array
          minItems: 1
          description: A missing, non-array or empty list answers 400.
          items:
            type: object
            required: [ missionId, resourceKey, status, dirty, observedAt ]
            properties:
              missionId: { type: string, description: 'Mission UUID, trimmed; blank answers 400.' }
              resourceKey: { type: string, description: Trimmed; blank answers 400. }
              status:
                type: string
                enum: [ created, published, merged_unpushed, merged ]
                description: Trimmed; any other value answers 400.
              dirty: { type: boolean, description: A non-boolean answers 400. }
              worktreePath: { type: string, description: A non-string is stored as null. }
              observedAt:
                type: string
                description: Trimmed and stored as given (not parsed); blank answers 400.
    RecordedObservationsDto:
      type: object
      required: [ recorded ]
      properties:
        recorded: { type: integer, minimum: 1 }
    AgentCatalogModelDto:
      type: object
      required: [ id, displayName, reasoningOptions, enabled ]
      properties:
        id: { type: string }
        displayName: { type: string, description: Defaults to the id. }
        reasoningOptions:
          type: array
          description: Reasoning or thinking levels selectable for this model; empty means none.
          items: { type: string }
        enabled:
          type: boolean
          description: When false the model is kept in the catalog but not offered for selection.
    AgentCatalogAgentDto:
      type: object
      required:
        [
          key,
          label,
          availableByDefault,
          models,
          defaultModel,
          defaultReasoningEffort,
          reasoningLabel
        ]
      properties:
        key: { type: string, description: 'Stable connector key (`claude`, `codex`, `cursor`, …).' }
        label: { type: string }
        availableByDefault: { type: boolean }
        models:
          type: array
          items: { $ref: '#/components/schemas/AgentCatalogModelDto' }
        defaultModel:
          oneOf:
            - type: string
            - type: 'null'
        defaultReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        reasoningLabel:
          type: string
          description: Column heading for the reasoning options; defaults to `Thinking`.
    AgentCatalogDto:
      type: object
      required: [ agents, defaultAgent, defaultModel ]
      properties:
        agents:
          type: array
          items: { $ref: '#/components/schemas/AgentCatalogAgentDto' }
        defaultAgent:
          type: string
          description: The instance default from overlord.toml, used when no preference is stored.
        defaultModel:
          oneOf:
            - type: string
            - type: 'null'
    UpdateAgentCatalogBody:
      type: object
      description: >-
        Each agent needs a non-blank `key` and `label` (trimmed) and a non-empty `models` list; each
        model needs a non-blank `id`, unique within the agent; a non-null `defaultModel` must name one
        of them; a non-null `defaultReasoningEffort` must be one of the default model's reasoning
        options when it has any. Each failure answers 400. A non-string `key`, `label`, model `id` or
        `displayName`, or a non-object agent or model, answers 500. A later agent with the same key
        replaces an earlier one.
      required: [ agents ]
      properties:
        agents:
          type: array
          description: A missing or non-array value answers 400 `agents array is required`.
          items:
            type: object
            required: [ key, label, models ]
            properties:
              key: { type: string }
              label: { type: string }
              availableByDefault: { type: boolean, description: Only `false` turns it off. }
              models:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [ id ]
                  properties:
                    id: { type: string }
                    displayName: { type: string, description: Trimmed; blank defaults to the id. }
                    reasoningOptions:
                      type: array
                      description: Non-string and blank entries are dropped.
                      items: { type: string }
                    enabled: { type: boolean, description: Only `false` disables. }
              defaultModel:
                oneOf:
                  - type: string
                  - type: 'null'
              defaultReasoningEffort:
                oneOf:
                  - type: string
                  - type: 'null'
              reasoningLabel: { type: string, description: Trimmed; blank defaults to `Thinking`. }
    ExecutionProviderDto:
      type: object
      required: [ kind, executable ]
      properties:
        kind:
          type: string
          enum: [ direct, latch ]
        executable:
          type: string
          description: Latch CLI to invoke; kept while `direct` so switching back is lossless.
    TerminalProfileDto:
      type: object
      required: [ launcher, placement, chord, background, executionProvider, openViewerOnLaunch ]
      properties:
        launcher:
          description: Built-in launcher (`iTerm2`, `Terminal`) or a prefix command; null runs inline.
          oneOf:
            - type: string
            - type: 'null'
        placement:
          type: string
          description: >-
            `window`, `tab` or `chord` on a read; the terminal-profile update echoes the submitted value.
        chord:
          description: Typed shortcut such as `cmd+d` when placement is `chord`.
          oneOf:
            - type: string
            - type: 'null'
        background:
          type: boolean
          description: Open the terminal without taking keyboard focus (macOS; ignored for `chord`).
        executionProvider:
          description: This target's provider override; null inherits the user default.
          oneOf:
            - { $ref: '#/components/schemas/ExecutionProviderDto' }
            - type: 'null'
        openViewerOnLaunch:
          description: This target's viewer-on-launch override; null inherits the user default.
          oneOf:
            - type: boolean
            - type: 'null'
    LaunchSessionDefaultsDto:
      type: object
      required: [ executionProvider, openViewerOnLaunch, worktreeBranchAutomationEnabled ]
      properties:
        executionProvider: { $ref: '#/components/schemas/ExecutionProviderDto' }
        openViewerOnLaunch: { type: boolean }
        worktreeBranchAutomationEnabled:
          type: boolean
          description: Whether launches prepare a per-mission branch and worktree before spawn.
    LaunchSessionSource:
      type: string
      description: Whether an effective value came from the target override or the user default.
      enum: [ target, user_default ]
    ResolvedLaunchSessionDto:
      type: object
      required: [ version, executionProvider, viewer, executionProviderSource, viewerOpenSource ]
      properties:
        version: { const: 1 }
        executionProvider: { $ref: '#/components/schemas/ExecutionProviderDto' }
        viewer:
          type: object
          required: [ kind, launcher, openOnLaunch, openAs, background ]
          properties:
            kind:
              type: string
              enum: [ iterm, terminal, inline, custom ]
            launcher:
              oneOf:
                - type: string
                - type: 'null'
            openOnLaunch: { type: boolean }
            openAs:
              type: string
              enum: [ window, tab ]
              description: Projected from the profile's placement.
            background: { type: boolean }
        executionProviderSource: { $ref: '#/components/schemas/LaunchSessionSource' }
        viewerOpenSource: { $ref: '#/components/schemas/LaunchSessionSource' }
    LaunchSettingsDto:
      type: object
      required:
        [
          executionTargetId,
          deviceLabel,
          agentConfigs,
          terminalProfile,
          launchSessionDefaults,
          resolvedLaunchSession,
          worktreeBranchAutomationEnabled
        ]
      properties:
        executionTargetId:
          description: The acting machine's execution target in this workspace, or null when it has none.
          oneOf:
            - type: string
            - type: 'null'
        deviceLabel:
          oneOf:
            - type: string
            - type: 'null'
        agentConfigs:
          type: object
          description: The caller's launch mechanics for this target, keyed by agent key.
          additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
        terminalProfile: { $ref: '#/components/schemas/TerminalProfileDto' }
        launchSessionDefaults: { $ref: '#/components/schemas/LaunchSessionDefaultsDto' }
        resolvedLaunchSession:
          description: The effective provider and viewer for this machine; null when it has no target.
          oneOf:
            - { $ref: '#/components/schemas/ResolvedLaunchSessionDto' }
            - type: 'null'
        worktreeBranchAutomationEnabled:
          type: boolean
          description: Mirrors `launchSessionDefaults.worktreeBranchAutomationEnabled`.
    UpdateAgentLaunchConfigBody:
      type: object
      properties:
        preCommand:
          type: string
          description: Trimmed. A non-string answers 500.
        flags:
          type: array
          description: Normalized; a non-array value stores an empty list.
          items: { $ref: '#/components/schemas/AgentLaunchFlagInput' }
    UpdateTerminalProfileBody:
      type: object
      properties:
        launcher:
          oneOf:
            - type: string
            - type: 'null'
        placement:
          type: string
          enum: [ window, tab, chord ]
        chord:
          oneOf:
            - type: string
            - type: 'null'
        background: { type: boolean }
        executionProvider:
          description: >-
            Absent keeps the stored override, null clears it. An object sets it: `kind` other than
            `latch` reads as `direct`, and a blank `executable` defaults to the Latch CLI; a non-object
            clears it.
          oneOf:
            - { $ref: '#/components/schemas/ExecutionProviderDto' }
            - type: 'null'
        openViewerOnLaunch:
          description: Absent keeps the stored override, null clears it; a non-boolean clears it.
          oneOf:
            - type: boolean
            - type: 'null'
    UpdateLaunchSessionDefaultsBody:
      type: object
      properties:
        executionProvider:
          description: >-
            Null resets to the default `direct` provider; an object is normalized as for the terminal
            profile, and a non-object also resets to the default.
          oneOf:
            - { $ref: '#/components/schemas/ExecutionProviderDto' }
            - type: 'null'
        openViewerOnLaunch:
          description: Null keeps the stored value. Not type-checked.
          oneOf:
            - type: boolean
            - type: 'null'
        worktreeBranchAutomationEnabled:
          description: Null keeps the stored value. Not type-checked.
          oneOf:
            - type: boolean
            - type: 'null'
    UpdateWorktreeBranchAutomationBody:
      type: object
      properties:
        enabled:
          type: boolean
          description: Only `true` turns automation on.
    LaunchPreferenceDto:
      type: object
      required: [ selectedAgent, selectedModel, selectedReasoningEffort ]
      properties:
        selectedAgent:
          oneOf:
            - type: string
            - type: 'null'
        selectedModel:
          oneOf:
            - type: string
            - type: 'null'
        selectedReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
    UpdateLaunchPreferenceBody:
      type: object
      properties:
        selectedAgent:
          oneOf:
            - type: string
            - type: 'null'
        selectedModel:
          oneOf:
            - type: string
            - type: 'null'
        selectedReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
    LocalTargetBridgeCallBody:
      type: object
      description: >-
        One capability call. `capability` and `input` must both be present and truthy (400 `A
        local-target capability call is required.`).
      required: [ capability, input ]
      properties:
        capability:
          type: string
          description: >-
            `readRepositoryTree`, `listBranches`, `observeResource`, `listWorktrees`,
            `deriveBranchStatus`, `performBranchAction`, `removeWorktree`, `purgeMergedWorktrees`,
            `generateCommitMessageFromLocalDiff`, `writeProjectMetadata`, `discoverLatch`,
            `inspectLatchSession`, `openLatchSession`, `stopLatchSession` or `sendLatchMessage`.
        input:
          $ref: '#/components/schemas/JsonValue'
          description: The capability's input object.
    CapabilityTargetMetadataDto:
      type: object
      required: [ executionTargetId, deviceLabel, transport ]
      properties:
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        deviceLabel:
          oneOf:
            - type: string
            - type: 'null'
        transport:
          type: string
          enum: [ in_process, desktop_bridge, runner_queue, fake ]
    LocalTargetErrorCode:
      type: string
      enum:
        [
          LOCAL_TARGET_REQUIRED,
          LOCAL_TARGET_UNREACHABLE,
          RESOURCE_MISSING,
          NOT_GIT_REPOSITORY,
          PERMISSION_DENIED,
          GIT_COMMAND_FAILED,
          CAPABILITY_NOT_IMPLEMENTED,
          LOCAL_TARGET_TIMEOUT,
          LOCAL_TARGET_UNSUPPORTED,
          TARGET_OPERATION_FAILED,
          LATCH_SESSION_ABSENT,
          UNKNOWN
        ]
    CapabilityResultDto:
      description: A local-target capability result (packages/core/service/local-target/types.ts
        `CapabilityResult`).
      oneOf:
        - type: object
          required: [ ok, value, target ]
          properties:
            ok: { const: true }
            value:
              $ref: '#/components/schemas/JsonValue'
              description: The capability's value.
            target: { $ref: '#/components/schemas/CapabilityTargetMetadataDto' }
        - type: object
          required: [ ok, code, message, target ]
          properties:
            ok: { const: false }
            code: { $ref: '#/components/schemas/LocalTargetErrorCode' }
            message: { type: string }
            details:
              $ref: '#/components/schemas/JsonValue'
              description: Present when the failure carries details.
            target: { $ref: '#/components/schemas/CapabilityTargetMetadataDto' }
    WorktreeDto:
      type: object
      description: A managed worktree as the local-target bridge reports it (packages/contract `WorktreeDto`).
      required:
        [
          path,
          branch,
          projectId,
          projectName,
          missionId,
          missionDisplayId,
          status,
          merged,
          dirty,
          sizeBytes,
          lastModifiedAt
        ]
      properties:
        path: { type: string }
        branch:
          oneOf:
            - type: string
            - type: 'null'
        projectId: { type: string }
        projectName: { type: string }
        missionId:
          oneOf:
            - type: string
            - type: 'null'
        missionDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        status:
          oneOf:
            - { $ref: '#/components/schemas/MissionBranchStatus' }
            - type: 'null'
        merged: { type: boolean }
        dirty: { type: boolean }
        sizeBytes:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        lastModifiedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
    WorktreeList:
      type: array
      maxItems: 0
      items: { $ref: '#/components/schemas/WorktreeDto' }
    RemoveWorktreeBody:
      type: object
      required: [ path ]
      properties:
        path:
          type: string
          description: Worktree path, trimmed and resolved; blank or non-string answers 400.
        force:
          type: boolean
          description: Only `true` removes a dirty worktree.
        primaryRepoPath:
          type: string
          description: Primary repository path; required with `clientExecuted` and on a target.
        clientExecuted:
          type: boolean
          description: '`true` acknowledges a removal the client already ran.'
        projectId:
          type: string
          description: Project UUID that owns the worktree; selects the target the removal is queued to.
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
    PurgeMergedWorktreesBody:
      type: object
      properties:
        projectId: { type: string }
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        primaryRepoPath: { type: string }
        worktreeRoot:
          type: string
          description: Where the target looks for managed worktrees; the target's default when absent or blank.
    PurgeWorktreesResultDto:
      type: object
      required: [ removed, skipped, worktrees ]
      properties:
        removed:
          type: array
          items: { type: string }
        skipped:
          type: array
          items:
            type: object
            required: [ path, reason ]
            properties:
              path: { type: string }
              reason: { type: string }
        worktrees:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/WorktreeDto' }
    RunnerExecutionRequestDto:
      type: object
      description: An execution request as the runner sees it (backend/execution/runner.ts `serviceSummaryToDto`).
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          executionTargetId,
          requestedAgent,
          requestedModel,
          requestedReasoningEffort,
          launchConfig,
          metadata,
          status,
          requestedSource,
          workingDirectory,
          lastError,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId:
          description: Null for a mission-less capability call.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        executionTargetId:
          description: The target that claimed the request, else the target it was stamped with.
          oneOf:
            - type: string
            - type: 'null'
        requestedAgent:
          oneOf:
            - type: string
            - type: 'null'
        requestedModel:
          oneOf:
            - type: string
            - type: 'null'
        requestedReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        launchConfig: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
        metadata:
          type: object
          description: >-
            The request's stored metadata object (malformed JSON reads as empty), for example
            `launchConfigSource`, `launchSession` (frozen at claim) and `providerSession`.
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
        status: { $ref: '#/components/schemas/ExecutionRequestStatus' }
        requestedSource: { type: string }
        workingDirectory:
          description: The resolved working directory; null until resolved.
          oneOf:
            - type: string
            - type: 'null'
        lastError:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    RunnerStatusDto:
      type: object
      required: [ queue, activeCount ]
      properties:
        queue:
          type: array
          items: { $ref: '#/components/schemas/RunnerExecutionRequestDto' }
        activeCount:
          type: integer
          minimum: 0
          description: The length of `queue`.
    RunnerClaimedRequestDto:
      description: A claimed request with the project's launch preparation settings.
      allOf:
        - { $ref: '#/components/schemas/RunnerExecutionRequestDto' }
        - type: object
          required: [ preLaunchCommands, launchEnvVars ]
          properties:
            preLaunchCommands:
              type: array
              description: The project's pre-launch commands, in order.
              items: { type: string }
            launchEnvVars:
              type: object
              description: The project's launch environment variables.
              additionalProperties: { type: string }
    RunnerClaimResponse:
      type: object
      required: [ request, longPoll ]
      properties:
        request:
          oneOf:
            - { $ref: '#/components/schemas/RunnerClaimedRequestDto' }
            - type: 'null'
        longPoll:
          type: boolean
          description: >-
            True on Postgres, where the long-poll wait is available; false on SQLite, where the runner
            keeps its polling cadence.
    RunnerClaimBody:
      type: object
      description: Every member is optional; non-string values are ignored.
      properties:
        projectId:
          type: string
          description: Project UUID or reference limiting the claim to one project.
        deviceFingerprint: { type: string, description: The claiming machine on a hosted backend. }
        deviceLabel: { type: string }
        devicePlatform: { type: string }
        executionTargetId:
          type: string
          description: An already-declared target this runner serves (with `runnerRelation`).
        runnerInstanceId: { type: string, description: Stable runner instance id; registers a heartbeat. }
        runnerRelation:
          type: string
          enum: [ native, adopted ]
          description: Any other value is ignored.
        runnerLabel: { type: string }
        runnerVersion: { type: string }
        capabilities:
          type: object
          description: Runner capability flags (an object; other values are ignored).
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
        supportedAgents:
          type: array
          description: Agent keys; non-strings are dropped.
          items: { type: string }
    RunnerClearBody:
      type: object
      properties:
        objectiveId:
          type: string
          description: Objective UUID or display id; non-strings are ignored.
        projectId:
          type: string
          description: Project UUID or reference; non-strings are ignored.
    RunnerClearResultDto:
      type: object
      required: [ cleared ]
      properties:
        cleared: { type: integer, minimum: 0 }
    RunnerLaunchedBody:
      type: object
      properties:
        providerSession:
          type: object
          description: The Latch session the launch opened; ignored unless `provider` is `latch` with a
            non-blank `providerSessionId`.
          required: [ provider, providerSessionId ]
          properties:
            provider: { const: latch }
            providerSessionId: { type: string }
            sessionName: { type: string }
            executionTargetId: { type: string }
            agentSessionId: { type: string }
            createdAt: { type: string }
            lastObservedState: { type: string, description: Defaults to `running`. }
    RunnerFailedBody:
      type: object
      properties:
        error:
          type: string
          description: Failure message stored as `lastError`; a non-string uses `Launch failed`.
    RunnerCompletedBody:
      type: object
      required: [ mutationResult ]
      properties:
        mutationResult: { $ref: '#/components/schemas/CapabilityResultDto' }
    ProtocolRequestBody:
      type: object
      description: >-
        The envelope `ovld protocol` posts (backend/protocol/flags.ts `ProtocolRequestBody`). Which
        flags and positionals a subcommand reads is specified by contract/protocol-commands.yaml. An
        absent body is treated as empty.
      properties:
        args:
          type: array
          description: The raw command-line arguments after the subcommand.
          items: { type: string }
        positional:
          type: array
          description: Positional arguments.
          items: { type: string }
        flags:
          type: object
          description: >-
            Flags keyed by their long name including the dashes (`--mission-id`); a string value, or
            `true` for a boolean flag.
          additionalProperties:
            oneOf:
              - type: string
              - type: boolean
        fileInputs:
          type: object
          description: File payloads keyed by the `--*-file` flag that named them.
          additionalProperties: { type: string }
        externalSessionId:
          oneOf:
            - type: string
            - type: 'null'
    AgentSessionChannelState:
      type: string
      enum: [ preparing, online, degraded, ended, lost ]
    AgentRequestKind:
      type: string
      enum: [ question, permission, choice, retry ]
    AgentRequestStatus:
      type: string
      enum: [ open, resolved, released_to_terminal, expired, cancelled ]
    AgentSessionChannelSelfDto:
      type: object
      required: [ channelId, state, bound, missionId, adapterKey, capabilities, leaseExpiresAt ]
      properties:
        channelId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/AgentSessionChannelState' }
        bound:
          type: boolean
          description: Whether the channel is bound to an agent session.
        missionId: { type: string, format: uuid }
        adapterKey:
          oneOf:
            - type: string
            - type: 'null'
        capabilities: { $ref: '#/components/schemas/JsonValue' }
        leaseExpiresAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
    AgentSessionHeartbeatBody:
      type: object
      properties:
        state:
          type: string
          enum: [ online, degraded ]
          description: Only `degraded` is honoured; anything else is `online`.
        capabilities:
          type: object
          description: Replaces the stored capabilities when present and truthy.
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
        nativeSessionId: { type: string }
        adapterVersion: { type: string }
    AgentSessionHeartbeatDto:
      type: object
      required: [ ok, leaseExpiresAt, credentialExpiresAt ]
      properties:
        ok: { const: true }
        leaseExpiresAt: { $ref: '#/components/schemas/DateTime' }
        credentialExpiresAt: { $ref: '#/components/schemas/DateTime' }
    AgentSessionEventInput:
      type: object
      required: [ eventId, kind ]
      properties:
        eventId:
          type: string
          description: Producer event id, unique per channel and adapter; at most 200 characters.
        kind: { type: string, description: At most 200 characters. }
        producerSequence: { type: number }
        occurredAt: { type: string, description: Parsed as a date; unparseable or future values use the server time. }
        severity: { type: string }
        actionability: { type: string }
        nativeEvent: { type: string }
        nativeTurnId: { type: string }
        nativeCallId: { type: string }
        subagentId: { type: string }
        correlationId: { type: string }
        origin: { type: string }
        summary: '{ type: string }'
        payload:
          type: object
          description: At most 8 KiB serialized.
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
    AppendAgentSessionEventsBody:
      description: One event, or a batch in `events`.
      oneOf:
        - type: object
          required: [ events ]
          properties:
            events:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/AgentSessionEventInput' }
        - { $ref: '#/components/schemas/AgentSessionEventInput' }
    AppendAgentSessionEventsDto:
      type: object
      required: [ accepted ]
      properties:
        accepted:
          type: array
          items:
            type: object
            required: [ id, channelSequence, duplicate ]
            properties:
              id: { type: string, format: uuid }
              channelSequence: { type: integer, minimum: 1 }
              duplicate: { type: boolean }
    AgentRequestOption:
      type: object
      required: [ optionId, label, kind ]
      properties:
        optionId: { type: string }
        label: { type: string }
        kind: { type: string }
    CreateAgentRequestBody:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/AgentRequestKind'
          description: Defaults to `question`.
        summary: '{ type: string }'
        details:
          type: object
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
        options:
          type: array
          description: At most 12 are kept.
          items: { $ref: '#/components/schemas/AgentRequestOption' }
        allowsFreeText: { type: boolean, description: Only `true` allows a free-text answer. }
        nativeRequestId: { type: string }
        nativeCallId: { type: string }
        windowExpiresAt: { type: string }
        windowBasis: { type: string }
    CreatedAgentRequestDto:
      type: object
      required: [ requestId, status, revision, windowExpiresAt ]
      properties:
        requestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AgentRequestStatus' }
        revision: { type: integer, minimum: 1 }
        windowExpiresAt:
          oneOf:
            - type: string
            - type: 'null'
    AgentRequestDto:
      type: object
      description: An agent request (backend/agent-session-routes.ts `requestDto`).
      required:
        [
          id,
          channelId,
          missionId,
          objectiveId,
          kind,
          summary,
          options,
          allowsFreeText,
          status,
          resolution,
          revision,
          windowExpiresAt,
          releasedReason,
          applicationState,
          resolvedAt,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        kind: { $ref: '#/components/schemas/AgentRequestKind' }
        summary: '{ type: string }'
        options:
          type: array
          description: The stored options as written.
          items: { $ref: '#/components/schemas/JsonValue' }
        allowsFreeText: { type: boolean }
        status: { $ref: '#/components/schemas/AgentRequestStatus' }
        resolution:
          description: The stored resolution object; null while unresolved.
          $ref: '#/components/schemas/JsonValue'
        revision: { type: integer, minimum: 1 }
        windowExpiresAt:
          oneOf:
            - type: string
            - type: 'null'
        releasedReason:
          description: '`timeout`, `local_activity`, `policy`, `interrupt`, `channel_ended` or `channel_lost`.'
          oneOf:
            - type: string
            - type: 'null'
        applicationState:
          type: string
          description: '`pending` until recorded, then `emitted`, `applied`, `not_applied` or `unknown`.'
        resolvedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
    AgentRequestDeliveryDto:
      type: object
      required: [ mode, reason, state, observedAt ]
      properties:
        mode:
          type: string
          enum: [ latch, read_only ]
        reason:
          oneOf:
            - type: string
              enum: [ no_latch_session, latch_session_exited, target_offline, request_closed ]
            - type: 'null'
        state:
          oneOf:
            - type: string
              enum: [ emitted, applied, not_applied, unknown ]
            - type: 'null'
        observedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
    HumanAgentRequestDto:
      description: A request with its delivery mode, as the human routes return it.
      allOf:
        - { $ref: '#/components/schemas/AgentRequestDto' }
        - type: object
          required: [ delivery ]
          properties:
            delivery: { $ref: '#/components/schemas/AgentRequestDeliveryDto' }
    AgentRequestListResponse:
      type: object
      required: [ requests ]
      properties:
        requests:
          type: array
          items: { $ref: '#/components/schemas/HumanAgentRequestDto' }
    AgentRequestLeaseBody:
      type: object
      properties:
        leaseId: { type: string, description: The lease to renew; blank or absent acquires a new one. }
    AgentRequestLeaseDto:
      type: object
      required: [ leaseId, leaseExpiresAt, status, revision, resolution ]
      properties:
        leaseId: { type: string }
        leaseExpiresAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/AgentRequestStatus' }
        revision: { type: integer, minimum: 1 }
        resolution: { $ref: '#/components/schemas/JsonValue' }
    ReleaseAgentRequestBody:
      type: object
      properties:
        reason:
          type: string
          enum: [ timeout, local_activity, policy, interrupt ]
    ReleasedAgentRequestDto:
      type: object
      required: [ released, status, resolution ]
      properties:
        released: { type: boolean }
        status: { $ref: '#/components/schemas/AgentRequestStatus' }
        resolution: { $ref: '#/components/schemas/JsonValue' }
    RecordAgentRequestApplicationBody:
      type: object
      properties:
        applicationState:
          type: string
          enum: [ emitted, applied, not_applied, unknown ]
    AgentRequestResolvedElsewhereDto:
      type: object
      required: [ changed, status, releasedReason ]
      properties:
        changed: { type: boolean }
        status: { $ref: '#/components/schemas/AgentRequestStatus' }
        releasedReason:
          oneOf:
            - type: string
            - type: 'null'
    AgentSessionInputKind:
      type: string
      enum: [ instruction, retry, continue ]
    AgentSessionInputStatus:
      type: string
      enum: [ queued, leased, emitted, acknowledged, failed, expired, cancelled ]
    ClaimedAgentSessionInputDto:
      type: object
      required: [ input ]
      properties:
        input:
          oneOf:
            - type: object
              required: [ id, kind, body, leaseId, leaseExpiresAt ]
              properties:
                id: { type: string, format: uuid }
                kind: { $ref: '#/components/schemas/AgentSessionInputKind' }
                body: { type: string }
                leaseId: { type: string }
                leaseExpiresAt: { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
    MarkAgentSessionInputEmittedBody:
      type: object
      required: [ leaseId ]
      properties:
        leaseId: { type: string }
        deliveryOutcome:
          type: string
          enum: [ delivered, queued_turn_boundary, queued_next_turn, unsupported ]
    MarkAgentSessionInputFailedBody:
      type: object
      properties:
        errorCode: { type: string, description: Defaults to `adapter_error`. }
    EndAgentSessionChannelBody:
      type: object
      properties:
        reason: { type: string, description: Defaults to `session_ended`. }
        exitCode: { type: number, description: A non-number is stored as null. }
    ResolveAgentRequestBody:
      type: object
      required: [ expectedRevision, resolution ]
      properties:
        expectedRevision: { type: integer, description: The request revision the answer was made against. }
        resolution:
          type: object
          description: '`text` and/or `optionId`; stored as given.'
          properties:
            text: { type: string, description: Trimmed; refused unless the request allows free text. }
            optionId: { type: string, description: Trimmed; must name one of the request's options. }
          additionalProperties: { $ref: '#/components/schemas/JsonValue' }
    ResolveAgentRequestResultDto:
      type: object
      required: [ resolved, request ]
      properties:
        resolved: { type: boolean }
        request: { $ref: '#/components/schemas/HumanAgentRequestDto' }
    AgentSessionInputDto:
      type: object
      required:
        [
          id,
          channelId,
          missionId,
          objectiveId,
          sessionId,
          kind,
          body,
          status,
          deliveryOutcome,
          deliveryLabel,
          attemptCount,
          lastErrorCode,
          emittedAt,
          acknowledgedAt,
          createdAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        sessionId:
          oneOf:
            - type: string
            - type: 'null'
        kind: { $ref: '#/components/schemas/AgentSessionInputKind' }
        body: { type: string }
        status: { $ref: '#/components/schemas/AgentSessionInputStatus' }
        deliveryOutcome:
          oneOf:
            - type: string
              enum: [ delivered, queued_turn_boundary, queued_next_turn, unsupported ]
            - type: 'null'
        deliveryLabel:
          type: string
          description: Display label, for example `Delivered`, `Queued (turn boundary)`, `Sent to harness`.
        attemptCount: { type: integer, minimum: 0 }
        lastErrorCode:
          oneOf:
            - type: string
            - type: 'null'
        emittedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        acknowledgedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    AgentSessionChannelSnapshotDto:
      type: object
      required: [ id, state, agentIdentifier, adapterKey, capabilities, lastHeartbeatAt, endedAt, endReason ]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/AgentSessionChannelState' }
        agentIdentifier:
          oneOf:
            - type: string
            - type: 'null'
        adapterKey:
          oneOf:
            - type: string
            - type: 'null'
        capabilities: { $ref: '#/components/schemas/JsonValue' }
        lastHeartbeatAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        endedAt:
          oneOf:
            - { $ref: '#/components/schemas/DateTime' }
            - type: 'null'
        endReason:
          oneOf:
            - type: string
            - type: 'null'
    AgentSessionInputListResponse:
      type: object
      description: >-
        `liveChannelId` and `liveChannel` are absent (not null) when the caller has no active workspace
        membership, which answers `{ inputs: [] }`.
      required: [ inputs ]
      properties:
        liveChannelId:
          description: The latest channel's id while it is `preparing`, `online` or `degraded`; null otherwise.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        liveChannel:
          description: The mission's (or objective's) most recent channel, live or not; null when it never had one.
          oneOf:
            - { $ref: '#/components/schemas/AgentSessionChannelSnapshotDto' }
            - type: 'null'
        inputs:
          type: array
          items: { $ref: '#/components/schemas/AgentSessionInputDto' }
    ChatThreadDto:
      type: object
      required:
        [
          id,
          organizationId,
          title,
          titleSource,
          archivedAt,
          lastActivityAt,
          activeRunState,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title:
          type: string
          description: '`''''` until the first message titles the thread; at most 80 characters once set.'
        titleSource:
          type: string
          enum: [ pending, generated, user ]
        archivedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        lastActivityAt: { $ref: '#/components/schemas/DateTime' }
        activeRunState:
          description: The state of the thread's unfinished run, or null.
          oneOf:
            - type: string
              enum: [ queued, running, waiting_user ]
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    ChatThreadListResponse:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ChatThreadDto' }
        nextCursor:
          description: Opaque cursor for the next page, or null on the last page.
          oneOf: [ { type: string }, { type: 'null' } ]
    ChatTextBlockDto:
      type: object
      required: [ id, kind, text, fallbackText, evidenceIds ]
      properties:
        id: { type: string }
        kind: { const: text }
        text:
          type: string
          description: Markdown. Citations reference `evidenceIds`.
        fallbackText: { type: string }
        evidenceIds:
          type: array
          items: { type: string }
    ChatEvidenceBlockDto:
      type: object
      required: [ id, kind, evidence, fallbackText ]
      properties:
        id: { type: string }
        kind: { const: evidence }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ChatEvidenceDto' }
        fallbackText: { type: string }
    ChatProposalBlockDto:
      type: object
      required: [ id, kind, proposalId, revision, fallbackText ]
      properties:
        id: { type: string }
        kind: { const: proposal }
        proposalId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        fallbackText: { type: string }
    ChatUnavailableBlockDto:
      type: object
      description: Replaces every block of a message whose sources are no longer authorized.
      required: [ id, kind, reason, regenerable, fallbackText ]
      properties:
        id:
          const: unavailable
        kind: { const: unavailable }
        reason: { const: source_access_lost }
        regenerable: { const: true }
        fallbackText: { type: string }
    ChatBlockDto:
      description: >-
        One block of a message. The server writes these four kinds; the TypeScript union also declares
        `question` and `mission` blocks, which no writer produces (see schema-disagreements.md).
      oneOf:
        - $ref: '#/components/schemas/ChatTextBlockDto'
        - $ref: '#/components/schemas/ChatEvidenceBlockDto'
        - $ref: '#/components/schemas/ChatProposalBlockDto'
        - $ref: '#/components/schemas/ChatUnavailableBlockDto'
    ChatSourceLocatorDto:
      description: Where an evidence reference came from. Never an absolute path or credential.
      oneOf:
        - type: object
          required: [ kind, connectionId, workspace, nodeId, path ]
          properties:
            kind: { const: knowledgebase }
            connectionId: { type: string }
            workspace: { type: string }
            nodeId: { type: string }
            path:
              oneOf: [ { type: string }, { type: 'null' } ]
        - type: object
          required: [ kind, entityType, entityId, projectId ]
          properties:
            kind: { const: overlord }
            entityType:
              type: string
              enum: [ project, mission, delivery ]
            entityId: { type: string }
            projectId: { type: string }
        - type: object
          required: [ kind, executionTargetId, projectId, resourceKey, relativePath, head ]
          properties:
            kind: { const: repository }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            relativePath:
              description: Repository-relative path, or null for resource-level observations.
              oneOf: [ { type: string }, { type: 'null' } ]
            head:
              oneOf: [ { type: string }, { type: 'null' } ]
    ChatEvidenceDto:
      type: object
      required: [ id, source, sourceRevision, observedAt, label, excerpt, truncated, stale ]
      properties:
        id: { type: string }
        source: { $ref: '#/components/schemas/ChatSourceLocatorDto' }
        sourceRevision:
          oneOf: [ { type: string }, { type: 'null' } ]
        observedAt: { $ref: '#/components/schemas/DateTime' }
        label: { type: string }
        excerpt:
          oneOf: [ { type: string }, { type: 'null' } ]
        truncated: { type: boolean }
        stale:
          type: boolean
          description: True when the observation is more than 15 minutes old when attached.
    ChatMessageDto:
      type: object
      required:
        [
          id,
          threadId,
          role,
          state,
          blocks,
          runId,
          answersQuestionId,
          clientRequestId,
          createdAt,
          updatedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        role:
          type: string
          enum: [ user, assistant ]
        state:
          type: string
          enum: [ streaming, complete, interrupted ]
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ChatBlockDto' }
        runId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        answersQuestionId:
          description: Set on a user message that answered a question.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        clientRequestId:
          description: The submitting client's request id on user messages; null on assistant messages.
          oneOf: [ { type: string }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
    ChatRunUsageDto:
      type: object
      required: [ toolCalls, activeProcessingMs, gatheredContentBytes ]
      properties:
        toolCalls: { type: integer, minimum: 0 }
        activeProcessingMs: { type: integer, minimum: 0 }
        gatheredContentBytes: { type: integer, minimum: 0 }
    ChatKnowledgebaseWriteDto:
      type: object
      description: >-
        A per-request grant for the assistant to write to one Knowledgebase workspace through one of the
        caller's connections.
      required: [ connectionId, workspace ]
      additionalProperties: false
      properties:
        connectionId:
          type: string
          format: uuid
          description: A UUID (any letter case on input; answered in lower case).
        workspace:
          type: string
          description: A Knowledgebase workspace slug (`^[a-z0-9][a-z0-9-]{0,62}$`).
    ChatRunDto:
      type: object
      required:
        [
          id,
          threadId,
          triggerMessageId,
          state,
          outcome,
          failureCode,
          continueAvailable,
          continuedFromRunId,
          knowledgebaseWrite,
          usage,
          cancelRequestedAt,
          createdAt,
          updatedAt,
          completedAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        triggerMessageId: { type: string, format: uuid }
        state:
          type: string
          enum: [ queued, running, waiting_user, completed, failed, cancelled ]
        outcome:
          description: Set on `completed` runs.
          oneOf:
            - type: string
              enum: [ answered, allowance_exhausted ]
            - type: 'null'
        failureCode:
          description: Set on `failed` runs.
          oneOf:
            - type: string
              enum:
                [
                  provider_unavailable,
                  rate_limited,
                  context_limit,
                  unsupported_capability,
                  interrupted,
                  provider_error,
                  source_access_lost
                ]
            - type: 'null'
        continueAvailable:
          type: boolean
          description: >-
            True on a run that completed `allowance_exhausted`: in the `run.updated` event that ended
            it, and on a snapshot's `latestRun` while no run is unfinished and none continues it. False
            everywhere else.
        continuedFromRunId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        knowledgebaseWrite:
          description: The Knowledgebase write grant of this run; null for research only.
          oneOf: [ { $ref: '#/components/schemas/ChatKnowledgebaseWriteDto' }, { type: 'null' } ]
        usage: { $ref: '#/components/schemas/ChatRunUsageDto' }
        cancelRequestedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        completedAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        revision: { type: integer, minimum: 1 }
    ChatQuestionOptionDto:
      type: object
      required: [ id, label ]
      properties:
        id: { type: string }
        label: { type: string }
    ChatQuestionDto:
      type: object
      required:
        [
          id,
          threadId,
          runId,
          ordinal,
          state,
          prompt,
          options,
          allowFreeText,
          answerMessageId,
          createdAt,
          answeredAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        ordinal:
          type: integer
          minimum: 1
          description: 1-based ordinal of the question within its run.
        state:
          type: string
          enum: [ open, answered, superseded, cancelled ]
        prompt: { type: string }
        options:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ChatQuestionOptionDto' }
        allowFreeText: { type: boolean }
        answerMessageId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        answeredAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        revision: { type: integer, minimum: 1 }
    ChatAssignmentDto:
      type: object
      description: The agent selection frozen when the proposal revision was prepared.
      required: [ agent, model, reasoningEffort, source ]
      properties:
        agent: { type: string }
        model:
          type: string
          description: Always a model enabled in the workspace catalog when the revision was prepared.
        reasoningEffort:
          oneOf: [ { type: string }, { type: 'null' } ]
        source:
          type: string
          enum: [ project_default, assistant_selection ]
    ChatProposalObjectiveDto:
      type: object
      required: [ title, objective, acceptanceCriteria, resourceKey, assignment, evidenceIds ]
      properties:
        title: { type: string }
        objective: { type: string }
        acceptanceCriteria:
          type: array
          maxItems: 50
          items: { type: string }
        resourceKey: { type: string }
        assignment: { $ref: '#/components/schemas/ChatAssignmentDto' }
        evidenceIds:
          type: array
          maxItems: 100
          items: { type: string }
    ChatProposalMissionDto:
      type: object
      required:
        [
          key,
          projectId,
          projectName,
          workspaceId,
          title,
          objectives,
          dependencies,
          audienceWarning
        ]
      properties:
        key:
          type: string
          description: Stable within a proposal across revisions.
        projectId: { type: string }
        projectName:
          type: string
          description: Snapshot for display; authorization is by `projectId`.
        workspaceId: { type: string }
        title: { type: string }
        objectives:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ChatProposalObjectiveDto' }
        dependencies:
          type: array
          maxItems: 10
          description: Keys of other missions in this proposal.
          items: { type: string }
        audienceWarning:
          description: Always set by the server to a fixed reminder that drafts are visible to the destination
            project's members.
          oneOf: [ { type: string }, { type: 'null' } ]
    ChatProposalRevisionDto:
      type: object
      required: [ revision, missions, responsibleProfileId, invalidated, createdAt ]
      properties:
        revision: { type: integer, minimum: 1 }
        missions:
          type: array
          maxItems: 10
          description: Empty when `invalidated`.
          items: { $ref: '#/components/schemas/ChatProposalMissionDto' }
        responsibleProfileId: { type: string }
        invalidated:
          type: boolean
          description: True when the revision's sources are no longer authorized.
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ChatCreatedMissionDto:
      type: object
      required: [ missionId, missionDisplayId, projectId, objectiveIds ]
      properties:
        missionId: { type: string, format: uuid }
        missionDisplayId:
          type: string
          description: '`''''` when the mission no longer exists.'
        projectId: { type: string }
        objectiveIds:
          type: array
          items: { type: string, format: uuid }
    ChatCreationReceiptDto:
      type: object
      required: [ id, proposalId, revision, missions, createdAt ]
      properties:
        id: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        missions:
          type: array
          items: { $ref: '#/components/schemas/ChatCreatedMissionDto' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ChatProposalDto:
      type: object
      required: [ id, threadId, state, currentRevision, current, receipt, createdAt, updatedAt ]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        state:
          type: string
          enum: [ open, created, cancelled ]
        currentRevision: { type: integer, minimum: 1 }
        current: { $ref: '#/components/schemas/ChatProposalRevisionDto' }
        receipt:
          oneOf: [ { $ref: '#/components/schemas/ChatCreationReceiptDto' }, { type: 'null' } ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    ChatThreadSnapshotDto:
      type: object
      required:
        [
          thread,
          messages,
          hasEarlierMessages,
          activeRun,
          latestRun,
          openQuestion,
          openProposals,
          referencedProposals,
          eventCursor,
          retainedFromSeq
        ]
      properties:
        thread: { $ref: '#/components/schemas/ChatThreadDto' }
        messages:
          type: array
          maxItems: 100
          description: Oldest first.
          items: { $ref: '#/components/schemas/ChatMessageDto' }
        hasEarlierMessages: { type: boolean }
        activeRun:
          description: The unfinished run, or null.
          oneOf: [ { $ref: '#/components/schemas/ChatRunDto' }, { type: 'null' } ]
        latestRun:
          description: The most recent `completed`, `failed` or `cancelled` run, or null.
          oneOf: [ { $ref: '#/components/schemas/ChatRunDto' }, { type: 'null' } ]
        openQuestion:
          description: The open question while its sources are authorized, else null.
          oneOf: [ { $ref: '#/components/schemas/ChatQuestionDto' }, { type: 'null' } ]
        openProposals:
          type: array
          items: { $ref: '#/components/schemas/ChatProposalDto' }
        referencedProposals:
          type: array
          description: Non-open proposals named by a proposal block in `messages`.
          items: { $ref: '#/components/schemas/ChatProposalDto' }
        eventCursor:
          type: integer
          minimum: 0
          description: The thread's last event sequence; subscribe with `after = eventCursor`.
        retainedFromSeq:
          type: integer
          minimum: 1
          description: Oldest replayable sequence; `after` below `retainedFromSeq - 1` is `snapshot_required`.
    ChatEventDto:
      description: >-
        One persisted thread event. Every kind carries `threadId`, `seq` (strictly increasing per
        thread, gap-free in storage) and `createdAt`.
      oneOf:
        - type: object
          required: [ kind, thread, threadId, seq, createdAt ]
          properties:
            kind: { const: thread.updated }
            thread: { $ref: '#/components/schemas/ChatThreadDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, message, threadId, seq, createdAt ]
          properties:
            kind: { const: message.created }
            message: { $ref: '#/components/schemas/ChatMessageDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, messageId, blockId, text, threadId, seq, createdAt ]
          properties:
            kind: { const: message.delta }
            messageId: { type: string, format: uuid }
            blockId: { type: string }
            text:
              type: string
              description: Text appended to the block.
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, message, threadId, seq, createdAt ]
          properties:
            kind: { const: message.completed }
            message: { $ref: '#/components/schemas/ChatMessageDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, run, threadId, seq, createdAt ]
          properties:
            kind: { const: run.updated }
            run: { $ref: '#/components/schemas/ChatRunDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, runId, toolCallId, label, state, threadId, seq, createdAt ]
          properties:
            kind: { const: tool.updated }
            runId: { type: string, format: uuid }
            toolCallId: { type: string }
            label:
              type: string
              description: Sanitized, user-facing progress label.
            state:
              type: string
              enum: [ requested, executing, completed, failed, cancelled ]
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, question, threadId, seq, createdAt ]
          properties:
            kind: { const: question.opened }
            question: { $ref: '#/components/schemas/ChatQuestionDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, question, threadId, seq, createdAt ]
          properties:
            kind: { const: question.closed }
            question: { $ref: '#/components/schemas/ChatQuestionDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, proposal, threadId, seq, createdAt ]
          properties:
            kind: { const: proposal.revised }
            proposal: { $ref: '#/components/schemas/ChatProposalDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, proposal, threadId, seq, createdAt ]
          properties:
            kind: { const: proposal.created }
            proposal: { $ref: '#/components/schemas/ChatProposalDto' }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
        - type: object
          required: [ kind, messageIds, proposalIds, threadId, seq, createdAt ]
          properties:
            kind: { const: content.invalidated }
            messageIds:
              type: array
              description: Replace these messages from a fresh snapshot.
              items: { type: string, format: uuid }
            proposalIds:
              type: array
              items: { type: string, format: uuid }
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 1 }
            createdAt: { $ref: '#/components/schemas/DateTime' }
    ChatStreamFrameDto:
      description: >-
        The JSON of one `data:` frame on the event stream. The stream itself is `text/event-stream`
        framing, not JSON.
      oneOf:
        - type: object
          required: [ type, event ]
          properties:
            type: { const: event }
            event: { $ref: '#/components/schemas/ChatEventDto' }
        - type: object
          required: [ type, retainedFromSeq ]
          properties:
            type: { const: snapshot_required }
            retainedFromSeq: { type: integer, minimum: 1 }
        - type: object
          required: [ type, at ]
          properties:
            type: { const: heartbeat }
            at: { $ref: '#/components/schemas/DateTime' }
    ChatEventPageDto:
      type: object
      required: [ events, cursor, hasMore ]
      properties:
        events:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ChatEventDto' }
        cursor:
          type: integer
          minimum: 0
          description: The last returned `seq`, or the request's `after` when none; pass it as `after` next.
        hasMore: { type: boolean }
    SubmitChatMessageBody:
      type: object
      required: [ clientRequestId, text ]
      properties:
        clientRequestId:
          type: string
          maxLength: 200
          description: Non-blank; idempotency key per thread.
        text:
          type: string
          maxLength: 16000
          description: Non-blank. Not validated on a replay.
        optionId:
          type: string
          description: An option of the open question, when answering through a card option.
        knowledgebaseWrite:
          description: Authorizes Knowledgebase writes for the run this message starts or resumes.
          oneOf: [ { $ref: '#/components/schemas/ChatKnowledgebaseWriteDto' }, { type: 'null' } ]
    CreateChatThreadBody:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/SubmitChatMessageBody'
          description: Optional first message.
    CreateChatThreadResponse:
      type: object
      required: [ thread, message, run ]
      properties:
        thread: { $ref: '#/components/schemas/ChatThreadDto' }
        message:
          oneOf: [ { $ref: '#/components/schemas/ChatMessageDto' }, { type: 'null' } ]
        run:
          oneOf: [ { $ref: '#/components/schemas/ChatRunDto' }, { type: 'null' } ]
    UpdateChatThreadBody:
      type: object
      required: [ expectedRevision ]
      description: At least one of `title` and `archived` is required.
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        title:
          type: string
          maxLength: 80
          description: Non-blank; stored trimmed.
        archived: { type: boolean }
    SubmitChatMessageResponse:
      type: object
      required: [ message, run, replayed ]
      properties:
        message: { $ref: '#/components/schemas/ChatMessageDto' }
        run: { $ref: '#/components/schemas/ChatRunDto' }
        replayed:
          type: boolean
          description: True when an earlier submission with the same `clientRequestId` was answered.
    AnswerChatQuestionBody:
      type: object
      required: [ clientRequestId, expectedRevision ]
      description: '`text`, or an `optionId` whose label becomes the text, is required.'
      properties:
        clientRequestId:
          type: string
          maxLength: 200
        expectedRevision: { type: integer, minimum: 1 }
        optionId: { type: string }
        text:
          type: string
          maxLength: 16000
    CancelChatRunBody:
      type: object
      required: [ clientRequestId ]
      properties:
        clientRequestId:
          type: string
          maxLength: 200
    ContinueChatRunBody:
      type: object
      required: [ clientRequestId ]
      properties:
        clientRequestId:
          type: string
          maxLength: 200
    ContinueChatRunResponse:
      type: object
      required: [ run, replayed ]
      properties:
        run: { $ref: '#/components/schemas/ChatRunDto' }
        replayed:
          type: boolean
          description: True when a run already continued the addressed run.
    CreateFromChatProposalBody:
      type: object
      required: [ clientRequestId, expectedRevision ]
      properties:
        clientRequestId:
          type: string
          maxLength: 200
          description: Non-blank; unique per owner across proposals.
        expectedRevision: { type: integer, minimum: 1 }
    CreateFromChatProposalResponse:
      type: object
      required: [ proposal, receipt, replayed ]
      properties:
        proposal: { $ref: '#/components/schemas/ChatProposalDto' }
        receipt: { $ref: '#/components/schemas/ChatCreationReceiptDto' }
        replayed: { type: boolean }
    UpdateChatPresenceBody:
      type: object
      required: [ clientId, platform, state ]
      properties:
        clientId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum: [ ios, web, desktop ]
        state:
          type: string
          enum: [ foreground, released ]
    ChatPresenceDto:
      type: object
      required: [ clientId, expiresAt ]
      properties:
        clientId: { type: string }
        expiresAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
    AckChatEventsBody:
      type: object
      required: [ clientId, seq ]
      properties:
        clientId:
          type: string
          maxLength: 200
        seq:
          type: integer
          minimum: 0
          description: At most the thread's last event sequence.
    ChatAckDto:
      type: object
      required: [ clientId, ackedSeq, suppressedNotificationIds ]
      properties:
        clientId: { type: string }
        ackedSeq: { type: integer, minimum: 0 }
        suppressedNotificationIds:
          type: array
          items: { type: string, format: uuid }
    ChatProviderReadinessDto:
      type: object
      required: [ provider, model, state, checkedAt ]
      properties:
        provider: { const: gemini }
        model: { type: string }
        state:
          type: string
          enum: [ ready, not_configured, unavailable, rate_limited ]
        checkedAt: { $ref: '#/components/schemas/DateTime' }
    ChatProvidersResponse:
      type: object
      required: [ providers, connections ]
      properties:
        providers:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/ChatProviderReadinessDto' }
        connections:
          type: array
          description: The caller's organization-scoped connections in the selected organization.
          items: { $ref: '#/components/schemas/AccountConnectionDto' }
    ChatNotificationDto:
      type: object
      required:
        [
          id,
          type,
          organizationId,
          threadId,
          runId,
          questionId,
          threadTitle,
          createdAt,
          dispatchedAt,
          readAt,
          revision
        ]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [ chat_needs_answer, chat_finished ]
        organizationId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        questionId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        threadTitle:
          type: string
          description: The thread title captured at dispatch (`''` when none).
        createdAt: { $ref: '#/components/schemas/DateTime' }
        dispatchedAt: { $ref: '#/components/schemas/DateTime' }
        readAt:
          oneOf: [ { $ref: '#/components/schemas/DateTime' }, { type: 'null' } ]
        revision: { type: integer, minimum: 1 }
    ChatNotificationListResponse:
      type: object
      required: [ items, unreadCount ]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ChatNotificationDto' }
        unreadCount:
          type: integer
          minimum: 0
          description: Every unread dispatched notification in the selected organization.
    MarkChatNotificationReadBody:
      type: object
      required: [ expectedRevision ]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    ChatDiagnosticDto:
      type: object
      required: [ seq, threadId, runId, attemptId, kind, createdAt, payload ]
      properties:
        seq: { type: integer, minimum: 1 }
        threadId: { type: string, format: uuid }
        runId:
          oneOf: [ { type: string }, { type: 'null' } ]
        attemptId:
          oneOf: [ { type: string }, { type: 'null' } ]
        kind:
          type: string
          description: An event kind, `http.exchange`, or a provider observation kind.
        createdAt: { $ref: '#/components/schemas/DateTime' }
        payload:
          $ref: '#/components/schemas/JsonValue'
          description: Unredacted observation.
    ChatDiagnosticPageDto:
      type: object
      required: [ entries, nextCursor, hasMore ]
      properties:
        entries:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ChatDiagnosticDto' }
        nextCursor:
          type: integer
          minimum: 0
          description: The last returned `seq`, or the request's `after` when none.
        hasMore: { type: boolean }
    EverhourUserConnectionDto:
      type: object
      description: The caller's Everhour connection state (never includes the key).
      required: [ connected, accountName ]
      properties:
        connected: { type: boolean }
        accountName:
          description: The Everhour user's name when known; null when not connected.
          oneOf: [ { type: string }, { type: 'null' } ]
    UpdateEverhourIntegrationBody:
      type: object
      required: [ apiKey ]
      properties:
        apiKey:
          type: string
          description: The caller's personal Everhour API key; coerced to a string and trimmed, never echoed.
    ProjectEverhourLinkDto:
      type: object
      required: [ projectId, everhourProjectName, everhourProjectId ]
      properties:
        projectId: { type: string, format: uuid }
        everhourProjectName:
          description: The name submitted when linking.
          oneOf: [ { type: string }, { type: 'null' } ]
        everhourProjectId:
          oneOf: [ { type: string }, { type: 'null' } ]
    LinkProjectEverhourBody:
      type: object
      properties:
        everhourProjectName:
          description: A name to find or create; missing, null or blank unlinks.
          oneOf: [ { type: string }, { type: 'null' } ]
    EverhourTimeRecordDto:
      type: object
      required: [ id, timeSeconds, date, comment ]
      properties:
        id:
          type: string
          description: Everhour's record id as a string; records without an id are dropped.
        timeSeconds: { type: number }
        date:
          type: string
          description: '`YYYY-MM-DD` as reported by Everhour (`''''` when Everhour gives none).'
        comment:
          oneOf: [ { type: string }, { type: 'null' } ]
    EverhourTimerDto:
      type: object
      required: [ taskId, startedAt, durationSeconds, comment ]
      properties:
        taskId: { type: string }
        startedAt:
          description: Everhour's start time as reported (`YYYY-MM-DD HH:MM:SS`), not ISO-8601.
          oneOf: [ { type: string }, { type: 'null' } ]
        durationSeconds: { type: number }
        comment:
          oneOf: [ { type: string }, { type: 'null' } ]
    MissionEverhourStateDto:
      type: object
      required: [ connected, projectLinked, taskId, records, totalSeconds, runningTimer ]
      properties:
        connected:
          type: boolean
          description: True when the caller's Everhour key could be read.
        projectLinked: { type: boolean }
        taskId:
          oneOf: [ { type: string }, { type: 'null' } ]
        records:
          type: array
          description: Newest date first; empty without a connection or task.
          items: { $ref: '#/components/schemas/EverhourTimeRecordDto' }
        totalSeconds: { type: number }
        runningTimer:
          description: The caller's running timer when it is on this mission's task, else null.
          oneOf: [ { $ref: '#/components/schemas/EverhourTimerDto' }, { type: 'null' } ]
    ProjectEverhourStateDto:
      type: object
      required:
        [
          connected,
          projectLinked,
          taskId,
          records,
          totalSeconds,
          runningTimer,
          hasRunningTimerInProject
        ]
      properties:
        connected:
          type: boolean
          description: True when the caller's Everhour key could be read.
        projectLinked: { type: boolean }
        taskId:
          description: The project's `general` task, or null before one is created.
          oneOf: [ { type: string }, { type: 'null' } ]
        records:
          type: array
          description: Newest date first; empty without a connection or task.
          items: { $ref: '#/components/schemas/EverhourTimeRecordDto' }
        totalSeconds: { type: number }
        runningTimer:
          description: The caller's running timer when it is on the `general` task, else null.
          oneOf: [ { $ref: '#/components/schemas/EverhourTimerDto' }, { type: 'null' } ]
        hasRunningTimerInProject:
          type: boolean
          description: True when the caller's running timer is on the `general` task or any of the project's
            mission tasks.
    CreateEverhourTimeBody:
      type: object
      required: [ timeSeconds ]
      properties:
        timeSeconds:
          type: number
          description: Greater than 0; rounded to whole seconds.
        date:
          type: string
          description: '`YYYY-MM-DD`; defaults to today''s UTC date when missing or blank.'
        comment:
          description: Omitted when null or blank.
          oneOf: [ { type: string }, { type: 'null' } ]
    UpdateEverhourTimeBody:
      type: object
      required: [ timeSeconds ]
      properties:
        timeSeconds:
          type: number
          description: Greater than 0; rounded to whole seconds.
        comment:
          description: When present, replaces the comment (trimmed); null clears it.
          oneOf: [ { type: string }, { type: 'null' } ]
    GitHubUserAccountDto:
      type: object
      required: [ id, login, avatarUrl ]
      properties:
        id: { type: string }
        login: { type: string }
        avatarUrl:
          oneOf: [ { type: string }, { type: 'null' } ]
    GitHubUserConnectionDto:
      type: object
      required: [ configured, connected, account, scopes ]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        account:
          description: Set while connected and the account's id and login are known.
          oneOf: [ { $ref: '#/components/schemas/GitHubUserAccountDto' }, { type: 'null' } ]
        scopes:
          type: array
          description: Granted OAuth scopes; empty unless connected.
          items: { type: string }
    GitHubUserAuthorizationDto:
      type: object
      required: [ authorizationUrl ]
      properties:
        authorizationUrl: { type: string }
    BeginGitHubUserAuthorizationBody:
      type: object
      properties:
        returnTo:
          type: string
          description: '`overlord://github/callback` or an `http(s)` URL on an allowed browser origin.'
    GitHubRepositoryOwnerDto:
      type: object
      required: [ login, type, avatarUrl, canCreateRepositories ]
      properties:
        login: { type: string }
        type:
          type: string
          enum: [ personal, organization ]
        avatarUrl:
          oneOf: [ { type: string }, { type: 'null' } ]
        canCreateRepositories: { const: true }
    GitHubRepositoryOwnerList:
      type: array
      minItems: 1
      description: The personal account first, then organizations by login.
      items: { $ref: '#/components/schemas/GitHubRepositoryOwnerDto' }
    GitHubIntegrationDto:
      type: object
      required: [ configured, connected, accountLogin, accountType, workspaceName ]
      properties:
        configured:
          type: boolean
          description: Whether the GitHub App is configured on this server.
        connected:
          type: boolean
          description: Whether the workspace has a live installation record.
        accountLogin:
          oneOf: [ { type: string }, { type: 'null' } ]
        accountType:
          oneOf: [ { type: string }, { type: 'null' } ]
        workspaceName:
          type: string
          description: The workspace's name (never null; `''` if the workspace was deleted).
    GitHubInstallUrlDto:
      type: object
      required: [ installUrl ]
      properties:
        installUrl: { type: string }
    GitHubRepoSummaryDto:
      type: object
      required: [ id, fullName, defaultBranch, private ]
      properties:
        id: { type: string }
        fullName: { type: string }
        defaultBranch: { type: string }
        private: { type: boolean }
    GitHubRepoSummaryList:
      type: array
      maxItems: 100
      items: { $ref: '#/components/schemas/GitHubRepoSummaryDto' }
    ProjectGitHubLinkDto:
      type: object
      required: [ projectId, repo ]
      properties:
        projectId: { type: string, format: uuid }
        repo:
          oneOf: [ { $ref: '#/components/schemas/GitHubRepoSummaryDto' }, { type: 'null' } ]
    LinkProjectGitHubBody:
      type: object
      properties:
        repoFullName:
          description: '`owner/name`; missing, null, non-string or blank unlinks.'
          oneOf: [ { type: string }, { type: 'null' } ]
    GitHubPullRequestDto:
      type: object
      required: [ number, url, state, headBranch, baseBranch ]
      properties:
        number: { type: integer, minimum: 1 }
        url: { type: string }
        state:
          type: string
          enum: [ open, closed ]
          description: The state GitHub reported when the pull request was opened.
        headBranch: { type: string }
        baseBranch: { type: string }
    CreateGitHubPullRequestBody:
      type: object
      properties:
        title:
          type: string
          description: Defaults to the mission title when missing or blank.
        body:
          type: string
          description: Omitted when missing or blank.
        draft:
          type: boolean
          description: Coerced to a boolean; default false.
