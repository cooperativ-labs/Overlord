components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth browser session cookie (`__Secure-` prefixed over HTTPS). Resolves the signed-in
        profile and its organization-bounded workspace memberships; it never selects an ambient
        workspace (backend/auth.ts `requireAuthenticatedSession`).
    sessionBearer:
      type: http
      scheme: bearer
      description: >-
        The same Better Auth session token sent as `Authorization: Bearer <session token>` by
        cross-origin clients (desktop remote mode, hosted web, mobile). Any bearer value that does not
        start with `out_` is tried as a session token first.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: out_
      description: >-
        A USER_TOKEN, `Authorization: Bearer out_…`. Personal tokens, `mission_lifecycle` tokens,
        `project_automation` tokens and the access tokens hosted MCP OAuth issues are all user tokens.
        A token authenticates its owning profile; every request intersects its consent and scope
        grants with live membership and per-workspace RBAC. An invalid, expired or revoked token
        answers 401 `{ error: 'Invalid or expired USER_TOKEN' }`. A `project_automation` token reaches
        only the routes listed in backend/project-automation-routes.ts; every other route answers 404
        `{ error: 'Not found' }`, and resources outside its selected projects read as 404.
    channelCredential:
      type: http
      scheme: bearer
      bearerFormat: osc_
      description: >-
        An agent-session channel credential, `Authorization: Bearer osc_…`, accepted only by the
        `/api/agent-session-channels/v1/*` family and refused (401) everywhere else.
  responses:
    BadRequest:
      description: >-
        The request failed validation (hand-written checks in the handler or the service layer, a
        ServiceError with status 400, or a SQLite foreign-key failure). See ErrorEnvelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: >-
        No session or token, or an invalid USER_TOKEN (`{ error }` only, written by the authentication
        middleware), or a handler found no authenticated profile.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: >-
        The caller is an active member of the owning workspace but lacks the RBAC action, or the
        token's scope grants exclude it (`error` is `Permission denied: <action>`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: >-
        The resource does not exist, is soft-deleted, belongs to a workspace the caller is not an
        active member of, or lies outside a project_automation token's projects. Existence is not
        disclosed. A project_automation token on a route outside its allowlist also gets 404.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: >-
        The request conflicts with current state (lifecycle, uniqueness, stale revision, ambiguous
        display id). SQLite unique and check constraint failures also answer 409 with only `error` and
        `detail`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: >-
        The body exceeded the parser limit (100 KB for JSON, the route's ceiling for raw uploads): `{
        error: 'Request body is too large.', code: 'body_too_large' }`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: >-
        A route-specific limit was reached. Overlord has no global rate limit; only the routes that
        document this response produce it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadGateway:
      description: An upstream dependency (a model provider or external service) failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: >-
        Any unexpected failure: `{ error, detail }` with both set to the exception message. This
        includes a malformed JSON body, a CORS-rejected origin and, on Postgres, constraint violations
        (see contract/api/schema-disagreements.md).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      type: object
      description: >-
        The one JSON error body of every route that forwards errors to `apiErrorHandler`
        (backend/errors.ts), and of the authentication middleware and the project-automation route
        guard. `error` is always present. Which other members appear depends on the error's origin: an
        ApiError writes `detail` and `code` when set; a service-layer ServiceError writes `code` and,
        when present, `details`; the body parser's 413 writes `code: body_too_large`; a SQLite
        constraint failure writes `detail` (the driver message) and no `code`; an unexpected failure
        (500) writes `detail` equal to `error`. Clients branch on `code` and HTTP status, never on
        `error` text.
      required: [ error ]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: >-
            Machine-readable code when the error carries one (open vocabulary, for example
            `validation_error`, `not_found`, `invalid_input`, `body_too_large`,
            `no_execution_target_registered`, `BRANCH_NOT_PREPARED`).
        detail:
          type: string
          description: Additional human-readable detail (ApiError detail, driver message, or the 500 message).
        details:
          $ref: '#/components/schemas/JsonValue'
    JsonValue:
      description: >-
        Any JSON value. Used where the code passes through arbitrary JSON (artifact `contentJson`,
        shared-context values, ServiceError `details`, repository-read `data`).
    OkResponse:
      type: object
      description: Acknowledgement written by `handle()` when a handler returns nothing, or returned explicitly.
      required: [ ok ]
      properties:
        ok:
          const: true
    DateTime:
      type: string
      format: date-time
      description: ISO-8601 timestamp. Postgres values are normalized to UTC `…Z`; SQLite values are
        stored as written (`nowIso()` writes UTC `…Z`).
    StatusType:
      type: string
      enum: [ draft, next, execute, review, complete, blocked, cancelled ]
    MissionPriority:
      type: string
      enum: [ low, normal, high, urgent ]
    ObjectiveState:
      type: string
      enum: [ future, draft, submitted, launching, executing, pending_delivery, complete ]
    CreatedByKind:
      type: string
      enum: [ human, agent, automation ]
      description: Rows predating creation provenance report `human`.
    ProjectLifecycle:
      type: string
      enum: [ active, archived ]
    ProjectListLifecycle:
      type: string
      enum: [ active, archived, all ]
    AgentLaunchFlagDto:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: CLI flag token, usually starting with `--`.
        value:
          description: Positional value after the flag; absent or null for a boolean flag.
          oneOf:
            - type: string
            - type: 'null'
    AgentLaunchFlagInput:
      description: >-
        A launch flag as accepted on input: a structured flag, or flag text (`--x`, `--x v`, `--x=v`)
        that the server parses. Entries without a non-blank name are dropped.
      oneOf:
        - type: string
        - type: object
          required: [ name ]
          properties:
            name: { type: string }
            value:
              oneOf:
                - type: string
                - type: 'null'
    AgentLaunchConfigDto:
      type: object
      required: [ preCommand, flags ]
      properties:
        preCommand:
          type: string
        flags:
          type: array
          items: { $ref: '#/components/schemas/AgentLaunchFlagDto' }
    AgentLaunchConfigInput:
      type: object
      description: Launch mechanics as accepted on input; omitted members default to empty.
      properties:
        preCommand:
          type: string
        flags:
          type: array
          items: { $ref: '#/components/schemas/AgentLaunchFlagInput' }
    ProjectDto:
      type: object
      required:
        [
          id,
          workspaceId,
          slug,
          name,
          description,
          color,
          defaultBranch,
          status,
          createdAt,
          updatedAt,
          revision,
          missionCount,
          position,
          preLaunchCommands,
          launchEnvVars
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description:
          oneOf:
            - type: string
            - type: 'null'
        color:
          description: Lower-case `#rrggbb` from project settings, or null.
          oneOf:
            - type: string
            - type: 'null'
        defaultBranch:
          description: Configured base branch for mission branches; null falls back to `main`.
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/ProjectLifecycle' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        missionCount: { type: integer, minimum: 0 }
        position:
          type: integer
          minimum: 0
          description: 1-based sidebar order within the workspace; 0 for a legacy row without one.
        preLaunchCommands:
          type: array
          items: { type: string }
        launchEnvVars:
          type: object
          additionalProperties: { type: string }
    ProjectStatusDto:
      type: object
      required: [ id, workspaceId, projectId, key, name, type, position, isDefault, isTerminal ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        type: { $ref: '#/components/schemas/StatusType' }
        position: { type: integer, minimum: 0 }
        isDefault: { type: boolean }
        isTerminal: { type: boolean }
    ProjectTagDto:
      type: object
      required: [ id, projectId, label, color, active ]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        label: { type: string }
        color:
          description: Free-form trimmed color text (not validated), or null.
          oneOf:
            - type: string
            - type: 'null'
        active: { type: boolean }
    ProjectResourceAccessMode:
      type: string
      enum: [ read, read_write ]
    ProjectResourceSourceDto:
      type: object
      required:
        [
          id,
          executionTargetId,
          sourceKind,
          descriptor,
          launchDefaults,
          observedRevision,
          observedContentDigest
        ]
      properties:
        id: { type: string, format: uuid }
        executionTargetId:
          description: The target this source materializes on; null for a project-global source.
          oneOf:
            - type: string
            - type: 'null'
        sourceKind:
          type: string
          description: Open vocabulary; the REST surface writes `local_checkout` and `git`.
        descriptor:
          type: object
          additionalProperties: true
          description: >-
            The stored descriptor object (`path` for a checkout, `url` for git, plus `launchDefaults`
            when set); `{}` when the stored JSON is not an object.
        launchDefaults:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
          description: Per-agent launch defaults; `{}` when none.
        observedRevision:
          oneOf:
            - type: string
            - type: 'null'
        observedContentDigest:
          oneOf:
            - type: string
            - type: 'null'
    ProjectResourceDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          executionTargetId,
          resourceKey,
          type,
          label,
          path,
          isPrimary,
          accessMode,
          status,
          observedAt,
          observationSource,
          createdAt,
          updatedAt,
          revision,
          sources
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        executionTargetId:
          description: Target of the representative source (the first `local_checkout` source, else the first
            source); null when none.
          oneOf:
            - type: string
            - type: 'null'
        resourceKey: { type: string }
        type:
          type: string
          description: >-
            `local_directory` when the representative source is `local_checkout`, otherwise that
            source's kind (`git`, …), or `remote_directory` when the resource has no source. The
            TypeScript type lists `local_directory`, `remote_directory`, `git`, `source_bundle`.
        label:
          oneOf:
            - type: string
            - type: 'null'
        path:
          type: string
          description: The checkout path of a `local_checkout` representative source, else empty.
        isPrimary: { type: boolean }
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
        status:
          type: string
          enum: [ active, missing, archived ]
        observedAt:
          description: When the representative source's target last reported this resource; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        observationSource:
          description: '`client` when `observedAt` is set, else null.'
          oneOf:
            - const: client
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/ProjectResourceSourceDto' }
    MissionCreatorTokenDto:
      type: object
      required: [ tokenId, label ]
      properties:
        tokenId: { type: string, format: uuid }
        label: { type: string }
    MissionDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          displayId,
          sequenceNumber,
          title,
          statusId,
          statusType,
          boardPosition,
          priority,
          assignedWorkspaceUserId,
          notes,
          scheduleId,
          dueDatetime,
          createdAt,
          updatedAt,
          revision,
          objectiveCount,
          completedObjectiveCount,
          hasExecutingObjective,
          hasCompletedObjective,
          hasPendingObjectiveWithInstructions,
          hasUnseenBlockingQuestion,
          hasUnseenReturnedToExecute,
          allowParallelObjectives,
          draftObjectiveResourceKey,
          tags,
          createdByKind,
          createdByAgent,
          createdByWorkspaceUserId,
          createdByToken
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        displayId:
          type: string
          description: Human-readable id, `<workspace prefix>:<sequence>` (for example `coo:756`).
        sequenceNumber: { type: integer, minimum: 1 }
        title: { type: string }
        statusId: { type: string, format: uuid }
        statusType: { $ref: '#/components/schemas/StatusType' }
        boardPosition: { type: integer }
        priority:
          oneOf:
            - $ref: '#/components/schemas/MissionPriority'
            - type: 'null'
        assignedWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        notes:
          description: Human-only notes; never sent to agents.
          oneOf:
            - type: string
            - type: 'null'
        scheduleId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        dueDatetime:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        revision: { type: integer, minimum: 1 }
        objectiveCount: { type: integer, minimum: 0 }
        completedObjectiveCount: { type: integer, minimum: 0 }
        hasExecutingObjective:
          type: boolean
          description: True while an objective is `executing` or `pending_delivery`.
        hasCompletedObjective: { type: boolean }
        hasPendingObjectiveWithInstructions: { type: boolean }
        hasUnseenBlockingQuestion: { type: boolean }
        hasUnseenReturnedToExecute: { type: boolean }
        allowParallelObjectives: { type: boolean }
        draftObjectiveResourceKey:
          oneOf:
            - type: string
            - type: 'null'
        tags:
          type: array
          items: { $ref: '#/components/schemas/ProjectTagDto' }
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        createdByWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        createdByToken:
          oneOf:
            - $ref: '#/components/schemas/MissionCreatorTokenDto'
            - type: 'null'
        objectives:
          type: array
          description: Present only on `GET /api/projects/{id}/missions?includeObjectives=1`.
          items: { $ref: '#/components/schemas/ObjectiveDto' }
    ObjectiveRunQueueEntryDto:
      type: object
      required:
        [
          id,
          queueId,
          queueName,
          position,
          state,
          blockedReason,
          waitingReason,
          waitingOnObjectiveId,
          waitingOnObjectiveDisplayId,
          attemptCount,
          precededBy
        ]
      properties:
        id: { type: string, format: uuid }
        queueId: { type: string, format: uuid }
        queueName: { type: string }
        position: { type: integer, minimum: 1 }
        state:
          type: string
          enum: [ waiting, blocked, dispatched, running ]
        blockedReason:
          oneOf:
            - type: string
            - type: 'null'
        waitingReason:
          oneOf:
            - type: string
              enum: [ mission_busy, resource_disconnected, retry_pending ]
            - type: 'null'
        waitingOnObjectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        waitingOnObjectiveDisplayId:
          oneOf:
            - type: string
            - type: 'null'
        attemptCount: { type: integer, minimum: 0 }
        precededBy:
          description: Always null in objective projections.
          type: 'null'
    ObjectiveDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          position,
          title,
          instructionText,
          state,
          autoAdvance,
          queueEntry,
          assignedAgent,
          model,
          reasoningEffort,
          createdAt,
          updatedAt,
          launchedAt,
          startedAt,
          completedAt,
          reopenedAt,
          revision,
          externalSessionId,
          branch,
          resourceKey,
          displayKey,
          displayId,
          createdByKind,
          createdByAgent,
          createdByWorkspaceUserId,
          launchConfigOverrides
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        title:
          oneOf:
            - type: string
            - type: 'null'
        instructionText: { type: string }
        state: { $ref: '#/components/schemas/ObjectiveState' }
        autoAdvance:
          type: boolean
          description: Deprecated; derived from live queue membership when the read joins it.
        queueEntry:
          description: Live Run Queue membership; null when not queued or when the read does not join queue
            state (create and update responses).
          oneOf:
            - $ref: '#/components/schemas/ObjectiveRunQueueEntryDto'
            - type: 'null'
        assignedAgent:
          oneOf:
            - type: string
            - type: 'null'
        model:
          oneOf:
            - type: string
            - type: 'null'
        reasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        launchedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        reopenedAt:
          oneOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        revision: { type: integer, minimum: 1 }
        externalSessionId:
          description: Native harness session id of the latest agent session; null where the read does not
            join sessions.
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        resourceKey:
          oneOf:
            - type: string
            - type: 'null'
        displayKey: { type: string }
        displayId:
          type: string
          description: '`{mission.displayId}.{displayKey}`, for example `coo:756.k7xm`.'
        createdByKind: { $ref: '#/components/schemas/CreatedByKind' }
        createdByAgent:
          oneOf:
            - type: string
            - type: 'null'
        createdByWorkspaceUserId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        launchConfigOverrides:
          type: object
          description: Explicit overrides keyed by execution target id (`*` = any target), then agent key;
            `{}` when none.
          additionalProperties:
            type: object
            additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
    ExecutionRequestDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          executionTargetId,
          requestedAgent,
          requestedModel,
          requestedReasoningEffort,
          launchConfig,
          status,
          requestedSource,
          localTargetMutationKind,
          lastError,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        requestedAgent:
          oneOf:
            - type: string
            - type: 'null'
        requestedModel:
          oneOf:
            - type: string
            - type: 'null'
        requestedReasoningEffort:
          oneOf:
            - type: string
            - type: 'null'
        launchConfig: { $ref: '#/components/schemas/AgentLaunchConfigDto' }
        status:
          type: string
          enum: [ queued, claimed, launching, launched, failed, cleared, cancelled, expired ]
        requestedSource: { type: string }
        localTargetMutationKind:
          oneOf:
            - type: string
              enum: [ branch_action, worktree_purge, capability_call ]
            - type: 'null'
        lastError:
          oneOf:
            - type: string
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    TerminalSessionDto:
      type: object
      required:
        [
          executionRequestId,
          objectiveId,
          provider,
          providerSessionId,
          sessionName,
          executionTargetId,
          deviceLabel,
          agentSessionId,
          executable,
          viewerKind,
          viewerOpenAs,
          createdAt,
          lastObservedState
        ]
      properties:
        executionRequestId: { type: string, format: uuid }
        objectiveId:
          type: string
          format: uuid
        provider:
          const: latch
        providerSessionId: { type: string }
        sessionName: { type: string }
        executionTargetId:
          oneOf:
            - type: string
            - type: 'null'
        deviceLabel:
          oneOf:
            - type: string
            - type: 'null'
        agentSessionId:
          oneOf:
            - type: string
            - type: 'null'
        executable: { type: string }
        viewerKind: { type: string }
        viewerOpenAs:
          type: string
          enum: [ window, tab ]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastObservedState:
          type: string
          enum: [ running, exited, stopping, lost ]
    MissionBranchStatus:
      type: string
      enum: [ pending, created, published, merged_unpushed, merged ]
    MissionWorktreePreference:
      type: string
      enum: [ worktree, branch ]
    MissionBranchDto:
      type: object
      required:
        [
          name,
          baseBranch,
          worktreePath,
          status,
          dirty,
          overrideBranch,
          worktreeAutomationEnabled,
          worktreePreference,
          willPrepareBranch,
          willUseWorktree
        ]
      properties:
        name: { type: string }
        baseBranch:
          oneOf:
            - type: string
            - type: 'null'
        worktreePath:
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/MissionBranchStatus' }
        dirty: { type: boolean }
        hasUnpushedCommits:
          type: boolean
          description: Never written by the REST read today (see schema-disagreements.md).
        overrideBranch:
          oneOf:
            - type: string
            - type: 'null'
        worktreeAutomationEnabled: { type: boolean }
        worktreePreference:
          oneOf:
            - $ref: '#/components/schemas/MissionWorktreePreference'
            - type: 'null'
        willPrepareBranch: { type: boolean }
        willUseWorktree: { type: boolean }
        observedAt:
          description: Present only once a local target observed the branch.
          $ref: '#/components/schemas/DateTime'
        observationSource:
          description: Present (`client`) only together with `observedAt`.
          const: client
    MissionCreatedFromDto:
      type: object
      required: [ sessionId, missionId, missionDisplayId, agentIdentifier ]
      properties:
        sessionId: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        missionDisplayId: { type: string }
        agentIdentifier: { type: string }
    MissionDetailDto:
      description: '`MissionDto` (without `objectives` as an opt-in) plus the mission page projections.'
      allOf:
        - $ref: '#/components/schemas/MissionDto'
        - type: object
          required: [ objectives, statuses, executionRequests, terminalSessions, branch, createdFrom ]
          properties:
            objectives:
              type: array
              items: { $ref: '#/components/schemas/ObjectiveDto' }
            statuses:
              type: array
              items: { $ref: '#/components/schemas/ProjectStatusDto' }
            executionRequests:
              type: array
              description: Active (queued, claimed, launching) requests, newest first.
              items: { $ref: '#/components/schemas/ExecutionRequestDto' }
            terminalSessions:
              type: array
              items: { $ref: '#/components/schemas/TerminalSessionDto' }
            branch:
              description: Always an object from this read; nullable in the TypeScript type.
              oneOf:
                - $ref: '#/components/schemas/MissionBranchDto'
                - type: 'null'
            createdFrom:
              oneOf:
                - $ref: '#/components/schemas/MissionCreatedFromDto'
                - type: 'null'
    ObjectiveAttachmentDto:
      type: object
      required:
        [
          id,
          workspaceId,
          projectId,
          missionId,
          objectiveId,
          inboxItemId,
          bucketKey,
          storageKey,
          filename,
          contentType,
          sizeBytes,
          uploadStatus,
          url,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        missionId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        objectiveId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        inboxItemId:
          description: Set while the file belongs to an unpromoted Inbox item; null otherwise.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        bucketKey:
          const: attachments
        storageKey: { type: string }
        filename: { type: string }
        contentType:
          oneOf:
            - type: string
            - type: 'null'
        sizeBytes:
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        uploadStatus:
          type: string
          enum: [ prepared, uploaded, available, failed, deleted ]
        url:
          type: string
          description: Server-relative URL serving the bytes (`/api/storage/attachments/<storageKey>`).
        createdAt: { $ref: '#/components/schemas/DateTime' }
    ObjectiveAttachmentList:
      type: array
      items: { $ref: '#/components/schemas/ObjectiveAttachmentDto' }
    RawUploadBody:
      type: string
      contentMediaType: application/octet-stream
      description: >-
        The file's raw bytes as the request body (no multipart). Any Content-Type is accepted and
        recorded as the attachment's media type. An empty body is refused (400).
    CreateProjectBody:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
        workspaceId:
          type: string
          description: >-
            Target workspace. Required in practice: a session or token request has no implicit
            workspace, so omitting it answers 400 `workspaceId is required when creating a project`.
        slug:
          type: string
          description: Slugified; derived from `name` when omitted or blank.
        description:
          oneOf:
            - type: string
            - type: 'null'
        color:
          type: string
          description: Six hex digits with or without `#`; stored lower-case with `#`. Other text answers 400.
        primaryResource:
          oneOf:
            - type: object
              required: [ directoryPath ]
              properties:
                directoryPath:
                  type: string
                  description: A blank path skips resource creation.
                executionTargetId:
                  description: >-
                    An existing target in the workspace (404 otherwise); null for a project-global
                    source; omitted to declare the calling machine, which needs a machine-local
                    identity or answers 409 `no_execution_target_registered`.
                  oneOf:
                    - type: string
                    - type: 'null'
            - type: 'null'
    InitializeProjectBody:
      type: object
      required: [ workspaceId, idempotencyKey, name, description ]
      properties:
        workspaceId: { type: string }
        idempotencyKey:
          type: string
          maxLength: 200
          description: >-
            Generated once by the client and reused on retry (at most 200 characters after trimming).
            A repeat with the same key for the same profile returns the first initialization and only
            retries pending or failed GitHub provisioning.
        name: { type: string, description: Project name and first mission title; must not be blank. }
        description: { type: string, description: Project description and first objective; must not be blank. }
        createGitHubRepository:
          type: boolean
          description: Only `true` requests provisioning.
        githubOwnerLogin:
          type: string
          description: Required exactly when `createGitHubRepository` is true (400 otherwise).
    InitializeProjectResultDto:
      type: object
      required: [ project, mission, repositoryProvisioning ]
      properties:
        project: { $ref: '#/components/schemas/ProjectDto' }
        mission: { $ref: '#/components/schemas/MissionDetailDto' }
        repositoryProvisioning:
          type: object
          required: [ status, retryable, ownerLogin, repository, resource, error ]
          properties:
            status:
              type: string
              enum: [ not_requested, pending, failed, succeeded ]
            retryable:
              type: boolean
              description: True while `status` is `pending` or `failed`; retry with the same idempotency key.
            ownerLogin:
              oneOf:
                - type: string
                - type: 'null'
            repository:
              oneOf:
                - type: object
                  required: [ id, fullName, defaultBranch, private, cloneUrl ]
                  properties:
                    id: { type: string }
                    fullName: { type: string }
                    defaultBranch: { type: string }
                    private: { const: true }
                    cloneUrl: { type: string }
                - type: 'null'
            resource:
              description: The read-only `git` resource recorded for the clone URL, once provisioning succeeded.
              oneOf:
                - $ref: '#/components/schemas/ProjectResourceDto'
                - type: 'null'
            error:
              description: The provisioning failure message (generic unless the provider raised an ApiError).
              oneOf:
                - type: string
                - type: 'null'
    ReorderProjectsBody:
      type: object
      required: [ orderedProjectIds ]
      properties:
        orderedProjectIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Every non-deleted project of one workspace (active and archived), top to bottom.
          items: { type: string }
    UpdateProjectBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank.
        description:
          description: Blank or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/ProjectLifecycle' }
        color:
          description: Six hex digits with or without `#`; an empty string or null clears it.
          oneOf:
            - type: string
            - type: 'null'
        defaultBranch:
          description: A valid git branch name; blank or null clears it (falls back to `main`).
          oneOf:
            - type: string
            - type: 'null'
        preLaunchCommands:
          type: array
          description: Replaces the stored list; blank lines are dropped.
          items: { type: string }
        launchEnvVars:
          type: object
          description: Replaces the stored map; entries with a blank name are dropped.
          additionalProperties: { type: string }
    RepositoryEntryDto:
      type: object
      required: [ path, name, type, parentPath, depth ]
      properties:
        path: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [ file, directory ]
        parentPath:
          oneOf:
            - type: string
            - type: 'null'
        depth: { type: integer, minimum: 0 }
    ProjectRepositoryDto:
      type: object
      required:
        [
          projectId,
          executionTargetId,
          resource,
          status,
          rootPath,
          gitRoot,
          branch,
          commit,
          entries,
          truncated,
          scannedAt,
          message
        ]
      properties:
        projectId: { type: string }
        executionTargetId:
          description: The `executionTargetId` query parameter echoed back, or null.
          oneOf:
            - type: string
            - type: 'null'
        resource:
          oneOf:
            - $ref: '#/components/schemas/ProjectResourceDto'
            - type: 'null'
        status:
          type: string
          enum: [ ready, no_resource, not_git_repository, unsupported_resource, unreadable ]
        rootPath:
          oneOf:
            - type: string
            - type: 'null'
        gitRoot:
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        commit:
          oneOf:
            - type: string
            - type: 'null'
        entries:
          type: array
          items: { $ref: '#/components/schemas/RepositoryEntryDto' }
        truncated: { type: boolean }
        scannedAt: { $ref: '#/components/schemas/DateTime' }
        message:
          oneOf:
            - type: string
            - type: 'null'
    CreateProjectTagBody:
      type: object
      required: [ label ]
      properties:
        label:
          type: string
          description: Trimmed; must not be blank and must be unique among the project's live tags.
        color:
          description: Free-form; blank or null stores null.
          oneOf:
            - type: string
            - type: 'null'
    UpdateProjectTagBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        label:
          type: string
          description: Trimmed; must not be blank and must stay unique among the project's live tags.
        color:
          oneOf:
            - type: string
            - type: 'null'
        active:
          type: boolean
          description: Inactive tags stay on missions but are hidden from the create picker.
    ReorderBoardColumnBody:
      type: object
      required: [ statusId, orderedMissionIds ]
      properties:
        statusId:
          type: string
          description: A live status of this project (409 otherwise).
        orderedMissionIds:
          type: array
          uniqueItems: true
          description: >-
            Mission UUIDs that should occupy the column, top to bottom. A mission from another column
            moves into it (its status changes). Each must be a live mission of this project (404
            otherwise).
          items: { type: string }
    RepositoryReadOperation:
      type: string
      enum: [ observe, tree, branches, worktrees, git_status, diff, read_file, search_text ]
    RepositoryReadRequest:
      description: >-
        One bounded, read-only repository read on a registered resource binding. Every variant carries
        the binding (`executionTargetId`, `projectId`, `resourceKey`) and an `operationId` matching
        `^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$`, reused on retry. Paths are repository-relative;
        absolute or escaping paths answer 400.
      oneOf:
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey ]
          properties:
            operation:
              type: string
              enum: [ observe, branches, worktrees, git_status ]
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey ]
          properties:
            operation: { const: tree }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            relativePath:
              oneOf:
                - type: string
                - type: 'null'
            maxEntries:
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, scope ]
          properties:
            operation: { const: diff }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            scope:
              type: string
              enum: [ unstaged, staged, all ]
            relativePaths:
              oneOf:
                - type: array
                  maxItems: 50
                  items: { type: string }
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, relativePath ]
          properties:
            operation: { const: read_file }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            relativePath: { type: string }
            startLine:
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
            endLine:
              description: Must not precede `startLine`.
              oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
        - type: object
          required: [ operation, operationId, executionTargetId, projectId, resourceKey, query ]
          properties:
            operation: { const: search_text }
            operationId: { type: string, minLength: 8, maxLength: 128 }
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
            query:
              type: string
              minLength: 1
              maxLength: 256
              description: One line; no NUL, CR or LF.
            relativePath:
              oneOf:
                - type: string
                - type: 'null'
            caseSensitive: { type: boolean }
    RepositoryReadResult:
      type: object
      required:
        [
          operationId,
          operation,
          binding,
          outcome,
          head,
          branch,
          observedAt,
          bytes,
          truncated,
          data
        ]
      properties:
        operationId: { type: string }
        operation: { $ref: '#/components/schemas/RepositoryReadOperation' }
        binding:
          type: object
          required: [ executionTargetId, projectId, resourceKey ]
          properties:
            executionTargetId: { type: string }
            projectId: { type: string }
            resourceKey: { type: string }
        outcome:
          type: string
          enum: [ ok, unavailable, target_offline, timeout, denied, binary, oversized, not_found ]
        head:
          oneOf:
            - type: string
            - type: 'null'
        branch:
          oneOf:
            - type: string
            - type: 'null'
        observedAt: { $ref: '#/components/schemas/DateTime' }
        bytes: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        data:
          description: >-
            Operation-specific bounded payload (packages/contract/src/chat.ts
            `RepositoryGitStatusData`, `RepositoryDiffData`, `RepositoryFileData`,
            `RepositorySearchData`, or the capability payload); non-`ok` outcomes carry `{ message }`.
          $ref: '#/components/schemas/JsonValue'
    CreateProjectStatusBody:
      type: object
      required: [ name, type ]
      properties:
        name:
          type: string
          description: Trimmed; must not be blank and must be unique among the project's live statuses (409).
        type: { $ref: '#/components/schemas/StatusType' }
        isDefault:
          type: boolean
          description: Only a `draft` or `next` status may be the default (400); setting it clears the
            previous default.
    UpdateProjectStatusBody:
      type: object
      description: Partial update; a status's type cannot change.
      properties:
        name:
          type: string
          description: Trimmed; must not be blank and must stay unique (409).
        isDefault:
          type: boolean
          description: >-
            `true` makes a `draft` or `next` status the default (400 for other types); `false` on the
            current default answers 409 (choose another default instead).
    ReorderProjectStatusesBody:
      type: object
      required: [ orderedStatusIds ]
      properties:
        orderedStatusIds:
          type: array
          minItems: 1
          description: Every live status of the project, top to bottom; positions become 0, 1, 2, ….
          items: { type: string }
    ProjectStatusList:
      type: array
      items: { $ref: '#/components/schemas/ProjectStatusDto' }
    ProjectList:
      type: array
      items: { $ref: '#/components/schemas/ProjectDto' }
    ProjectTagList:
      type: array
      items: { $ref: '#/components/schemas/ProjectTagDto' }
    MissionList:
      type: array
      items: { $ref: '#/components/schemas/MissionDto' }
    ProjectResourceList:
      type: array
      items: { $ref: '#/components/schemas/ProjectResourceDto' }
    CreateProjectResourceBody:
      type: object
      description: >-
        Exactly one source: `directoryPath` (or its alias `path`) for a `local_checkout` source, or
        `sourceUrl` for a `git` source; when both are given `sourceUrl` wins. A resource with the
        derived `resourceKey` that already exists gains or updates the source instead of a new
        resource being created.
      properties:
        directoryPath:
          type: string
          description: Checkout path on the execution target.
        path:
          type: string
          description: Alias of `directoryPath` read when `directoryPath` is absent.
        sourceUrl:
          type: string
          description: An `http(s)://` or `git@host:path` Git URL (400 otherwise).
        resourceKey:
          description: Slugified; derived from `label`, then from the path's basename, when blank.
          oneOf:
            - type: string
            - type: 'null'
        label:
          oneOf:
            - type: string
            - type: 'null'
        isPrimary:
          type: boolean
          description: Defaults to true (only an explicit `false` creates a non-primary resource); a new
            primary clears the previous one.
        executionTargetId:
          description: >-
            For a checkout: an existing target of the workspace (404 otherwise), null for a pathless
            global source, or omitted to declare the calling machine (409
            `no_execution_target_registered` without a machine-local identity). For a `sourceUrl` it
            is stored as given without validation.
          oneOf:
            - type: string
            - type: 'null'
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
          description: A primary resource is always `read_write`; a non-primary one defaults to `read`.
    UpdateProjectResourceBody:
      type: object
      description: Partial update; omitted members are unchanged.
      properties:
        resourceKey:
          description: Slugified; a blank or null value re-derives the key from the label or the current key.
          oneOf:
            - type: string
            - type: 'null'
        isPrimary:
          type: boolean
          description: Only `true` has an effect (it promotes the resource and forces `read_write`); `false`
            is ignored.
        accessMode:
          $ref: '#/components/schemas/ProjectResourceAccessMode'
          description: Ignored for a primary resource.
    UpdateProjectResourceSourceBody:
      type: object
      required: [ launchDefaults ]
      properties:
        launchDefaults:
          type: object
          description: >-
            Replaces the per-agent defaults keyed by agent key. Entries with a blank key, a non-object
            value, or neither a pre-command nor flags are dropped; `{}` clears them.
          additionalProperties: { $ref: '#/components/schemas/AgentLaunchConfigInput' }
