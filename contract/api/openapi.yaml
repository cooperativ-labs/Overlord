        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/webhooks/{id}":
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription UUID; an unknown, deleted or foreign subscription answers 404.
        schema: { type: string }
    patch:
      operationId: patchWebhooksById
      tags: [webhooks]
      x-overlord-permission: webhook:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Update a webhook subscription
      description: >-
        Requires `webhook:update` on the subscription's workspace. Omitted members are unchanged; an empty
        body answers the subscription unchanged. A new `endpointUrl` is validated as on create, including
        the refusal of a literal private address (400). Re-enabling resets `consecutiveFailures` and clears
        `disabledReason`; disabling sets `disabledReason: manual`. A concurrent change answers 409.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWebhookSubscriptionBody' }
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscriptionDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteWebhooksById
      tags: [webhooks]
      x-overlord-permission: webhook:delete
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Delete a webhook subscription
      description: Requires `webhook:delete` on the subscription's workspace. Soft-deletes it and records a change.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/webhooks/{id}/rotate-secret":
    parameters:
      - name: id
