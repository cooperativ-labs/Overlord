            malformed encoding answers 500.
          schema: { type: string }
      requestBody:
        required: true
        description: The file bytes. The request's `Content-Type`, whatever it is, is recorded as the
          attachment's `contentType`.
        content:
          '*/*':
            schema: { $ref: '#/components/schemas/RawUploadBody' }
      responses:
        '200':
          description: The stored attachment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectiveAttachmentDto' }
