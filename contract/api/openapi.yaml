    get:
      operationId: getProjectsByIdRepository
      tags: [projects]
      x-overlord-permission: project:read
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Describe the project's repository resource
      description: >-
        Requires `project:read`. Picks the active resource matching `resourceKey`, else the primary, and
        reports why the tree cannot be read when it cannot. The control-plane backend does not read local
        checkouts: a linked local directory reports `unsupported_resource` unless the backend itself is a
        local target.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: executionTargetId
          in: query
          required: false
          description: Target whose source is preferred; blank is treated as absent.
          schema: { type: string }
        - name: resourceKey
          in: query
          required: false
          description: Resource to describe; blank or unknown falls back to the primary.
          schema: { type: string }
      responses:
        '200':
          description: The repository projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepositoryDto' }
