  "/api/projects/{id}/repository-reads":
    parameters:
      - name: id
        in: path
        required: true
        description: Project UUID (display names and slugs are not accepted).
        schema: { type: string }
    post:
      operationId: postProjectsByIdRepositoryReads
      tags: [projects]
      x-overlord-permission: project:read
      x-overlord-edition: both
      x-overlord-consumers: [unverified]
      summary: Run a bounded read-only repository read on an execution target
      description: >-
        Requires `project:read`, and the caller must have access to the named execution target for this
        project (404 `Execution target not found` otherwise). `projectId` in the body must equal the path
        id (400 `invalid_request`). The read is queued for the target's runner and the request waits up to
        30 seconds; an offline target, an unlinked resource, a timeout or a target-side refusal is a 200
        with the matching `outcome`, not an error. Reusing an `operationId` for a different read answers
        409 `operation_conflict`; at most four reads run per caller at once. A client disconnect stops the
        wait, never the queued read.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryReadRequest' }
      responses:
        '200':
          description: The read's result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryReadResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
