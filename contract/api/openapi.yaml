        local target.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: executionTargetId
          in: query
          required: false
          description: Target whose source is preferred; blank is treated as absent.
          schema: { type: string }
        - name: resourceKey
          in: query
          required: false
          description: Resource to describe; blank or unknown falls back to the primary.
          schema: { type: string }
