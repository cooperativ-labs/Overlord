      responses:
        '200':
          description: The server description.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/McpServerInfoDto' }
        '401':
          description: >-
            Not authenticated (`{ error: 'Authentication required' }`) with the `WWW-Authenticate` header
            naming the protected-resource metadata; or an invalid user token.
          headers:
            WWW-Authenticate:
              required: false
              description: Present on the `Authentication required` refusal.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: postMcp
      tags: [mcp]
      x-overlord-permission: authenticated
      x-overlord-edition: both
      x-overlord-consumers: [external, mobile]
      summary: MCP JSON-RPC transport
      description: >-
        Registered only when `OVERLORD_MCP_ENABLED=true`. The transport only: a JSON-RPC 2.0 request, or a
        batch array, answered as JSON (never an SSE stream). Methods are `initialize`,
        `notifications/initialized`, `ping`, `tools/list`, `tools/call`, `resources/list` and
        `resources/read`; the tools, their arguments and their authorization are specified by the
        generated tool catalog (ADR 0008). JSON-RPC errors are answered with HTTP 200: `-32600` for an
        invalid request, `-32601` for an unknown method, `-32000` when a tool or resource fails (its
        message carried). A single notification answers `{ jsonrpc: '2.0', result: null }`; a batch omits
        notifications. Authentication as `GET /mcp`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/JsonRpcRequest'
                - type: array
                  items: { $ref: '#/components/schemas/JsonRpcRequest' }
      responses:
        '200':
          description: The JSON-RPC response, or an array of them for a batch.
          content:
            application/json:
              schema:
                oneOf:
