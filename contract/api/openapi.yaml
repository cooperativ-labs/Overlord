  /api/connections/knowledgebase/callback:
    get:
      operationId: getConnectionsKnowledgebaseCallback
      tags: [connections]
      x-overlord-permission: public
      x-overlord-edition: cloud
      x-overlord-consumers: [external]
      summary: Knowledgebase OAuth callback
      description: >-
        The Knowledgebase authorization server redirects here. On Cloud it consumes the single-use state,
        exchanges the code and stores the encrypted grant; off Cloud, and on any failure, the status is
        `failed`. Only a status leaves the server. Responses carry `Cache-Control: no-store` and
        `Referrer-Policy: no-referrer`.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: The authorization code.
          schema: { type: string }
        - name: state
          in: query
          required: false
          description: The state minted by `POST /api/connections`.
          schema: { type: string }
        - name: error
          in: query
          required: false
          description: The authorization server's error code.
          schema: { type: string }
      responses:
        '302':
          description: >-
            When the flow named a return target: `overlord://connections/callback` (mobile) or the web
            origin plus `/settings/connections` (web), each with
            `provider=knowledgebase&status=<connected|denied|expired|failed>`. The body is Express's short
            redirect notice.
          headers:
            Location:
              required: true
              schema: { type: string }
        '200':
          description: Connected, and no return target; a short HTML status page.
          content:
            text/html:
              schema: { type: string }
        '400':
          description: Not connected (or not Cloud), and no return target; a short HTML status page.
          content:
            text/html:
              schema: { type: string }
