  /api/objective-transcript:
    get:
      operationId: getObjectiveTranscript
      tags: [activity]
      x-overlord-permission: unknown
      x-overlord-permission-candidates: [mission:read, objective:read]
      x-overlord-edition: both
      x-overlord-consumers: [mobile]
      summary: Full-text objective history across workspaces
      description: >-
        Projects objectives of active projects across the workspaces of the active organization where the
        caller holds both `mission:read` and `objective:read` (no workspace answers an empty page),
        narrowed to a project_automation token's projects. Reads newest first with `before`,
        oldest-new-first with `after`, or revalidates named ids with `ids`; at most one of the three. Any
        other query parameter, or a malformed value, answers 400 `invalid_request`. Responses carry
        `Cache-Control: no-store`.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: limit
          in: query
          required: false
          description: Decimal 1-100 without leading zeros, default 50. Not allowed with `ids`.
          schema: { type: string }
        - name: before
          in: query
          required: false
          description: An opaque cursor from `nextBefore` or `newestCursor` (base64url, at most 256 characters).
          schema: { type: string }
        - name: after
          in: query
          required: false
          description: An opaque cursor; returns objectives created after it, ascending.
          schema: { type: string }
        - name: ids
          in: query
          required: false
          description: Comma-separated distinct objective UUIDs, at most 100 (and 3699 characters).
          schema: { type: string }
      responses:
        '200':
          description: The page.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectiveTranscriptPageDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
