  "/api/run-queues/entries/{entryId}":
    parameters:
      - name: entryId
        in: path
        required: true
        description: >-
          Run Queue entry UUID. A live entry in a project the caller cannot reach answers 404 `Project not
          found`; an unknown or removed entry id answers 500 with `error: 'Run Queue entry not found'`.
        schema: { type: string }
    patch:
      operationId: patchRunQueuesEntriesByEntryId
      tags: [run-queues]
      x-overlord-permission: execution_request:create
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Move or retry a Run Queue entry
      description: >-
        Requires `execution_request:create` in the entry's project. With `retry: true` the entry's hold
        and attempt budget are cleared (it becomes `waiting` with `waitingReason: retry_pending`) and a
        dispatch tick is scheduled; a `dispatched` or `running` entry answers 409
        `run_queue_entry_running`, and combining `retry` with `queueId`, `afterEntryId` or `position`
        answers 500 with `error: 'retry cannot be combined with a queue move'`. Otherwise the entry is
        moved: to `queueId` (default its current queue; a live queue of the same project, else 404
        `run_queue_not_found`), directly after `afterEntryId` (an entry of the destination queue, else 404
        `run_queue_entry_not_found`), else to `position`, else to the end. A `dispatched` or `running`
        entry cannot be moved (409 `run_queue_entry_running`). A moved entry becomes plain `waiting`; a
        source queue left empty by the move is retired.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRunQueueEntryBody' }
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunQueueEntryDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteRunQueuesEntriesByEntryId
      tags: [run-queues]
      x-overlord-permission: execution_request:create
      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Remove a Run Queue entry
      description: >-
        Requires `execution_request:create` in the entry's project. Takes an optional JSON body. Removes
        the entry, turns the objective's auto-advance off and moves a not-yet-started objective to the end
        of its mission's order. With `force: true` the objective's active execution requests are cleared,
        an in-flight entry whose objective is still `launching` (with no active request left) is reset to
        `draft`, and the queue is paused so the released dispatch tick does not start the next entry. A
        non-default queue left empty is retired.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteRunQueueEntryBody' }
      responses:
        '200':
          description: What the removal did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunQueueEntryRemovalDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
