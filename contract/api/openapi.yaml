      summary: Rotate a webhook signing secret
      description: >-
        Requires `webhook:update`. Replaces the secret immediately (the old one stops signing at once) and
        returns the new one. Takes no body.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: The subscription and its new secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateWebhookSubscriptionResultDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/webhooks/{id}/test":
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription UUID; an unknown, deleted or foreign subscription answers 404.
        schema: { type: string }
    post:
      operationId: postWebhooksByIdTest
      tags: [webhooks]
      x-overlord-permission: webhook:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Send a test delivery
      description: >-
        Requires `webhook:update`. Synchronously POSTs a signed `webhook.ping` envelope (no mission data)
        to the endpoint with a 10-second timeout and no redirects, and records the attempt in the delivery
        log. Works on a disabled subscription. A non-2xx answer, a timeout or a network failure answers
        502 `Test delivery failed: <reason>`. Before sending it applies the dispatcher's private-network
        check: an endpoint that is, or whose hostname resolves to, a private address and is not an
        internal host answers 400 without any request or attempt record. Takes no body.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: The endpoint answered 2xx.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookTestResultDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  "/api/webhooks/{id}/deliveries":
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription UUID; an unknown, deleted or foreign subscription answers 404.
        schema: { type: string }
    get:
      operationId: getWebhooksByIdDeliveries
      tags: [webhooks]
      x-overlord-permission: webhook:read
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: A subscription's delivery attempt log
      description: >-
        Requires `webhook:read`. Attempts newest first by `attemptedAt`, at most `limit`; `hasMore` says
        whether older attempts exist. Page with `before` set to the last `attemptedAt`. Includes test
        pings.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: before
          in: query
          required: false
          description: >-
            Only attempts with `attemptedAt` lexically before this value (not validated; pass a previous
            `attemptedAt`).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: >-
            Page size, default 25, clamped to 1–100. Read with `Number()`; a value that is not an integer
            (`abc`, `2.5`) answers 500 `datatype mismatch` on SQLite (see schema-disagreements.md).
          schema: { type: string }
      responses:
        '200':
          description: One page of attempts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryAttemptsPageDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/webhooks/{id}/deliveries/{outboxId}/redeliver":
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription UUID; an unknown, deleted or foreign subscription answers 404.
        schema: { type: string }
      - name: outboxId
        in: path
        required: true
        description: The `outboxMessageId` of a delivery attempt of this subscription.
        schema: { type: string }
    post:
      operationId: postWebhooksByIdDeliveriesByOutboxIdRedeliver
      tags: [webhooks]
      x-overlord-permission: webhook:update
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Re-queue a delivery
      description: >-
        Requires `webhook:update`. The outbox message must belong to the subscription's workspace and name
        this subscription (404 otherwise). Resets it to `pending` with its attempt count cleared, for the
        dispatcher to pick up; no entity change is recorded. Takes no body.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: Re-queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/uploads/{bucketKey}":
    parameters:
      - name: bucketKey
        in: path
        required: true
        description: '`user-images`, `workspace-images` or `organization-images`; any other value answers 404.'
        schema: { type: string }
    post:
      operationId: postUploadsByBucketKey
      tags: [storage]
      x-overlord-permission: unknown
      x-overlord-permission-candidates: [user_image:self:create, workspace_image:create, organization_image:create]
      x-overlord-edition: both
      x-overlord-consumers: [cli, webapp]
      summary: Upload an image
      description: >-
        The request body is the image's raw bytes (no JSON, no multipart). The permission depends on the
        bucket: `user-images` needs `user_image:self:create` in some authorized workspace (the image is
        stored in the lowest-id such workspace's bucket unless `workspaceId` names one, under
        `user-images/<profileId>/` and recorded against the authenticated uploader's profile);
        `workspace-images` needs `workspace_image:create` on the required `workspaceId`;
        `organization-images` needs `organization_image:create` and organization-admin status in the
        request's selected organization (404 when none is selected); a token request must also consent to
        every live workspace of that organization (403). `attachments` and unknown keys answer
        404. Only PNG, JPEG, GIF and WebP (by the request's `Content-Type`) are accepted (415 otherwise);
        SVG is refused. At most 8 MiB, refused by the parser with 413 `body_too_large`. User and workspace
        images are recorded in their metadata table with an entity change; an organization image is only
        written to storage (its URL is then set with `PATCH /api/organizations/{id}`).
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: workspaceId
          in: query
          required: false
          description: >-
            Workspace UUID, trimmed. Required for `workspace-images` (400 without it); optional for
            `user-images`; ignored for `organization-images`. Authorized as above (404 outside the
            caller's authorized workspaces).
          schema: { type: string }
        - name: x-upload-filename
          in: header
          required: false
          description: >-
            The original filename, percent-encoded; defaults to `upload`, and a blank value to
            `image<ext>`. A malformed encoding answers 500.
          schema: { type: string }
      requestBody:
        required: true
        description: The image bytes; the request `Content-Type` selects the image type.
        content:
          '*/*':
            schema: { $ref: '#/components/schemas/RawImageUploadBody' }
      responses:
        '200':
          description: The stored image.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredImageDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  "/api/storage/{bucketKey}/{storageKey}":
    parameters:
      - name: bucketKey
        in: path
        required: true
        description: '`user-images`, `workspace-images`, `organization-images` or `attachments`; any other
          value answers 404.'
        schema: { type: string }
      - name: storageKey
        in: path
        required: true
        description: >-
          The object's backend key, percent-encoded as one segment (its `/` as `%2F`), exactly as in a
          stored object's `url`.
        schema: { type: string }
    get:
      operationId: getStorageByBucketKeyByStorageKey
      tags: [storage]
      x-overlord-permission: unknown
      x-overlord-permission-candidates: [user_image:read, workspace_image:read, organization_image:read, attachment:read]
      x-overlord-edition: both
      x-overlord-consumers: [cli, mobile, webapp]
      summary: Download a stored object
      description: >-
        Serves the bytes of a stored object. For `user-images`, `workspace-images` and `attachments` the
        key must match a live metadata row exactly (the newest `user-images` row whose key ends with a
        bare legacy key also matches) and the caller needs the bucket's read action on that row's
        workspace; a `project_automation` token reads only attachments of its projects, and an unpromoted
        Inbox attachment only its owner. For `organization-images` there is no metadata row: the caller
        needs `organization_image:read` in some authorized workspace, and only a key of the selected
        organization's own image shape (`organization-files/<organizationId>/images/<uuid>.<png|jpg|gif|webp>`)
        is read from that organization's bucket, with the content type taken from its extension. On every
        bucket the key must be a relative key of non-empty `/`-separated segments, none `.` or `..`, with
        no backslash or control character, and it never resolves outside the bucket. Every miss answers
        404 `File not found`. When the bucket presigns reads the response is
        a redirect to the storage provider instead of the bytes.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      responses:
        '200':
          description: >-
            The object's bytes with its recorded content type (`application/octet-stream` when none).
            Attachments are served with `X-Content-Type-Options: nosniff` and `Content-Disposition:
            attachment` (the filename percent-encoded). Images use `Cache-Control: private,
            max-age=31536000, immutable`.
          headers:
            Cache-Control:
              required: true
              schema: { type: string }
            Content-Disposition:
              required: false
              description: '`attachment; filename="<percent-encoded name>"` on `attachments` only.'
              schema: { type: string }
            X-Content-Type-Options:
              required: false
              description: '`nosniff` on `attachments` only.'
              schema: { type: string }
          content:
            '*/*':
              schema: { $ref: '#/components/schemas/BinaryDownload' }
        '302':
          description: >-
            A presigned URL at the storage provider (S3-compatible buckets configured to presign reads),
            with `Cache-Control: private, no-store`; for attachments the URL carries the download
            disposition.
          headers:
            Location:
              required: true
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
