      description: >-
        Registered only when `OVERLORD_MCP_ENABLED=true`. Describes the MCP server: protocol version,
        endpoint, the tool definitions and widget resources (specified by the generated tool catalog, ADR
        0008, not here) and usage instructions. It is not a Streamable HTTP SSE stream. Accepts a session,
        a user token (including hosted MCP OAuth access tokens and `project_automation` tokens) or, from
        loopback, an unauthenticated local operator. An unauthenticated remote call answers 401 with
        `WWW-Authenticate: Bearer resource_metadata="/.well-known/oauth-protected-resource/mcp"`.
