        are `{ error, code }` with `code` from the closed ChatErrorCode set and `error` the code with
        spaces. Events with `seq` greater than `after`, read from storage through the source-authorization
        projection (an event whose sources are no longer authorized is replayed as `content.invalidated`).
        With `poll=1` the route answers one JSON page of at most 200 events. Otherwise it answers
        `text/event-stream`: replay, then live events, as unnamed `data:` frames whose JSON is a
        `ChatStreamFrameDto` (no `event:` or `id:` lines). The server polls storage every 500 ms,
        rechecking membership and sources each time, writes a `heartbeat` frame when 15 seconds have
        passed since the last one, and, when the cursor falls behind retention while streaming, writes one
        `snapshot_required` frame and ends the stream; any other failure after the stream started ends it
        without a frame. A closed stream never implies that a run finished. Errors before the stream
        starts are written by the route itself as `{ error, code }` (`{ error: 'Chat request failed' }`
        with 500 for any other failure), except 401, the project-automation guard's 404 and the Local
        `chat_unavailable` 404, which come from the shared middleware.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: after
          in: query
          required: true
          description: >-
            The last sequence already applied (a snapshot's `eventCursor`), decimal digits. Missing,
            malformed, or greater than the thread's last event sequence answers 400 `invalid_request`;
            below `retainedFromSeq - 1` answers 409 `snapshot_required`.
          schema: { type: string }
        - name: poll
          in: query
          required: false
          description: '`1` answers one JSON page instead of a stream.'
          schema: { type: string }
      responses:
        '200':
          description: >-
            With `poll=1`, a `ChatEventPageDto`. Otherwise `text/event-stream` with headers
            `Cache-Control: no-cache, no-transform`, `Connection: keep-alive` and `X-Accel-Buffering: no`,
            flushed before the first event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatEventPageDto' }
            text/event-stream:
              schema: { $ref: '#/components/schemas/ChatStreamFrameDto' }
