  /api/missions/search:
    get:
      operationId: getMissionsSearch
      tags: [missions]
      x-overlord-permission: mission:read
      x-overlord-edition: both
      x-overlord-consumers: [cli, webapp]
      summary: Mission search, version 1 (frozen)
      description: >-
        Ranked mission search across the workspaces of the active organization where the caller holds
        `mission:read`, or within one project. Reads only `q`, `projectId`, `statusTypes` and `limit`.
        Answers `{ missions }` with full mission DTOs.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: q
          in: query
          required: false
          description: Query text; empty or stop-word-only uses the fallback ordering.
          schema: { type: string }
        - name: projectId
          in: query
          required: false
          description: One project id (any string; an unknown or unreadable project answers 404).
          schema: { type: string }
        - name: statusTypes
          in: query
          required: false
          description: Comma-separated status types; values are not validated (an unknown type matches nothing).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: >-
            Integer result cap, default 25. Not bounded above; negative values give no results. Across
            workspaces it is split `floor(limit / workspaces)` per workspace with the remainder to the
            lowest workspace ids.
          schema: { type: string }
      responses:
        '200':
          description: The matching missions, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MissionSearchV1Response' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/missions/search/v2:
    get:
      operationId: getMissionsSearchV2
      tags: [missions]
      x-overlord-permission: mission:read
      x-overlord-edition: both
      x-overlord-consumers: [webapp]
      summary: Mission search, version 2
      description: >-
        Same authorization and fan-out as version 1. A single project id searches that project's workspace
        only. Validation failures answer 400 `validation_error`. Complete and cancelled missions stay
        eligible; there is no implicit date window.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
      parameters:
        - name: q
          in: query
          required: false
          description: Query text; a display id short-circuits; empty or stop-word-only uses `fallback` mode.
          schema: { type: string }
        - name: projectIds
          in: query
          required: false
          description: Comma-separated project UUIDs (non-UUID values answer 400). `projectId` is read as an
            alias when `projectIds` is absent.
          schema: { type: string }
        - name: projectId
          in: query
          required: false
          description: Alias of `projectIds`.
          schema: { type: string }
        - name: statusTypes
          in: query
          required: false
          description: Comma-separated status types; values are not validated (an unknown type matches nothing).
          schema: { type: string }
        - name: resourceKeys
          in: query
          required: false
          description: Comma-separated resource keys; missions with an objective on one of them. `resourceKey`
            (single) is read when absent.
          schema: { type: string }
        - name: resourceKey
          in: query
          required: false
          description: Alias for a single resource key.
          schema: { type: string }
        - name: dateField
          in: query
          required: false
          description: Column for `from`/`to`; defaults to `updatedAt` when a bound is given. An empty value
            answers 400. A `dueDatetime` range excludes missions without a due date.
          schema: { $ref: '#/components/schemas/MissionSearchDateField' }
        - name: from
          in: query
          required: false
          description: Inclusive ISO-8601 bound with a timezone (`…Z` or `±hh:mm`); must precede `to`.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: Exclusive ISO-8601 bound with a timezone.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: >-
            Integer result cap, default 25. Not bounded above; negative values give no results. Across
            workspaces it is split `floor(limit / workspaces)` per workspace with the remainder to the
            lowest workspace ids.
          schema: { type: string }
      responses:
        '200':
          description: The search envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchMissionsResponseV2' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
