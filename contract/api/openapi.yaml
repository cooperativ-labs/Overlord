      summary: List a workspace's webhook subscriptions
      description: >-
        Requires `webhook:read` on the named workspace (a workspace outside the caller's authorized set
        answers 404). Authenticated requests carry no ambient workspace, so `workspaceId` is required in
        practice. Newest first; never includes a secret.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
