      summary: Create a webhook subscription
      description: >-
        Requires `webhook:create` on the subscription's workspace: the named project's workspace when
        `projectId` is given (then `workspaceId` is ignored), else `workspaceId`. The endpoint must use
        `https://`, or `http://` for an internal host (`OVERLORD_WEBHOOK_INTERNAL_HOSTS`, plus loopback on
        Local). A host that is a literal private address (loopback, RFC 1918, link-local, unspecified,
        unique-local or IPv4-mapped forms of these) answers 400 unless it is internal; hostnames are
        resolved and checked at dispatch and test time. Records a `webhook_subscription` change. The signing secret (`whsec_…`) is returned only here and by rotation.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
