    description: "Workspace activity feed and objective transcripts."
  - name: agent-catalog
    description: "Workspace agent catalog."
  - name: agent-requests
    description: "Human inbox of agent-session requests."
  - name: agent-session-channels
    description: "Agent Session Exchange adapter channel (channel credential only)."
  - name: agent-session-inputs
    description: "Human-to-agent session inputs."
  - name: auth
    description: "Overlord-owned sign-in handoffs and login-provider advertisement (Better Auth routes are excluded)."
  - name: chat
    description: "Private assistant conversations (Cloud)."
  - name: connections
    description: "Account connections."
  - name: deliveries
    description: "Delivery deferred-work resolutions."
  - name: everhour
    description: "Everhour extension routes."
  - name: execution-targets
    description: "Execution targets and their observations."
  - name: github
    description: "GitHub extension routes."
  - name: inbox
    description: "Profile-owned inbox capture."
  - name: launch-settings
    description: "Launch settings and preferences."
  - name: local-target
    description: "Co-located local-target capability calls."
  - name: mcp
    description: "MCP Streamable HTTP endpoint; tools are specified by the generated tool catalog (ADR 0008)."
  - name: meta
    description: "Health, metadata and diagnostics."
  - name: missions
    description: "Missions, mission search and mission sub-resources."
  - name: mobile
    description: "Mobile push and Live Activity registration."
  - name: notifications
    description: "In-app notifications and notification preferences."
  - name: oauth
    description: "Hosted MCP OAuth authorization server and discovery."
  - name: objectives
    description: "Objectives and objective sub-resources."
  - name: organizations
    description: "Organizations and onboarding."
  - name: profile
    description: "Own profile and default project."
  - name: project-resources
    description: "Project resources and sources."
  - name: project-statuses
    description: "Project statuses."
  - name: projects
    description: "Projects and project sub-resources."
  - name: protocol
    description: "Agent protocol transport; subcommands are specified by protocol-commands.yaml (ADR 0008)."
  - name: realtime
    description: "Realtime streams and the change feed."
  - name: run-queues
    description: "Project Run Queues."
  - name: runner
    description: "Runner queue operations."
  - name: storage
