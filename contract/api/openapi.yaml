        `provider_not_ready` without a write key, 422 `credential_rejected` when upstream refuses the key,
        502 `provider_unavailable` when upstream cannot be reached. The key is never echoed.
      security: [ { sessionCookie: [] }, { sessionBearer: [] }, { userToken: [] } ]
