      x-overlord-edition: both
      x-overlord-consumers: [mobile, webapp]
      summary: Connect or rotate an API-key account connection
      description: >-
        Profile-scoped, both editions. The key is validated upstream before it is sealed; this is also the
        reconnect and rotation call. 404 `provider_not_available` for a provider that is not an API-key
