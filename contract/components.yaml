# Overlord Component Registry
# Machine-readable counterpart to CONTRACT.md "Component Registry" and "Interaction Surfaces"
#
# IMPORTANT: Update this file and CONTRACT.md together when adding components or surfaces.
# Increment contractVersion when any stable interface changes.

contractVersion: '76'

components:
  protocol:
    label: 'Protocol Layer'
    stableIdentifier: protocol
    referenceSpec: 'planning/feature-plans/03-agent-protocol.md'
    owns:
      - 'ovld protocol subcommand names and flags'
      - 'packages/core protocol/service source package: shared service functions, repository helpers, and generated database types'
      - 'session lifecycle: attach → (update|heartbeat)* → (ask|deliver)'
      - 'context assembly format from attach'
      - 'delivery payload structure and validation rules'
      - 'versioned delivery-report evidence normalization and deterministic fallback presentation'
      - 'transactional enqueue of overlord.delivery.compose.v1 worker jobs from deliverSession and recordWork'
      - 'request envelope: per-flag fileInputs map (at most one stdin payload) and change-rationale file_path/filePath alias normalization'
      - 'changed-file and change-rationale recording protocol'
      - 'idempotency key scope naming: protocol.*'
      - 'in-place mission artifact updates via update-artifact (same editable fields and revision CAS as REST PATCH /api/missions/:id/artifacts/:artifactId; no session key required)'
      - 'mid-turn mission artifact creation via add-artifact (POST /api/protocol/add-artifact), which creates an artifact without a delivery using the same createArtifact service as REST POST /api/missions/:id/artifacts; optional session key stamps session/objective provenance when present'
      - 'account-owned inbox capture: protocol create --inbox explicitly creates a private profile-owned inbox item; ordinary non-executing create falls back to inbox only after explicit and discovered project resolution fail, while prompt and record-work remain project-required'
      - 'objective auto-advance on create/prompt/add-objectives via per-item autoAdvance and --auto-advance/--no-auto-advance, plus update-objective to toggle auto-advance on an existing objective'
      - 'agent-facing mission lifecycle commands only; runner queue/device/project-resource management commands live on CLI/Runner/REST surfaces'
    dependsOn:
      - database
      - auth
    interactionSurfaces:
      - agentToProtocol
      - protocolToDatabase

  database:
    label: 'Database Layer'
    stableIdentifier: database
    referenceSpec: 'planning/feature-plans/09-database-schema-contract.md'
    owns:
      - 'table definitions, column types, indexes, foreign keys, CHECK constraints'
      - 'organizations table (grouping layer above workspaces) and the required workspaces.organization_id FK; workspaces remain the sole RBAC layer; slugs are unique per organization, not instance-wide'
      - 'Agent Session Exchange core tables (agent_session_channels, agent_session_events, agent_requests, agent_session_inputs) declared by contract and migrated with the channel bootstrap; the scoped channel credential is hash-only and scoped to one channel, native_session_id is a correlation alias and never an authorization key, raw native payloads are never persisted, and no derived capability tier is persisted. The never-migrated hook_events and permission_requests designs are superseded by them; their closed status vocabulary and the mission_events permission_request value remain valid'
      - 'controlled vocabularies (closed and open sets)'
      - 'creation provenance on missions and objectives: created_by_kind (closed human/agent/automation, NOT NULL DEFAULT human), created_by_agent (open connector identifier), and created_by_session_id as a deliberate soft reference to agent_sessions.id with no foreign key, so a dangling provenance pointer can never block a delete; provenance is read as a column on rows already selected and carries no new index'
      - 'profile-owned inbox_items: a minimal private unassigned capture with one v1 objective array entry, optional due datetime and priority, profile cascade deletion, and no workspace/project/status/session state'
      - 'versioned deliveryReport payload storage in deliveries.payload_json; summary remains immutable agent-authored source text'
      - 'worker_jobs durable background queue including core types overlord.delivery.compose.v1, overlord.live_activity.dispatch.v1, overlord.push_notification.dispatch.v1, and overlord.notification.dispatch.v1'
      - 'private live_activity_push_tokens registrations keyed by profile and ActivityKit activity id, carrying environment and bundle_id so update/end pushes select the APNs host and liveactivity topic per registration; APNs tokens are never projected through REST, realtime, or audit payloads'
      - 'private device_push_tokens registrations (globally unique device_token bound to one profile, with platform, environment, and bundle_id) and notification_preferences rows unique per (profile_id, type, transport), with a reserved (all, all) master row; standard APNs device tokens are stored separately from ActivityKit tokens and are never projected through REST, realtime, or audit payloads'
      - 'private notifications history rows addressed to exactly one assigned mission-owner profile, with workspace/mission/objective references, read and soft-dismiss lifecycle, revision CAS, and no token, prompt, instruction, summary, or event payload storage'
      - 'project_resources as project-scoped logical identities and project_resource_sources as the sole target/source materialization descriptors (local checkout paths, Git, bundles, or opaque virtual handles), with optional per-agent launchDefaults (pre-command and normalized flags) in descriptor_json; existing resource rows are intentionally discarded by the contract-v4 migration rather than carried through a legacy compatibility shape'
      - 'execution_target_runner_registrations: one-to-many live runner processes serving one local execution target (runner_instance_id, native/adopted relation, non-secret label/runner_version/capabilities_json/supported_agents_json, health/last_heartbeat_at/last_error_code); source of truth for local target reachability, distinct from the gateway-owned one-per-virtual-target execution_target_registrations; execution_requests.claimed_by_runner_registration_id records the winning runner instance'
      - 'explicit leased lifecycle policy for disposable independent local execution targets: lifecycle_kind, lease duration/grace/expiry, compare-and-set heartbeat renewal, and an idempotent backend cleanup worker; expiry is offline only and never performs cleanup'
      - 'virtual execution target core tables (execution_target_registrations, project_environment_definitions, project_resource_sources, execution_request_snapshots, execution_request_grants, execution_request_observations, mission_target_resources) and additive execution_requests snapshot/failure/gateway columns; immutable snapshot (payload_json + SHA-256 payload_digest) created in the same transaction as the queued request and never updated; grant records store hashes/opaque IDs, never bearer values'
      - 'soft-delete and revision semantics'
      - 'migration versioning via schema_migrations'
      - 'extension table naming: ext_<name>_'
      - 'logical types and adapter mappings'
    dependsOn: []
    interactionSurfaces:
      - protocolToDatabase
      - restApiToDatabase
      - restApiToDatabase
      - extensionToCore

  cli:
    label: 'CLI Layer'
    stableIdentifier: cli
    referenceSpec: 'planning/feature-plans/02-cli-first-product-surface.md'
    owns:
      - 'management command names and argument shapes'
      - 'ovld setup: interactive first-run configuration for backend target, agent connectors, and terminal launcher'
      - 'ovld serve: boot a fully-initialized local instance in local/backend packages'
      - 'ovld config set: select a local loopback backend URL or hosted/cloud backend URL'
      - 'ovld auth login: first-run backend onboarding before authentication'
      - 'project linking and discovery from working directory, with a packaged-mode fallback to the OS app-data overlord.toml'
      - 'configuration file locations: overlord.toml, .overlord/project.json (legacy resourceId plus additive resourceIdsByExecutionTarget map keyed by execution_targets.id, plus additive resourceKey for logical checkout identity, plus additive projects array for every linked project with at most one isPrimary); linking a read_write checkout idempotently maintains its agent no-edit instruction block and ignores only .overlord/tmp/ and .overlord/logs/'
      - 'project resource registration commands: ovld add-cwd --key <resourceKey> upserts a target-scoped local_checkout source on the project-scoped identity; ovld add-url --url <git-url> upserts its project-global git source'
      - 'backend URL settings: backend_url and backend_mode (local/cloud)'
      - 'per-user terminal profiles on user_execution_target_preferences for opening launched agents in a terminal window'
      - 'protocol session-key cache: persists the attach session key by (working directory, mission) and auto-injects --session-key when the flag is absent; cleared at deliver'
      - 'agent-session runtime: the ovld agent-session command family and the compiled harness catalog (cli/src/agent-session/catalog.generated.ts). The only local module that carries agent-session traffic to the backend, and only with the channel-scoped OVERLORD_SESSION_CHANNEL_TOKEN — never the user broad USER_TOKEN. The runtime reads the compiled catalog, never the descriptor YAML. Adding a sixth harness must add zero agent-session subcommands'
      - 'ovld agent-session capabilities [<agent>] [--json]: offline human/agent-facing reader of the compiled catalog — no network call, no write, no subprocess'
      - 'ovld agent-session event --agent <key> --payload-file -: the push path for callback and extension shapes. Gate, reduce on the machine, post, exit. Emits no stdout or stderr on any path and exits 0 on every path including failure, because an observational hook that speaks has produced output the user did not ask for and cannot turn off'
      - 'ovld agent-session request --agent <key> --payload-file -: the call path for callback decision hooks. Gate, create, wait with waiter-lease renewal, emit exact native allow/deny or defer silently'
      - 'ovld agent-session inbox --agent <key> [--payload-file -]: the inject path. Claims one pending instruction and emits harness-native bytes with honest Delivered / Queued(turn-boundary) / Unsupported reporting; Claude asyncRewake exits 2 with stderr; Cursor followup_message never reports Delivered'
      - 'ovld agent-session sidecar --agent <key> --port <port>: the push path for control-plane shapes. Harness-agnostic — it is driven by the adapter descriptor and codec, so a sixth control-plane harness adds zero subcommands. Binds the harness control port on loopback only, mints a per-launch secret held in memory and never persisted or projected to a client, and re-reads harness state before resubscribing after a dropped stream'
      - 'cli/src/agent-session/codec-registry.generated.ts: connector-owned event codecs compiled for execution. The CLI executes harness dialects but is never their source of truth'
      - 'cli/src/agent-session/decision-codec-registry.generated.ts: connector-owned request/decision codecs compiled for execution. The pure interpreter reduces native request payloads into bounded redacted cards and emits the connector-declared exact native allow/deny/defer bytes'
      - 'ovld doctor agent-session reporting: installed descriptor digest versus the compiled catalog, and which mission the current working directory native session is bound to, both without a network call for an unbound session'
      - 'human-readable CLI output format conventions'
      - 'ovld inbox create alias for non-executing account-owned capture'
    dependsOn:
      - auth
      - rest
    interactionSurfaces:
      - cliToRest
      - connectorToAgentSessionRuntime

  connector:
    label: 'Connector Layer'
    stableIdentifier: connector
    referenceSpec: 'planning/feature-plans/05-connectors-and-agent-plugins.md'
    owns:
      - 'connector core workflow instructions'
      - 'per-agent plugin/adapter files and managed file manifests'
      - 'hook scripts and their event contracts'
      - 'ovld agent-setup <agent>/all and ovld doctor behavior'
      - 'connector capability declarations and approved capability flag set'
      - 'per-adapter event codec declaration (connectors/adapters/<agent>/codec/<agent>.codec.yaml, referenced by the descriptor codecSpec field): a declaration of where native values live, never executable code. It cannot name a destination the core interpreter does not implement, and an unknown key is a generation error rather than a silently ignored field'
      - 'per-adapter decision codec declaration (connectors/adapters/<agent>/codec/<agent>.decision-codec.yaml, referenced by decisionCodecSpec): native request paths and literal allow/deny/defer bodies compiled for the shared pure interpreter; exact bytes and redacted request cards are pinned by executable decision-codec fixtures'
      - 'per-adapter harness capability descriptor (connectors/adapters/<agent>/harness-capabilities.yaml, validated by contract/harness-capabilities.schema.yaml) and its executable fixtures: the only hand-authored agent-session capability source, and simultaneously the runtime gating input, the CI contract, and the source of the generated CAPABILITIES.md, HARNESS-MATRIX.md, compiled CLI catalog, and deprecated conformance projection'
      - 'connector-owned native event-normalization and decision codecs; resolve emits the harness exact native decision shape and every failure path returns no decision so the harness own behavior remains the floor'
    doesNotOwn:
      - 'any network call to the Overlord backend — adapters translate and hand off to the CLI, which owns transport, auth, retry, and redaction'
      - 'the live session effective capability snapshot (computed by the backend from catalog plus runtime probes and policy)'
      - 'capabilityTier, which is derived from passing fixtures and never authored or persisted'
    dependsOn:
      - protocol
      - cli
    interactionSurfaces:
      - connectorToProtocol
      - connectorToAgentSessionRuntime

  runner:
    label: 'Runner Layer'
    stableIdentifier: runner
    referenceSpec: 'planning/feature-plans/04-runner-and-launch-execution.md'
    owns:
      - 'execution_requests queue claiming and launch'
      - 'working directory resolution: explicit workingDirectory, objective resource_key on the claiming target, primary target resource, then cwd .overlord/project.json fallback (matching the mission project among any linked projects in that file)'
      - 'effective launch-config resolution shared by manual, auto-advance, and claim-time paths: objective override, selected project-resource source defaults, user execution-target defaults, workspace defaults, then empty'
      - 'per-mission branch/worktree preparation before local agent spawn when enabled'
      - 'same-mission branch/worktree reuse: an existing planned worktree on the expected mission branch may be reused even when dirty so sequential objectives can continue uncommitted work'
      - 'runner launch environment, including OVERLORD_PROJECT_RESOURCES sibling-resource manifest resolved for the launching target'
      - 'mission branch base resolution for runner preparation: project-configured base first, then the repository main worktree checkout, then the repo default'
      - 'deterministic branch/worktree planning algorithm (cli/src/branch-planning.ts), co-owned with the service layer and pinned to contract/branch-planning-vectors.json'
      - 'ovld runner commands'
      - 'runner-instance identity and heartbeat: a stable runnerInstanceId plus a native/adopted relation to the execution target it serves, published on every claim so the backend reports honest local liveness'
      - 'persistent runner service: ovld runner supervise delegates to the same claim-and-launch path as ovld runner once; Postgres runners reconnect queue long-polls immediately after an empty wake/25s timeout while SQLite retains an adaptive polling fallback; ovld runner service <install|start|stop|restart|status|uninstall> manages an OS-level user service (macOS launchd io.overlord.runner, Linux systemd --user overlord-runner.service); local diagnostic state in ~/.ovld/runner-service.json; owner-only service files; Windows deferred'
      - 'execution target selection logic'
      - 'runner queue REST operations used by ovld runner: GET /api/runner/status, POST /api/runner/claim, POST /api/runner/clear, POST /api/runner/requests/:id/launching, POST /api/runner/requests/:id/launched (additive optional providerSession body), POST /api/runner/requests/:id/failed, POST /api/runner/requests/:id/harness-events (additive Latch event ingest; presentation only)'
      - 'branch-preparation acknowledgement through POST /api/missions/:id/branch-prepared'
      - 'Latch capability discovery on the execution target: run read-only `latch capabilities --json` where the process will run, expose found/not_installed/incompatible states, cache per target with cheap revalidation, never install or upgrade Latch as a side effect'
      - 'Latch launch path: when claim-time launchSession selects latch and the launch environment contains LATCH_SESSION_ID, run the same terminal command string S inline in that existing PTY via $SHELL -lc, record the opaque id as providerSession, and never call latch create or open; the marker is correlation only and grants no authority. Otherwise, when discovery is found, replace only the final spawn with latch create --manifest-file - --json using S via $SHELL -lc, record providerSession on execution_requests.metadata_json, then best-effort latch open; viewer failure must not fail the request; direct launch unchanged when provider is direct or Latch unavailable'
      - 'Latch terminal-session lifecycle capabilities on the execution target: inspectLatchSession, openLatchSession, stopLatchSession, collectLatchEvents, and resolveLatchInput invoke the public Latch CLI with argv on the mapped device; inspect state is running/exited/stopping/lost while reachability remains a separate capability-result/client condition; stop is explicit and never coupled to objective delivery or completion; collectLatchEvents snapshots `latch events --json --from`; resolveLatchInput relays `latch send --resolve` when the binary advertises it'
      - 'Launch does not mint Agent Session Exchange channels. Protocol attach is the binding declaration and does not require a Latch session or a session channel'
    dependsOn:
      - database
      - connector
      - rest
    interactionSurfaces:
      - runnerToRest

  rest:
    label: 'REST API Layer'
    stableIdentifier: rest
    referenceSpec: 'planning/feature-plans/09-database-schema-contract.md'
    referenceSection: 'REST API Boundary'
    owns:
      - 'URL paths and HTTP method contracts'
      - 'project resource-source launch defaults via PATCH /api/projects/:id/resources/:resourceId/sources/:sourceId, preserving the materialization fields in descriptor_json while replacing per-agent launchDefaults'
      - 'request/response DTO shapes (camelCase, derived from logical schema)'
      - 'creation-provenance projection: MissionDto/ObjectiveDto carry non-optional createdByKind (human fallback in the mapper), createdByAgent, and createdByWorkspaceUserId; MissionDetailDto alone carries createdFrom (sessionId, missionId, missionDisplayId, agentIdentifier, or null) via a LEFT JOIN that tolerates a missing session and is never paid per board row'
      - 'terminal-session projection: MissionDetailDto.terminalSessions additively returns bounded Latch provider-session mappings from all mission execution requests, with target/device label, stored name, claim-time executable/viewer, last observed state, and additive observation (cursor, turnCount, pending awaiting_input, unattached); it never exposes launch material, terminal output, credentials, socket tokens, or attachment grants'
      - 'POST /api/missions/:id/terminal-sessions/harness-events ingests Latch NDJSON as presentation and may emit agent_question for a new awaiting_input; POST /api/missions/:id/terminal-sessions/resolve-observation clears a pending request id after a local-target latch send --resolve. Neither is a Latch dependency for protocol Channel 1'
      - 'Agent Session Exchange human resolve/enqueue/release surfaces remain mounted for historical rows but return no active controls (410). Adapter channel routes are not used by new connector installs'
      - 'profile-owned inbox routes: authenticated GET/POST /api/inbox, GET/PATCH/DELETE /api/inbox/:id, and POST /api/inbox/:id/promote; profile isolation returns 404, promotion requires mission:create on the destination project and atomically creates its normal mission then consumes the capture; inbox writes are intentionally outside workspace realtime'
      - 'delivery read projection: GET /api/missions/:id/deliveries returns normalized DeliveryDto records and delivery mission events expose an additive deliveryId without raw payload JSON'
      - 'admin-only workspace objective CSV export (GET /api/workspaces/:id/objectives.csv) as a text/csv attachment'
      - 'read-only derived mission branch metadata (MissionBranchDto) from missions.active_branch, predicted via the service layer copy of the branch-planning algorithm (backend/branch-planning.ts) pinned to contract/branch-planning-vectors.json, then merged with latest client branch observations when available'
      - 'mission branch base metadata resolution: project-configured base first, then the primary resource main worktree checkout for pending branches, with prepared branches tied to the runner-recorded baseBranch payload'
      - 'on-demand branch-action git mutations (POST /api/missions/:id/branch/action: merge-with-parent / push-parent / publish) run host-side against worktrees under ~/.ovld/worktrees and the resource selected by optional resourceKey, defaulting to the primary repo; the Runner Layer owns launching the agent into a worktree, not these mutations'
      - 'REST auth integration points'
      - 'desktop OAuth handoff: browser-only GET /api/auth/desktop/github starts only the configured GitHub provider with the fixed desktop callback, so Better Auth writes its OAuth state cookie in the system browser; GET /api/auth/desktop/callback derives a short-lived opaque ticket from an authenticated browser session and redirects only to overlord://auth/callback; POST /api/auth/desktop/exchange consumes it once and returns a Better Auth session token only to the Electron main process'
      - 'hosted-web OAuth handoff: browser-only GET /api/auth/browser/callback accepts only a configured trusted web origin, derives a short-lived opaque ticket from an authenticated browser session, and redirects to that origin; POST /api/auth/browser/exchange consumes it once and returns a Better Auth session token to the web client without placing a credential in the callback URL'
      - 'versioned agent-session channel route family /api/agent-session-channels/v1/* — adapter event/request/input/heartbeat operations for exactly one channel, authenticated only by a channel-scoped credential; a normal user or session token is rejected there and a channel credential is rejected on every human route'
      - 'separate authenticated human agent-session surfaces (resolve effective capabilities, list/answer requests, enqueue/cancel input) using session/token auth plus resource-derived RBAC, the permission-resolution RBAC and workspace policy ceiling, revision CAS, and immutable audit attribution'
      - 'server-side payload allowlist and bounds for agent-session summaries, options, ids, sequences, timestamps, and diagnostic codes; formatter output renders as escaped plain text with explicit truncation'
      - 'SSE/WebSocket realtime endpoint (GET /realtime, compatibility GET /api/stream) and GET /sync/changes?after=<seq> catch-up read; both aggregate current readable memberships, filter before EntityChangeDto projection, expose workspaceId, and advance the global cursor past filtered rows'
      - 'SQL Studio launch metadata exposed through /api/meta'
      - 'webhook subscription management (/api/webhooks*: list/create, update/soft-delete, rotate-secret, test, deliveries, redeliver), gated by webhook:* permissions'
      - 'in-process webhook dispatcher (backend/webhook-dispatcher.ts), a RealtimeHub-style singleton polling loop claiming outbox_messages rows and delivering HMAC-signed HTTP POSTs; SSRF guards (https-only, private-network block) apply to external endpoints, with an OVERLORD_WEBHOOK_INTERNAL_HOSTS allowlist (plus implicit localhost in Local edition) exempting colocated consumers'
      - 'full mission.delivered webhook envelopes include the normalized delivery.report projection without exposing raw deliveries.payload_json; thin envelopes remain identifier/link-only'
      - 'in-process delivery composition worker (backend/delivery-compose-worker.ts) claiming overlord.delivery.compose.v1 worker_jobs, calling the compose-delivery automation, and updating deliveryReport.presentation with entity_changes(entity_type=delivery)'
      - 'organization management endpoints: list organizations for the caller, update an organization (org-admin gated), list/add/remove organization admins (add/remove maintains the invariant that an org admin is ADMIN of every constituent workspace)'
      - 'shared onboarding endpoint (POST /api/onboarding, zero-membership users only): creates an organization, a default workspace, membership, and ADMIN role in one transaction; used verbatim by the web onboarding screen and the ovld org-setup CLI command'
      - 'project APIs support explicit target workspace context for multi-workspace organization UIs: CreateProjectBody.workspaceId and GET /api/workspaces/:id/statuses'
      - 'project list lifecycle filtering: GET /api/projects and GET /api/workspaces/:id/projects default to active projects and accept lifecycle=active|archived|all; lifecycle selection never changes project-read authorization'
      - "workspace agent catalog and launch-settings management uses only workspace-scoped routes under /api/workspaces/:id, authorized against the target workspace's own membership (launch:read to view, launch:configure to mutate; non-membership reads as 404)"
      - 'authenticated default-project preference routes GET/PUT/DELETE /api/profile/default-project use the account-wide project_user_preferences.preferences_json.overlord.defaultProject marker; it grants no access and defaultProjectId is additive on /api/meta'
      - "resource-owned REST and extension operations derive the named resource's workspace and the caller's matching workspace_users membership before authorization, persistence, external-provider access, and entity_changes attribution; account-wide reads aggregate authorized memberships server-side and parentless creates name a workspace when ambiguous"
      - "workspace execution-target projection: GET /api/workspaces/:id/execution-targets returns all non-deleted target identity/status/owner display metadata, reachability, honest unavailable reason, safe runner-instance diagnostics, non-secret leased-lifecycle policy/expiry, and active workspace-member access count to an authenticated member; never connection_json, credentials, raw capabilities, target registration, creation, or access mutation. Project selection remains limited to the acting member's eligible targets. Workspace admins may PATCH a target label and active/disabled status; disabled targets are ineligible and cannot be claimed. DELETE soft-deletes the target plus its linked device when that device has no remaining live execution target; the GET projection opportunistically soft-deletes any remaining orphan devices"
      - 'storage routes for the organization-images bucket key (/api/storage/organization-images/…) with a PUBLIC organization_image:read grant'
      - 'hosted MCP OAuth endpoints: POST /oauth/register, POST /oauth/token, POST /oauth/revoke, GET /oauth/authorize, POST /oauth/authorize/request, POST /oauth/authorize/approve'
      - 'versioned virtual-target gateway route family (/api/virtual-targets/v1/*): PUT …/registration, POST …/claim, POST …/requests/:id/progress, POST …/requests/:id/launched, POST …/requests/:id/failed, POST …/grants/:id/exchange, GET …/missions/:id/resources, POST …/missions/:id/actions; owns DTO shapes, target-authenticated auth/RBAC, per-request idempotency, and bounded/redacted output; the immutable VirtualExecutionQueueItemV1 payload + digest are built by the service layer at queue time and returned only to the authenticated claiming gateway; local /api/runner/* routes are unchanged'
      - 'authenticated mobile Live Activity registration routes: PUT and DELETE /api/mobile/live-activities/:activityId/push-token; registrations are private to the caller and APNs delivery is handled by the in-process live-activity dispatcher'
      - 'authenticated standard push routes: PUT /api/mobile/push/device-token and POST /api/mobile/push/device-token/revoke (opaque device token carried in the body, never the URL, with no read surface), plus GET/PUT /api/profile/notification-preferences returning canonical { enabled, preferences: { type, transport, mode }[] } with an additive APNs categories compatibility projection; alert/background APNs delivery is handled by the in-process push-notification dispatcher and never reuses ActivityKit tokens or topics'
      - 'authenticated profile-owned notification history: GET /api/notifications lists only the caller profile non-dismissed rows with an additive bounded server-composed { body } presentation projection that is never stored on the row; PATCH /api/notifications/:id/read and DELETE /api/notifications/:id require expectedRevision, return 404 for another profile, and append notification entity changes in the same transaction. The notification dispatcher delivers the existing APNs transport only for catalog APNs types and otherwise emits a notification entity change for realtime consumers; it never exposes tokens or raw mission/event content. Web and desktop render only those history rows and notification entity changes; policy is never derived from other realtime entity types.'
      - 'editable mission artifacts: PATCH /api/missions/:id/artifacts/:artifactId accepts expectedRevision plus a non-empty subset of { label, contentText, externalUrl }, requires mission:update on the named mission, preserves delivery/session/objective provenance plus contentJson, rejects stale edits with 409 and non-HTTP(S) external URLs, and emits an artifact entity-change in the same transaction'
      - 'mid-turn mission artifact creation: POST /api/missions/:id/artifacts accepts { type, label } plus at least one of { contentText, externalUrl }, requires artifact:create on the named mission, optionally stamps objectiveId/sessionId provenance, leaves delivery_id null, and emits an artifact entity-change insert in the same transaction'
      - 'mission shared context: GET /api/missions/:id/context returns SharedContextEntryDto[] with mission:read; PUT /api/missions/:id/context upserts { key, value } with mission:update (same durable memory as Protocol write-context), and emits a shared_context_entry entity-change in the same transaction'
      - 'user-scoped GitHub repository authorization under /ext/github: authenticated connection metadata/authorization/disconnect and eligible-owner reads are account-wide; it reuses the Better Auth GitHub OAuth App client registration while maintaining a distinct explicit repo read:org grant, profile-bound hashed single-use state, and separately AES-256-GCM-encrypted token; its /api/auth/callback/github/repository callback is handled before the Better Auth wildcard; credentials never enter DTOs, logs, mobile/browser storage, realtime, or change projections, and the one-installation-per-workspace GitHub App integration remains separate'
      - 'composite project initialization: POST /api/projects/initialize authorizes project:create against its explicit workspace, atomically creates the project plus first mission/objective under a caller idempotency key, and optionally performs retryable private GitHub repository provisioning through the separate user OAuth connection; provisioning failure preserves the internal creation, while success records exactly one GitHub project link and one non-primary read-only git resource without changing the workspace GitHub App installation'
    dependsOn:
      - database
      - auth
    interactionSurfaces:
      - restApiToDatabase
      - virtualGatewayToRest

  auth:
    label: 'Auth Layer'
    stableIdentifier: auth
    referenceSpecs:
      - 'planning/feature-plans/07-user-token-authentication.md'
      - 'planning/feature-plans/08-role-based-access-control.md'
    owns:
      - 'token creation, rotation, revocation, tombstoning of revoked credentials, and hash storage'
      - 'role assignment CRUD'
      - 'permission check interface'
      - 'audit log attribution fields'
      - 'Better Auth implementation tables: user, session, account, verification, apikey'
      - 'self-service account deletion trigger (user.deleteUser), delegating the cascade to a backend-supplied callback'
      - 'sign-up/sign-in email verification via an optional backend-supplied sendVerificationEmail callback (Resend-backed, RESEND_API_KEY, notifications.cooperativ.io); disabled by default when unset'
      - 'hosted MCP OAuth consent and token issuance: browser approval creates scoped mission_lifecycle USER_TOKEN access tokens; authorization codes are short-lived, single-use, PKCE-protected, and resource-bound; refresh tokens are not issued through contract version 2'
    dependsOn:
      - database
    interactionSurfaces:
      - authToDatabase

  automations:
    label: 'Automations Layer'
    stableIdentifier: automations
    referenceSpec: 'automations/docs/01-automations-overview.md'
    owns:
      - 'Automation interface and built-in automation registry'
      - 'Gemini provider configuration and client lifecycle'
      - 'reference summarization automations and objective title automation'
      - 'compose-delivery automation: schema-constrained Gemini presentation for delivery reports with null fallback'
      - 'fire-and-forget automation helpers with caller-supplied persistence callbacks'
      - 'downstream automation loading via OVERLORD_AUTOMATIONS_MODULE (custom-automation extension point)'
    dependsOn: []
    interactionSurfaces:
      - serviceToAutomations

  extension:
    label: 'Extension System'
    stableIdentifier: extension
    referenceSpecs:
      - 'planning/feature-plans/09-database-schema-contract.md'
      - 'planning/feature-plans/agent-harness-configuration-architecture.md'
    referenceSection: 'Extension Points'
    owns:
      - 'user_harness_extensions authoring workflow'
      - 'workspace_harness_extensions catalog promotion workflow'
      - 'extension table namespace: ext_<name>_'
      - 'extension migration component naming: ext:<name>'
      - 'namespaced JSON metadata keys inside core tables'
    dependsOn:
      - database
    interactionSurfaces:
      - extensionToCore

  desktop:
    label: 'Desktop Shell'
    stableIdentifier: desktop
    referenceSpec: 'desktop/docs/desktop-app.md'
    optional: true
    owns:
      - 'Electron app/window lifecycle and the hardened BrowserWindow security baseline (contextIsolation, sandbox, nodeIntegration: false, preload)'
      - 'profile-scoped CSP (loopback in Local mode; remote REST + wss origins added in Remote mode), single-instance lock, shell-local navigation guard, external-navigation handling'
      - 'process supervision of the bundled web/REST server (Node utilityProcess) in Local mode only; Remote mode does not fork the embedded server'
      - 'backend profiles ({ id, label, mode: local|remote, backendUrl } + active id) in userData/settings.json, per-profile Electron session partitions (persist:backend-<id>), per-backend bearer-token storage via safeStorage, and the reload-and-login switcher / first-run chooser (additive; Local is the default unchanged behavior)'
      - 'the minimal window.overlord preload bridge surface (feature-detected by the SPA, never required by it), incl. getActiveBackend/listBackends/addBackend/removeBackend/switchBackend/writeProjectMetadata/invokeLocalTarget, onNavigate(route), runnerService.{getStatus,install,start,stop,restart,uninstall} which drive the CLI-owned ovld runner service operations as a subprocess without supervising the runner itself, and showNotification({ title, body, tag?, soundUrl? }) through only the bounded overlord:show-notification IPC handler; that notification bridge carries no route, credential, token, raw event content, or arbitrary Electron capability'
      - 'remote OAuth callback: handles overlord://auth/callback only in Electron main, exchanges its opaque short-lived ticket with the active backend, and writes the resulting Better Auth session token through per-profile safeStorage; no token crosses the preload bridge'
      - 'mission deep links: accepts only overlord://missions/<missionId> where missionId matches [A-Za-z0-9:_-]{1,64}, then focuses the shell and emits the fixed internal /user/missions/<missionId> route through onNavigate; links carry no credential, ticket, or payload'
      - 'desktop packaging metadata and the build/sign/notarize pipeline (electron-builder, entitlements, app-data layout)'
    dependsOn:
      - rest
      - cli
      - runner
      - auth
    interactionSurfaces:
      - shellToRest
      - shellToCli

  mobile:
    label: 'Mobile REST Consumer'
    stableIdentifier: mobile
    referenceSpec: '../OverlordMobile/conformance-manifest.yaml'
    owns:
      - 'native ActivityKit lifecycle and per-activity push-token registration stream'
      - 'standard user-notification permission prompt and APNs device-token registration, rotation, sync, and revocation on sign-out; device tokens are kept strictly separate from ActivityKit tokens'
      - 'user-visible notification preference UI backed by the profile notification-preferences routes, and handling of notification taps into mission deep links'
      - 'authenticated registration, rotation, and revocation calls to the Mobile → REST surface'
      - "presentation of the additive creation-provenance fields decoded from MissionDto/ObjectiveDto (createdByKind, createdByAgent, createdByWorkspaceUserId) as optionals defaulting to human; an agent-authored objective read back in the mission chat feed is attributed rather than presented as the operator's own text, and the attribution leads the accessibility label"
    dependsOn:
      - rest
    interactionSurfaces:
      - mobileToRest
      - mobilePushToRest

  mcp:
    label: 'MCP Server'
    stableIdentifier: mcp
    referenceSpec: 'mcp/README.md'
    optional: true
    owns:
      - 'hosted MCP endpoint path: GET/POST /mcp'
      - 'supported MCP protocol version advertisement'
      - 'MCP tool names, input/output schemas, safety annotations, MCP Apps resource URI patterns, prompt names, and MCP JSON-RPC response shaping'
      - 'public ChatGPT mission-first surface: project resolution/selection, mission search/context reads, explicit mission/session writes, and presentation-only widget resources'
      - 'OAuth protected-resource metadata for the hosted MCP resource'
      - 'mapping MCP tool calls to existing service/protocol operations'
      - 'hosted overlord_update_artifact tool forwarding to Protocol update-artifact'
      - 'hosted overlord_add_artifact tool forwarding to Protocol add-artifact'
      - 'additive assignedTo input on overlord_create_mission, forwarded to the same service-layer member resolver as Protocol --assigned-to (workspace_users.id, profile UUID, orgid:username, bare username, or email); an unresolvable member is an error, never a silent fallback to unassigned'
      - 'additive autoAdvance input on overlord_create_mission and overlord_add_objectives items, forwarded to Protocol create/add-objectives'
      - 'hosted overlord_update_objective tool forwarding to Protocol update-objective'
    dependsOn:
      - auth
      - protocol
      - database
    interactionSurfaces:
      - mcpToAuth
      - mcpToService

# Interaction surfaces — the only sanctioned paths between components
interactionSurfaces:
  mobileToRest:
    description: 'Native mobile app registers private ActivityKit push tokens over REST; the server owns snapshot recomputation and APNs delivery'
    from: mobile
    to: rest
    transport: https-json
    authMechanism: bearer-token
    routeFamily: '/api/mobile/live-activities/:activityId/push-token'
    rules:
      - 'PUT accepts only an opaque ActivityKit pushToken and upserts the authenticated profile registration; DELETE revokes only that caller registration and both operations are retry-safe'
      - 'Registrations and tokens are never returned by a read endpoint, included in realtime, or written to application logs'
      - 'The mobile app never sends mission data or an APNs payload; the backend recomputes the bounded account snapshot from authorized data'

  mobilePushToRest:
    description: 'Native mobile app registers standard APNs device tokens and notification preferences over REST; the server owns alert composition and APNs delivery'
    from: mobile
    to: rest
    transport: https-json
    authMechanism: bearer-token
    routeFamily: '/api/mobile/push/device-token, /api/profile/notification-preferences'
    rules:
      - 'PUT /api/mobile/push/device-token upserts { deviceToken, environment, bundleId, appVersion? } for the authenticated profile and rotates an existing token in place; POST …/revoke removes only that caller registration; both are retry-safe and return 204'
      - 'A device token is globally unique and bound to exactly one profile; registering a token held by another profile reassigns it, and clients must revoke before clearing credentials on sign-out'
      - 'Standard device tokens are never ActivityKit tokens: separate tables, routes, APNs topics (<bundleId> vs <bundleId>.push-type.liveactivity), and apns-push-type values'
      - 'Device tokens are carried in the request body, never the URL, and are never returned by a read endpoint, included in realtime, or written to application logs'
      - 'Notification preferences are caller-profile state addressed by every shared notification-catalog type and its catalog-declared transport, each with mode alert|silent|off. The reserved (all, all) master switch never affects Live Activity delivery. Unknown types, transports, ineligible pairs, or modes are rejected 400. GET adds an APNs categories projection and PUT accepts it as an APNs-only compatibility alias so older mobile builds remain usable; backend, webapp, mobile, and database consume the same canonical preference rows.'
      - 'The mobile app never sends mission data or an APNs payload; the backend recomputes the bounded alert snapshot from authorized data at delivery time'
      - 'APNs payloads carry only bounded project name, sanitized mission title and display id, unread-notification badge count (not missions-in-review), mission id, category, and deep link — never tokens, instructions, prompts, summaries, question text, file paths, or event payloads'

  agentToProtocol:
    description: 'Agents invoke ovld protocol subcommands via subprocess CLI'
    from: agent
    to: protocol
    transport: subprocess-cli
    authMechanism: session-key-flag
    requiredSequence: 'attach → (update|heartbeat)* → (ask|deliver)'
    responseFormat: json-stdout
    errorSignal: non-zero-exit
    shellSpecialHandling: '--summary-file - / --payload-file - with heredoc'

  protocolToDatabase:
    description: 'Protocol layer reads and writes via service layer only — no direct table access'
    from: protocol
    to: database
    transport: service-layer-function-calls
    rules:
      - 'No direct table writes from protocol handlers'
      - 'All mutations in ACID transactions'
      - 'Optimistic concurrency: revision compare-and-set; zero-row update = 409'
      - 'entity_changes appended in same transaction as domain mutation'
      - 'enqueueWebhookEvent() (packages/core/service/webhook-events.ts) appends matching outbox_messages rows in the same transaction as the domain mutation, called from both the protocol service core and the REST data layer — a second shared-single-writer rule alongside insertEntityChange'
      - 'Protocol-scope idempotency keys in idempotency_keys table'

  cliToRest:
    description: 'Published CLI commands call the configured backend over HTTP instead of opening the database'
    from: cli
    to: rest
    transport: http-json
    rules:
      - 'CLI must not import database adapters or service internals'
      - 'Backend URL comes from backend_url (loopback for Local, HTTPS for Cloud); a container/agent-pod CLI consumes the injected runtime OVERLORD_BACKEND_URL and must not persist config'
      - 'Mutations go through backend endpoints that own persistence and idempotency'
      - 'Cloud/headless runners authenticate with scoped service tokens that can claim only their own target/workspace requests'

  connectorToProtocol:
    description: 'Connector hook scripts invoke protocol commands via subprocess'
    from: connector
    to: protocol
    transport: shell-script-subprocess
    rules:
      - 'Hook scripts must not write to the database directly'
      - 'Hook scripts must use ovld protocol hook-event or update'
      - 'Hooks may not add new event types without contract update'
      - 'UserPromptSubmit follow-up capture records user_follow_up activity without requiring a live session and without reopening execution'

  connectorToAgentSessionRuntime:
    description: 'Connector integrations hand native payloads to the CLI agent-session runtime, which is the only component that calls the versioned agent-session channel route family'
    from: connector
    to: cli
    transport: subprocess-stdin-native-payload
    authMechanism: channel-scoped-credential
    routeFamily: '/api/agent-session-channels/v1/*'
    rules:
      - 'Adapters make zero network calls: they translate a native payload and hand it to ovld agent-session <action> --agent <key> --payload-file -, and the CLI owns transport, auth, retry, and redaction'
      - 'The CLI presents a channel-scoped hash-stored OVERLORD_SESSION_CHANNEL_TOKEN bound to exactly one session channel, never the user broad USER_TOKEN. A channel credential cannot read mission context or resolve a human decision; a normal user or session token is rejected on the adapter route family'
      - 'Credentials travel only through environment, stdin, or an authorization header — never argv, URLs, descriptor files, events, diagnostics, or crash text'
      - 'A native session id is a correlation alias only. The verified channel/session credential is the authorization and mission scope; the working directory may locate an existing local binding but never creates one and never authorizes an event'
      - 'Scope resolution runs before logging, interpreter spawn, filesystem write, or network access. An unbound session produces no request, no event, no database row, and no observable delay'
      - 'The harness own behavior is the floor: timeout, backend error, missing binding, auth failure, or malformed response all return no decision, which yields the native prompt. No failure path may manufacture an approval and no decision call may retry with a broader credential'
      - 'Payload reduction happens on the machine before transmission: no transcripts or transcript paths, no raw tool input or output, no file contents, no environment variables. Follow-up prompt text is the one deliberate exception, persisted in full for bound sessions'
      - 'Clients gate controls on the live channel effective capability snapshot, never on the static catalog and never on the agent identifier'
      - 'Human list/answer/enqueue surfaces are a separate auth family using ordinary session/token auth plus resource-derived RBAC'
      - 'Adding a harness must add zero agent-session subcommands: everything harness-specific travels as data, and the adapter key selects connector-owned event and decision codecs'
      - 'The session channel is created at the launching transition, before the agent process exists, so harness output published before attach lands somewhere durable and correctly authorized. POST /api/runner/requests/:id/launching additively returns a one-time sessionChannel bootstrap and the launch environment gains OVERLORD_SESSION_CHANNEL_ID and OVERLORD_SESSION_LAUNCH_KIND'
      - 'The raw credential is never written into the terminal launch script under <checkout>/.overlord/tmp. It is staged in an owner-only 0600 file outside every checkout, keyed by a hash of the channel id, and removed on channel end or auth failure; OVERLORD_SESSION_CHANNEL_TOKEN stays a supported input for virtual gateways that realize the bootstrap directly into the environment'
      - 'ovld protocol attach --session-channel-id binds the prepared channel to the new agent_sessions row and backfills the session id onto every pre-attach event and request. The flag carries the channel id only, never its credential'
      - 'The adapter router is mounted ahead of the /api human authentication guard, so a browser session, a USER_TOKEN, and the loopback-trusted local-operator fallback are structurally unable to reach it. Every handler operates on the channel resolved from the credential, never one named in a request body or path'
      - 'The shared connectors/core/scripts/agent-session-hook.sh is rendered per adapter as scripts/agent-session-<action>.sh with both the adapter key and a fixed action from a closed three-value set (event, request, inbox) substituted, so an untrusted native payload can never select which CLI operation runs'
      - 'Ending or losing a channel revokes its credential, releases every open request to the terminal, and expires every queued input in one transaction. A waiter lease renewed by long poll, plus a server-side release sweep, is what guarantees a held decision is released even when the waiting process is killed'
      - 'The blocking request runtime creates and observes requests only through its authenticated channel. Human request listing and resolution use ordinary session/token authentication in the request-owning workspace; a resolution requires an identified human actor, session:attach permission, and revision CAS. A callback returns an exact connector-native decision only when that human resolution wins; all other outcomes release to the harness without a decision'

  runnerToRest:
    description: 'CLI runner claims/updates execution requests through backend APIs, then launches agents locally'
    from: runner
    to: rest
    transport: http-json
    rules:
      - 'Runner queue endpoints are GET /api/runner/status, POST /api/runner/claim, POST /api/runner/clear, POST /api/runner/requests/:id/launching, POST /api/runner/requests/:id/launched (additive optional providerSession body persisted onto metadata_json.providerSession; never overloads launched_session_id), POST /api/runner/requests/:id/failed, and POST /api/missions/:id/branch-prepared'
      - 'Backend claim endpoint must perform atomic compare-and-set on execution_requests'
      - 'Postgres claim waits use a dedicated non-pooled LISTEN connection for at most 25 seconds after an empty initial claim; queue notifications are wake hints only, followed by the same scoped authorized atomic claim. The additive response longPoll flag is true for this capability; SQLite responds immediately with longPoll false.'
      - 'Backend claim must set claimed_by_device_id, claimed_by_execution_target_id when known, claimed_by_runner_registration_id when the claim registered a runner instance, and claim_expires_at'
      - 'A claim resolves an already-declared local execution target and never creates one; an explicit executionTargetId in the claim body must exist, be non-deleted, be type local, have status active, and be accessible to the authenticated member, otherwise the claim fails with 409 no_execution_target_registered'
      - 'Claim body additively carries runnerInstanceId, runnerRelation (native | adopted), runnerLabel, runnerVersion, capabilities, and supportedAgents; when runnerInstanceId is present the backend upserts only the execution_target_runner_registrations row (health healthy, heartbeat now) for the resolved target'
      - 'Several runner instances may serve one local target (host runner plus adopting containers); claim competition stays target-level and no request field selects a runner instance'
      - 'Local target reachability derives from a recent healthy/degraded runner registration; devices.last_seen_at is honored only for a target that has never had a runner registration (upgrade compatibility)'
      - 'Backend state transitions must append mission_events and entity_changes in the same transaction'
      - 'Allowed transitions are queued → claimed → launching → launched|failed; active requests may be cleared; stale claims and launched-without-attach requests may move to expired; other terminal statuses are sinks unless a new request is explicitly queued'
      - 'Protocol attach links execution_requests.launched_session_id when launch context supplies an execution request id'
      - 'Runner launches agents locally after a successful claim'
      - 'Runner reports launching/launched/failed state back through backend endpoints'
      - 'Runner claims and launches only local/device execution targets; virtual targets are claimed and realized by an external gateway over virtualGatewayToRest, and resolveWorkingDirectory never runs for a virtual claim'

  virtualGatewayToRest:
    description: 'An external Virtual Target Gateway (e.g. Racecar) claims and realizes virtual execution requests through the documented REST surface only — never the database'
    from: gateway
    to: rest
    transport: https-json
    authMechanism: target-scoped-gateway-principal
    routeFamily: '/api/virtual-targets/v1/*'
    rules:
      - "A gateway principal is scoped to exactly one execution_targets row of type virtual (target-authenticated, not device-authenticated); it cannot enumerate, claim, or observe another target's work"
      - 'claimed_by_execution_target_id is the universal claimant identity; claimed_by_device_id stays nullable for virtual claims'
      - 'PUT …/registration registers/refreshes gateway identity (gateway_key, gateway_instance_id), capabilities, supported agents, supported queue schema versions, adapter key/version, and heartbeat; a matching stable gateway identity replaces rather than creates a target'
      - "POST …/claim atomically claims a queued request for the caller's target and returns the immutable VirtualExecutionQueueItemV1 snapshot, claimId, expiry, and only request-scoped opaque launch-grant references — never filesystem paths or raw secrets; replaying the same gateway+request returns the same claim and payload"
      - 'POST …/requests/:id/progress appends a bounded, monotonic preparation observation and does not change status'
      - 'POST …/requests/:id/launched validates request/claim/target/digest, records VirtualTargetLaunchObservationV1, then makes the normal launching → launched transition exactly once'
      - 'POST …/requests/:id/failed records a typed, redacted VirtualTargetFailureV1 and makes the allowed transition to failed; retryable informs retry policy but does not itself requeue'
      - 'progress/launched/failed are idempotent by request and observation sequence'
      - "POST …/grants/:id/exchange swaps an authenticated, unexpired opaque grant for narrowly scoped credentials/attachment-download access bound to request+target+gateway instance; every exchange is audited and never returns the user's Overlord token"
      - 'GET …/missions/:id/resources returns summarized opaque lifecycle resources and source-compatibility observations; POST …/missions/:id/actions authorizes an explicit start/stop/archive/delete/enqueue/retry/dequeue action and delegates it; delegated-action output becomes an observation and can never change mission completion'
      - 'The gateway must never access the database directly; it must be idempotent by executionRequestId, and it must not introduce a parallel request state machine'

  restApiToDatabase:
    description: 'REST handlers use service layer after auth check'
    from: rest
    to: database
    transport: service-layer-function-calls
    rules:
      - 'Auth check via Auth Layer before any service call'
      - 'Same service layer as CLI and Protocol Layers'
      - 'Idempotency keys for retried writes'
      - 'Response shapes use camelCase logical field names'

  mcpToAuth:
    description: 'Hosted MCP requests authenticate through the Auth Layer before tool listing or invocation'
    from: mcp
    to: auth
    transport: http-bearer
    authMechanism: oauth-bearer-token
    discoveryEndpoints:
      - 'GET /.well-known/oauth-protected-resource'
      - 'GET /.well-known/oauth-protected-resource/mcp'
      - 'GET /.well-known/oauth-authorization-server'
    authorizationEndpoints:
      - 'POST /oauth/register'
      - 'GET /oauth/authorize'
      - 'POST /oauth/token'
      - 'POST /oauth/revoke'
      - 'POST /oauth/authorize/request'
      - 'POST /oauth/authorize/approve'
    rules:
      - 'MCP handlers must resolve the caller through the Auth Layer before listing or invoking tools'
      - 'Missing or failed authentication returns an OAuth-compatible WWW-Authenticate: Bearer challenge'
      - 'MCP authentication resolves the profile/credential without selecting an ambient workspace; resource operations derive scope and account-wide tools aggregate authorized memberships'
      - 'OAuth approval creates mission_lifecycle-scoped USER_TOKEN access tokens and does not issue refresh tokens through contract version 2'
      - 'OAuth resource parameters, when supplied, are bound through approval and token exchange to the canonical hosted /mcp resource; mismatches return invalid_target'

  mcpToService:
    description: 'MCP tool handlers call existing service/protocol functions and never write tables directly'
    from: mcp
    to: database
    transport: service-layer-function-calls
    rules:
      - 'MCP handlers must not read or write database tables directly'
      - 'Every tool call must pass through the same RBAC gates as the corresponding REST or protocol operation'
      - 'Mission creation tools require explicit projectId or a prior resolved project identity; missing or ambiguous project context is a tool error'
      - 'Hosted MCP delivery artifacts use the existing Protocol deliver artifact shape and lifecycle; MCP does not create artifact types or write artifact rows directly'
      - 'Hosted MCP mid-turn artifact creation uses overlord_add_artifact → Protocol add-artifact → the same createArtifact service as REST POST; MCP does not write artifact rows directly'
      - 'Hosted MCP artifact updates use overlord_update_artifact → Protocol update-artifact → the same updateArtifact service as REST PATCH; MCP does not write artifact rows directly'
      - 'Hosted MCP objective auto-advance uses overlord_create_mission / overlord_add_objectives autoAdvance and overlord_update_objective → Protocol create/add-objectives/update-objective; MCP does not write objective rows directly'
      - 'Hosted MCP must not expose local filesystem/worktree inspection, runner queue claiming, execution target mutation, or branch-action tools'
      - 'MCP Apps widget resources use ui://overlord/* URIs, self-contained HTML, and associated tool structuredContent only; no third-party frames, secrets, or unrestricted network access'

  authToDatabase:
    description: 'Auth layer accesses auth tables via the configured Better Auth database adapter; reads role_assignments and workspace_users for identity bridging'
    from: auth
    to: database
    transport: configured-better-auth-adapter-and-direct-query
    rules:
      - 'Auth tables (user, session, account, verification, apikey) are auth-internal; no other component reads them directly'
      - 'Identity bridge reads profiles where profiles.id matches the Better Auth user id, then resolves workspace_users only for explicit resource/workspace scope or account-wide aggregation'
      - 'Role resolution reads role_assignments by resource-derived or explicit workspace_user_id and workspace_id; no cookie or request header selects membership'
      - 'Auth Layer must not write to core domain tables (missions, projects, etc.) itself'
      - 'Exception: the deleteUser beforeDelete hook invokes a backend-supplied onDeleteUser(userId) callback (see backend/account-deletion.ts) to hard-purge the RESTRICT children of profiles and workspace_users (workspace_users, user_tokens, user_images, role_assignments, workspace_user_execution_targets, project_user_preferences) before the auth user row is hard-deleted; the write happens in the caller-supplied callback, not in Auth Layer code, mirroring the serviceToAutomations delegation pattern'

  serviceToAutomations:
    description: 'Service-layer callers invoke automations through exported functions; persistence via injected callbacks only'
    from: service
    to: automations
    transport: function-calls
    rules:
      - 'Automations must not read or write domain tables directly'
      - 'Provider secrets come from environment variables documented in .env.prod.example / .env.local.example'
      - 'Automations return null on provider unavailability or failure; callers supply deterministic fallbacks'
      - 'New built-in automations register through the automations registry, not ad hoc imports from other modules'
      - 'Downstream automations load via OVERLORD_AUTOMATIONS_MODULE (custom-automation extension point), not by editing the built-in registry'

  extensionToCore:
    description: 'Extensions interact with core only through service APIs and change feed'
    from: extension
    to: database
    transport: service-layer-apis-entity-changes-outbox
    rules:
      - 'No direct writes to core tables'
      - 'Extension tables must use ext_<name>_ prefix'
      - 'Migration component must be ext:<name>'
      - 'JSON metadata keys must be namespaced (reverse-DNS or package-style)'
      - 'Reactions to core events via service APIs, entity_changes, or outbox_messages only'

  shellToRest:
    description: "The desktop shell's BrowserWindow loads the SPA and calls /api/* (incl. SSE realtime) over the loopback origin (Local) or the hosted backend's HTTPS/wss origin (Remote) via the SPA's runtime-injected API base URL — another HTTP client of the existing REST surface"
    from: desktop
    to: rest
    transport: loopback-or-https-http-and-sse
    rules:
      - 'The shell must not fork or modify the SPA'
      - 'Local mode: Better Auth session cookies work natively on the shared loopback origin; the shell injects no headers and stores no tokens for in-app requests'
      - 'Remote mode (cross-origin): only the active profile Better Auth session bearer token (safeStorage/keychain) is injected into the SPA API and realtime clients instead of cross-site cookies; the desktop never reads or mints USER_TOKENs for in-app requests, while spawned CLI/headless clients retain their separate USER_TOKEN credential. Selected workspace remains client-side navigation state and is never sent as request scope'
      - 'Navigation stays scoped to the shell origin in both modes; the remote REST + wss origins are added to CSP connect-src per the active profile'
      - 'Desktop-only affordances are exposed only via the feature-detected window.overlord preload bridge'
      - 'User-notification policy is server-owned: the SPA renders only profile-owned GET /api/notifications history and authorized notification entity changes, never inferred mission/objective/event changes. It invokes only the bounded window.overlord.showNotification({ title, body, tag?, soundUrl? }) bridge when available; the browser fallback is its native Notification API. App/CLI update banners are a separate in-app UI, not a user-notification transport.'
      - 'Remote social OAuth uses an opaque, single-use, short-lived handoff ticket between the backend callback and Electron main; the custom URL and renderer never receive a session, bearer, GitHub access token, or client secret'
      - 'Mission deep links are limited to overlord://missions/<missionId> with an id matching [A-Za-z0-9:_-]{1,64}; the main process emits only the fixed internal /user/missions/<missionId> route through window.overlord.onNavigate'

  shellToCli:
    description: 'The desktop shell supervises the bundled CLI/server as subprocesses (ovld serve / runner / launch), analogous to the Agent -> Protocol subprocess pattern'
    from: desktop
    to: cli
    transport: subprocess-and-utility-process
    rules:
      - 'The shell triggers existing CLI/runner behavior; it must not reimplement launch, terminal, or config logic owned by the CLI/Runner Layers'
      - 'Spawned CLI needing a network credential receives a USER_TOKEN via Overlord_USER_TOKEN; pure-loopback execution needs none'
      - 'The web/REST server is forked as a Node utilityProcess (Electron ABI), not a separately shipped Node runtime'
