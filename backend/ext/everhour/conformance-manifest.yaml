contractVersion: 172.0.0
componentType: rest-module
componentKey: everhour
label: "Everhour REST Extension"
description: >
  Reference REST extension for Everhour time tracking. Exposes project and mission
  integration endpoints under /ext/everhour/. Since contract v153 the personal API key
  is stored by the shared account-connections module through the
  account-connection-provider extension point and is managed only through
  /api/connections (the /user-connection and /integration aliases are retired).

restModule:
  endpointPrefix: /ext/everhour
  usesServiceLayer: true
