contractVersion: "153"
componentType: rest-module
componentKey: everhour
label: "Everhour REST Extension"
description: >
  Reference REST extension for Everhour time tracking. Exposes profile-scoped
  user-connection, project, and mission integration endpoints under /ext/everhour/.
  Since contract v153 the personal API key is stored by the shared account-connections
  module through the account-connection-provider extension point; /user-connection and
  /integration are compatibility aliases over it.

restModule:
  endpointPrefix: /ext/everhour
  usesServiceLayer: true
